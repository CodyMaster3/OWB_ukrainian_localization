l_english:
  # Events
  nf_new_khans.1.t:0 "Роздоріжжя"
  nf_new_khans.1.d:0 "Наша історія — це низка темних вчинків, за які ми неодноразово опинялись на межі знищення, хоча мало хто з нас готовий це визнати. У Каліфорнії наш народ двічі опинився на межі загибелі від рук тих, хто нині править заходом. Після другої поразки вцілілі були розкидані вітрами, і лише завдяки діям двох людей Нові Хани не зникли остаточно. Один з них став відомий як Папа Хан — він зібрав більшість уцілілих, дав їм нову силу та перетворив на Великих Ханів. Вони рушили на схід, у Неваду, оселившись у пустках Мохаве й знову ставши могутнім плем'ям. \n\nІншим чоловіком був Амгалан. Він зібрав як уцілілих, так і охочих приєднатися, намагаючись втримати їх разом. Його група була набагато меншою, але її підтримали Послідовники Апокаліпсису. Завдяки їжі, воді й медичній допомозі від цих чужинців, Амгалан відчув обов'язок віддячити; тож коли Послідовники спланували експедицію далеко на північний схід, він і його відколота група Ханів рушили разом із ними. Вони все ще звали себе Новими Ханами й дивились на південь, у бік дедалі віддаленіших родичів, із..."
  nf_new_khans.1.a:0 "Бунтом у серці"
  nf_new_khans.1.b:0 "Журливим сумом"
  nf_new_khans.1.c:0 "Стоїчним спокоєм"

  nf_new_khans.2.t:0 "Справжній Новий Хан"
  nf_new_khans.2.d:0 "Шлях Нових Ханів і Послідовників був довгим і звивистим, через чужі й небезпечні землі. Вони проходили під підозрілими поглядами рейнджерів, землями тих, хто ходить по смолі, та селами тих, хто говорить від імені богів небес і пари. Там, де Послідовників не приймали, Амгалан і його супутники заступалися й рятували їх від небезпеки. Обидві групи стали досить дружні, але саме Амгалан почав глибше дослухатися до слів і вчинків Послідовників. \n\nПоки його клан пив і бився, Амгалан читав їхні книги й голограми. Він почав замислюватись, що зміни потребує не земля, а самі Хани. Повільно, але впевнено зміна визрівала в ньому, і коли експедиція досягла земель Вайомінгу й Монтани, Амгалан був уже іншою людиною. Оточення помітило зміну, але решта Ханів не вважали мир і зцілення правильним шляхом. Поки що вони жили, як і раніше. До кінця експедиції вони здобули..."
  nf_new_khans.2.a:0 "Арсенал зброї"
  nf_new_khans.2.b:0 "Рекрутів з різних племен"
  nf_new_khans.2.c:0 "Таємниці зброярства"

  nf_new_khans.3.t:0 "Нові домівки і родини"
  nf_new_khans.3.d:0 "Саме на цих родючих і здоровіших землях Послідовники почали будівництво аванпосту, з якого мали налагодити зв'язок із племенами й містами. Ми зупинилися разом із ними, пустивши нове коріння. Ці землі раніше населяли розрізнені фермери й племена — хтось пішов на південь, хтось приєднався до нас. З того часу ми розсіялися рівнинами, полюючи й беручи все необхідне. Хоч Амгалан все ще наш лідер, його влада радше символічна — кожна родина Ханів живе за власними законами. \n\nОдне з племен, що відступило на південь, було Сонцеглядачами. Вони тихо повели свої отари до гнізда Барона. Вони все ще дивились у небо, коли Бейлі вирішив, що їхні землі краще служитимуть йому. Бідолахи не мали жодного шансу. Одна з дочок племені прийшла до нас — жінка на ім’я Ессен, закривавлена й похмура. Зазвичай одна нова рекрутка не викликає особливої уваги, але Амгалан одразу зацікавився нею й назвав її..."
  nf_new_khans.3.a:0 "Прихованим вогнем"
  nf_new_khans.3.b:0 "Справжньою Ханкою"
  nf_new_khans.3.c:0 "Вовчицею без зграї"

  nf_new_khans.4.t:0 "Амгалан серед попелу"
  nf_new_khans.4.d:0 "Перед ще тліючими руїнами маєтку Барона Августа стояв Амгалан. Попіл війни зігрівав його шкіру в холодну ніч. Але цей вогонь не приносив йому спокою. \n\nХани пройшли тисячі миль у пошуках Вайомінгу — земного раю, описаного Послідовниками. Амгалан вів їх від Папи Хана сюди. І хоча земля й справді прекрасна й багата навіть після ядерного вогню, усе виявилось не так, як він сподівався. \n\nБарон був монстром — у цьому не було сумнівів. Люди під його чоботом кричали про це. Але саме Амгалан дозволив загинути ще більшій кількості Ханів. Так, земля тепер безпечна, але якою ціною? Він мріяв про інше майбутнє, а тепер діти, народжені в дорозі, вже знають, що таке кров. \n\nМоже, ми забрали забагато? Може, ми самі пробудили війну в цих землях? Та врешті-решт, Амгалан дійшов висновку:"
  nf_new_khans.4.a:0 "Пустка ніколи не буде вільною від війни"
  nf_new_khans.4.b:0 "Барон не позбавить нас мирного майбутнього"
  nf_new_khans.4.c:0 "Можливо, старі шляхи мають стати новими"

  nf_new_khans.5.t:0 "Про урядування"
  nf_new_khans.5.d:0 "Амгалан і Ессен стояли на пагорбі, дивлячись на табори внизу. Ранковий вітер приносив запах роси, і старий Хан усміхнувся. \n\n— Думаєш, це дурниця, еге ж? — спитав він, тримаючи щоденник біля серця. \n\nЕссен пирхнула: — Їм потрібна сильна рука, а не сильна система. \n\n— Сильна рука може прийти і зсередини. Нам не потрібен деспот. Хани стали занадто чисельними для старих методів. \n\nВона трохи помовчала: — Думаєш, вони самі цього хочуть? \n\n— Дехто так, дехто ні. Але вони мене слухають. Тут ми можемо побудувати майбутнє, як це роблять уряди заходу. \n\n— Тільки не зламай свій народ у своїх мріях, Послідовнику, — відповіла вона, сідаючи поряд. \n\nВін протягнув їй трохи в'яленого м’яса. — Для здоров’я, — посміхнувся він. — І за те, що ти з нами."
  nf_new_khans.5.a:0 "Слова Амгалана розпалили вогонь у серці Ессен"
  nf_new_khans.5.b:0 "Але Ессен знала: Хани — не НКР"

  nf_new_khans.6.t:0 "Дочка Барона"
  'nf_new_khans.6.d:0 "Амгалан увійшов до старої в’язниці Бейлітауну, де колись утримували переважно невинних або просто нещасних людей. Тепер тут залишилось лише кілька осіб, причетних до війни проти Ханів: частина командирів Загону Зака, найгірші з головорізів Барона і Аннет Бейлі. Коли палаючий вогонь поглинув будинок Бейлі та самого Барона, його дочка здалася Ханам. Дехто вимагав її негайної страти, але старий вождь відмовив. Вона провела дні у в’язниці, поки Хани осмислювали ситуацію. Тепер же охоронці передали прохання про зустріч. \n\nКоли Амгалан прибув, вона одразу ж підійшла до ґрат із чарівною усмішкою. \n\n“Доброго ранку, Амгалане. Я давно хотіла зустрітись у менш кривавих умовах. У вас є всі підстави тримати мене тут — я ж дитина вашого ворога — але знайте: я можу бути вам корисна. Я знаю всі родини Ейрі, їхні сильні й слабкі сторони. Я можу забезпечити співпрацю з вами.” Вона пильно дивилася на нього. “З моєю допомогою мир і добробут повернуться швидше. Хіба це не наша спільна мета?”\n\nЇї слова і голос були приємні, і Амгалан це визнав. Але чи була це щирість? Ще треба було з’ясувати."
  nf_new_khans.6.a:0 "“Дам відповідь завтра”"

  nf_new_khans.31.t:0 "Дочка Барона, ч. 2"
  nf_new_khans.31.d:0 "Того ж дня Амгалан покликав до свого намету Езекіеля — колишнього агента Барона, ув’язненого за незгоду із рішенням про війну з Ханами. Вони познайомилися після звільнення в’язнів і швидко знайшли спільну мову. Езекіель став головним джерелом інформації про Ейрі. Амгалан знову потребував його поради: “Ти знаєш її краще за всіх. Що скажеш про Аннет Бейлі?” \n\nТой запалив сигарету й задумався. “Чесно? Найрозумніше буде лишити її в камері. Вона хитра й має характер. Але вона також розумна і справді знає своє діло.” Знявши капелюха, він додав тихіше: “Я ще й небайдужий до неї, бос. Якщо даси їй шанс — я простежу, щоб вона не вийшла за межі.” \n\nВін сказав усе напряму. Амгалан довіряв йому. Час вирішити."
  nf_new_khans.31.a:0 "Вона занадто небезпечна"
  nf_new_khans.31.b:0 "Вона отримає шанс"

  nf_new_khans.32.t:0 "Ще одна пропозиція"
  nf_new_khans.32.d:0 "Езекіель вперше за багато місяців повернувся до Бейлітауну, до міс Аннет Бейлі. Маєток давно відновили, хоча обслуги стало менше. Він зняв капелюха перед могилою Августа й зайшов усередину. Аннет кинулась до нього й обняла. Після поцілунків він промовив: “Чув, що справи твої йдуть добре. Не вплуталась у біду?” \n\nВона пирхнула: “Якщо питаєш про зраду твоєму босу — то ні. Майже.” \n\nВін усміхнувся, але нічого не сказав. Потім витягнув ніжно-бузкову сукню, яку знайшов у покинутому довоєнному магазині. Очі Аннет засвітилися, але подарунок одразу відійшов на другий план, коли вона побачила, як Езекіель став на одне коліно й простягнув обручку. \n\nЇї обличчя змінилось. “Ти й справді любиш влазити в халепу, га?” Він усміхнувся. Вона відповіла з лукавою усмішкою:"
  nf_new_khans.32.a:0 "“Гадаю, я тобі винна”"

  nf_new_khans.7.t:0 "Війна Білого Кролика"
  nf_new_khans.7.d:0 "На наших західних кордонах спалахнула війна, до якої ми не маємо прямого стосунку. З одного боку — клан величезних супермутантів, схожих на тих, яких ми бачили в Каліфорнії. З іншого — Люди Лісу, які давно живуть у цих краях і поклоняються білому рогатому кролику. Вони були ворожі до наших розвідників. \n\nМи не знаємо, що спричинило цей конфлікт, але вже кілька наших мисливських загонів потрапили під перехресний вогонь. Без вирішення конфлікту миру не буде. Амгалан зібрав нараду, щоб вирішити, як діяти далі."
  nf_new_khans.7.a:0 "Спокій нам тільки снився"

  nf_new_khans.71.t:0 "Зустріч із Могулом"
  nf_new_khans.71.d:0 "Амгалана провели до старого офісу шахти, де мешкав Могул. Ессен ішла поруч — вона наполягла на участі. Вождь мутантів говорив голосно, іноді здригались вікна: “Привіт, Вождю Ханів. Кажуть, ти хочеш допомогти.” \n\n— Принаймні вислухати. Чому вони напали на вас? — запитав Амгалан. \n\nМогул махнув рукою: “Яке мені діло! Кричать про священність і прокляття — божевільні. Ми втомились від переслідувань. Тож, допоможеш нам?” \n\nЕссен трохи нервувала, але сподівалась, що він скаже «так». Мутанти справді виглядали виснаженими."
  nf_new_khans.71.a:0 "“Я допоможу”"

  nf_new_khans.72.t:0 "Зустріч у лісі"
  nf_new_khans.72.d:0 "Ессен увійшла в гай ватажка культу — біля вогнища. Вона була одна, на вимогу культу. З темряви з’явився Скитер-Божевільний: смердів кров’ю, шкірою й грибами. На спині — роги. “Сонячна Ханка хоче дружби? Допомогти повернути святі пагорби?” \n\nВона здивувалась, що її звуть за колишнім плем’ям — Сонцеглядачами. Але відкинула це й подумала про кількість воїнів, яких бачила — набагато більше, ніж Хани вважали. Нарешті вона відповіла: “Ми хочемо бути друзями, якщо ви також.” \n\nВін звузив очі й показав гнилу усмішку: “Може й так. Але ми не маємо слабких чи брехливих друзів. Доведи силу!”"
  nf_new_khans.72.a:0 "“Я приймаю виклик”"

  nf_new_khans.8.t:0 "Та, що зветься Честю"
  nf_new_khans.8.d:0 "Наші розвідники повідомляють щось несподіване. Символ мечів і шестерень, знайомий з Мохаве, майорить у горах Монтани. Це Братство Сталі. Вони — відкриті, не ховаються. Їхні воїни, Сестри Сталі, кидають виклик традиціям і допомагають місцевим. Багато з нас бачать у них можливих друзів — споріднені душі. Їхню лідерку звуть Хонор. \n\nЧас покаже, чи вони простягнуть руку — чи направлять лазер."
  nf_new_khans.8.a:0 "Побачимо"
  nf_new_khans.8.b:0 "Їм потрібен дім"

  nf_new_khans.10.t:0 "Жодного нового пораненого коліна"
  nf_new_khans.10.d:0 "Племена Стендінґ-Рок — насторожені й злі. Їхня історія — це біль і утиски від урядів старого світу, таких самих, як ті, що все ще існують на півночі. І в цьому ми несподівано знайшли спорідненість — через наші стосунки з НКР. Хоча вони й приймають нас, вони не забувають, що ми — загарбники. Шаппа Вагнер і її люди готуються до війни. Нам краще не потрапити їм на очі."
  nf_new_khans.10.a:0 "Кажуть, ми подібні більше, ніж думаємо"

  nf_new_khans.11.t:0 "Лише роздратування"
  nf_new_khans.11.d:0 "Фалая влетіла до намету Амгалана без запрошення. “Що, до біса, вони мають на увазі, коли називають себе 'Великими Ханами', га? Схоже, вони просто купка великих ідіотів.”\n\nВона розвела руками, люто зітхнувши. “Вони нас не слухають. Жеруть спиртне, ніби це спорт, і смердять на весь табір, як хімлабораторія. Що ми будемо з ними робити, Амгалане?”\n\nВін знизав плечима у слабкій згоді: “Ми маємо здобути їхню повагу. Вони ще не розуміють, що ми — їхня родина.”\n\nЇї око сіпнулося. “Ми дали їм прихисток! Хіба цього недостатньо? А тепер вони тут усе руйнують, і ми маємо це терпіти?!”\n\n“Після всього, що вони пережили, я їх не засуджую,” — Амгалан сперся підборіддям на руку. “У часи тривоги всі ми неспокійні. Ми маємо бути поруч і спрямовувати їх.”\n\n“Та це не неспокій, Амгалане. Це — безрозсудність. Вони саморуйнуються. Вони прагнуть крові, і не зупиняться, поки не отримають її.”\n\n“Багато з нас такі — подивися на Ессен, або навіть на мене,” — сказав Амгалан, дивлячись, як її обличчя сповнилось здивуванням."
  nf_new_khans.11.a:0 "..."

  nf_new_khans.27.t:0 "Лише роздратування (продовження)"
  nf_new_khans.27.d:0 "Амгалан продовжив: “Помста — природна річ. Колись я переслідував рейнджера НКР, який убив мою матір — і перерізав йому горло її ножем.”\n\n“Я думав, що мені стане легше, що стану сильнішим. Але ніколи не почувався таким безсилим і самотнім, як тоді. Помста й лють відділяють розум від тіла. Вони висмоктують суть людини, лишаючи лише оболонку.” Його очі зволожилися. “Я не дозволю їм пройти через це.”\n\nФалаї знадобилось кілька секунд, щоб отямитись. “То ти розумієш, наскільки це погано, Амгалане. Це — нове покоління Ханів, яке не змінилося, як ми.”\n\n“Я знаю,” — зітхнув він, поклавши руку їй на плече. “Реджис і його люди — не погані. Якби були, я б не впустив їх.” Він м’яко глянув на неї. “Ми можемо їх розуміти, бути поруч, не погоджуючись з ними.”\n\nВона глибоко вдихнула: “Просто подумай над цим, добре?”\n\nВін кивнув, і вона залишила його наодинці з думками..."
  nf_new_khans.27.a:0 "Хай тримається курс."

  nf_new_khans.12.t:0 "Майбутнє Ханства"
  nf_new_khans.12.d:0 "Через усі випробування Хани Вайомінгу стали останнім бастіоном своєї культури — і настав час обрати, де ми пустимо найглибше коріння."
  nf_new_khans.12.a:0 "Даріон — завжди буде дім"
  nf_new_khans.12.b:0 "Бейлітаун — економічна сила"
  nf_new_khans.12.c:0 "Меджик-Сіті — за розміри й дива"
  nf_new_khans.12.e:0 "Рапід-Сіті — зростаюче місто"
  nf_new_khans.12.f:0 "Фейрв’ю — прогрес і сталь"
  nf_new_khans.12.g:0 "Грейстейбл — північний мегаполіс"
  nf_new_khans.12.h:0 "Бітер-Спрінґс — щоб ніколи не забути"
  nf_new_khans.12.i:0 "Шейді-Сендс — на честь минулого"

  nf_new_khans.13.t:0 "Пам’ятай Даріона"
  nf_new_khans.13.d:0 "Даріон. Гарл Смертельна-Рука. Усі ми знаємо легенди, пам’ятаємо оповіді — і всі вони закінчуються однаково. Невдачі Ханів. Дехто з нас, зокрема Амгалан, жив крізь це. \n\nНевдачі Даріона розірвали молодого Амгалана надвоє: вдруге його народ знищила одна людина — так званий 'Обраний'. Коли Хани тікали, їх ловили НКР. Коли ховалися — вони зраджували одне одного за хімію. \n\nАгресія Гарла зруйнувала перших Ханів. Параноїдальна манія Даріона — наступних. Амгалан не дозволить цьому знищити його народ. Він лише може сподіватися, що серця його людей з ним."
  nf_new_khans.13.a:0 "Чи зможуть Хани жити в мирі?"

  nf_new_khans.14.t:0 "Їх звали Рейнджерами"
  nf_new_khans.14.d:0 "Хани й Рейнджери зустрічались не раз у минулому. Їхня майстерність і стиль завжди вражали юного Амгалана. І хоч дні мотоциклів під сонцем Каліфорнії давно минули, Рейнджер Джей відродив у ньому ці спогади. \n\nЗ ними Хани зможуть навчитися новим трюкам — і захищати себе краще, ніж будь-коли."
  nf_new_khans.14.a:0 "Хани — не вуличні щурі."

  nf_new_khans.15.t:0 "Нескорені Сестри"
  nf_new_khans.15.d:0 "Одного дня до Ессен прийшла жінка — Сестра Сталі, яка втратила все й шукала новий дім. Колись благородна душа тепер була порожнечею. Та вона побачила в Ессен гідну мету. \n\n“Поки зорі світять опівночі, я нестиму твою волю, як смолоскип,” — мовила вона, ставши на коліно перед Воїтелькою. \n\nЕссен знала, що дух воїна недооцінювати не можна. Але вона також бачила: ця жінка б’ється не через жагу до бою, а через відсутність віри. І все ж, може, вона стане у пригоді..."
  nf_new_khans.15.a:0 "Її лють — без дисципліни."
  nf_new_khans.15.b:0 "Її лють може стати зброєю."

  nf_new_khans.16.t:0 "Зважування вибору"
  nf_new_khans.16.d:0 "Реджис сидів біля вогнища з тими, хто вижив у Біттер-Спрінґс. Поруч — Джек і Діана, пов’язані хімією й коханням. Вони обговорювали становище з північними Ханами. \n\nДіана: “Чудово, що нас прийняли без питань, але я не певна щодо верхівки.” \n\nДжек: “Старий міг би трохи прийняти психо, а ця Ес — надто сувора.” \n\nРеджис слухав мовчки. Він зважував свої варіанти..."
  nf_new_khans.16.a:0 "заповнювач (тимчасово)"

  nf_new_khans.17.t:0 "Вечір спокою"
  nf_new_khans.17.d:0 "Езекіель відклав карти й ковтнув Old Roamin'. Ліворуч — Рейнджер Джей, теж одноокий, з яким він швидко порозумівся. Праворуч — Джастін Вокер, щойно зі штаб-квартири Послідовників. \n\nВона часто поглядала на Амгалана, який сидів навпроти, спокійний і... програваючий. \n\nВони обговорювали тривогу серед Ханів, поради Ессен, загрози з півдня й дірки в чоботях Джея. Езекіель мовчав — досі новенький серед них. \n\nНарешті, Амгалан запитав:\n\n“А ти що скажеш, Зеке, коли брат чи сестра спитають, чого ми прагнемо? Миру чи війни? Друзів чи підданих? Мечів чи плугів?”"
  nf_new_khans.17.a:0 "..."

  nf_new_khans.18.t:0 "Медичні дари"
  nf_new_khans.18.d:0 "Наші збирачі повернулись з медичних об’єктів. Хоч більшість втрачено, вдалося знайти дещо цінне. Маленький улов, але дуже корисний."
  nf_new_khans.18.d_alt:0 "Ми знайшли не лише запаси, а й засоби для власного виробництва. Невдовзі нам не доведеться більше видавати медикаменти по краплі."
  nf_new_khans.18.a:0 "Кожна дрібниця — дар"
  nf_new_khans.18.b:0 "Радіація більше не страшна"
  nf_new_khans.18.c:0 "Залежність нас не зупинить"
  nf_new_khans.18.e:0 "Ніч буде світлою"
  nf_new_khans.18.f:0 "Вищі знання відкриті нам"
  nf_new_khans.18.g:0 "Нічого не сховається від нас"
  nf_new_khans.18.h:0 "Наша сила буде нездоланною"

  nf_new_khans.26.t:0 "Вечір спокою (продовження)"
  nf_new_khans.26.d:0 "Усі дивилися на Езекіеля, який допив залишки напою. \n\n“Скажу так — трохи з того, трохи з іншого.” Діана скривилась, Джей кивнув, Амгалан — без змін. “Бос, мені подобається, що ти не шукаєш боїв. Якби я думав інакше — стояв би за Барона. Але біда інколи сама приходить. І я свій револьвер ще не закопую.”\n\nВін кинув три карти й узяв нові. Амгалан усміхнувся. \n\n“Мудрі слова, друже. Колись я сам так казав. Але хай наші біди несуть якнайменше крові.”\n\nВсі виклали карти. \n\n“А тепер ще трохи мудрості...” — мовив Езекіель, клацаючи карти."
  nf_new_khans.26.a:0 "\"Фул-хаус.\""

  nf_new_khans.23.t:0 "Його звали Папа Хан"
  nf_new_khans.23.d:0 "Коли Даріон загинув і Хани опинились на межі загибелі вдруге, не лише Амгалан вів уцілілих. Його група була меншою. Більша йшла за чоловіком, якого кликали Папа. Папа Хан був велетнем, вірив, що Хани мають йти на схід — геть від НКР. З Амгаланом вони не були друзями, але розійшлись мирно. \n\nПапа хотів сили, ізоляції. Амгалан — друзів і нового сенсу. Минуло багато років, і зв’язку немає. Але Амгалан досі сподівається, що його родичі десь живі. \n\nМоже, ще зустрінуться..."
  nf_new_khans.23.a:0 "Чи пам’ятаєш Папу?"

  nf_new_khans.21.t:0 "Свята кров"
  nf_new_khans.21.d:0 "Ессен і її загін вирушили все далі в Бігорнерські ліси, шукаючи Святих, всупереч закликам Амгалана до стриманості. Декого їй довелось поховати — їх убили пастки або засідки. Святі уникали чесного бою. Кампанія все більше виснажувала Ессен, і не одне дерево постраждало, коли вона зганяла злість. Але зрештою вона виявила їхній притулок у глушині, завдяки інформації, яку вибили з нещасного бранця.\n\nЗгадавши, що їм довелося пережити від рук Святих покидьків, Ессен і її воїни дочекалися ночі — поки більшість ворогів не впали п’яними чи обдовбаними. Після півночі вони штурмували стару мисливську хату, Ессен вибила двері й повела за собою від кімнати до кімнати. Спротиву було мало — ті, кого вони зустрічали, були неспроможні чинити опір. Це була різанина, а не битва. Залита кров’ю, Ессен підпалила дім на прощання. Святі більше не поверталися — решта тихо втекли назад до своїх у заміський клуб."
  nf_new_khans.21.a:0 "Їм ще пощастило"

  nf_new_khans.19.t:0 "Амгалан, бунтівник"
  nf_new_khans.19.d:0 "Новий Хан за народженням, Амгалан прожив понад шістдесят років — і хоча більшість цього не скажуть, глянувши на нього поза наметом. Колись його знали як красеня, що сипав словами, мов шовком, до всіх гарних панянок. Бо ж мускулистий чоловік на мотоциклі з язиком поета — рідкість.\n\nАле ті часи скінчилися, коли загадковий мандрівник прийшов і убив Даріона.\n\nАмгалан робив усе, що міг, щоб допомогти тим, хто вижив. Але не зміг урятувати всіх. Забагато загиблих. І найбільше його гнітила не поразка, а думка: якби ті люди жили іншим життям, може, й жили б далі. Бо ж набіги й грабунки завжди мали свою ціну.\n\nТа Хани змінилися. Вони стали племенем, а не бандою — і в серці Амгалана загорілась іскра надії. Він уже зустрічав Послідовників, і вірив: з їхньою допомогою можна почати знову. Якщо пощастить — може, він матиме рацію..."
  nf_new_khans.19.a:0 "Часи насильства минули."

  nf_new_khans.20.t:0 "Без Хана"
  nf_new_khans.20.d:0 "Хоч північні Хани й пережили чимало, це блідне перед тим, через що пройшли Великі Хани Папи Хана.\n\nТого ранку вітер, що дув у Даріон з півдня, приніс із собою спеку й натяк на кров у повітрі. Щось сталося."
  nf_new_khans.20.a:0 "Хто ці незнайомці?"

  nf_new_khans.201.t:0 "[KHA_bitter_springs_title]"
  nf_new_khans.201.d:0 "[KHA_bitter_springs_event]"
  nf_new_khans.201.a:0 "Папа не буде забутим"

  KHA_bitter_title_ncr:0 "Бітер-Спрінґс і НКР"
  KHA_bitter_event_ncr:0 "Поки Амгалан, Ессен і Хани півночі пускали коріння й шукали шляхи в майбутнє, далеко на півдні назрівала катастрофа. Великих Ханів Мохаве, яких уже вигнали з Вегасу, чекала нова біда. НКР, обурена набігами, почала повномасштабний наступ на їхній дім у Бітер-Спрінґс.\n\nАтака сталася, коли Папа Хан був у рейді. Решта готувалася або прориватися, або виводити цивільних. Вони ледве не потрапили в пастку, якби не вчасне повернення Папи й його загону. Вони вдарили по тилу НКР, розбили частину сил — цього було недостатньо, але хаос дозволив іншим вирватися. Прорив очолив Реджис, що залишився як права рука. Він бачив, як Папу розстріляли скоординованим вогнем десятка солдатів і снайперів. І образ цей лишився з ним назавжди."

  KHA_bitter_title_bos:0 "Бітер-Спрінґс і Братство Сталі"
  KHA_bitter_event_bos:0 "Поки Амгалан, Ессен та інші північні Хани закріплювалися на новій землі й обмірковували шляхи в майбутнє, далеко на півдні зріло нещастя. Великі Хани пустки Мохаве, вже витіснені з Вегаса у глухі куточки, тепер знову опинилися перед обличчям загибелі. Розлючене численними набігами на свої об'єкти й каравани, Братство Сталі в Мохаве почало повномасштабний штурм їхній дім у Бітер-Спрінґс.\n\nНаступ розпочався в той час, коли Папа Хан перебував у рейді. Решта готувалась або прориватися, або забезпечити відступ для цивільного населення. Їхній відчайдушний прорив ледь не завершився катастрофою, якби не вчасне повернення Папи Хана зі своїми бійцями.\n\nВони обрушилися на тилові частини Братства з шаленою атакою, прорубуючи шлях крізь сталеві броні ворогів і змушуючи їх відтягнути сили з передової. Та цього було недостатньо: Братство зібрало надто багато солдатів і техніки. Але в сум’ятті Хани в Бітер-Спрінґс отримали шанс вирватися гуртом і прорвати лінію оборони.\n\nРеджис, залишений у таборі як права рука Папи, очолив прорив і затримався найдовше. Він бачив, як Папа Хан упав під зливою лазерних пострілів з десятка стволів. І ця картина ніколи не полишала його. Коли стало ясно, що все втрачено, він розвернувся й побіг слідом за своїм народом."

  KHA_bitter_title_generic:0 "Бітер-Спрінґс"
  KHA_bitter_event_generic:0 "Поки Амгалан, Ессен та інші Хани півночі обживали нові землі й замислювались над майбутнім, далеко на півдні насувалася трагедія. Великі Хани з Мохаве, вже вигнані з Вегаса до далеких окраїн, опинилися під черговою загрозою. Місцеві сили, обурені набігами, розпочали масовану атаку на їхній табір у Бітер-Спрінґс.\n\nНаступ стався, коли Папа Хан був у рейді. Залишені у таборі готувались або відбиватися, або прориватися з надією врятувати беззбройних. Прорив міг би обернутися катастрофою, якби не неочікуване повернення Папи й його людей.\n\nЇхній удар у тил ворога був блискавичним і лютий. Вони знищили чимало нападників і змусили ворога відтягнути частину сил. Хоча цього не вистачило для перемоги, хаос дав шанс усім, хто лишився в Бітер-Спрінґс, пробитися через лінії оточення.\n\nРеджис, залишений у таборі як права рука Папи, очолив прорив, але залишився, щоб забезпечити втечу іншим. Він власними очима бачив, як Папа Хан упав під шквальним вогнем ворога. Цей момент назавжди закарбувався в його серці. І коли стало ясно, що час бігти — він розвернувся і рушив слідом за своїм народом."

  nf_new_khans.22.t:0 "На роздоріжжі"
  nf_new_khans.22.d:0 "З прибуттям до Вайомінґу Хани Амгалана страждали від кризи ідентичності. А з появою Реджиса й Великих Ханів Мохаве все лише загострилось. Амгалан зібрав найвпливовіших, аби вирішити — куди рухатись далі.\n\nОдні вірили в бачення миру — з Послідовниками, стабільністю та осілим життям. Вони хотіли, щоб Амгалан став незаперечним вождем.\n\nІнші тягнулися до Ессен — її сила, бажання захищати й помститися вражали. Вони мріяли про славу й велич нового Ханату.\n\nА ще були ті, хто хотів усе лишити, як є. Грабувати. Жити. Бути Ханами. Вони бачили в Реджиcі справжнього провідника.\n\nПісля нічної ради вирішили:"
  nf_new_khans.22.a:0 "Хани хотіли миру"
  nf_new_khans.22.b:0 "Хани хотіли лишитись Ханами"
  nf_new_khans.22.c:0 "Хани прагнули слави"

  nf_new_khans.24.t:0 "Набіг занадто далеко"
  nf_new_khans.24.d:0 "Стався нічний напад. Амгалан і Ессен поспішили до поселення біля Бігорнерських лісів. Там усе було в попелі. Наметів не лишилось. Людей — вирізано. Горла перерізані, тіла — спотворені. Деякі — розчленовані. Один Хан — обезголовлений.\n\nПляшки навколо єдиного вцілілого намету. На його боці — символ Святих.\n\nАмгалан був спокійний, Ессен — у нестямі. Вони знали: Хани вже готові мстити. І діяти доведеться. Але кожен бачив шлях по-різному."
  nf_new_khans.24.a:0 "Святі заплатять"

  nf_khans.8.t:0 "Неочікуване Повернення"
  nf_khans.8.d:0 "Амґалан їхав дорогою, яка торкалася самих країв його памʼяті. Вона не виглядала знайомою насправді, навіть якщо він колись тут бував — то було так давно. І все ж, дороги Каліфорнії не здавалися чужими. Реджис їхав позаду нього, поглядаючи довкола з байдужим інтересом, коли вони наближалися до Шейді-Сендс. Колись це було саме серце НКР, земля Ведмедя, але багато років тому саме тут народилися й Хани. Народилися... і майже двічі померли.\n\nРеджис не впізнавав нічого, але в Амґалана це викликало хвилю ностальгії. Він ніколи не планував повертатися. Минуло десятки років і сотні миль між ним і тим юнаком, що тікав звідси так давно. І все ж, хоча він і жалкував про хаос, який залишив ведмежу барлогу спаленою дотепер, він не міг не радіти поверненню додому."
  nf_khans.8.a:0 "Як усе докотилося до цього?"

  nf_khans.10.t:0 "Могила героя"
  nf_khans.10.d:0 "Клубки диму ще в’юнились угору, коли Реджис піднімався на пагорб, що все ще здавався знайомим, попри час і відстань. За ним ішли ті, хто мав власні спогади про ці хребти та підйоми, а також кілька таких, хто ніколи тут не бував. Ессен ішла поруч — зацікавлена після всіх розповідей про битви й після власних боїв, які допомогли їм сюди дістатися. Для неї це місце вібрувало від гніву і пахло мертвими. Це були Бітер-Спрінґс.\n\nНазва стала ще доречнішою за останні роки, та місце знову належало Ханам. Тепер воно здавалося невеликим, важко було уявити, що тут колись жили. Ті, хто його відібрав — давно зникли. Як і майже все інше. Але щоби вшанувати чоловіка, який віддав своє життя, щоби Хани з Мохаве вижили, було вирішено звести меморіал Папі Хану. Мохаве знову — земля Ханів, і тепер він наглядатиме за нею з гордістю."
  nf_khans.10.a:0 "Але гіркота не зникне ніколи"

  nf_khans.9.t:0 "Полегшення"
  nf_khans.9.d:0 "Амґалан вийшов зі свого намету — простого, подекуди протертого, розташованого серед відбудованих руїн Даріона, — вдягнений у старі шкіряні куртки, які він десятки разів ремонтував за роки. Кожна латка й шрам на ній були як пам’ятник падінням та сутичкам на його шляху. А їх було чимало, і він знав — буде ще більше. Завівши ревучий мотор свого байка, він сам вирушив з Даріона на відкриті дороги.\n\nБільшість шосе вже давно прочищено, тож поїздка під ясним небом була легкою. Він плавно оминав забуті довоєнні авто, проїжджав повз господарства Вільних Ханів, що почали вкривати узбіччя. Дорога вела повз штаб-квартиру Послідовників — і хоча ніхто не звернув на нього увагу, він усе ж підняв руку в привітанні. Зрештою, він опинився на роздоріжжі: одна дорога вела назад додому, інша — далі в невідоме.\n\nВін довіряв Джастін, Ессен і Реджису. І вирішив, що заслужив трохи тиші та спокою. Тож рушив геть, без певної мети. Він знав — ці троє впораються."
  nf_khans.9.a:0 "І він не помилявся"

  nf_khans.11.t:0 "Шануй свого Хана"
  nf_khans.11.d:0 "Великих Ханів зібрали знову — цього разу не для обговорення майбутнього, а щоби остаточно провести одного з них у спокій. Амґалан почав вечір на своєму звичному почесному місці, та це мало змінитися. Зібравши увагу всіх, він підвівся і мовив: “Минуло багато років відтоді, як я вирушив у дорогу разом із вами, мої родичі й друзі, і стільки ж, як я був вашим ватажком. Проте час зробити це офіційно — й відійти. Нехай усі Великі Хани, незалежно від того, якими дорогами вони сюди прийшли, визнають свого нового Хана ханів.” Він вказав на Реджиса і відступив. “Реджисе, майбутнє — твоє.”\n\nАмґалан відійшов у затемнений куток і сів, швидко забутий натовпом, тоді як Реджис підвів голос, звертаючись і до нього, і до всіх присутніх. “Дякую тобі, Амґалане. Не думайте, що щось кардинально зміниться. Я знаю наш народ. Я знаю, хто такі Великі Хани. Нас били й кидали, але тепер ми піднімаємось — і зробили це, не зрадивши себе. Ми втратили останній дім, але тепер ми — тут назавжди!” Він підняв кулак до неба, й інші Хани зробили те саме, вигукуючи.\n\nБільше слів не було потрібно. Реджис не був тим, хто любить довгі промови, а Великим Ханам і не треба було більше. Зібрання перетворилося на свято підняття Реджиса, й не раз його плескали по плечу й називали Реджис-Ханом. Він не очікував цього титулу, але"
  nf_khans.11.a:0 "Він прижився"

  nf_khans.12.t:0 "Зустріч Ідеалістів"
  nf_khans.12.d:0 "Єлизавета посміхалась через увесь намет до Амґалана — світла й життєрадісна, попри ситуацію. Вона щиро сподівалася, що все скоро владнається і все повернеться на круги своя. Амґалан зберігав суворий вираз, але всередині його тішила її позитивність. “Ти мусиш розуміти,” — почав Хан — “моїм людям буде важко пробачити чи забути. Вони жадають помсти.”\n\n“Звісно ж!” — радісно відповіла вона. “Я розумію! Але ж ми обоє хочемо, щоб загинуло якнайменше, правда? Мені сказали, що ті, хто це зробив, уже вигнані зі Святих, більшість із них уже мертва. Арчі позбувся їх кілька днів тому.”\n\nАмґалан зітхнув із полегшенням. “Якщо це правда, тоді, можливо, ми й справді зможемо досягти якоїсь угоди, яка втихомирить мій народ. Дати тим, хто вижив, шанс почати заново.” Вони говорили годинами — і зрештою:"
  nf_khans.12.a:0 "Так і сталося"

  nf_khans.13.t:0 "Нормальність"
  nf_khans.13.d:0 "У повітрі знову пахло кров’ю, хоча Ессен не могла визначити напрямку. Вона стояла нерухомо, вслухаючись, але нічого дивного не чула. Вона гукнула Меліссі в темряву, яка останні дні постійно була поруч після того, як її зір остаточно зник.\n\n“Що тобі треба, Ессен?” — голос Мелісси й її кроки долинули першими, ще до того, як її рука торкнулася плеча Ессен.\n\n“Ти це відчуваєш? Запах крові? Що там внизу відбувається?” Вони дивились на табір з хребта, де стояв намет Ессен. Полонені працювали внизу, а воїни тренувалися в спарингах. Мелісса не бачила нічого дивного й повітря для неї було звичним.\n\n“Мені здається, це звичайний запах табору. Нічого незвичного. Твої воїни готуються до наступного бою, все добре. Повір моїм очам.” — з цими словами вона злегка стиснула плече Ессен. Хан ханів відчула полегшення, хоч і на мить задумалася — а може, цей запах справді був тут завжди? Вона відкинула думки й поклала свою руку на Меліссину:\n"
  nf_khans.13.a:0 "“Так, це — нормально.”"

  nf_khans.14.t:0 "Двоє Воїнів"
  nf_khans.14.d:0 "Мелісса відкрила вогонь, її кулеметна черга розірвала крила комахи-кровопийці, і та впала на землю. Вона добила її ударом ноги в голову, в той час як Ессен з флангу розсікла голову іншій комасі широким замахом сокири. Шум розбудив решту гнізда, й незабаром вони були втягнуті у короткий, але запеклий бій, прикриваючи одне одного.\n\nВони вирушили в дику місцевість разом, розшукуючи гніздо, про яке ходили чутки. З кожним кроком вони все краще розуміли одне одного, і похід здавався легким. Саме Мелісса знайшла гніздо й нарахувала тварюк — обидві погодилися діяти негайно.\n\nКоли все скінчилось, обидві були неушкоджені, стоячи серед куп комах-кровопийць, оцінюючи роботу одна одної з повагою. Їхня співпраця була легкою й природною: Мелісса кликала цілі, Ессен перехоплювала всіх, хто проривався. “Більше крові ці комахи не побачать,” — сухо пожартувала Ессен, витираючи лезо. Інша жінка засміялась і дружньо вдарила її по спині."
  nf_khans.14.a:0 "“Треба повторити!”"

  nf_khans.15.t:0 "Великий Розпродаж"
  nf_khans.15.d:0 "“Розпродаж з нагоди закриття!” — саме так Джек назвав подію, яка привела Ханів з усього Даріона, щоби скупити останні товари Джека й Даян перед тим, як ті стануть незаконними. Це швидко переросло в імпровізовану вечірку, що заполонила вулиці пʼянкою та веселощами Вільних Ханів.\n\nАмґалан прибув кілька годин по тому, крокуючи поміж вогнищ, пар у темних провулках, і нерухомих тіл, що вже заснули поруч. Хан ханів знав: це буде важко прибирати, але не мав серця зупиняти. Знайшовши дилерів, він побачив їх затишно вмощених на старому дивані поряд із горою кришечок. “Бачу, ви сьогодні не байдикували.”\n\n“Привіт, шефе!” — Джек підняв руку. “Так, ми вирішили піти чистими. Але спершу зробили тобі послугу.”\n\n“Послугу?”\n\n“Ага, твоя нова реабілітаційна клініка буде мати купу клієнтів!”"
  nf_khans.15.a:0 "“Я мав би здогадатися”"

  nf_khans.16.t:0 "Час Святкувань"
  nf_khans.16.d:0 "Останні роки Хани рідко мали нагоду для свята — чи то на півночі, чи на півдні — постійні мандри й нестача всього не залишали місця для радості. Але часи змінились, і з ними — доля Ханів. Їх стало більше, їжі вистачало, а дехто вважав їх навіть багатими. Найголовніше — давній розкол між родичами зцілився, Хани стали єдиним племенем. Попри трагедії, це було возз’єднання.\n\nІдея свята належала Реджису — зібратися й дати кожному можливість розслабитись. Це перетворилось у кількаденний фестиваль по всій території Ханів. Сокири були закопані, нові кохання спалахували, хімія та випивка лилися рікою. Наприкінці ситуація трохи вийшла з-під контролю, але всі погодились — воно було того варте. А найбільше тостів лунало за:"
  nf_khans.16.a:0 "Амґалана!"
  nf_khans.16.b:0 "Реджиса!"
  nf_khans.16.c:0 "Ессен!"


  nf_khans.17.t:0 "Питання"
  nf_khans.17.d:0 "Амґалан і Реджис сиділи разом, розділяючи трапезу та обговорюючи плани на майбутнє Ханів, коли розмова повернула на минуле. Старший чоловік сказав: “Я знав Папу, знаєш. Ми були ще майже хлопчаками. Обоє вели своїх людей з руїн, як могли. Історія, здається, має слабкість до повторень.” Він кивнув у бік Реджиса з розумінням і додав: “Розкажи, як пройшло для Папи? Наскільки ти знаєш.”\n\nРеджис розповів про прибуття до Вегасу, про короткий період сили до того, як Хаус і Три Родини витіснили їх у пустку, про появу НКР та Братства Сталі, про катастрофу в Бітер-Спрінґс. Після його оповіді обидва сиділи мовчки, поки Амґалан не порушив тишу, вдивляючись у далечінь: “Як гадаєш, Папа мав би повести вас інакше?”\n\nРеджис швидко підняв голову на ці слова, але Амґалан підняв руку й уточнив: “Я не принижую його пам’яті чи мужності. Просто запитую — можливо, саме спосіб життя Ханів привів до всіх цих лих. Наші дні як рейдерів і шукачів сили часто завершуються смертю й вигнанням, чи не так? Як думаєш, це взагалі життєздатно?” Молодший замислився перед відповіддю:"
  nf_khans.17.a:0 "“Можливо, ні”"
  nf_khans.17.b:0 "“Ми просто були недостатньо сильні”"

  nf_khans.18.t:0 "Двобій"
  nf_khans.18.d:0 "Не було кращого способу пізнати Ессен, ніж вступити з нею в поєдинок — саме так Реджис опинився навпроти неї у колі з пилюки. Вони випробовували одне одного, атакуючи й ухиляючись. Навколо стояли Хани, серед них — Мелісса та Езекіель, які, здавалось, вже робили ставки. Першою пролила кров Ессен, врізавши ліктем по носу Реджису, коли той спробував скрутити їй руку. “І наскільки ж ти Великий Хан?” — спитала вона, коли він відштовхнув її.\n\n“Достатньо, щоби бути тут. Достатньо, щоби впоратись з тобою.” Він ударив її двічі в підборіддя, змусивши її відступити, але вона повалила його на землю потужним ударом ногою. Публіка схвально загула.\n\n“Як ти взагалі пройшов через усю пустку?” — запитала вона, поправляючи щелепу. Його відповіддю стала хмара пилу й гравію, що вдарила їй у очі, після чого він провів підсічку. Він швидко опинився зверху, використовуючи перевагу. Ессен напружилася, готова до удару, та він простягнув їй руку. Тоді він і відповів:"
  nf_khans.18.a:0 "“Я зробив, що мав”"
  nf_khans.18.b:0 "“Я захистив їх”"

  nf_khans.19.t:0 "Карканні Ворона"
  nf_khans.19.d:0 "Реджис сидів біля вогнища, готуючись до зустрічі з чоловіком із загиблого племені. Його волосся було сплетене в химерні візерунки, що нагадували слова. Це був Бут Кроу, колись батько для тих, хто поклонявся Лицям Рашмора. “Ти той, кого звуть Реджис?” — запитав він. “Я чув про твоє плем’я — і добре, і зле.”\n\nРеджис кивнув і запропонував напій. Той відмовився, не довіряючи. “Я чув, що сталось з твоїм плем’ям. Хани теж знають, як болить втрата. Не довіряєш — кажи відверто.”\n\nКроу дивився на Реджиса з сумнівом, а потім сказав: “Ти носиш ім’я одних із найстрашніших монстрів історії. Кажуть, ви — вбивці. Але я чув також, що ти шукаєш друзів. Скажи мені, Реджис, чи прагнеш ти дружби зі мною?”\n\n“Так. Я чув про мудрого лідера воїнів. Поважаю це. Коли твоє плем’я впало — я думав, ти теж. Але якщо ти тут, я пропоную тобі місце з нами. Як і ми, ти можеш відродитись. Що скажеш?”"
  nf_khans.19.a:0 "Добре"
  nf_khans.19.b:0 "Тільки заради помсти"

  nf_khans.192.t:0 "Плач Вейлс"
  nf_khans.192.d:0 "Реджис уважно слухав, як Вейлс Томас завершувала свою історію. Вона сказала: “Хоч я й вдячна за притулок, мушу сказати — моє плем’я знищене. Наш спосіб життя зник. Навіть мої боги втратили своїх людей. Я не хочу бути частиною насилля. Я не знаю вашої історії, але знаю ім’я. Хани — монстри, убивці. Чому я маю вірити, що ви інші?”\n\nРеджис задумався. “Не буду брехати. Ми пролили чимало крові. Іноді без причини. Але ми просто виживали. Мені не подобається твоя історія, навіть якщо я чув її десятки разів. Ми можемо стати кращими. Старий Амґалан хотів би цього. Я даю тобі шанс допомогти нам бути кращими. Це все, що маю. Ти віриш мені?”"
  nf_khans.192.a:0 "Вона мовчки кивнула"

  nf_khans.193.t:0 "Тиша Птаха"
  nf_khans.193.d:0 "Знову надійшов звіт: патруль атаковано, припаси вкрадено, Хани — мертві. Кажуть, Шура Гікі, лідер розбитого племені Чотирьох Отців, вижила та збожеволіла. Реджис не вірив чуткам, але хтось таки нападав. Мелісса прибігла в табір: вона знайшла нападника.\n\nВони дійшли до урвища, де кілька Ханів оточили фігуру в чорному, з черепом грифа на голові. Декілька вже лежали в пилюці. Не вагаючись, Реджис вихопив мачете й виступив наперед. Шура кинулась на нього з криком, але він майстерно ухилявся, чекаючи моменту. Вона посковзнулась у калюжі крові, і Реджис ударив — мачете пройшов наскрізь. Він відштовхнув її з обриву. Не реагуючи на звук падіння, він повернувся допомогти пораненим."
  nf_khans.193.a:0 "Фігура хитнулась і впала в калюжу власної крові."

  nf_khans.194.t:0 "Фламманґ і Його Скарби"
  nf_khans.194.d:0 "Реджис скривився, підходячи до халупи-магазину з криво намальованою вивіскою. Він не хотів тут бути, але скарги змусили його діяти — і він погоджувався з ними. Хани були надто поблажливими, а Фламманґ Астгол — надто хитрим. Вриваючись до приміщення, він побачив останніх жертв шахрайства. Вони втекли, щойно побачили його. “Ти маєш піти. Ми попереджали.”\n\n“Шахрайство?! Це чесний бізнес! Як інакше я підніму плем’я? Я завжди казав: ‘Чесна угода для кожного’.”\n\nРеджис підняв розвалений пістолет-трубу й поглянув на Астгола. Поклав зброю, поклав руку на плече. “Може, ці слова колись щось значили. Але не тепер. Ми дали тобі дім. А ти нас обдурив. Ти йдеш.”\n\nТиша повисла в повітрі. Реджис знав — справу зроблено."
  nf_khans.194.a:0 "Вранці їх уже не було"

  nf_khans.21.t:0 "Вшануй свого Папу"
  nf_khans.21.d:0 "Найвеличніші з Ханів зібралися знову — цього разу не на суперечку, а щоби нарешті поставити крапку. Амґалан розпочав вечір на своєму звичному почесному місці, але довго там не пробув. Він підвівся й звернувся до зібрання: “Минуло багато років відколи я вирушив у дорогу з вами, мої рідні та друзі. І так само довго я був вашим ватажком. Та настав час офіційно відійти вбік. Хай усі Великі Хани, незалежно від шляху, яким вони сюди дістались, визнають свого нового Хана Ханів.” Він вказав на Реджиса та відійшов: “Реджис, майбутнє — твоє. І я вірю в тебе.”\n\nАмґалан сів у затишному кутку, отримавши стримані оплески, поки Реджис виступав: “Дякую, Амґалане, за все. Ми це не забудемо. Друзі, я пишаюсь прийняти цю роль. Я знаю вас, знаю, на що ми здатні. Нас били, виганяли, але тепер ми тут. І нікуди не підемо!” Він підняв кулак у небо, і Хани відповіли тим самим.\n\nСлів більше не було потрібно. Реджис не був балакуном, а Хани не потребували більше. Свято почалося, і багато хто вже називав його Папа Реджис. Він не очікував такого титулу, але"
  nf_khans.21.a:0 "Він прижився"

  nf_khans.22.t:0 "Очі стають сірими"
  nf_khans.22.d:0 "Амґалан навчав Ессен читати — коли випадала вільна хвилина. То вони брали старі книги у Послідовників, то писали повідомлення на землі. Сьогодні вони йшли старими дорогами й читали вивіски. Але Ессен часто зупинялась, просила допомоги, не могла розібрати літери. Спершу Амґалан думав, що то бруд і час заважають — аж поки не спитав: “Ессен, а як добре ти мене бачиш?”\n\nВона відвела погляд: “Ти нечіткий. Завжди був, але стало гірше.” Це важко давалось їй.\n\nАмґалан поклав руку їй на плече. “Я нікому не скажу, якщо ти бажаєш. Але раджу звернутись до Послідовників. Можливо, вони зможуть уповільнити це.” Ессен стисла зуби, не бажаючи просити допомоги, але зрештою зітхнула:\n"
  nf_khans.22.a:0 "“Гаразд, добре”"

  nf_khans.23.t:0 "Дощ Минув"
  nf_khans.23.d:0 "Ессен отримувала лікування для свого зору вже кілька місяців. Нещодавно Послідовники запропонували операцію, яка, на їхню думку, могла б відновити її зір. Завдяки новому обладнанню й старим довоєнним схемам — це стало можливим. Ессен цього разу не вагалась і одразу лягла на стіл. Амґалан був поруч, поклав руку їй на плече.\n\nОперація пройшла успішно. Через кілька днів настав час зняти пов'язки. Поряд були Мелісса й Амґалан — одна тривожна, інший — упевнений. Світ, який відкрився перед Ессен, був неймовірно чітким. Її очі наповнились слізьми, вона обійняла кожного з них. Амґалану вона прошепотіла на вухо: “Дякую тобі.”"
  nf_khans.23.a:0 "Майбутнє було ясним"

  nf_new_khans.25.t:0 "Останній подих"
  nf_new_khans.25.d:0 "За старовинною традицією, щойно сходить сонце, Сонцепоклонники виходять із наметів, вартові опускають зброю, і всі вшановують той вогонь, що прокинувся зі сну. Опівдні — година молитви, погляди спрямовані в небо. А ввечері, коли сутінки огортають землю, усі схиляють голови, прощаючись із великим сонцем до ранку. \n\nПротягом більшої частини життя Ессен знала тільки сонце. Вона народилась у його обіймах, працювала невтомно, щоби вразити його погляд, а в холодні ночі розглядала зірки — його слуг — і чекала повернення. Але коли обличчя людей навколо почали розмиватись, а її власні руки стали майже незнайомими — вона замислилась: чи не образила вона когось? Сонце? Народ? Себе? \n\nПодії після Бейлі підтвердили її страхи. Вона вижила під час вибуху гранати лише завдяки тому, що перед нею стояв вищий Сонцепоклонник. Коли Ессен виповзла з-під тіл і руїн, вона була одна. Остання.\n\nВся в гарячій крові й сажі, сонце не було більше теплим — воно палило її безжально.\n\n«СЛАБКІСТЬ», — почула вона в собі, і зрозуміла."
  nf_new_khans.25.a:0 "Ось ціну, яку Сонцепоклонники заплатили за свою слабкість."

  nf_new_khans.28.t:0 "Ще один втрачений дім"
  nf_new_khans.28.d:0 "Після загибелі Папи Хана, вирішувати подальшу долю Великих Ханів довелось Реджису. З ворогами з усіх боків і безліччю поранених та цивільних, він ухвалив важке рішення покинути Пустку Мохаве. Жага помсти охопила багатьох, і частина Ханів вирішила іти власним шляхом. Але Реджис знав: помста — це смерть. \n\nВін згадав історії Папи про Нових Ханів, які давно пішли на північ після падіння Даріона. Великий Хан вирушив шукати далеких родичів. Подорож виявилась тяжкою: чутки, брак припасів, бійки й ворожа земля виснажували їх. Але врешті-решт:"
  nf_new_khans.28.a:0 "Він був змучений"
  nf_new_khans.28.b:0 "Він пишався"
  nf_new_khans.28.c:0 "Він був злісний"

  nf_new_khans.29.t:0 "Щасливе возз’єднання"
  nf_new_khans.29.d:0 "Амґалан та Ессен разом із воїнами попрямували до кордону. Розвідники повідомили про велику озброєну групу, що наближається до земель Ханів. Їм було наказано спостерігати здалеку. \n\nАмґалан відчував щось дивне, навіть тривожне. Решта готувались до бою, але старий вождь хотів спочатку поставити запитання. Він піднявся мотоциклом на хребет, Ессен позаду, і чекав. \n\nГрупа наближалась повільно, обережно, з дітьми й жінками серед них. Озброєні, та з опущеною зброєю. Амґалан гукнув: “Хто ви, що йдете в землі Ханів?”\n\nВідповідь була неочікуваною:"
  nf_new_khans.29.a:0 "“Ми — Хани”"

  nf_new_khans.30.t:0 "Щасливе возз’єднання. Продовження"
  nf_new_khans.30.d:0 "Минуло три дні. Реджис сидів біля вогню з Меліссою, Джеком і Діаною. Після довгого шляху на північ вони знайшли своїх загублених родичів. Після здивованих запитань, Північні Хани прийняли їх. Багатьом подобались історії з Мохаве. \n\n“Цей Амґаллі нормальний чувак,” — зауважив Джек.\n\n“Занадто нормальний,” — хором відповіли Мелісса і Діана.\n\n“Б’юсь об заклад, міг би кинути мене далеко,” — знизав плечима Джек. — “І його Ессен теж.”\n\n“Вона мені подобається,” — посміхнулась Мелісса. — “До речі, Реджисе, багато хто тут хоче нового лідера. Чому б не ти?”\n\nРеджис довго мовчав, але зрештою відповів просто:"
  nf_new_khans.30.a:0 "“Можливо”"

  nf_new_khans.33.t:0 "До гіркого кінця"
  nf_new_khans.33.d:0 "Великі Хани з Мохаве, під проводом Реджиса, вирушили в Ейрі. Вигнані з дому, вони шукали притулку серед чуток про далеких родичів. Земля ця мала недобру славу, та всі дороги сюди були небезпечні.\n\nКоли вони ввійшли до ущелини, голос зверху гукнув: “Хто такі?” — “Ми Великі Хани!” — відповів Реджис.\n\n“Не бачу нічого великого. Але ми знаємо, що робити з Ханами.” — і відкрили вогонь. У долині запанувала тиша."
  nf_new_khans.33.a:0 "Кінець дороги"

  nf_new_khans.34.t:0 "Роздоріжжя"
  nf_new_khans.34.d:0 "“Послідовники розривають з нами зв’язки.” Амґалан стояв у наметі Ессен. Голос рівний, але з надривом. “Вони засуджують твій шлях війни. Вони більше не допоможуть.”\n\n“І все?” — Ессен напружилась. — “Поки вони не заважають і лікують своїх нікчем — нехай хоч скиглять.”\n\nВін зітхнув. “Я не йду. Я тут до кінця. Хани — мій народ. І ти — теж.”\n\nКоли він пішов, Ессен сиділа сама в темряві. Це не стало несподіванкою, але гнів лишився. Та часу на це не було — на неї чекали Мелісса й Езекіель. Справжні Хани йшли далі."
  nf_new_khans.34.a:0 "Слабаки..."

  nf_new_khans.35.t:0 "Сонця більше нема"
  nf_new_khans.35.d:0 "Ессен відкрила очі — темрява. Вона осліпла. Відтоді як Послідовники припинили лікування, зір стрімко погіршився. Вона сиділа в ліжку, вдивлялась у морок — лише тіні, можливо уявні. Голова заболіла. Надворі вже прокидались воїни: бійки, їжа, тренування — звичні звуки.\n\nКрізь клапан намету долинали запахи диму, поту й алкоголю — звичне повітря Військового табору Справжніх Ханів. Вона дістала сокиру, використовуючи її як тростину, вийшла назовні. Ледь-ледь відчувалось денне світло.\n\nВона мусила сказати генералам, що сліпа. Меліссі вона зізналась — перед іншими не приховає. Але Амґалану — нізащо. Його жалість була б отрутою."
  nf_new_khans.35.a:0 "Вона більше не побачить сонце"

  nf_new_khans.36.t:0 "Рад-Лами"
  nf_new_khans.36.d:0 "Колись Хани знайшли зруйноване ранчо, вивіска 'Pacha’s Pastures' ще трималась. Але не було там ані брамінів, ані бізонів — тільки волохаті довгошиї чудовиська, що паслись у траві. Ці істоти ще й плювались кислотною слиною. \n\nПослідовники ідентифікували їх як рад-лам. Спочатку їх лишили в спокої, але згодом вирішили — якщо вміємо їздити верхи, то й лам підкоримо.\n\nМинуло кілька місяців, кілька травм і падінь, але перші ламовершники були готові. Двоє Ханів — один за вуздечками, інший з рушницею. Новий етап кінної війни почався."
  nf_new_khans.36.a:0 "Тільки бережись слини"

  nf_new_khans.37.t:0 "Пісня іменних народів"
  nf_new_khans.37.d:0 "У пошуках знань Послідовники натрапили на старі книги й плівки, серед яких — техніка горлового співу. Вона нібито походила з Монголії — країни Ханів Старого Світу.\n\nЦе швидко стало модою серед Ханів як північних, так і з Мохаве. Найбільше здивувало те, як швидко Ессен і Мелісса опанували техніку. Їхні дуети стали частими — особливо перед битвами. Їхній спів надихав усіх у загоні."
  nf_new_khans.37.a:0 "Хто б міг подумати?"

  #Mad Baron Events

  nf_khans.99.t:0 "Ой, наш ПАПА!"
  nf_khans.99.d:0 "Здається, Папу Хана зжер якийсь канібал-кур’єр у спробі провести божевільний ритуал. Ритуал провалився, але відкрив міжвимірний портал до нашого спасителя — повелителя й захисника Ханів, Романа фон Унгерн-Штернберґа, який уразив кур’єра божественною карою просто на місці. Він поведе нас до помсти по всіх пустках."
  nf_khans.99.a:0 "Він — Месія!"

  nf_tmb.1.t:0 "Зачекайте! Це ж не Монголія!"
  nf_tmb.1.d:0 "Хоч наш спаситель урятував нас від того божевільного кур’єра, деякі речі, що він каже, зовсім не мають сенсу. Він твердить, що існують тварини, які можуть зрівнятись у люті з нашими сталевими колісницями — так звані 'коні'. Крім того, він не пам’ятає нічого про історію нашого народу, окрім того, що ми жили у міфічній Монголії. І найгірше — він дуже погано сприйняв новину, що чоловік на ім’я 'Роман фон Унгерн-Штернберґ' помер 354 роки тому від рук Радянського Союзу."
  nf_tmb.1.a:0 "Як це я помер 354 роки тому?"

  nf_tmb.2.t:0 "Нові скакуни для Нових Ханів"
  nf_tmb.2.d:0 "Схоже, міфічна земля Вайомінґу справді існує. У далеких землях ми знайшли табуни легендарних створінь — коней. Ми сядемо верхи поруч із Великим Ханом — аж до самого кінця світу."
  nf_tmb.2.a:0 "Я — швидкість!"

  nf_vegas.1002.t:0 "Комунізм з Елвісівською специфікою"
  nf_vegas.1002.d:0 "Натовп зібрався біля Лакі 38, коли Король мовчки ввійшов до будівлі зі своїми вбивчими рухами (не тими, від яких помирають від старості, якщо що). Спокійно, з безмежною харизмою, він почав пояснювати Містеру Хаусу суть справи: 'Народ Вегасу хоче, ні, вимагає — комунізм з елвісівською специфікою.'\n\nМістер Хаус був шокований, але Король не дав йому слова. 'Ти, я, ми всі королі. Тримай, Король, ти загубив це. Дозволь я відкрию цю камеру й передам.'\n\nПоки він намагався відкрити анкамеру, Хаус почав волати щось про Айн Ренд, дармоїдів і всяке інше капіталістичне марення. Але Король зумів вимкнути його нейроінтерфейс, проголосивши: 'Товаришу Хаус, я відключаю твій доступ. Відтепер це НАШ інтерфейс.'"
  nf_vegas.1002.a:0 "Як казав Бенні: 'Рінґ-а-дінґ-дон!'"
