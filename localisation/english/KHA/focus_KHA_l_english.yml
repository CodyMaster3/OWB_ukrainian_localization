l_english:
 # originally by david, re-written/adapted by Happy, re-rewritten for 5.0 by Tar
 # restarted by violet, lusa, aida, ironvanguard, and tran for 5.0 following tar's departing of the team. we love and miss you, tar.
 # finished by Aida.valuna, IronVanguard and Anapostrophe. we love and miss you, Violet.

  #War Council

  KHA_khan_war_council:0 "Військова рада"
  KHA_khan_war_council_desc:0 "Поки триває холодна війна між Братством Монтани та Макартурським Анклавом, ті, хто опинився між цими гігантами, мають обмежене вікно можливостей. Якщо ми діятимемо швидко, то зможемо зміцнити нашу владу до того, як зіткнемося з гнівом обох сторін."

  KHA_ncr_teachings:0 "Старий ворог"
  KHA_ncr_teachings_desc:0 "Хани досі пам’ятають перемоги над молодою Республікою. Шейді-Сендс роками тремтів перед нашими могутніми воїнами. Але день за днем Республіка росла, розвивалась і перевершила нас. Через власну пиху ми відмовилися бути кимось, окрім як ницими рейдерами, гадаючи, що зможемо тримати пустку у страху десятиліттями. Хтось досі мріє про «старі добрі часи», але розумніші розуміють: ще одна поразка може стати останньою для Ханів."
  KHA_ncr_teachings_tt:0 "§MДослідження Атраріса щодо армії НКР дадуть нам розуміння, як з нуля створити сучасне військо.§! \n\n §RЕссен прагне реформувати наше військо до колишньої слави Даріона та нагадати, що буває з тими, хто чіпає Ханів.§!"

  KHA_ces_teachings:0 "Новий союзник"
  KHA_ces_teachings_desc:0 "Ми знаємо про Легіон небагато, окрім того, що він — союзник зручний. Попри чисельність і лояльність, легіонери не зрівняються з Ханом. Принаймні у чесному бою. Легіон вдається до боягузливих методів — диверсій, підступу й атакування хвилями із людей. Багато з цих підходів суперечать нашим традиціям, але ми можемо чогось навчитися від наших «друзів»."
  KHA_ces_teachings_tt:0 "§MАтраріс знає ціну військової розвідки. Виконання цього фокуса під його керівництвом дасть бонуси до нашого розвідувального агентства.§! \n\n §RЕссен, яка допомагала Легіону знищувати табори НКР в Мохаве, хоче впровадити Легіонерські тактики жаху. Виконання фокуса під її правлінням дасть бонус до планування.§!"

  KHA_war_logistics:0 "Нові шляхи постачання"
  KHA_war_logistics_desc:0 "Ми — новачки на цих землях, і це зробило нас легкою здобиччю для тих, хто добре їх знає. Та наші розвідники виявили декілька безпечних маршрутів для караванів. Трохи інвестицій — і ми забезпечимо надійне постачання для наших військ."

  KHA_conquer_ranchers:0 "Південна експансія"
  KHA_conquer_ranchers_desc:0 "Нашій імперії потрібні ресурси, земля та нові люди. Ми здобудемо все це силою."

  KHA_use_ranches:0 "Використати ранчо"
  KHA_use_ranches_desc:0 "Хани — погані фермери. Але якщо забезпечити лояльність фермерів, ми зможемо гарантувати стабільне постачання їжі для нашої імперії."
  KHA_use_ranches_tt:0 "§MМи не сіємо — це роблять наші раби.§!"

  KHA_initiate_rancheros:0 "Посвятити Ранчеро"
  KHA_initiate_rancheros_desc:0 "Замість пасти худобу, найсильніші з фермерів будуть посвячені в наші ряди як славетні воїни."

  KHA_conquer_north:0 "Заткнути їхні роти"
  KHA_conquer_north_desc:0 "Єлизавета, змовниця, намагається налаштувати інші фракції проти нас. Ми мусимо зірвати її плани, доки вона не завдала ще більше шкоди."

  KHA_khan_implants:0 "Війна і мир"
  KHA_khan_implants_desc:0 "Змовницю та її напівбляшаних друзів покарано. Атраріс бачить користь у мирі, а не в безглуздому руйнуванні. Можливо, ми зможемо переконати їх у щирості наших намірів."

  KHA_initiate_metalmen:0 "Хани-Кіборги"
  KHA_initiate_metalmen_desc:0 "Хай то була їхня бойова культура чи імпланти — більшість із Металічної Пащі пережили ініціацію і тепер готові служити в нашому зростаючому війську."

  KHA_new_khan_cohorts:0 "Нові когорти"
  KHA_new_khan_cohorts_desc:0 "Завдяки нашій нечуваній експансії ми можемо організувати значну частину населення в нові когорти, підсилюючи наші ряди."

  KHA_lone_tree:0 "Плоди Самотнього Дерева"
  KHA_lone_tree_desc:0 "Країна, малозаселена колоністами, під керівництвом параноїка, що готується до вторгнення, якого ніколи не буде. Самотнє Дерево — легка здобич. Покажемо їм, що навіть стіни і пастки не врятують від наших рейдів."

  KHA_plagued_lands:0 "Заражені землі"
  KHA_plagued_lands_desc:0 "Ми втратили кількох людей, прямучи до Вайомінґу, через автоматизовану оборону заражених земель. Якщо ми відправимо невеликий загін у рейд, зможемо добути там високотехнологічну зброю, яка допоможе нам у майбутніх битвах."

  KHA_conquer_marshall:0 "Ще одна Республіка, яку слід стерти"
  KHA_conquer_marshall_desc:0 ""

  KHA_ranch_economy:0 "Економіка ранчо"
  KHA_ranch_economy_desc:0 "Економічна система республіки Маршалл набагато розвиненіша за нашу. Можливо, ми можемо чогось у них навчитися."

  KHA_marshall_the_troops:0 "Змусити Маршалл маршувати"
  KHA_marshall_the_troops_desc:0 "Республіка Маршалл мала власну армію, що складалась із погано навчених рекрутів, найманців із сумнівною вірністю та місцевих ополченців. Наше завдання — відсіяти зерно від полови."

  KHA_conquer_east:0 "Історія повторюється"
  KHA_conquer_east_desc:0 "«Історики» мали б знати, що орда вже насувається. Це не вторгнення. Це — повторення історії."

  KHA_khan_common_ground:0 "Спільна мова"
  KHA_khan_common_ground_desc:0 "Історики — не воїни, їх захищають найманці. Від інших їх відрізняє бажання допомагати та плекати навколишнє. Можливо, вони погодяться служити нашим людям, якщо ми гарантуємо їм безпеку. Вони можуть нас ненавидіти в тіні, але не зможуть заперечити порядок, який ми принесли Вайомінґу."

  KHA_written_by_victors:0 "Написано переможцями"
  KHA_written_by_victors_desc:0 "Історію пишуть переможці. Історики залишаться у літописах так само, як і всі інші, хто впав перед сильнішими."

  KHA_conquer_center:0 "Забуті громадяни колишньої країни"
  KHA_conquer_center_desc:0 ""

  KHA_khan_patriots:0 "Патріотизм Ханів"
  KHA_khan_patriots_desc:0 "Патріоти шукали мету — те, за що можна померти. Багато з них загинули під час ініціації, але ті, хто вижив, тепер служать країні з фанатичним завзяттям, а не вклоняються забутим ідолам."

  KHA_war_industry:0 "Майстри-зброярі"
  KHA_war_industry_desc:0 "І Джексони, і Чотири Отці мали багатовікову традицію зброярства. Ми можемо використати їхній досвід на благо нашої воєнної справи."

  KHA_no_rock_left_standing:0 "Жодного каменя не залишити"
  KHA_no_rock_left_standing_desc:0 "Хоча наші відносини з Сіу були дружніми через спільних ворогів, ми більше не можемо ігнорувати зростаючий мілітаризм цього племені. Ми мусимо з ними розібратися — так чи інакше."

  KHA_war_for_survival:0 "Війна за виживання"
  KHA_war_for_survival_desc:0 "Роки поспіль Хани воювали задля грабунку й рейдів. Але цього разу ми б’ємося за своє право існувати. За своє майбутнє. За наших дітей. Ми йдемо на війну, щоб сказати тим, хто хоче нас знищити: «Ми не помремо». Хани не вмирають!"

  KHA_war_for_survival_2:0 "Війна за виживання"
  KHA_war_for_survival_2_desc:0 "Роки поспіль Хани воювали задля грабунку й рейдів. Але цього разу ми б’ємося за своє право існувати. За своє майбутнє. За наших дітей. Ми йдемо на війну, щоб сказати тим, хто хоче нас знищити: «Ми не помремо». Хани не вмирають!"

  KHA_cutting_supply:0 "Час платити по рахунках"
  KHA_cutting_supply_desc:0 "Вугільний Консорціум постачає Братству Сталі вугілля для їхніх пристроїв. Якщо ми знищимо джерело, то отримаємо вирішальну перевагу у прийдешній війні."

  KHA_bos_tin_cans:0 "Бляшанки"
  KHA_bos_tin_cans_desc:0 "Без живлення бійці Братства — лише ходячі бляшанки. У нас обмежений час для дій, аби розбити їх ще до того, як вони знайдуть нове джерело енергії."

  KHA_legion_tactics:0 "Тактика Легіону"
  KHA_legion_tactics_desc:0 "Легіон вже воював із Братством і зумів змусити їх відступити всупереч усім шансам. Тепер, коли ми маємо достатньо людей, можемо знову застосувати їхню тактику."

  KHA_steelbreakers:0 "Ламачі Сталі"
  KHA_steelbreakers_desc:0 "З наближенням війни з Братством і Анклавом ми розгорнемо Ламачів Сталі — загін ветеранів Ханів, здатних зрівнятися з бійцями в силовій броні."

  KHA_promise_revenge:0 "Обіцяти їм помсту"
  KHA_promise_revenge_desc:0 "Джексони, що перебувають під нашою владою, давно ворогують із Полковником. Якщо ми пообіцяємо їм помсту, вони нададуть нам повну підтримку."

  KHA_enclave_connections:0 "Зв’язки з Анклавом"
  KHA_enclave_connections_desc:0 "Не всі родини задоволені правлінням Полковника. Джексони активували свої сплячі осередки на базі Макартура, відкривши нам вікно для удару, поки Анклав відволікнений."

  KHA_homeland_for_us:0 "Нарешті вдома"
  KHA_homeland_for_us_desc:0 "Тепер, коли ми закріпилися в Монтані та Вайомінґу, можна відпочити й відновити сили. Після всього, що ми пережили, Хани нарешті мають місце, яке можуть назвати домом."

  #Atraris Diplomacy

  KHA_the_pen_the_sword:0 "Перо і меч"
  KHA_the_pen_the_sword_desc:0 "Кажуть, хто живе мечем — помирає від меча. Атраріс бачить марність побудови імперії лише на силі. Занадто багато імперій упало не від гармат, а від невдоволення власного народу. Можливо, настав час Ханам вивчити мистецтво дипломатії."

  KHA_horse_not_brahmin:0 "Темний кінь"
  KHA_horse_not_brahmin_desc:0 "Для більшості пустельників кінь — просто дивина. Мало хто знає про їхнє довоєнне походження, а ще менше — що колись вони були основою цілих цивілізацій. Ми покажемо їм, чому багато армій пало під копитом і мечем."

  KHA_horsemasters:0 "Повелителі коней"
  KHA_horsemasters_desc:0 "Атраріс міг і читати про них у книжках, але Сіу мають власні методи приручення й верхової їзди. Візьмемо їх за приклад."

  KHA_encourage_ranches:0 "Заохотити ранчо"
  KHA_encourage_ranches_desc:0 "Кінь, придатний до служби у війську, — рідкість. Ми повинні підтримати ранчо, щоб збільшити поголів’я табунів."

  KHA_reorganise_ranchers:0 "Реорганізувати Ранчерів"
  KHA_reorganise_ranchers_desc:0 ""

  KHA_old_natives_new_natives:0 "Жертви імперіалізму"
  KHA_old_natives_new_natives_desc:0 ""

  KHA_going_west:0 "На Захід"
  KHA_going_west_desc:0 ""

  KHA_purpose_for_elisaveta:0 "Мета для Єлизавети"
  KHA_purpose_for_elisaveta_desc:0 ""

  KHA_work_with_historians:0 "Співпраця з Істориками"
  KHA_work_with_historians_desc:0 ""

  #Esen's Warpath

  KHA_khans_carry_their_own:0 "Хани несуть своє"
  KHA_khans_carry_their_own_desc:0 ""

  KHA_picking_their_corpses:0 "Обчистити їхні трупи"
  KHA_picking_their_corpses_desc:0 "Імпланти — велика рідкість у пустці. Ми не можемо дозволити собі марнувати таке цінне обладнання."

  KHA_dead_tell_no_tales:0 "Мертві не розповідають"
  KHA_dead_tell_no_tales_desc:0 "Єлизавета, підступниця, більше не має де ховатися і поширювати свої отруйні річі. Подивимося, чи зможе вона вичавити з цього хоч якісь ідеї назад до життя."

  KHA_this_does_put_smile:0 "Це й справді тішить"
  KHA_this_does_put_smile_desc:0 "Можливо, Єлизавета в чомусь була права. Найвище щастя у світі — перемагати своїх ворогів, гнати їх перед собою, грабувати їхнє багатство, бачити сльози на обличчях їхніх близьких, а не сидіти без діла, поки світ навколо палає."
  KHA_this_does_put_smile_tt:0 "§GПоглянь на світлу сторону, Єлизавето — принаймні Хани обрумінували свій шлях до багатства.§!"

  KHA_contact_mongols:0 "Зв’язатися з Монголами"
  KHA_contact_mongols_desc:0 "Безжальні рейдери, що називають себе Монголами, походять від старих байкерських банд. Їхні ряди порідшали останнім часом, а їхній вплив ослаб. Якщо ми запропонуємо союз — зможемо скористатися їхньою люттю."

  KHA_one_percenters:0 "Один відсоток"
  KHA_one_percenters_desc:0 "Усі Монголи є вправними наїзниками, але не кожен із них входить у той самий "один відсоток". Обрані з найкращих, вони наганяють жах. Подейкують, що навіть Вісімдесятників лякає рев їхніх двигунів!"

  KHA_drugs_on_wheels:0 "Хімія на колесах"
  KHA_drugs_on_wheels_desc:0 "Навіщо робити поодинокі доставки, коли можна возити хімію масово на транспорті? Завдяки нашій майстерності керування моторами, ми можемо постачати достатньо хімії, що вистачить цілому місту."

  #Bitter Springs Subtree
  
  KHA_when_springs_run_bitter:0 "Коли джерела стають гіркими"
  KHA_when_springs_run_bitter_desc:0 "Новини про різанину в Бітер-Спрінґс докотилися аж до Вайомінґу. Це ж не може бути настільки жахливо, правда?"

  KHA_out_out_brief_candle:0 "Згасай, згасай, коротка свічко"
  KHA_out_out_brief_candle_desc:0 "Тоді хлопчик побачив усе — Відколи себе пам’ятав, був великим хлопцем \n Виконував чоловічу роботу, хоч у душі ще дитина — \n Він побачив усе зруйнованим. “Не дай їм забрати наші життя, \n НКР, коли прийдуть. Не дай, сестро!” \n Та він уже пішов."

  KHA_becoming_better:0 "Самоспоглядання"
  KHA_becoming_better_desc:0 "Можливо, це не така вже й велика трагедія. Можливо, якби ми не нападали на НКР, цього б не сталося. Можливо, ми могли бути кращими. Можливо, ми могли якось це зупинити. А раптом вони не мали злих намірів? А якщо це була помилка в спілкуванні? Невже вони настільки ненависні, щоб розстріляти беззбройних цивільних?"

  KHA_iwill_fight_some_more_forever:0 "Я ще поборюсь — і завжди"
  KHA_iwill_fight_some_more_forever_desc:0 "§RПрийде день, коли вони вважатимуть себе в безпеці й щасливими — і раптом їхня радість обернеться попелом у роті, і тоді вони зрозуміють: борг сплачено.§!"

  KHA_khan_resilience:0 "Стійкість Ханів"
  KHA_khan_resilience_desc:0 "На безкраїх рівнинах Вайомінґу тримаються Великі Хани. Можливо, час прийняти втрати і рухатися далі. Ми відійдемо з лінії вогню — допоки не наберемо достатньо сил, щоб віддати належне за все, що трапилось."

  #Misc

  KHA_focus_great_hunts:0 "Великі полювання"
  KHA_focus_great_hunts_desc:0 "У минулому ми вдавалися до полювання в часи спокою. Шкури та м’ясо Ґеко і Товсторогів можуть добре послужити нашому народу — а саме полювання дарує незрівнянне захоплення!"

  KHA_focus_camp_armouries:0 "Таборові зброярі"
  KHA_focus_camp_armouries_desc:0 "Наші воїни не повинні повністю залежати від праці рабів для виготовлення та обслуговування своєї зброї, броні та транспорту. Кожен воїн повинен уміти сам зібрати й підтримувати своє спорядження, а кожен табір — мати відповідні майстерні."

  KHA_focus_arms_workshops:0 "Збройові майстерні"
  KHA_focus_arms_workshops_desc:0 "Лише таборових збройових буде замало для обсягів виробництва, яких ми прагнемо — нам потрібно створити майстерні, що повністю присвячені виготовленню зброї."

  KHA_focus_slave_workshops:0 "Рабські майстерні"
  KHA_focus_slave_workshops_desc:0 "Раби давно вже є частиною виробничої лінії у збройових майстернях, але тепер слід забезпечити їхнє глибоке включення в систему. Це суттєво підвищить нашу продуктивність!"

  KHA_focus_warrior_scholars:0 "Воїни-Вчені"
  KHA_focus_warrior_scholars_desc:0 "Коли ми не воюємо, не полюємо, не будуємо чи не лагодимо спорядження, ми не повинні розслаблятися. Ми повинні навчатися, досліджувати, пізнавати. Усе, чого можна навчитися в пустках — це знання, що можуть урятувати життя."

  KHA_focus_overwhelming_firepower:0 "Переважаюча вогнева міць"
  KHA_focus_overwhelming_firepower_desc:0 "У нас немає стільки людей, як у НКР чи Легіону, але ми цілком здатні зрівнятися з ними розмірами нашої важкої артилерії."

  KHA_focus_warrior_training:0 "Підготовка воїнів"
  KHA_focus_warrior_training_desc:0 "Наша нова зброя без вмілих стрільців на матиме жодної користі. Кожен Хан повинен уміти стріляти з будь-якої зброї, що опиниться в його руках!"

  KHA_focus_reuse_old_factories:0 "Відновити старі фабрики"
  KHA_focus_reuse_old_factories_desc:0 "Пустки наповнені покинутими фабриками — багато з них усе ще мають придатне обладнання. Ми можемо і мусимо скористатися цим негайно."

  KHA_focus_lessons_of_history:0 "Уроки історії"
  KHA_focus_lessons_of_history_desc:0 "Протягом свого існування ми здобували багато перемог — і пережили безліч поразок. Усі ці битви повинні визначати, як ми воюємо — і як керуємо собою в мирні часи."

  KHA_focus_on_the_move:0 "У Русі"
  KHA_focus_on_the_move_desc:0 "Хани ніколи не зупиняються. Щоб це було ефективно, ми повинні вміти виживати завдяки самому лише довкіллю та забезпечити мобільність нашої промисловості."

  KHA_focus_synthesise_our_own_chems:0 "Синтез власної хімії"
  KHA_focus_synthesise_our_own_chems_desc:0 "Приходячи до нас, Послідовники Апокаліпсису принесли технології та навчили нас виготовляти зброю. Вони також навчили нас синтезувати власні хімікати — і це було на кілька щаблів вище за природні опіати, до яких ми звикли."

  KHA_focus_founders_of_the_chem_trade:0 "Засновники Хім-Торгівлі"
  KHA_focus_founders_of_the_chem_trade_desc:0 "У Каньйоні Редрок майже нічого не росте, окрім низки рослин, що є основою для виготовлення хімії. Завдяки цьому багато банд з Мохаве залежать від нас — і ми заслужили титул «засновників хім-торгівлі»."

  KHA_focus_old_friends:0 "Старі друзі"
  KHA_focus_old_friends_desc:0 "Деякі з давніх рейдерських груп, з якими ми вийшли зі сховища, залежать від нас у постачанні нових і захопливих препаратів. Ми маємо скористатися цим доти, поки це можливо — це не тільки принесе нам зиск, а й, можливо, зробить їх легкою здобиччю в майбутньому."

  KHA_focus_crimson_caravan_trade_deals:0 "Угоди з Червоним Караваном"
  KHA_focus_crimson_caravan_trade_deals_desc:0 "Офіційно НКР забороняє наркотики, що викликають залежність, проте Червоний Караван і більшість багатих незалежних торговців охоче закривають очі на це заради прибутку. Це дозволяє нам поширювати наш вплив серед корумпованої еліти НКР!"

  KHA_focus_the_logical_path:0 "Логічний вибір"
  KHA_focus_the_logical_path_desc:0 "Мало хто в пустках вартий союзу з Ханами, але за Колорадо на нас чекає дуже схожа сутність. Легіон поділяє багато наших поглядів — зокрема, вічну ненависть до НКР. Ми повинні зблизитися з ними. Хто знає — можливо, разом ми знищимо НКР."

  KHA_focus_a_friend_of_the_legion:0 "Друг Легіону"
  KHA_focus_a_friend_of_the_legion_desc:0 "Хоча Легіон і близький до нас за ідеологією, нині у нас небагато дипломатичних зв’язків. Деякі з його лідерів усе ще бачать у нас диких племен. (Серйозно? Диких? Наші воїни миються двічі на місяць — удвічі частіше за них!) Ми повинні показати їм нашу культуру й спадщину."

  KHA_focus_caesars_advisor:0 "Радник Цезаря"
  KHA_focus_caesars_advisor_desc:0 "Як символ нашої зростаючої дружби, Цезар надіслав нам одного з найвірніших радників — фрументарія на ім’я Карл. Він без сумніву звітуватиме перед самим Цезарем, тож слід уважно прислухатися до його порад і навчити його, як ми ведемо війну."

  KHA_focus_join_the_legion:0 "Приєднатися до Легіону"
  KHA_focus_join_the_legion_desc:0 "Військовий союз із Биком за Колорадо — це логічне продовження наших нинішніх відносин з Легіоном. Варто лише попросити."

  KHA_focus_ideas_of_the_legion:0 "Ідеї Легіону"
  KHA_focus_ideas_of_the_legion_desc:0 "Разом з тактиками та організацією Легіону до нас прийшли й інші ідеї — зокрема, повне відкидання автоматизації. Якщо ми хочемо продовжувати наш союз, слід це прийняти."

  KHA_focus_legion_slave_trade:0 "Работоргівля Легіону"
  KHA_focus_legion_slave_trade_desc:0 "Економіка як Легіону, так і наша значною мірою тримається на рабській праці. Ми повинні об'єднати наші рабовласницькі системи — щоб мати доступ до потрібних нам працівників."

  KHA_focus_a_bastion_across_the_colorado:0 "Бастіон За Колорадо"
  KHA_focus_a_bastion_across_the_colorado_desc:0 "Попри союз із Легіоном, очевидно, що він не зможе напряму допомогти нам у разі вторгнення НКР. Тож нам доведеться самим зміцнити наші кордони."

  KHA_focus_war_with_ncr:0 "Готуймося до війни з Ведмедем"
  KHA_focus_war_with_ncr_desc:0 "Час помсти вже майже настав — але нам потрібні ще воїни. Покличмо всі загони додому."

  KHA_focus_avenge_bittersprings:0 "Помститися за Бітер-Спрінґс"
  KHA_focus_avenge_bittersprings_desc:0 "Барабани війни задзвонили. Ми більше не відступимо. Ми не здамося. Ми проженемо цих собак туди, звідки вони прийшли. Ніколи знову вони не зможуть влаштувати бійню над нашими жінками й дітьми! До зброї!"

  KHA_focus_legion_industry:0 "Промислові ідеї Легіону"
  KHA_focus_legion_industry_desc:0 "Радники Легіону навчили нас низці прийомів для підвищення промислової ефективності — від ефективнішої металургії до раціоналізації рабської праці. Це виведе наше виробництво на новий рівень!"

  KHA_focus_legion_weapons:0 "Зброя від Легіону"
  KHA_focus_legion_weapons_desc:0 "Сам Цезар наказав постачати нам кілька тонн зброї, боєприпасів і вибухівки, щоб ми могли ефективніше захищати себе від НКР. Ми приймемо цей дар із вдячністю."

  KHA_focus_fake_neutrality:0 "Фасад нейтралітету"
  KHA_focus_fake_neutrality_desc:0 "Захист Легіону привабливий, але вони вимагають надто багато. Ми повинні йти своїм шляхом — хоча кожному очевидно, на чий бік ми схиляємось у конфлікті між Ведмедем і Биком."

  KHA_focus_our_own_slave_trade:0 "Власна работоргівля"
  KHA_focus_our_own_slave_trade_desc:0 "Раби — основа економіки пустки, й нашої теж. Ми повинні пріоритетно поневолювати стільки людей, скільки зможемо — щоб наростити виробничі потужності."

  KHA_focus_backhand_support:0 "Плащ та Кинджал"
  KHA_focus_backhand_support_desc:0 "Пряме зіткнення з НКР на кордоні тільки викличе нові хвилі солдатів. Натомість надішлемо елітні загони Легіону — і насолодимося солодкою помстою, не піддаючи ризику наших жінок і дітей."
  KHA_focus_melissa_lewis_desc:0 "Melissa is a courier for the Great Khans and knows all the tricks of the business. She wasn't born into the tribe but instead underwent grueling training—and she shows true potential."

  KHA_focus_khan_addicts:0 "Синтетичні опіоїди"
  KHA_focus_khan_addicts_desc:0 "Завдяки новим технологіям наш народ перейшов від природних опіоїдів до значно сильніших синтетичних — джету та психо. Тільки дурень став би на шляху такого обколотого шаленого велетня."

  KHA_focus_khan_overdose:0 "Обколоті Хани"
  KHA_focus_khan_overdose_desc:0 "Якщо перед битвою дати бійцям більше хімії, ми зможемо обколоти їх до бойового безумства — забезпечуючи шалений атакувальний бонус ціною організованості."

  KHA_focus_upgrade_the_arsenal:0 "Оновити арсенал"
  KHA_focus_upgrade_the_arsenal_desc:0 "Якими б хоробрими не були наші бійці, вони не зможуть перемогти солдата НКР з лазерним мушкетком, якщо самі мають тільки ніж. Нам потрібно оновити озброєння, щоб наша міць засяяла."

  KHA_focus_a_khan_holds_their_own:0 "Хан сам за себе"
  KHA_focus_a_khan_holds_their_own_desc:0 "Щоб навіть вступити до Ханів, воїн повинен довести свою спроможність у чесному бою один на один. Багато наших ворогів такої підготовки не мають."

  KHA_focus_cheap_firearms:0 "Дешева вогнепальна зброя"
  KHA_focus_cheap_firearms_desc:0 "Пустка — це скарбниця покинутої зброї та спорядження. Ми повинні використати це на повну!"

  KHA_focus_impale_the_enemy:0 "Проткнути ворогів"
  KHA_focus_impale_the_enemy_desc:0 "Справжній Хан не тікає, навіть коли перед ним переважаючий ворог. Він йде вперед — і знищує того, хто стоїть проти нього. А термоспис, який він триматиме — неабияк допомагає."

  KHA_focus_deal_with_gun_runners:0 "Угода зі Зброярами"
  KHA_focus_deal_with_gun_runners_desc:0 "Зброярі — це компанія із Кістяка Анджелесу, знані за свою якість і майстерність. Хоч їхній осередок знаходиться в Кістяку Анджелеса, у них є фабрики на околицях Нью-Вегаса, і, як усі торговці, вони не проти продати зброю за кришки."

  KHA_focus_the_khan_arena:0 "Арена Ханів"
  KHA_focus_the_khan_arena_desc:0 "У каньйоні розташована велика арена, де Хани відточують навички ближнього бою. У ній проходять змагання, де найкращі воїни виборюють право стати лідерами бойових загонів."

  KHA_focus_weapon_manafacturing_quantity:0 "Масове виробництво"
  KHA_focus_weapon_manafacturing_quantity_desc:0 "Хоч кожен Хан — вправний боєць без зброї, проти НКР із вогнепалом цього замало. Потрібно налагодити масове виробництво зброї!"

  KHA_focus_new_tactics:0 "Нові тактики"
  KHA_focus_new_tactics_desc:0 "Ми добре вивчили тактику НКР — але й вони нашу. Щоб не стати передбачуваними, маємо залишатися непередбачуваними."

  KHA_focus_iron_steeds:0 "Залізні коні"
  KHA_focus_iron_steeds_desc:0 "Чингісхан водив своїх воїнів на конях. Ми поведемо своїх — на значно швидших і привабливіших мотоциклах."

  KHA_focus_war_path:0 "Великий шлях війни"
  KHA_focus_war_path_desc:0 "Усі, хто стоїть між нами й нашими прагненнями, мають впасти на коліна. До зброї!"

  KHA_focus_agricultural_development:0 "Сільськогосподарський розвиток"
  KHA_focus_agricultural_development_desc:0 "Наш народ має безліч витоків — і стільки ж ідей, як вижити в цих жорстоких землях. Одна з них — сільське господарство."

  KHA_focus_construction_techniques:0 "Будівельні техніки"
  KHA_focus_construction_techniques_desc:0 "Якщо ми вирішили оселитися, маємо вдосконалити методи будівництва, щоб швидко зводити житло та фабрики."

  KHA_focus_build_a_weapons_stockpile:0 "Створити запаси зброї"
  KHA_focus_build_a_weapons_stockpile_desc:0 "Поки все добре — треба готуватись до гіршого. Зброя в запасі завжди згодиться."

  KHA_focus_scavenger_outposts:0 "Пункти збирання"
  KHA_focus_scavenger_outposts_desc:0 "Збирання дає доступ до ресурсів, яких важко дістати в пустці. Ми маємо створити такі пункти."

  KHA_focus_improved_housing:0 "Покращене житло"
  KHA_focus_improved_housing_desc:0 "Хоча Хани традиційно мешкають у наметах, для жінок і дітей буде великою перевагою збудувати постійні помешкання."

  KHA_focus_old_world_civilization:0 "Цивілізація старого світу"
  KHA_focus_old_world_civilization_desc:0 "Рейди — не єдиний спосіб вижити в пустці. Фермерство, полювання й збирання можуть бути не менш прибутковими."

  KHA_focus_one_community:0 "Племінний дух"
  KHA_focus_one_community_desc:0 "Великі Хани — це одна велика родина. Ми дбаємо одне про одного, і завжди підтримаємо у скруті. У цьому — наша найбільша сила."

  KHA_focus_fire_support:0 "Вогнева підтримка"
  KHA_focus_fire_support_desc:0 "Ключ до нашої успішної оборони — потужні вибухові засоби. Їх треба впровадити до армії."

  KHA_focus_enhanced_tactics:0 "Поліпшені тактики"
  KHA_focus_enhanced_tactics_desc:0 "Світ змінюється, так само і війна. Ми повинні створити власні доктрини."

  KHA_focus_military_planning:0 "Ретельне планування"
  KHA_focus_military_planning_desc:0 "Тотальна війна — не наш метод. Ми надто розпорошені. Кожен удар має завдавати максимальних втрат."

  KHA_focus_medical_advancements:0 "Медичні досягнення"
  KHA_focus_medical_advancements_desc:0 "Послідовники дали нам чимало технічних знань, зокрема — як створювати ліки. Це допомогло рятувати поранених у боях."

  KHA_focus_electronic_technology:0 "Електронні технології"
  KHA_focus_electronic_technology_desc:0 "Послідовники дали основу, але не методи масштабного виробництва або вдосконалення. Тут на сцену вступаємо ми."

  KHA_focus_industrial_aid:0 "Промислова Допомога"
  KHA_focus_industrial_aid_desc:0 "Послідовники знані своєю підтримкою. Час прийняти технології старого світу, які вони використовують."

  KHA_focus_our_own_innovations:0 "Наші власні іновації"
  KHA_focus_our_own_innovations_desc:0 "Послідовники дали нам фундамент майбутнього. Тепер наш обов’язок — будувати далі."

  KHA_focus_trained_field_medics:0 "Польові медики"
  KHA_focus_trained_field_medics_desc:0 "Хоч Послідовники — пацифісти, ми можемо адаптувати їхню допомогу для порятунку наших воїнів у бою."

  KHA_focus_settle_the_wasteland:0 "Осісти в пустці"
  KHA_focus_settle_the_wasteland_desc:0 "Хани вічно кочували, та настав час осісти й створити постійну опору."

  KHA_focus_the_long_house:0 "Рада довгого дому"
  KHA_focus_the_long_house_desc:0 "У центрі племені — Довгий Дім, де ухвалюють рішення. Зібравши найкращих радників з загонів, ми уникнемо помилок."

  KHA_focus_chance:0 "Ченс"
  KHA_focus_chance_desc:0 "Ченс — ветеран Ханів і один з небагатьох, хто вижив у Різанині в Бітер-Спрінґс. Він безжальний воїн, що не знає ані страху, ані жалю до своїх ворогів."

  KHA_focus_mcmurphy:0 "МакМерфі"
  KHA_focus_mcmurphy_desc:0 "МакМерфі — уроджений Хан і досвідчений командир рейдів у глибокому тилу ворога."

  KHA_focus_the_armorer:0 "Зброярка"
  KHA_focus_the_armorer_desc:0 "Зброярка Ханів — одна з найкращих у пустці. Вона з нічого кує обладунки варті легенд."

  KHA_focus_oscar_velasco:0 "Оскар Веласко"
  KHA_focus_oscar_velasco_desc:0 "Оскар — снайпер, що вижив у Різанині. Його вміння й вірні бійці ще прислужаться нам."

  KHA_focus_melissa_lewis:0 "Мелісса Льюїс"
  KHA_focus_melissa_lewis_desc:0 "Мелісса — кур’єр Ханів. Не народжена в племені, але пройшла жорсткі випробування. У ній — великий потенціал."

  KHA_focus_desmond_lans:0 "Десмонд Ленс"
  KHA_focus_desmond_lans_desc:0 "Десмонд ніколи не забував різанину в Бітер-Спрінґс і вважає, що Великим Ханам давно час помститися НКР за їхні звірства."

  KHA_focus_jack:0 "Джек"
  KHA_focus_jack_desc:0 "Джек — безтурботний наркоторговець, або ж «постачальник хімії», як він себе називає. Його часто можна побачити разом із Діаною. Вони керують наркотрафіком у Мохаві та постачають хімікати Великим Ханам. Джек вивчив хімію у Послідовників Апокаліпсису."

  KHA_focus_diane:0 "Діана"
  KHA_focus_diane_desc:0 "Діана — наркоторговка та членкиня Великих Ханів. Її часто можна побачити з Джеком, хоча здається, що це більше він слідує за нею, ніж навпаки."

  KHA_focus_anders:0 "Андерс"
  KHA_focus_anders_desc:0 "Андерс був і залишається Ханом, і здобув собі ім’я як найнадійніший наркокур’єр Діани. Разом трійця — Діана, Джек і Андерс — контролює переважну більшість наркотрафіку Великих Ханів."

  KHA_focus_jerry_the_punk:0 "Джеррі Панк"
  KHA_focus_jerry_the_punk_desc:0 "Коли Джеррі був дитиною, Послідовники Апокаліпсису прийшли до Каньйону Ред Рок з довоєнними книжками. Джеррі проводив години за читанням, особливо поезії, і згодом став поетом Великих Ханів — пишучи епоси про їхні перемоги."

  KHA_focus_emma_winslow:0 "Емма Вінслоу"
  KHA_focus_emma_winslow_desc:0 "Емма була однією з перших Послідовниць Апокаліпсису, яка встановила контакт із Великими Ханами, та присвятила свій час допомозі племені — навіть почала переймати його культуру. Якщо ми запросимо її до Довгого дому, можливо, зможемо переконати її народ, що ми не такі вже й погані."

  KHA_focus_dalia:0 "Далія"
  KHA_focus_dalia_desc:0 "Далія — більше, ніж просто гарне обличчя. Її вміння переконувати та політична кмітливість роблять її чудовою мотиваційною промовицею."

  KHA_focus_new_lands:0 "Нові землі"
  KHA_focus_new_lands_desc:0 "Нас стає дедалі більше, але наші землі не ростуть разом з нами. Нам потрібні нові ресурси, нові поселення і нові раби — тож ми повинні їх забрати!"

  KHA_focus_a_new_home:0 "Новий фронтир"
  KHA_focus_a_new_home_desc:0 "Десь там є дім для Ханів.\nНам просто треба його знайти."
  KHA_focus_a_new_home_tt:0 "§RДопоможи Ханам вирушити кудись далі у майбутньому оновленні.§!"

  KHA_focus_expand_northwards:0 "Просунутися до Зони 51"
  KHA_focus_expand_northwards_desc:0 "Розривачі Небес на півночі зараз займають Зону 51 — цінний довоєнний військовий об’єкт, який, схоже, досі лишається недоторканим для рейдерських банд. Всередині цієї бази мають бути великі скарби — не кажучи вже про безліч поселень, які ми отримаємо, зайнявши ці землі."

  KHA_focus_a_new_silk_road:0 "Постачати чорний ринок Шейді-Сендс"
  KHA_focus_a_new_silk_road_desc:0 "Тепер, коли ми практично маємо прямий доступ до Шейді-Сендс через наші поселення в районі Зони 51, ми можемо без зусиль просувати наші наркотики, психотропи та зброю прямо в серце Республіки. Політична еліта вже благає про порятунок від гнітючої демократії, в яку перетворилася НКР."

  KHA_focus_enslave_the_west:0 "Поневолити Захід"
  KHA_focus_enslave_the_west_desc:0 "Західні землі Розривачів Небес багаті на поселення та ресурси, але також і на спротив. Його треба зламати, якщо ми хочемо продовжити свою діяльність у регіоні."

  KHA_focus_integrate_the_west_reavers:0 "Створити застави Ханів"
  KHA_focus_integrate_the_west_reavers_desc:0 "Тепер, коли Західна Невада очищена від ворогів, ми маємо переселити туди частину Ханів і збудувати опорні пункти. Ці землі тепер наші, і невдовзі ми почнемо рекрутувати нових Ханів із місцевих."

  KHA_focus_explore_a51:0 "Почати експедицію в Зону 51"
  KHA_focus_explore_a51_desc:0 "Військова база в Зоні 51 зазнала важких ударів під час Великої війни, але глибоко під землею залишилися цілі відсіки. Багато з них не бачили світла століттями, і в них можуть бути як великі багатства, так і смертельні небезпеки..."

  KHA_focus_enslave_the_east:0 "Поневолити Схід"
  KHA_focus_enslave_the_east_desc:0 "Попри затяжну війну, в Східній Неваді все ще залишилося багато цивільного населення. Ми повинні змусити їх працювати у фабриках та шахтах!"

  KHA_focus_integrate_the_east_reavers:0 "Інтегрувати Спрінґс"
  KHA_focus_integrate_the_east_reavers_desc:0 "Хоча наша війна з Розривачами Небес була кривавою, багато місцевих у захоплених поселеннях співчувають нашому способу життя. Насправді, чимало з них хочуть приєднатися до Ханів. Ми повинні скористатися цим, щоб поповнити наші бойові загони."

  KHA_focus_press_advantage:0 "Розвинути успіх"
  KHA_focus_press_advantage_desc:0 "Племена та рейдерські банди Невади були абсолютно не готові до нашого стрімкого наступу на Розривачів Небес і поширення наркотрафіку вшир та вдовж. Ми маємо продовжити, поки вони не встигли підготуватися до спротиву."

  KHA_focus_expansion_rangers:0 "Знищити Рейнджерів"
  KHA_focus_expansion_rangers_desc:0 "Рейнджери на півночі постійно заважають нашій наркоторгівлі. Їхня одержимість жалюгідними ідеалами допомоги слабким і беззахисним постійно зіштовхує їх з нашими загонами. Час покінчити з ними раз і назавжди."

  KHA_focus_reno_drug_trade:0 "Отримати доступ до наркоринку Нью-Ріно"
  KHA_focus_reno_drug_trade_desc:0 "Нью-Ріно кишить наркотиками, і нам потрібне безпечне місце для торгівлі. На щастя, ми маємо нещодавно звільнену 'Цитадель', яка ідеально підходить для цього..."

  KHA_focus_recruit_lowlifes:0 "Рекрутувати покидьків"
  KHA_focus_recruit_lowlifes_desc:0 "Ми контролюємо чимало територій, які не входять до осередків Великої Ханської нації. Через це ми не можемо нормально рекрутувати там людей. Можливо, варто змінити тактику і зосередитися на тих, кого легко переконати..."

  KHA_focus_backstab_wht:0 "Розтрощити Білоногих"
  KHA_focus_backstab_wht_desc:0 "Білоногі та їхня велика імперія становлять пряму загрозу нашим землям. Ми повинні розібратися з ними, перш ніж вони становитимуть небезпеку для нас і наших союзників."

  KHA_focus_utah_client_states:0 "Створити підданницькі держави в Юті"
  KHA_focus_utah_client_states_desc:0 "Ми будемо надто розтягнуті, якщо вийдемо з нашими територіями вглиб Юти. Тому слід створити підданницькі держави серед місцевих племен і поселень."
  KHA_tributary_effect_tt:0 "Цей фокус має кілька наслідків:\n\nЯкщо ви контролюєте всі національні землі §YСкорботних§!, §YХранителів Часу§! або §YСмоляних Ходоків§! — ви §Gперетворите§! їх на своїх маріонеток.\n\nІнакше ви отримаєте §Yцілі війни§! на будь-яку державу, що володіє їхніми національними територіями.\n\nЯкщо §YСкорботні§!, §YХранителі Часу§! або §YСмоляні Ходоки§! у фракції з вами — вони стануть вашими §Gмаріонетками§!.\n\nІнакше ви отримаєте §Rцілі війни на маріонетизацію§! проти них."

  KHA_focus_raise_new_wht_hosts:0 "Зібрати орди Білоногих"
  KHA_focus_raise_new_wht_hosts_desc:0 "Багато племінних Білоногих не були фанатиками Цезаря чи мормонів. Насправді, чимало з них готові служити будь-кому заради здобичі й слави. Вони стануть легким поповненням наших лав."
  kha_raise_wht_warbands:0 "У кожній контрольованій провінції, що є національною територією [WHT.GetNameWithFlag], буде створено дивізію §RХанських бігунів§!."

  KHA_focus_integrate_wht:0 "Нові члени Ханів"
  KHA_focus_integrate_wht_desc:0 "Багато людей з-поміж Білоногих ніколи не виступали проти приєднання до Ханів і мають великий досвід виживання в пустках. Ми не можемо марнувати такий потенціал!"

  KHA_focus_enslave_wht:0 "Зробити їх рабами"
  KHA_focus_enslave_wht_desc:0 "Білоногі були нашими ворогами, тож ми ніколи не зможемо їм довіряти. Краще закувати їх у кайдани й відправити на роботу в шахти та майстерні!"

  KHA_focus_khan_culture_1:0 "Засоби виробництва"
  KHA_focus_khan_culture_1_desc:0 "Хани завжди були в русі, виготовляючи все необхідне де б не опинилися. Ми повинні слідувати цим традиціям."

  KHA_focus_khan_culture_2:0 "Соціальний дарвінізм"
  KHA_focus_khan_culture_2_desc:0 "У ханській культурі виживають лише найсильніші, і завдяки цьому наш народ загалом став сильнішим!"

  KHA_focus_khan_culture_3:0 "Здатні тіла"
  KHA_focus_khan_culture_3_desc:0 "Кожен хан, хто має здорове тіло — є воїном. Це накладає обмеження на наше виробництво, бо в нас немає окремих механіків, але це також означає, що кожен хан здатен захистити себе та своїх близьких."

  KHA_focus_khan_culture_4:0 "Тактика «ударив - відбіжав»"
  KHA_focus_khan_culture_4_desc:0 "Ми ніколи не зможемо зібрати велику армію, тож маємо розробити власну тактику, яка дозволить нам використати максимум із наявного."

  KHA_focus_khan_culture_5:0 "Постійні споруди"
  KHA_focus_khan_culture_5_desc:0 "Кочовий спосіб життя добре підходить для набігів, але якщо ми хочемо процвітати — нам слід осісти."

  KHA_focus_khan_culture_6:0 "Ідеї майбутнього"
  KHA_focus_khan_culture_6_desc:0 "Культуру Ханів часто вважають примітивною, але осівши на місці, ми нарешті можемо задуматися над новими шляхами існування."

  KHA_focus_khan_culture_7:0 "Постійне місце проживання"
  KHA_focus_khan_culture_7_desc:0 "Постійне житло — це також і постійна безпека, якщо ми зможемо захистити його."

  KHA_focus_khan_culture_8:0 "Оборонні стратегії"
  KHA_focus_khan_culture_8_desc:0 "Ми повинні розширити наші оборонні можливості за межі Каньйону Ред-Рок та захистити все, що вважаємо своїм."

  KHA_establish_the_drug_runners:0 "Розгорнути наркокур'єрів"
  KHA_establish_the_drug_runners_desc:0 "Ми змогли виготовляти більше наркотиків, ніж продаємо. Щоб розширити наш бізнес, нам потрібні спеціальні наркокур'єри, які приноситимуть прибуток."


  ######REGIS PATH#######

  khan_regis_intro:0 "Великий хан"
  khan_regis_intro_desc:0 "Реджис прибув як чужинець у чужу землю, але північні Хани не здалися йому зовсім незнайомими. Хоча їхній ватажок Амґалан править м’яко, за сорок років Хани майже не змінилися. Реджиса зустріли з розкритими обіймами, і він уже має неабиякий вплив у племені, фактично виконуючи обов’язки хана. Можливо, скоро й офіційно."

  khan_meet_amgalan:0 "Слово доброї людини"
  khan_meet_amgalan_desc:0 "Амґалан дав Реджису багато свободи, не бажаючи виступати проти його очевидної популярності серед Ханів. Але старий ватажок має що сказати, а Реджис завжди вмів слухати."

  khan_the_followers:0 "Наші давні знайомі"
  khan_the_followers_desc:0 "Хани з Мохаве колись товаришували з Послідовниками Апокаліпсису, хоча згодом і розійшлися через розбіжності в поглядах. Та тут усе інакше, й Реджис розуміє, що здобути їхню прихильність буде лише на користь."

  khan_open_initiations:0 "Відкрите посвячення"
  khan_open_initiations_desc:0 "Великі Хани ніколи не зважали на походження — кожен, хто здатний і має бажання, може стати Ханом. Якщо ми заявимо, що двері відкриті — до нас приєднається багато охочих."

  khan_our_heritage:0 "Наша спадщина"
  khan_our_heritage_desc:0 "Минуле Ханів — це боротьба, амбіції та здатність кидати виклик тим, хто хоче нас підкорити. Ми завжди вставали після поразки. І хоч це не завжди спрацьовувало — це частина нас."

  khan_meet_esen:0 "Воїтелька"
  khan_meet_esen_desc:0 "Ессен відносно нещодавно приєдналася до Ханів, але її рішучість і готовність захищати нову родину вже здобули їй визнання. Якщо Реджис хоче колись очолити всіх воїнів, він має здобути і її повагу."

  khan_mojave_guns:0 "Стріляючі палиці"
  khan_mojave_guns_desc:0 "У Мохаве Ханам часто доводилося воювати — і з НКР, і з дикими мутантами. Багато хто навчився самотужки лагодити зброю. Кращі майстерні допоможуть нам озброїти бійців ефективніше."

  khan_bigger_motors:0 "Потужніші мотори"
  khan_bigger_motors_desc:0 "Рівнини й степи великі, й мотоциклів уже недостатньо. Настав час поставити на хід старі довоєнні автомобілі."

  khan_our_spirit:0 "Наш дух"
  khan_our_spirit_desc:0 "Бути Ханом — означає бути воїном. Ми не лише приймаємо удар, але й даємо відповідь. Оце і є дух Хана — не здаватися, навіть коли по тобі вдарили."

  khan_the_present_and_the_past:0 "Теперішнє й минуле"
  khan_the_present_and_the_past_desc:0 "Останнім часом Реджис часто задумується над питанням: «Хто такі Хани?» Частина відповіді йому відома. Але решту ще треба з’ясувати."

  khan_the_present:0 "Обнадійливе майбутнє"
  khan_the_present_desc:0 ""У нас є шанс стати іншими. Почати нову пісню. Амґалан має рацію — не потрібно більше так багато крові." — Реджис"

  khan_back_to_the_beginnings:0 "Почнемо спочатку"
  khan_back_to_the_beginnings_desc:0 "Щоб осісти, нам потрібне хороше місце. А краще — кілька. Час відкласти рушницю і взятися за молот. Послідовники допоможуть."

  khan_who_are_the_khans:0 "Хто такі Хани"
  khan_who_are_the_khans_desc:0 "Реджис колись запитав себе: «Хто такі Хани?» Тепер у нього є відповідь. Ми — господарі цієї землі, не просто грабіжники. А отже, саме нам її й оберігати."

  khan_blowing_off_steam:0 "Випустити пару"
  khan_blowing_off_steam_desc:0 "Хани осіли й закріпилися, але не всім цього досить. Дехто жадає бійки — і ми можемо на цьому заробити. Найманці з Ханів — це почесно. Навіть якщо це лише жменька."

  khan_yellowstone_science:0 "Прогулянка в парку"
  khan_yellowstone_science_desc:0 ""Я ходив з Амґаланом і ще кількома подивитися на Єллоустоун на власні очі. Це неймовірне місце, я не думав, що такі ліси ще існують. Треба буде якось побачити. А ось Послідовниця Жюстін більше раділа не деревам, а старим лабораторіям." — Реджис"

  khan_expanding_our_bag:0 "Розширення наших навичок"
  khan_expanding_our_bag_desc:0 "Жюстін та Емма під час досліджень Єллоустоуну знайшли більше, ніж очікували — склади зі зброєю і формули нової хімії. Щоб використати все це, знадобиться час, але воно того варте."

  khan_four_fathers_tribe:0 "Батьки"
  khan_four_fathers_tribe_desc:0 "Четверо Батьків — дивне плем’я, як і їхня релігія, але принаймні вони чесні. Якщо дозволити їм доступ до Рашмора, вони стануть надійними союзниками."

  khan_the_past:0 "Горде минуле"
  khan_the_past_desc:0 ""Хани — це ті, ким ми завжди були. Ми — бійці й не здаємося. Де б ми не були — ми знайдемо свій шлях. Не забувайте про це." — Реджис"

  khan_jackson_family:0 "Вигнанці, як і ми"
  khan_jackson_family_desc:0 "Родина Джексонів — запальне плем’я, сповнене люті й жадоби помсти. Вони небезпечні, але з ними легко домовитися. Якщо пообіцяти їм допомогу в поверненні дому — вони віддячать."

  khan_metal_mouths:0 "Залізні люди"
  khan_metal_mouths_desc:0 "На півночі — банда рейдерів, не схожа на жодну іншу. Сталеві кінцівки, механічні обличчя — моторошне видовище. Їхній ватажок, Сталевий Джо, готовий до угоди, якщо не будемо йому заважати. Союз можливий, але не дружба."

  khan_drugs_as_a_part_of_culture:0 "Наркотики як частина культури"
  khan_drugs_as_a_part_of_culture_desc:0 ""Ви зайшли надто далеко! Ми не будемо стояти осторонь, поки ви споюєте кожну душу навколо. Це зрада нашої місії!" — лютувала Жюстін, а Амґалан мовчав.\n\n\"Вашої місії. Ми просто даємо людям те, чого вони хочуть, і заробляємо. Вибач, якщо не витримуєш, але ми — Великі Хани, а не Хани Апокаліпсису.\" — спокійно відповів Реджис, і Жюстін вийшла, розлючена."

  khan_family_business:0 "Лише сімейний бізнес"
  khan_family_business_desc:0 "Ми не просто бійці — ми виробники зброї й торговці. Якщо добре постаратися, це може перетворитися на справжню промисловість. А зайва зброя нам не завадить."

  khan_gun_without_target:0 "Зброя без цілі"
  khan_gun_without_target_desc:0 "Ми нарощуємо виробництво, але це ставить питання: проти кого все це піде? Мабуть, час придивитися до сусідів і дати відповідь."

  khan_money_rolls_in:0 "Гроші течуть рікою"
  khan_money_rolls_in_desc:0 "Діана активно розширює мережу клієнтів, і про хімію Ханів знають від Чорного Каньйону до Калґарі. Джек і варщики ледь встигають за попитом, але прибутки говорять самі за себе."

  khan_honour_the_promise:0 "Дотриматись обіцянки"
  khan_honour_the_promise_desc:0 "Обіцянку було дано, і патріарх Джексонів нагадав про неї. Ніл хоче повернення своїх земель, а натомість віддає нам дім вигнанців. Слово Хана не буває порожнім."

  khan_what_lies_beyond:0 "Що чекає далі"
  khan_what_lies_beyond_desc:0 "Ми пройшли цей шлях не без бою — і далі буде те саме. Щоб іти вперед, треба бути готовими до всього, навіть якщо це — ціла армія в силовій броні."

  khan_our_heavies:0 "Тяжка піхота"
  khan_our_heavies_desc:0 "Більшість Великих Ханів уміє битися, але є ті, хто живе заради бою. Вони — найсильніші з нас. Якщо дати їм найкраще спорядження, ворог не встоїть."

  khan_papa_khan_legacy:0 "Ім'ям Папи Хана"
  khan_papa_khan_legacy_desc:0 "Південні Хани досі не оговталися від поразки в Мохаве, особливо — від втрати Папи. Реджис пропонує спорудити меморіал на його честь та перейменувати старий Даріон на щось значуще."

  khan_far_son:0 "Кроти у дворі"
  khan_far_son_desc:0 "На півдні збираються в купу чорні постаті в плащах і з металевими пазурами. Вони вже дивляться в наш бік. Ми не можемо чекати, поки вони нападуть."

  khan_great_stampede_assault:0 "На курсі зіткнення"
  khan_great_stampede_assault_desc:0 "Ми просуваємося на північ, а на півдні зростає нова сила — Велика Зграя. Вони горді, войовничі й не схожі на інших. Майже як ми. Тож краще вдарити першими."

  khan_montana:0 "Переможна карта"
  khan_montana_desc:0 "Братство Сталі ніколи не було друзями Ханів. Вони, як таргани в броні, повсюди. Але цього разу — ми їх виженемо."

  khan_middlemark:0 "Останній дзвінок"
  khan_middlemark_desc:0 "То це величезний магазин із довоєнним крамом, повний зброї й керований роботом? І це ще ніхто не пограбував?"

  khan_macarthur:0 "Жуки"
  khan_macarthur_desc:0 "Про Анклав розповідали ще з часів Каліфорнії: чорні, як жуки, люди, які хочуть знищити всіх. Тепер вони не на нафтовій платформі, але нічим не кращі. Треба їх прибрати."

  khan_united_identity:0 "Єдине плем'я"
  khan_united_identity_desc:0 "Межа між північними й південними Ханами вже стерлася. Попри роки — ми одне плем’я. Ханів не ділять більше на північ і південь."

  khan_the_true_heir:0 "Справжній спадкоємець"
  khan_the_true_heir_desc:0 "Реджис не чекав, що його втеча з Бітер-Спрінґс приведе його сюди. Але тепер Амґалан готовий передати йому владу, а Хани — підтримати. Папа повертається."

  khan_great_stampede:0 "Вершники"
  khan_great_stampede_desc:0 "Їзда верхи — це не мотоцикл. Кінь — живий, із власним норовом. Але він вірний друг і грізна сила. Треба вчитися їх приручати."

  khan_come_join_our_fire:0 "Приєднуйтесь до нашого вогню"
  khan_come_join_our_fire_desc:0 "Ніітситапі — чесні й горді. У них теж важка історія. Ми розуміємо одне одного. Їм є місце у нашій Раді."

  khan_macarthur_lab_equipment:0 "Нові можливості"
  khan_macarthur_lab_equipment_desc:0 "Анклавівці були паскудами, але в техніці розбиралися. Їхні лабораторії й верстати — справжній скарб. Можливо, ми нарешті доведемо Ультрапсихо до досконалості."

  khan_expand_the_drug_business:0 "Чингіс"
  khan_expand_the_drug_business_desc:0 "Колись жили інші Хани. Ті, що завоювали пів світу верхи. Без гармат. Їхній хан усіх ханів звався Чингіс. Ми доведемо, що гідні цього імені."

  khan_the_worthy_heir:0 "Гідний спадкоємець"
  khan_the_worthy_heir_desc:0 "Нема сенсу приховувати: Послідовники відвернулися, а більшість Ханів слухає Реджиса. Амґалан утратив авторитет. Час зробити це офіційно — Реджис стане ханом усіх Ханів."



  ######REGIS PATH#######

  # The Mad Baron Tree For the April Fools 2022

  KHA_focus_tmb_1:0 "Спаситель"
  KHA_focus_tmb_1_desc:0 "Здається, наш спаситель страждає на амнезію після сутички з проклятим кур’єром. Він несе нісенітницю про те, що є людиною, яка померла 354 роки тому."

  KHA_focus_tmb_2:0 "Пошуки «коней»"
  KHA_focus_tmb_2_desc:0 "Наш хан наказав знайти міфічну істоту на ім’я «кінь». Ми не змогли знайти нічого про них, окрім того, що вони буцімто живуть у міфічних землях Еквестрії та Вайомінґу. Ми шукаємо Еквестрію, бо навіть Хани знають, що Вайомінґ не існує."

  KHA_focus_tmb_tengri:0 "Під владою вічного неба"
  KHA_focus_tmb_tengri_desc:0 "Наші закони будуть простими, як того хотів Тенґрі: не забувай про борги, не вбивай жінок і дітей, не тікай від ворогів і не зраджуй свого хана."

  KHA_focus_tmb_3:0 "Поклик хана"
  KHA_focus_tmb_3_desc:0 "Відгукнувшись на поклик хана, багато хто з Ханів сформували кавалерійські бригади. Весь світ тремтітиме перед Ордою."
  KHA_focus_tmb_3_tt:0 "10 загонів кавалерії чекають на наказ Великого Хана."

  KHA_focus_tmb_vegas:0 "Кров для небесного бога"
  KHA_focus_tmb_vegas_desc:0 "Тенґрі дарував нам силу, щоб ми могли помститися нечестивому Хаусу. З новою силою в руках вулиці Вегаса буде очищено від крові."

  KHA_focus_tmb_temple:0 "Вогонь і кров"
  KHA_focus_tmb_temple_desc:0 "Ми забрали те, що належить нам — вогнем і кров’ю. Місто очищено від гріхів і стало гідним місцем для єдиного справжнього бога неба."

  KHA_focus_tmb_skyreavers:0 "«Небесні» ґрабіжники"
  KHA_focus_tmb_skyreavers_desc:0 "Язичники на півночі чіпляються за дари неба. Ми заберемо своє силою."

  KHA_focus_tmb_enterprise:0 "USS Ентерпрайз"
  KHA_focus_tmb_enterprise_desc:0 "Схоже, під базою «Зона 51» поховано зорельот. Він зветься USS Ентерпрайз. Корабель порожній, і це викликає багато запитань. Ніхто не пам’ятає, щоб у США був космічний флот або зорельоти взагалі. Можливо, варто дослідити."

  KHA_focus_tmb_wrath:0 "Гнів хана"
  KHA_focus_tmb_wrath_desc:0 "Корабель був покинутий екіпажем — ми знайшли лише одного в’язня, що вимагав свободи. Він стверджував, що є «Ханом» і жадає помсти. Це звучить як вигідна нагода."
  KHA_focus_tmb_wrath_tt:0 "Це відкриє персонажа §MХан Нунієн Сінґ§! як командира."

  KHA_focus_tmb_north:0 "Не вірю, що ми це хани"
  KHA_focus_tmb_north_desc:0 "Ніхто не вірить, що ми так швидко захопили всі ці землі. Продовжуймо наступ."

  KHA_focus_tmb_rangers:0 "Як рак, що шириться"
  KHA_focus_tmb_rangers_desc:0 "Ми поглинемо їх, як хвиля."

  KHA_focus_tmb_tech:0 "Унґерноміка"
  KHA_focus_tmb_tech_desc:0 "Мудра політика нашого Хана призвела до стрімкого зростання економіки разом із технологічним прогресом."

  KHA_focus_tmb_avenge_bitter_springs:0 "Помста за Біттер-Спрінґс"
  KHA_focus_tmb_avenge_bitter_springs_desc:0 "Ми знайшли кілька ядерних зарядів в Ештоні. Можливо, станеться «непорозуміння в комунікації» і вони випадково полетять просто на них."

  #Ideas

  KHA_idea_tengri:0 "Під владою вічного неба"

  KHA_idea_genetic_soldiers:0 "Генетично покращені солдати"

  april_fools_communist_vegas:0 "Комунізм з елвісівським обличчям"
  april_fools_communist_vegas_desc:0 "Коли я був дитиною, пані та панове, я був мрійником. Я читав комікси — і був революціонером у коміксах. Дивився фільми — і був революціонером у фільмах. І кожна моя мрія здійснилася сотні разів... Дуже рано в житті я зрозумів: «Без комунізму робочий день ніколи б не завершився; без комунізму в людини немає товариша; без комунізму дорога ніколи б не звернула — без комунізму». Тож я продовжую трощити капіталізм. Надобраніч. Дякую."

  #Military Buildup Focuses
  khan_warriors:0 "Воїни хана"
  khan_warriors_desc:0 "Саме серце нашого племені — це горда воїнська культура. Їхнє місце в суспільстві повинно регулярно визнаватись, інакше вони можуть стати некерованими."

  khan_way_of_the_land:0 "Шлях землі"
  khan_way_of_the_land_desc:0 "Вода — це сама суть життя. Цінний ресурс, який необхідний усім суспільствам пустки. Щоб укріпити наші позиції та забезпечити майбутнє, ми копатимемо нові криниці."

  khan_way_of_the_earth:0 "Шлях металу"
  khan_way_of_the_earth_desc:0 "Холодна сталь, омита теплою кров’ю. Це образ, що повторювався тисячі років. Навіть після загибелі найбільших творінь людства потреба в металі знову дає про себе знати."

  khan_new_workshops:0 "Нові майстерні"
  khan_new_workshops_desc:0 "Племінна кустарна промисловість буде тобі в пригоді, якщо ти хочеш виробляти одну гвинтівку на тиждень! Але багато рук вимагає багато зброї, і лише спеціалізовані майстерні зможуть задовольнити таку потребу."

  khan_biking_bonus:0 "Залізні скакуни"
  khan_biking_bonus_desc:0 "Наші предки скакали від Ханбалику до Києва на плоті й крові. Ми ж поїдемо від Маріпози до Нью-Йорка на сталі та мастилі."

  khan_biking_bonus_2:0 "Пекло на двох колесах"
  khan_biking_bonus_2_desc:0 "Гуркіт моторів знову лунає рівнинами, і він віщує гірше за блискавку. Коли хани виїжджають — інші падуть."

  khan_horsies_pretty:0 "Наші маленькі поні"
  khan_horsies_pretty_desc:0 "Кінь — витривала істота, а кінь пустки — тим паче. Наші коні — наші товариші і в мирний час, і на війні."

  khan_horsies_better_gear:0 "Вогняні сідла"
  khan_horsies_better_gear_desc:0 "Якість кінського спорядження може вирішити долю вершника в бою. Варто брати лише найкраще: броню від майстрів, сідельні сумки від ремісників, ручної роботи вудила. Хтось із патруля навіть казав, що знайшов піп-бой, пристосований для кінської ноги. Для чого коню піп-бой — невідомо."

  khan_experience:0 "Племінні вправи"
  khan_experience_desc:0 "Бездіяльність веде до занепаду. І м’язів, і розуму. Лише регулярні тренування збережуть наших воїнів у формі."

  khan_warrior_idea_1:0 "Від хлопців до чоловіків"
  khan_warrior_idea_1_desc:0 "Тисячоліття тому, за правління старих ханів, хлопців змалку вчили бути воїнами. Стрільба з лука, верхова їзда, походи. І щойно вони ставали чоловіками — вже були майстрами бою. Ми можемо наслідувати це, щоб зменшити обсяг формального навчання."

  khan_warrior_idea_2:0 "Офіцерський корпус"
  khan_warrior_idea_2_desc:0 "Виділений офіцерський корпус потрібен для спрощення тренування та організації. Монголи це розуміли — і ми також.\n\nЯ зразковий стародавній генерал,\nЯ знаю про тваринний, рослинний та мінеральний матеріал,\nЯ ханів Кублая згадаю, і бої в історії перелічу\nВід Єхуліна до Даохуїґу, порядок збережу."

  khan_new_khans:0 "Нові хани"
  khan_new_khans_desc:0 "Бути ханом — це не лише про кров! Є сотні міцних, племінних людей, які впишуться в нашу зграю. Варто лише відчинити двері, й вони самі прийдуть."

  khan_weapon_prod_idea_1:0 "Майстри-ковалі"
  khan_weapon_prod_idea_1_desc:0 "Зброя — особливий товар; це бар'єр між життям і смертю. Виготовляти її без пристрасті — не просто недбалість, це смертельно. Тож геть лінивих ковалів — і хай лишаються ті, хто справді дбає про свою справу."

  khan_mil_industry_2:0 "Нові кузні"
  khan_mil_industry_2_desc:0 "Наші зусилля з залучення майстрів дали плоди — тепер їм треба лише місце для праці. Найменше, що ми можемо — це дати їм його."

  khan_weapon_prod_idea_2:0 "Подальше вдосконалення"
  khan_weapon_prod_idea_2_desc:0 "Маючи вправні руки та працездатні кузні, залишається лише одне — матеріал. Слабкі сплави й нечисті метали слід відсіяти, залишивши тільки чисту сталь."

  khan_new_khans_2:0 "Жодного дому більше не втратимо"
  khan_new_khans_2_desc:0 "Наші приготування завершені, і наші загони краще споряджені, ніж будь-коли. Вороги більше не топтатимуть наші землі! Хто спробує — зустріне кулю."

  khan_khanate_rangers:0 "Рейнджери ханства"
  khan_khanate_rangers_desc:0 "Нас принизив НКР, але це не означає, що ми нічого не навчилися. Рейнджери отримують найкраще спорядження, навчання і найнебезпечніші завдання. Це їхня «спецслужба»... І нам теж варто мати таку."

  khan_doctrine_bonus:0 "Мистецтво війни"
  khan_doctrine_bonus_desc:0 "Війни виграють спершу в таборі, потім на полі бою. Без бойової доктрини ми не переможемо організованого ворога. І це очевидно."

  khan_using_our_tricks:0 "Наші прийоми"
  khan_using_our_tricks_desc:0 "Покоління сутичок з сусідніми племенами загартували наш тактичний хист. Сучасна війна складна, але іноді варто повернутися до старих трюків."

  khan_raider_rangers:0 "Рейдери-рейнджери"
  khan_raider_rangers_desc:0 "НКР має суворі правила щодо рейнджерів — рейдерів та бандитів туди не беруть. Але хто краще знає бій, як не той, хто виживав лише завдяки ньому?"

  khan_spec_ops_go_go:0 "Мов ніж у ребро"
  khan_spec_ops_go_go_desc:0 "Будь-яка армія має свою еліту. Вони завдають удару в найвразливіше місце. Їм потрібне найкраще спорядження — і ми це забезпечимо."

  khan_khanate_raiders:0 "Армія рейдерів"
  khan_khanate_raiders_desc:0 "Наші поразки були не через брак дисципліни чи структури. Ні, проблема — у нестачі грубої сили! А хто знає силу краще, ніж дикі покидьки пустки?"

  khan_assymetric_bonus:0 "Партизанська війна"
  khan_assymetric_bonus_desc:0 "Нам не потрібно битись відкрито. Перетин наших земель має бути як повзання по цвяхах — тисяча порізів, нескінченне виснаження, озвірілі партизани за кожним рогом. Це буде криваво — і прекрасно!"

  khan_raider_upgrade:0 "Смерть Его"
  khan_raider_upgrade_desc:0 "Дві сотні років пустка намагається довести, що тутешні монстри найжорстокіші створіння. Але знаєш що? Тримай мій джет. Це виклик — і ми його приймаємо!"

  khan_raider_upgrade_AGAIN:0 "Влада Ід"
  khan_raider_upgrade_AGAIN_desc:0 "Ми зібрали кожного джетового наркомана, рейдера й мародера у цій клятій країні. Тепер лишилося знайти, на кого цю пекельну машину спрямувати. Можливо, колись ми повеземо її до Шейді-Сендс..."

  # focus

  khan_1:0 "Я лишив своє серце в Каліфорнії"
  khan_1_desc:0 "Колись ми жили в пустелях заходу. Для багатьох із нас серце досі там, у пекучій спекоті. Тепер ми шукаємо ту саму теплоту серед гір Вайомінгу."

  khan_2:0 "Дім на фронтирі"
  khan_2_desc:0 "Попри всі труднощі, жахи та втрати ми дісталися краю — багатого і щедрого. Саме тут має бути наше майбутнє — жодна душа не сумнівається в цьому."

  khan_3:0 "Остання, хто дивиться на сонце"
  khan_3_desc:0 "Її звали 'сонце-глядачкою' — з племені, що колись жило тут, але було витіснене або знищене бароном-браміном. Деякі речі не вдається втекти, як би ти не намагався."

  #focus - diplomacy

  khan_diplomacy:0 "Дім далеко від дому"
  khan_diplomacy_desc:0 "Монтана, Вайомінг, Дакота — ці землі нові для нас. Багато хто з наших ще ніколи не бачив суворих зим Скелястих гір чи прекрасних полів Монтани. Друзі в цих краях, особливо з огляду на наш статус новоприбулих, можуть стати нам у великій пригоді."

  khan_the_brotherhood_diplo:0 "Експедиція до Монтани"
  khan_the_brotherhood_diplo_desc:0 "Ми думали, що залишили їх позаду — спершу в Каліфорнії, потім у Неваді. Але куди б ми не вирушили, вони вже там, у тій чи іншій формі. Наші стосунки з ними стануть ключовими для нашого майбутнього."

  khan_send_delegate:0 "Делегація Амгалана"
  khan_send_delegate_desc:0 "Хоч її плем’я було мирним, у Ессен дух воїна, якого не знайти в інших. Амгалан замислився — може, якщо відправити її воювати поруч із Сестрами, вона знайде споріднені душі? А можливо, і щось спільне між нами."

  khan_brotherhood_experience:0 "Тактика братства"
  khan_brotherhood_experience_desc:0 "Чи ми боремося з ними, чи співпрацюємо — ми можемо багато чого навчитися в Братства. Давайте уважно придивимося до їхніх методів і подумаємо, як застосувати їх до наших."

  khan_come_follow_me:0 "Зустріч опівночі"
  khan_come_follow_me_desc:0 "У житті ми завжди обираємо між тим, щоб знайти друзів або нажити ворогів. Хани зазвичай обирали друге, але це не має тривати вічно. Є добрі люди, з якими ми можемо об'єднатись і створити союз."

  khan_join_sisters:0 "Шляхетні воїни Монтани"
  khan_join_sisters_desc:0 "Чутки про братство з Каліфорнії сюди не доходять. Жінка на ім’я Гонор взяла під контроль місцевий загін і перетворила форт Веріті на справжню оазу. Наша взаємодія з ними була мирною. Можливо, вони захочуть ділитися допомогою і прикривати нам спину?"

  khan_knight_advisor:0 "Допомога від Сестри"
  khan_knight_advisor_desc:0 "Сестринство швидко пішло нам назустріч. Вони запропонували нам Лицаря Ейвері як радника і союзника. Нехай вона добре нам служить — а ми їй."

  khan_honours_pride:0 "Гордість Гонор"
  khan_honours_pride_desc:0 "Сентинель Гонор запропонувала нам загін своїх найкращих воїнів для охорони наших кордонів. З ними захист нашої землі стане набагато простішим."

  khan_ambercozas_unbroken:0 "Незламні"
  khan_ambercozas_unbroken_desc:0 "Після падіння Сестринства і затвердження влади Ессен, загін на чолі з паладином Амберкозою присягнув на вірність Ессен — шукаючи нового сенсу."

  khan_standing_rock_diplo:0 "Знедолені племена"
  khan_standing_rock_diplo_desc:0 "Племена Стендінґ-Рок — стійкі та рішучі. Наші відносини з ними мають бути обережними, інакше ми ризикуємо їх розгнівати."

  khan_join_marshall:0 "Маршалл опівночі"
  khan_join_marshall_desc:0 "Республіка Маршалл зі сходу — складні до переговорів, але їхнє вміння виживати й силова броня роблять їх ідеальними союзниками. А їхній підхід 'живи і дай жити' добре узгоджується з нашими поглядами."

  khan_join_highland:0 "Нічна варта"
  khan_join_highland_desc:0 "Забезпечити південний кордон можна просто — звернувшись до мешканців Роллінза. Після перемоги над ворогами з-під землі вони не прагнуть нових конфліктів. Тепле рукостискання — і угода в кишені."

  khan_join_ruminators:0 "Спільна усмішка"
  khan_join_ruminators_desc:0 "Єлизавета з Румінаторів — дивна особа, але не вороже налаштована. Якщо ми слухатимемо й не будемо надто цинічними (навіть коли нам втюхують копію їхньої книги), вони можуть стати гарними союзниками."

  khan_hellshark_monroe:0 "Гелшарк Монро"
  khan_hellshark_monroe_desc:0 "Нещодавно до нас прийшла жінка в розмальованій силовій броні з шкурами ґеконів. Назвавшись Гелшарк, вона заявила, що дезертирка з посту Анклаву Макартура. Вона хоче приєднатися до нас — каже, їй подобається наш стиль. Чому б і ні?"

  khan_khanate_protectorate:0 "Навчання від мандрівника пустки"
  khan_khanate_protectorate_desc:0 "Монро прийшов не сам — із ним була зграя приручених ґеконів. Він запропонував навчити нас приручати цих створінь. Чому б і не прийняти? Це ж ресурс, як і будь-який інший."

  khan_auto_armor:0 "Одягнені у сталь"
  khan_auto_armor_desc:0 "Союзники поділилися з нами деякими секретами виготовлення та ремонту силової броні. Навчання та виробництво будуть довгими, але ми повинні з чогось почати."

  khan_power_armor:0 "Схеми броні"
  khan_power_armor_desc:0 "Ми здобули детальні схеми кількох типів силової броні — завдяки торгівлі та вдалому гральному вечору. Це значно полегшить роботу нашим механікам."

  khan_power_armor_2:0 "Допитливі писарі"
  khan_power_armor_2_desc:0 "Ніхто не знає силову броню краще за Братство... хіба що ті інші, в чорній броні. Якщо ми отримаємо кількох писарів, щоб навчили нас тонкощам, наші зусилля стануть ще ефективнішими."

  khan_power_armor_3:0 "Суворе тестування"
  khan_power_armor_3_desc:0 "Спорядження для війни ніколи не буває надто добре протестованим. Наші інженери воліли б трохи поспати, але нехай дочекаються після ще кількох десятків вогневих випробувань."

  khan_khanate_elite:0 "Найкращі обладунки"
  khan_khanate_elite_desc:0 "Виявилося, що перевантаження ядерного блока може спричинити вибух. Особливо, якщо один з інженерів неправильно його встановив. З позитивного — тепер у нас нове звалище й ми дізналися, як НЕ треба робити."

  khan_resource_exchange:0 "Обмін ресурсами"
  khan_resource_exchange_desc:0 "Наші племена можуть запропонувати одне одному чимало. Чому б не почати торгівлю?"

  khan_str_experience:0 "Пліч-о-пліч"
  khan_str_experience_desc:0 "Наші хани можуть воювати разом з найкращими воїнами із Стендінґ-Рок. Звідки б ти не був — завжди є чого навчитися."

  khan_fire_council:0 "Запалити вогонь"
  khan_fire_council_desc:0 "Хани цілком можуть стояти самостійно, але навіть найсильнішому воїну потрібен союзник. Ми можемо звернутись до сусідів зі схожим духом і запросити їх поділити наше вогнище."

  khan_fire_council_str:0 "Підживити вогонь цивілізації"
  khan_fire_council_str_desc:0 "Під проводом Реджиса хани здобули повагу племен Стендінґ-Рокі. Майбутнє завжди було для нас непевним — але разом ми можемо змінити долю."

  khan_str_puppet:0 "Воїни схилять голови"
  khan_str_puppet_desc:0 "Племена не так легко підкоряються завойовникам. Але якщо ми гарантуємо, що вони більше не піднімуть зброї проти нас, і дозволимо їм бути самостійними — це піде на користь відносинам, навіть якщо примусово."

  khan_horses_for_my_khanate:0 "Ханство за коня"
  khan_horses_for_my_khanate_desc:0 "Коні для нас — майже легенда. Хоч ми не майстри тваринництва, але впровадження коней у війну й повсякденне життя дасть нам перевагу."

  khan_ruminators_diplo:0 "Посмішка друзів"
  khan_ruminators_diplo_desc:0 "Румінатори — дружній народ, хоч і не без 'сумнівних' сусідів. Подальша співпраця з ними піде на користь обом сторонам."

  khan_industrial_coop:0 "Любов Єлизавети"
  khan_industrial_coop_desc:0 "Єлизавета сприйняла 'співпрацю' буквально. Вона надіслала власні ресурси, аби ми краще освоїлися у Стретчі."

  khan_jaye:0 "Досвід Джея"
  khan_jaye_desc:0 "Рейнджер Джей пройшов із нами більшість труднощів Заходу. Хоч він і відійшов від справ, після нашого прибуття у Вайомінг, він все ще радий допомогти — нам або Румінаторам Єлизавети."

  khan_friends_of_elizaveta:0 "Друзі Єлизавети"
  khan_friends_of_elizaveta_desc:0 "Відтоді, як ми прибули, Єлизавета була до нас лише доброю. Багато Ханів вірять у її справу. То чому б не співпрацювати з нею ще тісніше?"

  #focus - followers/chems

  khan_the_followers_of_the_apocalypse:0 "Співпраця з Послідовниками"
  khan_the_followers_of_the_apocalypse_desc:0 "Послідовники Апокаліпсису провели нас крізь більшу частину шляху до Вайомінгу. Саме завдяки їхній співчутливості ми дожили до сьогоднішнього дня."

  khan_follower_workshops:0 "Краудсорсинг Послідовників"
  khan_follower_workshops_desc:0 "Послідовники швидко вразили місцевих, навіть якщо ми самі — навпаки, налякали. Все більше людей готові ділитися з нами своїм добром."

  khan_follower_doctorates:0 "Докторські ступені Послідовників"
  khan_follower_doctorates_desc:0 "Послідовники не соромляться ділитися знаннями з нашими колишніми виробниками хімії. Можливо, їм вдасться застосувати свої навички не для задоволення, а задля лікування."

  khan_follower_medicinal:0 "Переорієнтація на медицину"
  khan_follower_medicinal_desc:0 "Хімія — частина нашої історії, як і залежність від них. Багато хто з нашого народу в тяжкому стані, і Послідовники радо допомагають."

  khan_follower_medicinal_2:0 "Очищення від залежності"
  khan_follower_medicinal_2_desc:0 "Хоч ми ще далеко від повного подолання наркотичної залежності серед Ханів, фундамент вже закладено, а загальна криза — принаймні тимчасово — відвернена."

  khan_amgalans_pilgrimage:0 "Паломництво Амгалана"
  khan_amgalans_pilgrimage_desc:0 "Амгалан був не завжди добрим і щедрим. Багато хто слідував за ним, надихнувшись історіями про запального юнака, і були розчаровані тим, ким він став."

  khan_papas_march:0 "Марш Папи Хана"
  khan_papas_march_desc:0 "Поки вогонь Амгалана згасав, той, кого згодом назвали Папою Ханом, повів Великих Ханів у Мохаве з полум’ям у серці."

  khan_remembering_darion:0 "Уроки Даріона"
  khan_remembering_darion_desc:0 "Даріон був одним із найвідоміших Ханів давнини. Здобуті з його фатальних помилок уроки — добрі чи погані — стали звичними."

  khan_weapons_of_war:0 "Те, що колись було домом"
  khan_weapons_of_war_desc:0 "Сховище 15 колись було домом для наших предків і багатьох інших, зокрема й наших найгірших ворогів. У витоках — смирення."

  khan_enemies_of_the_ncr:0 "Вороги НКР"
  khan_enemies_of_the_ncr_desc:0 "Цивілізація завжди становила загрозу нашому способу життя, а найбільшим ворогом була Нова Каліфорнійська Республіка. Щоб уникати їхнього зростаючого впливу, нам довелося навчитися багатьом хитрощам."

  khan_ranger_training:0 "Шлях Рейнджера"
  khan_ranger_training_desc:0 "Джей мав багато чому нас навчити. Рейнджери — вправні воїни нового світу. Якби ми мали таку ж дисципліну в минулому — можливо, історія склалася б інакше."

  khan_our_ancestors_ways:0 "Шляхи наших предків"
  khan_our_ancestors_ways_desc:0 "Ми походили з роду розбійників і рейдерів. Від них ми отримали багато — від знань про обслуговування зброї до уроків... винахідливості."

  khan_underground_workshops:0 "Звідки береться зброя"
  khan_underground_workshops_desc:0 "Ми не можемо дозволити собі покладатися на сторонні джерела зброї. Ми маємо самі вміти її виготовляти й обслуговувати."

  khan_infantry_bonus:0 "Нас називали тими, хто вижив"
  khan_infantry_bonus_desc:0 "Протягом нашої історії у Ханів була одна спільна риса: ми вижили. Ми здобували знання, коли потрібно, й адаптувалися до обставин."

  khan_chem_trade:0 "Торгівля хімією"
  khan_chem_trade_desc:0 "Хімія — частина стилю життя Ханів. Ми не можемо від них відмовитися — вони в основі нашого племені. Амгалан і його поплічники не можуть змусити Великих Ханів змінитися."

  khan_chem_trade_2:0 "Повноцінне прийняття хімії"
  khan_chem_trade_2_desc:0 "Хімія й торгівля нею — це те, чим ми завжди займалися. Ми не збираємося зупинятися тільки тому, що хтось добре попросив."

  #focus - society / development

  khan_alone_in_the_mountains:0 "Наодинці в горах"
  khan_alone_in_the_mountains_desc:0 "Ми ще не встигли як слід освоїтись у цьому регіоні. Багато хто з нас ніколи не відчував такої крижини — водночас благословення і прокляття. Але так не буде завжди. Ми вже налагоджуємо контакти, щоб доставити більше припасів до Даріона, а час від часу — і нових поселенців."

  khan_ralston_workshop:0 "Переїзд у Ралстон"
  khan_ralston_workshop_desc:0 "Мешканці Ралстона миролюбні — настільки, що навіть терплять найжорстокіших Ханів. Ми маємо скористатися цією нагодою і розвинути місто."

  khan_the_steady_hand_of_amgalan:0 "Стійка рука Амгалана"
  khan_the_steady_hand_of_amgalan_desc:0 "Знання Амгалана про природу та його дипломатичний хист дозволили нам налагодити співпрацю з фермерами на півночі Вайомінгу."

  khan_mutant_advisors:0 "Звернутися до супермутантів"
  khan_mutant_advisors_desc:0 "Ми не до кінця розуміємо, що саме спричинило цей конфлікт, але ясно одне — миру не буде, доки це не вирішиться. Мутанти, як і ми, мандрівники з далекої Каліфорнії. А той, хто каже, що не боїться Людей-з-лісу, просто бреше. Амгалан добровільно зголосився зустрітися з лідером мутантів і запропонувати допомогу."

  khan_large_brothers:0 "Допомога великим братам"
  khan_large_brothers_desc:0 "Могул, лідер мутантів, охоче прийняв нашу допомогу. За його словами, йому бракує не тільки озброєння, а й живої сили. Поки ми готуємося до прямої участі, ті Хани, що жадають бою, можуть рушити першими."

  khan_hunt_down_jackalope:0 "Полювання на Джекалопа" # позоруй! – https://en.wikipedia.org/wiki/Jackalope
  khan_hunt_down_jackalope_desc:0 "Час покласти цьому край і зупинити кровопролиття. Разом із Могулом і його людьми наш загін вирушить до лігва Людей-з-лісу. Якщо фанатики не підуть — доведеться знищити їх."

  khan_giant_gratitude:0 "Вдячність гіганта"
  khan_giant_gratitude_desc:0 "Культ Джекалопа знищено або розсіяно по пагорбах, а мутанти в основному готові скласти зброю. Сам Могул радий мати союзників і запропонував нам усі трофеї культу та власну підтримку."

  khan_men_of_the_wood:0 "Звернення до лісу"
  khan_men_of_the_wood_desc:0 "Бої на наших околицях важко ігнорувати, особливо коли в них потрапляють наші мисливці. Ессен пропонує власний план — завоювати прихильність лідера культу. Вони дивні, але, на її думку, можуть стати у пригоді."

  khan_giantkillers:0 "Хани-вбивці гігантів"
  khan_giantkillers_desc:0 "Культовий лідер Скітер Божевільний погодився зустрітися з Ессен, але висунув умову: принести голови двадцяти п’яти мутантів. Він не зустрінеться з нами доти, доки ми не виконаємо завдання. Зухвалість! Але ми, Хани, не вперше стикаємося з мутантами. Вперед!"

  khan_they_might_not_be_giants:0 "Край велетнів більше не їхній"
  khan_they_might_not_be_giants_desc:0 "Фанатики прийняли Ессен як союзника, хоч і з побоюванням ставляться до решти з нас. Вона вже планує остаточну перемогу над мутантами. Їхній час минув."

  khan_uneasy_friendships:0 "Напружена дружба"
  khan_uneasy_friendships_desc:0 "Люди-з-лісу сприйняли нашу допомогу як знак від богів і присягнули на вірність. Це насторожує, але їх багато, і ми досі знаходимо їхні схованки. Цей альянс нам вигідний — хоч і незручний."

  khan_ralston_power:0 "Електростанція Ралстона"
  khan_ralston_power_desc:0 "Неподалік заводу стоїть стара електростанція. Якщо Джей не помиляється, її можна запустити з мінімальними зусиллями."

  khan_nuka_cola_workshop:0 "Завод Ядер-Коли"
  khan_nuka_cola_workshop_desc:0 "Нам пощастило. У сільській місцевості ми натрапили на завод Ядер-Коли з її величезним запасом всередині. Справжній скарб, що чекав на нас."

  khan_ralston_construction:0 "Будівництво в Ралстоні"
  khan_ralston_construction_desc:0 "Розвиток Ралстона вигідний як місцевим, так і нам. Почнемо з розчищення територій і подивимось, що вийде."

  khan_ralston_construction_part_dos:0 "Поштовх для Ралстона"
  khan_ralston_construction_part_dos_desc:0 "Розчистити місце — це лише початок. Дамо робітникам зелене світло й подивимось, що вони вигадають."

  khan_better_tech_uwu:0 "Що можна використати"
  khan_better_tech_uwu_desc:0 "Збір ресурсів — ключ до нашого майбутнього у Вайомінгу. Знання про це так само важливе."

  khan_tech_factories_1:0 "Індустріальні засоби"
  khan_tech_factories_1_desc:0 "Розбудова промисловості на наших землях — завжди хороша ідея."

  khan_tech_factories_2:0 "Індустріальні потужності"
  khan_tech_factories_2_desc:0 "Прагнення до стрімкого зростання навіть у скрутні часи веде до кращого завтра."

  khan_peace_in_our_time:0 "Мир на степах"
  khan_peace_in_our_time_desc:0 "Барона прибрано, а його люди тепер слухають нас. Їхнє майбутнє — у наших руках."

  khan_ezekiel_henries:0 "Новий хан із-під влади Барона"
  khan_ezekiel_henries_desc:0 "Колишній головоріз Барона, Езекіель Генріс швидко прийняв нашу владу — і наразі люди із задоволенням працюють з ним!"

  kha_the_matter_of_state:0 "Питання нової держави"
  kha_the_matter_of_state_desc:0 "Прибічники Барона так легко не здадуться. Наступний крок має бути вирішений."

  kha_barons_daughter:0 "Донька Барона"
  kha_barons_daughter_desc:0 "Виявилося, що Барон був не таким уже й бездушним. Але головне питання — чи не передалося це за наслідством?"

  kha_ranching:0 "Ранчо Сандерсів"
  kha_ranching_desc:0 "Родина Сандерсів жила під владою Барона багато років. Вони не святі, але готові до співпраці — і користуються повагою багатьох місцевих."

  khan_rancher_gunsmiths:0 "Зброярі Вайомінгу"
  khan_rancher_gunsmiths_desc:0 "Місцеві дуже серйозно ставляться до виготовлення зброї — практично всі зразки з арсеналів Барона збережені в ідеальному стані. Ці надбання стануть у пригоді й нам."

  kha_a_friend_in_need:0 "Гасіння пожежі"
  kha_a_friend_in_need_desc:0 "У Рівертоні спалахнули сутички між нашими людьми та місцевими. Самулл добровільно зголосився розібратися із заворушеннями."

  khan_the_path_earned:0 "Заслужений шлях"
  khan_the_path_earned_desc:0 "Після тривалих зусиль ми здобули довіру народу Ейрі. Нашу позицію у Вайомінгу тепер ніхто не зможе похитнути. Лишилося лише готуватися до майбутнього."

  khan_the_grand_workshops:0 "Великі майстерні"
  khan_the_grand_workshops_desc:0 "Щоб збудувати будь-яке суспільство, треба вміти покладатися на себе. Початок реформ у виробництві продемонструє нашу рішучість як ніколи."

  khan_worland_infra:0 "Битва за Мітіці"
  khan_worland_infra_desc:0 "Місцеві кажуть, що в Мітіці колись відбулася велика битва між «Людьми з лісу» та супермутантами. Якщо допоможемо з відновленням інфраструктури, можливо, з цього буде користь."

  khan_biking_technology:0 "Самотні мандрівники"
  khan_biking_technology_desc:0 "Вайомінг — великий і живописний край. Деякі в Ханстві вважають його надто великим, але саме вони почали відновлювати мотоцикли на старому заводі. Можливо, це початок чогось нового?"

  khan_angered_populace:0 "День, коли грім замовк"
  khan_angered_populace_desc:0 "У Ханів рідко буває тверезий розсуд. І тепер, коли один із наших під загрозою через «Святих», Ханство вимагає радикальних дій."

  khan_outriders:0 "Ессен збирає загін"
  khan_outriders_desc:0 "Амгалан закликав до стриманості й терпіння, але ця образа надто велика. Ессен увірветься на землі Румінаторів і вимагатиме відплати. Святі отримають по заслузі."

  khan_bloody_woods:0 "Кров у лісах"
  khan_bloody_woods_desc:0 "Боротьба у Бігорнерських лісах тільки посилилася — Святі ведуть партизанську війну. Якщо хочемо швидко покінчити з ними, потрібен рішучий удар."

  khan_third_street_saints:0 "Святі відступають"
  khan_third_street_saints_desc:0 "Ессен повернулася переможницею. Вона виявила схованку Святих і власноруч винищила всіх усередині. Люди Арчі втекли з піджатими хвостами, а нам дісталася купа трофеїв. Згодиться."

  khan_saints_diplomacy:0 "Утримати бурю"
  khan_saints_diplomacy_desc:0 "Наші люди гніваються, а деякі вже мстяться. Навіть Амгалан ледве стримує лють. Якщо хочемо зупинити подальше кровопролиття — треба діяти швидко. Насамперед — переконати Ханів дати йому шанс."

  khan_amgalans_trials_and_tribulations:0 "Випробування Амгалана"
  khan_amgalans_trials_and_tribulations_desc:0 "У нас конфлікт із Арчі та його Святими, але Румінатори — мирні та доброзичливі. Вони раді допомогти врегулювати ситуацію. Єлизавета вже в дорозі — їй можна довіряти."

  khan_ruminator_reparations:0 "Компенсація від Румінаторів"
  khan_ruminator_reparations_desc:0 "Єлизавета стримала слово — переконала Арчі припинити опір і подарувала нам дарунок для примирення. Не впевнені, що робити з 50 примірниками «Румінації до багатства», але все ж..."

  khan_industry_boom:0 "Рух уперед"
  khan_industry_boom_desc:0 "Реставрація техніки — справа непроста. Розширення промислових основ дозволить нашим байкерам рушати швидше."

  khan_khanate_tool_research:0 "Інструменти Ханства"
  khan_khanate_tool_research_desc:0 "Інструменти — основа будь-якої промисловості. Нам треба мати якомога більше, чи виготовлених власноруч, чи врятованих із брухту."

  khan_the_working_tribe:0 "Очищення озера Бігорн"
  khan_the_working_tribe_desc:0 "На сході, біля озера Бігорн, оселилися рейдери. Вони укріпилися у форті, який ми могли б використати для власних цілей, якщо захочемо."
  
  khan_roads_focus_because_theyarecool:0 "Відкриті дороги"
  khan_roads_focus_because_theyarecool_desc:0 "Щоб наші байкери й далі могли мчати швидко й вільно, нам потрібно відремонтувати дороги! Ми відправимо робочі загони, щоб привести їх до ладу — гідного наших нових сталевих жеребців, які жадають олії."

  khan_khanate_tool_tech:0 "Кращий шлях"
  khan_khanate_tool_tech_desc:0 "Завдяки нашим знанням у догляді за транспортом, ми навчилися краще пристосовуватися до нього у виробництві. Тепер наші заводи зможуть ефективніше працювати з матеріалами!"

  khan_rock_em_sock_em_bike_em:0 "Рев крізь Вайомінг"
  khan_rock_em_sock_em_bike_em_desc:0 "Наше панування у Вайомінгу налякало багатьох місцевих рейдерів — і за це варто подякувати моторам, що ревуть. Тепер ми мчимо вільно, разом, по степах — і ні про що не турбуємося."

  khan_khans_of_the_road:0 "Відкриваємо автомайстерні"
  khan_khans_of_the_road_desc:0 "Якщо ми збираємося далі колесити землями, чому б не відкрити невеликі майстерні, де можна буде ремонтуватися й заправлятись?"

  khan_esen_intro:0 "Повернути погляд до неба"
  khan_esen_intro_desc:0 "Амгалан був дурнем, якщо думав, що його методи приведуть Ханів до успіху. Мудрість Послідовників зніжила його — його кістки не годяться для війни, а розум потонув у мріях. Сонце нещадне до слабких, і Ессен, підтримана більшістю однодумців серед Ханів, вимагає повернення до старих звичаїв. \n\n До звичаїв §YСправжніх Ханів.§!"

  khan_scavenging_4:0 "Полювання на забутих полях"
  khan_scavenging_4_desc:0 "Старі вежі з лезами досі стоять на полях Ґрінвею. Коли вітер завиває, леза обертаються, розрізаючи повітря. Старий запис Послідовників каже, що так можна добути енергію. Ессен наважується спробувати."

  khan_scavenging_5:0 "Сонце і солдат"
  khan_scavenging_5_desc:0 "Зібраних ресурсів вистачило б на життя, та цього замало, щоб перетворити брухт і енергію на щось корисне. Під сонцем завжди триває війна. Ті, хто готуються — перемагають."

  khan_scavenging_1_desc:0 "Землі Мітіці зберігають скарби, поховані під руїнами війни. Якщо очистити територію, нам може пощастити — або хоча б знайдеться корисний брухт."
  khan_scavenging_2_desc:0 "Покинуті об'єкти розкидані рівнинами Ворленда. Хани славляться своєю винахідливістю, хоч і грубою. Що може краще це довести, ніж відновлення цих об'єктів?"
  khan_scavenging_3_desc:0 "Справжні Хани захоплюються гарячим чорним димом. Немає нічого чистішого чи захопливішого, ніж кидати металобрухт у вогонь і дивитися, як він перетворюється на щось нове й палаюче. 'Ще!' — кричать Справжні Хани. І Ессен дослухається."
  khan_tributaries:0 "Данина поваги до поклику"
  khan_tributaries_desc:0 "Мертва вага веде до втрат, а кожна кришка забезпечує добробут Справжніх Ханів. §R'За родину,'§! — пояснила Ессен, перш ніж віддати наказ позбутися всього непотребу, продавши його торговцям і мандрівникам."
  khan_consulting_the_book:0 "Прекрасні коні"
  khan_consulting_the_book_desc:0 "Книгу про давню імперію було знайдено в сховці Послідовників. Ессен розлютилася, що ключі до їхнього процвітання були приховані, але, як кожен добрий лідер, вона скерувала гнів у свої мечі."
  khan_esenist_doctrines:0 "Військовий шлях Ессен"
  khan_esenist_doctrines_desc:0 "Ще до свого походу Ессен була визнана однією з найсильніших серед Нових Ханів. Вона ламала двері, коли їх потрібно було вибити, і переробляла зброю, коли та заїдала. Цю силу потрібно передавати — адже вождь ніщо, якщо народ не може покладатися на себе."
  khan_the_path_of_glory:0 "Золота галявина"
  khan_the_path_of_glory_desc:0 "“Коли я була дівчинкою, я любила губитися в золотих галявинах. Це була болотиста місцевість із високою жовтою травою — земля місцями просідала від давніх кратерів. Поле перетинав самотній залізничний шлях. В один бік — до дому. В інший — до мрій.” — Ессен"
  khan_esen_capstone_tran_dont_shoot_me:0 "Діва світанку"
  khan_esen_capstone_tran_dont_shoot_me_desc:0 "Під проводом Ессен Справжні Хани стали сміливішими. Потік прагнень і дій наповнив кожного новим сенсом — і новими випробуваннями. Щодня доводиться щось доводити. І світанок ще ніколи не був таким бажаним."
  khan_esens_workshop:0 "Озбройся — або втрать руку"
  khan_esens_workshop_desc:0 "Наполегливість Ессен готуватись до війни — попри її нечіткі цілі — викликала як рішучість, так і страх у серцях Ханів. Кожна рука має мати зброю, а кожна зброя — своє життя."
  khan_building_a_khanate:0 "Побудова ханства"
  khan_building_a_khanate_desc:0 "Ті, хто першими копають ґрунт, несуть тягарі, яких історії не згадають. Але поки збудовано фундамент для нащадків — слабкість тимчасова, а ханство — вічне."
  khan_to_want_it_all:0 "Все належить нам"
  khan_to_want_it_all_desc:0 "“Амгалан тричі питав мене: §Y'Навіщо ти це робиш?'§! \n\n Я дивилася йому в очі. Попри суперечки, я все ще любила його як батька, тому відповіла: §R'Бо слабкі заслуговують на свою долю. Лише коли ми останні — ми в безпеці.'§!”"
  khan_pay_mind_to_the_old_ways:0 "Слухай, Сонценароджений і Сонцелам"
  khan_pay_mind_to_the_old_ways_desc:0 "Сонцесяйні складались переважно з Сонценароджених, але траплялось, що кочівники теж приєднувались до племені. Ті, хто проходив Випробування Спекою — сидіння на кручах кілька днів без їжі й води — отримували ім’я Сонцелам. Для Ессен кожен Хан — Сонцелам, і вона передає старі традиції."
  khan_a_warrior_like_myself:0 "Воїн, як і я"
  khan_a_warrior_like_myself_desc:0 "Ессен зі своїми Справжніми Ханами вистежувала групу Братства. Але загін не чинив опору. Їхня лідерка зняла шолом — змучена, вигнана зі свого Віділення. Вона шукала мир. Ессен дала вибір: приєднатися — або померти."
  kha_metalmouths_goal:0 "Вкусити пил"
  kha_metalmouths_goal_desc:0 "Амгалан давно помітив Металеворотих. 'Насувається біда,' — сказав він і почав складати план. Ессен також бачила, що ті — просто покидьки. І закликала Ханів до війни."
  khan_lumber:0 "Дрова для вогню"
  khan_lumber_desc:0 "Коли Справжні Хани палили серце Металеворотих, ліси теж охопило полум’я. Зарості й дерева вигоріли за ніч. Нічого не залишилось — ідеально для нового початку."
  khan_scrapping_metalmouths:0 "На металобрухт"
  khan_scrapping_metalmouths_desc:0 "Ессен дарувала Сталевому Джо милість, якої сама ніколи не отримала: життя, якщо вони покинуть землі. Та коли вона відвернулась, Джо вистрілив. І втратив руку. А разом із нею — і своїх людей."
  kha_montana_chapter_goal:0 "Остання сторінка Монтани"
  kha_montana_chapter_goal_desc:0 "Глава Братства в Монтані — загадка. Але одне ясно: вони тримають те, що могло б належати Ханам — мрії, які припадають пилом. Прийшов час їх розбудити."
  khan_in_search_of_coal:0 "У пошуках вугілля"
  khan_in_search_of_coal_desc:0 "Колись Ессен вдивлялась у горизонт. Дим від Вугільного консорціуму закривав небо. Узимку вона мріяла про тепло… \n\n §R'І коли знову прийде зима, мрія стане реальністю.'§! — Ессен"
  khan_a_woman_goes_to_war:0 "Гнів полудня"
  khan_a_woman_goes_to_war_desc:0 "Будучи командиром при Амгалані, Ессен чула багато сумнівів. А тепер, як лідерка, чує ще більше. Їй треба довести всім свою вартість. Хани повинні слухати. \n\n §R'Розумієш — залишайся. Ні — іди.'§! — Ессен"
  kha_marshall_wargoal:0 "Падіння Республіки"
  kha_marshall_wargoal_desc:0 "Республіка Маршалл багата на ресурси. Її народ вижив завдяки землі. Але ця земля зможе більше в руках Ханів. Шкода, що Республіка не поділяє цієї думки."
  khan_four_fathers_wargoal:0 "Кров на бруківці"
  khan_four_fathers_wargoal_desc:0 "Перемога над Республікою Маршалл сколихнула Монтана. Розумні сховалися. Інші — почали багато гавкати. Чотири Отці — такі дурні. А Хани жадають нової перемоги."
  khan_ashes_of_the_free_states:0 "Попіл Вільних Штатів"
  khan_ashes_of_the_free_states_desc:0 "Амгалан і Ессен стояли разом, дивлячись на тліюче вугілля колишньої столиці. §Y'Цього ти хотіла?'§! — запитав Амгалан. \n\n Очі Ессен, тьмяні й холодні, ловили відблиски жару. §R'Це — та ще більше.'§!"
  khan_basalt_caravan_company:0 "Троянди в Розеті"
  khan_basalt_caravan_company_desc:0 "Мир після війни був безмовною втіхою для Ессен. Перемога означає ще один день життя. Тепер — час відбудови. Вперед — із серцем Сонця й силою Хана!"
  kha_standing_rock_wargoal:0 "Шторм, що минає"
  #kha_standing_rock_wargoal_desc:0 "The warriors of Standing Rock are a worthy foe, not too different from us. It is a shame that we cannot stand as companions in battle, but it was likely inevitable that two conquerors would come to blows. May their defeat be a glorious one." (Я б сказав оооооо, але скажу)
  kha_standing_rock_wargoal_desc:0 "§R'Шаппа — воїн, як і я,'§! — зазначила Ессен. §R'Шкода, що ми надто схожі.'§!\n\nРозвідки про бойові загони Стендінґ-Року надходять хвилями. Ворог зі схожими ідеалами наближається з кожним завоюванням. Війна — неминуча. А коли попіл вляжеться, народиться істинна спадщина."
  khan_stretching_the_stretch:0 "Завоювання Стретчу"
  khan_stretching_the_stretch_desc:0 "Стретч — дивний регіон. Хоча вони й тримаються осторонь, їхні внутрішні чвари чути по всьому краю. Ессен терпіла це заради симпатій Амгалана до Румінаторів, та крики й безладні наслідки не припиняються. Тепер вона бажає тиші."
  khan_saul_advisor:0 "Останній світлячок"
  khan_saul_advisor_desc:0 "Після розпаду Румінаторів, за проханням Амгалана, їх інтегрували до ханів. Вони виконують буденні обов’язки, щоб підтримувати добробут племені. Але один із них особливо привернув увагу Ессен — світлячок на ім’я Саул."
  khan_integrating_saints:0 "Що визначає святого"
  khan_integrating_saints_desc:0 "Попри свою показну чистоту, святі поводяться як будь-який інший бандитський клан — вони вірні лише найсильнішому. Коли Арчі вилетів зі сцени, у Стретч повернулися мир і тиша.\n\nНарешті."
  khan_assemble_the_horde:0 "Сонцеобціловані мародери"
  khan_assemble_the_horde_desc:0 "Після низки перемог — пролитої крові й здобичі — Ессен замислюється. Її дух і далі палає, а справжні хани спрямовують погляд на схід і захід."
  khan_the_western_approach:0 "Західний шлях"
  khan_the_western_approach_desc:0 "§C'Дивився на ті землі. Паскудні люди з усіх усюд живуть на заході,'§! — пробурмотів Езекіель, кинувши фішку на мапу. §C'Який хід зробиш?'§!\n\nЕссен лише хмикнула й усміхнулась. Відповідь була проста — ніж у серце західного регіону."
  khan_storm_monger_1:0 "Доторкнутись до неба"
  khan_storm_monger_1_desc:0 "Земля Буревісників залишає гіркий присмак у тих, хто вижив. Поля вкриті кров’ю, тіла розкидані заради якогось вищого культу.\n\nЄресь, каже Ессен, бо на небі місце лише для одного сонця."
  khan_storm_monger_2:0 "Хмари з нами"
  khan_storm_monger_2_desc:0 "Падіння Буревісників принесло здобич, небачену раніше — технології з часів, коли небо відкидало гігантські тіні. Тепер лише справа часу — опанувати їх."
  khan_storm_monger_3:0 "І посміхнулось небо"
  khan_storm_monger_3_desc:0 "“І тоді ми піднялися в небо. Вітер гладив моє волосся. Хмари несли мене, легені хололи — але я відчула.\n\nНа межі між світом і космосом.\n\nЯ відчула, як усміхається сонце.” — Ессен"
  khan_macarthur_esen:0 "Оспіваний Анклав"
  khan_macarthur_esen_desc:0 "“Амгалан розповідав мені про привидів Каліфорнії. Про чорну сторінку, яку історія не може перегорнути. Розвідки й сутички кажуть, що уламок цього привида досі блукає горами...\n\n§RОблога пекельного вогню й снігу — звучить чудово.§!” — Ессен"
  khan_macarthur_weapons:0 "Приховані сховища"
  khan_macarthur_weapons_desc:0 "Гори обшукали після перемоги справжніх ханів. У снігу та за міцною охороною знайшли кілька сховищ. Щоб дістатися до кожного, потрібен час..."
  khan_macarthur_munition:0 "Геллфаєр в наших руках"
  khan_macarthur_munition_desc:0 "Ніч завершилась у вогнях та броньованих трунах, похованих в снігу. Гори вкрились вічним бурштином і ядучим туманом. Це означало смерть для слабких — і новий початок для ханів."
  khan_yellowstone:0 "Обшукати долину"
  khan_yellowstone_desc:0 "Старі записи описують Єллоустоун як одну з найбільших природних систем на Землі. Скільки з того втрачено — невідомо, але ресурси в самому серці долини кличуть до Ессен. Протестувальники можуть іти геть."
  khan_bounty_of_the_scourge:0 "Здобич після прочісування"
  khan_bounty_of_the_scourge_desc:0 "“Коли парк став нашим, я зрозуміла, наскільки тут тихо. Ми й далі будемо посилати ханів на пошуки й збори, але поки що... я насолоджуюсь тишею. Це схоже на дім.” — Ессен"
  khan_they_call_it_hephaestus:0 "Вони звуть його Гефест"
  khan_they_call_it_hephaestus_desc:0 "Те, що ми сприймали як звичайний дослідницький об’єкт посеред Єллоустоунської долини, виявилося старовинною технічною базою. Всередині ми знайшли креслення, інструменти, напівавтоматизовані верстати — усе це може змінити хід нашого промислового розвитку."
  khan_hephaestus_labs:0 "Ковадло Сонця"
  khan_hephaestus_labs_desc:0 "Ми офіційно заснували ковальню в самому серці лабораторій "Гефеста". Усе, що було досі теорією, стає нашою практикою. Тут ми розпечемо майбутнє до білого жару."
  khan_scorched_sun:0 "Обпалене Сонце"
  khan_scorched_sun_desc:0 "Наш шлях пройшов через вогонь, кров і сталь. Ми побудували з попелу, вчилися в науці, спостерігали за падінням ворогів. Тепер сонце дивиться згори — йому немає кого судити, крім нас самих."
  khan_true_khans_finish:0 "Світанок Справжніх Ханів"
  khan_true_khans_finish_desc:0 "Ессен поглянула на обрій: поля, що горіли вчора, сьогодні цвітуть. Дороги, якими їхали на війну, тепер ведуть до нового майбуття. Справжні хани здобули своє місце під сонцем — і більше його не віддадуть."
  khan_true_khans_bonus:0 "Шлях Сонця"
  khan_true_khans_bonus_desc:0 "Усе, що ми робили — не марно. Кожна перемога, кожна рана, кожна втрата — лягла в основу нашої сили. Сонце сходить для тих, хто не відвертає погляду. Справжні хани — тепер і навіки."
  khan_the_eastern_approach:0 "Наступ на схід"
  khan_the_eastern_approach_desc:0 "§C'На сході — самі культи, руїни й простий люд,'§! — видихнув сигару Езекіель. §C'Що думаєш про це, шефе?'§! \n\n Ессен встромила ніж у центр східного регіону на карті. §R'Їдемо на схід,'§! — буркнула вона, із затуманеним поглядом."
  khan_the_scourging_of_bismarck:0 "Багато було таких, як ти. Шкода."
  khan_the_scourging_of_bismarck_desc:0 "“Генрі нагадав мені Амгалана. Людина компромісу, яка блукала світом, але врешті зазнала поразки. З поваги до цього я пощадила його, коли Бісмарк було перетворено на руїни. Та все одно боляче — бачити, як зусилля втомленої людини обертаються на попіл.” — Ессен"
  khan_dramatae:0 "Фінальний акт Ессен"
  khan_dramatae_desc:0 "Блазень — постать особлива. Коли всі інші втекли, він залишився, просячи “Аудіювання”, а тоді тримав увагу Ессен годину виставами й трюками. \n\n §R'Нехай лишається,'§! — сказала Ессен."
  khan_red_moon_never_falls:0 "Червоний місяць не впаде"
  khan_red_moon_never_falls_desc:0 "Червоний місяць дивився на Два Народи багато днів. Очевидно, вони сприйняли це як пророцтво, й незабаром хвилі людей підходили до Справжніх Ханів, просячи проводу. Під його світлом Ессен прийняла кожного майбутнього воїна."
  khan_the_children_of_atom:0 "Єретики більше не єретики"
  khan_the_children_of_atom_desc:0 "Останнім часом у нас стали псуватись шахти — їх хтось навмисно саботує. Довго ми не знали винуватця, поки чутки про культ, що поклоняється шахтам, не прояснили ситуацію..."
  khan_secrets_of_the_silo:0 "Таємниці шахти"
  khan_secrets_of_the_silo_desc:0 "“Минуло чимало часу з розгрому церкви. Ці шахти щось означали, але ми просто лишили їх. Та щось у мені свербить — а якщо там і справді були секрети?” — Ессен"
  khan_atomic_technologies:0 "Атомні технології"
  khan_atomic_technologies_desc:0 "Після перемоги над Церквою Шахти ми виявили сховища енергетичної зброї — багато зразків у відмінному стані. Інші — красиво виставлені у вітринах. Усі раділи здобичі, крім Ессен: §R'Вони приховували це від нас?'§!"
  khan_ruins_of_vault_37:0 "Руїни Сховища 37"
  khan_ruins_of_vault_37_desc:0 "Сховище 37 й особливо його наглядач стали для Ханів новим видом ворога. Що можуть болти й лазери такого, чого не зробили вже люди? Сподіваємось, відповідь буде на нашу користь..."
  khan_slaughtering_roaches:0 "Під нашою п'ятою"
  khan_slaughtering_roaches_desc:0 "“Людина, здатна керувати мутантами й тарганами, не має місця у цьому світі. Знищення Короля Тарганів — єдиний шлях до безпеки. Шкода, що Езекіель не написав про це у своїх нотатках...” — Ессен"
  khan_vault_workshops:0 "Час наздоганяє нас"
  khan_vault_workshops_desc:0 "Очистивши шлях від роботів і мутантів, Ессен насолоджується короткою паузою — часом для відновлення того, що було втрачено."
  
  khan_khanate_reborn:0 "Ханство відроджено: посудина війни"
  khan_khanate_reborn_desc:0 "Кров, пролита по землі, живила ґрунт для чогось нового. Чогось, що залишиться з Ханами назавжди. Ессен носить більше шрамів, ніж може порахувати, і, дивлячись на завойовану землю, вона готова здобути ще більше."

  khan_amgalan_intro:0 "У слід за майбутнім"
  khan_amgalan_intro_desc:0 "Для Амгалана, Послідовників і Ханів — це день надії. Йому довелося докласти багато зусиль, застосувати весь свій розум і трохи удачі, але його позиція тепер по-справжньому закріплена. Його рідня — як північна, так і південна — прийняла його мудрість і дала йому шанс довести, що саме його бачення майбутнього є найкращим. Може, тепер Амгалан нарешті зможе трохи поспати."

  khan_necessity_is_the_root_of_all_misdeeds:0 "Вбивця сестер"
  khan_necessity_is_the_root_of_all_misdeeds_desc:0 "Сестринство мертве, винищене безумною жінкою, чиї руки залиті кров’ю. Навіть якщо вони й не були нашими союзниками, то з такою як Гейман ми б усе одно не пішли поруч. Хапайте зброю."

  khan_the_unyielding_hero:0 "Непохитний герой"
  khan_the_unyielding_hero_desc:0 "Амгалан відмовився зрадити свої ідеали або відмовитись від надії на майбутнє, і з часом його рідні почали дивитися на нього по-новому. Мир, до якого він прагнув, був не проявом слабкості, а складною метою сильної людини. Його повага зростає з кожним днем."

  khan_caravan_upgrade:0 "Розширення караванів"
  khan_caravan_upgrade_desc:0 "Стабільність приваблює людей, а люди приносять торгівлю. У міру того як ми розбудовуємо наш дім на півночі, караванів стає все більше. І ми можемо пришвидшити цей процес, створивши власні."

  khan_amgalans_travels:0 "Мандри Амгалана"
  khan_amgalans_travels_desc:0 "“Навіть коли мій народ пускає коріння довкола мене, заклик дороги досі лунає в моїх вухах. Я мушу побачити цю землю й ті, що за нею, пізнати тих, хто в них живе. Але не хвилюйтесь — я завжди повертатимусь.” — Амгалан"

  khan_a_home_for_all:0 "Дім для всіх"
  khan_a_home_for_all_desc:0 "Жюстін розгорнула грубу карту сусідніх земель, де червоним позначено останні війни та битви. “Куди б ми не рушили — війна ніколи не змінюється.”\n\nАмгалан кивнув і поклав поряд іншу карту — Даріона й навколишніх земель. “Завжди є ті, хто шукає втечі. Ми можемо дати їм притулок.”"

  khan_a_home_for_all_2:0 "Багатство товарів"
  khan_a_home_for_all_2_desc:0 "Послідовники все більше інтегруються в наші справи: будують майстерні, колодязі, пункти переробки брухту. І на щастя, вони щедро діляться плодами цієї праці."

  khan_amgalan_factory_2:0 "Ремісничі вироби"
  khan_amgalan_factory_2_desc:0 "Серед Ханів є чимало вмілих майстрів, здатних творити і красиве, і корисне. Колись вони працювали з тим, що трапиться під руку, в наметах, готових у будь-який момент згорнутись. Тепер ми можемо дозволити їм майстерні й постійне забезпечення ресурсами."

  khan_build_a_better_place:0 "Будуємо краще місце"
  khan_build_a_better_place_desc:0 "Фалая — одна з найрозумніших серед нас — довго вивчала все, чого Послідовники могли її навчити. Тепер вона вже не учень, а сама навчає. З нею на чолі наших будівельних ініціатив наші оселі стануть предметом заздрості всієї пустки."

  khan_factorio_is_too_expensive:0 "Промислове обладнання"
  khan_factorio_is_too_expensive_desc:0 "Ми віднайшли чимало деталей старого промислового обладнання на розібраних довоєнних фабриках. З невеличкою допомогою Послідовників ми зможемо відремонтувати їх і запустити наші власні виробництва."

  khan_realm_of_diana:0 "Володарка Діана"
  khan_realm_of_diana_desc:0 "“На півдні я знайшов місце, якого не міг уявити. Долину, населену сильними, здоровими людьми, якими опікується мати на ім’я Діана. Ми говорили кілька днів, і вона дала мені дари, щоби я поділився з вами.” — Амгалан"

  khan_healthy_gang:0 "Сила в здоров’ї"
  khan_healthy_gang_desc:0 "“Я зустрівся з Діаною знову, й вона навчила мене багато чому — секретам медицини й фізичного розвитку, про які Послідовники навіть не мріяли. В обмін я запропонував їй добровольців з-поміж наших воїнів. Є охочі побачити ту долину?” — Амгалан"

  khan_follower_research:0 "Медичні досягнення"
  khan_follower_research_desc:0 "Багато Ханів, як північних, так і південних, виявилися швидкими учнями в хімії — і завдячують вони за це Послідовникам. Ті ж, у свою чергу, не припиняють вдосконалювати свою справу. Якщо ми підштовхнемо наших хіміків долучитися до них, хто зна, які прориви ми ще зробимо."

  khan_followers_support:0 "Втілення книжкової науки"
  khan_followers_support_desc:0 "Теорії нам не допоможуть вижити під радіаційним дощем, під час епідемій чи посух. Перетворити знання в практичні винаходи — необхідний крок у нашому розвитку. Навіть якщо деякі Хани все ще хочуть робити з цього зброю..."

  khan_followers_science:0 "Накопичені знання"
  khan_followers_science_desc:0 "Прагнення до знань не вмерло з вибухом бомб. У маленьких лабораторіях, з купою мотлоху, вчені постапокаліптичного світу не зупинились. Послідовники завжди полювали за новими відкриттями — і так залишилося дотепер."

  khan_followers_laboratories:0 "Лабораторії Послідовників"
  khan_followers_laboratories_desc:0 "Науковцю потрібна лабораторія, хоч більшість із них зараз — це лише тінь колишніх. Але у Послідовників технологій більше, ніж у інших, і їм є що нам показати. Комп'ютери творять дива."

  khan_followers_lost_medical_knowledge:0 "Втрачені медичні знання"
  khan_followers_lost_medical_knowledge_desc:0 "Мелісса й Ессен повернулися з експедиції в покинуті райони з розповідями про довоєнну дослідницьку лікарню, що майже не постраждала. Те, що вона була повна гнізд жалокрилів, лише підбурило ентузіазм Послідовників. Вони вже планують повернути все, що там можна знайти."

  khan_followers_ralston_manufacturing_plant:0 "Виробництво в Ралстоні"
  khan_followers_ralston_manufacturing_plant_desc:0 "Наші спільні дослідження з Послідовниками в галузі медицини та хімії потребують кращих виробничих потужностей. Перетворення старого заводу в Ралстоні має дати змогу виробляти більше ліків з місцевих рослин."

  khan_followers_agricultural_division:0 "Сільське господарство Послідовників"
  khan_followers_agricultural_division_desc:0 "Хімія — не єдина наука, якою займаються Послідовники. У сільському господарстві вони значно перевершують нас. Хани ніколи не славились як фермери, але зі зростанням поселень усе більше з нас береться за землю. Якщо вони готові навчати — ми готові вчитися."

  khan_agricultural_advancements:0 "Сільськогосподарський прорив"
  khan_agricultural_advancements_desc:0 "Ми навчаємось швидко — швидше, ніж очікували Послідовники. Старі поля, що занепали після кінця світу, оживають завдяки знанням наших нових союзників. Їздити на тракторі, а не на мотоциклі — трохи дивно, щиро кажучи."

  khan_work_with_dealers:0 "Укладення угоди"
  khan_work_with_dealers_desc:0 "Джек і Діана сиділи поруч, поки Жюстін слухала пропозицію першого. “Слухай, леді, твоя справа з ліками — це круто. Ми хочемо допомогти. Ми знаємо, як дістати потрібне тим, хто цього хоче. Просто замов за нас слівце перед А-чоловіком.”\n\nЖюстін зітхнула й знизала плечима: “Гаразд.”"

  khan_force_dealers_out:0 "Реабілітація від хімії"
  khan_force_dealers_out_desc:0 "Діана глибоко затяглась цигаркою, дивлячись, як Амгалан відкриває першу реабілітаційну клініку в невідомо скількох милях. “Це знищить наш бізнес, ти ж знаєш.”\n\nДжек знизав плечима, лежачи в старому кріслі: “Може, час на щось нове? Можу варити щось для Послідовників.” Діана лише знизала у відповідь — вже обмірковувала, як тримати це в кришках."

  khan_field_medics:0 "Польова медицина"
  khan_field_medics_desc:0 "Ніде швидка медична допомога не грає такої ролі, як на полі бою. Підготовка наших людей до цієї справи — ключ до того, щоб якнайбільше Ханів поверталось додому."

  khan_healthy_gang_2:0 "Потужні антидоти"
  khan_healthy_gang_2_desc:0 "Пустош наповнений істотами, отруйними на вигляд і по суті, як і отруйними залишками старого світу. Але на кожну отруту є протиотрута — і ми стали вправними у їхньому створенні."

  khan_natural_stimpaks:0 "Натуральні стимулятори"
  khan_natural_stimpaks_desc:0 "Стимулятори — це диво старого світу, але його можна відтворити. Правильні рослини й сполуки — і ми маємо свою версію, не гіршу, а може, й кращу."

  khan_meds_will_be_spread:0 "Розподіл ліків"
  khan_meds_will_be_spread_desc:0 "Завжди є що вивчити, але схоже, ми дійшли меж у медицині, яку можемо опанувати. Тепер головне — застосувати ці знання. Забезпечення ліками наших людей та союзників зробить майбутнє кращим для всіх."

  khan_followers_spread:0 "Обмін знаннями"
  khan_followers_spread_desc:0 "Знання — найяскравіше світло в ці темні часи, і Послідовники мають його найбільше. Але вони щедрі друзі й діляться з нами. Ми теж можемо передати ці знання нашим союзникам."

  khan_followers_established_bonuses:0 "Поширення гуманізму"
  khan_followers_established_bonuses_desc:0 "Під нашим захистом і підтримкою Послідовники Апокаліпсису розцвіли як ніколи. Зростання їхнього впливу на людей, яким вони допомагають, — це невелика плата за це."

  khan_capstone_1:0 "Хан над Ханами"
  khan_capstone_1_desc:0 "Час суперечок завершено — Хани голосно й чітко підтримали новий шлях. Сьогодні — лише початок, але він уже має значення. За Ханство!"

  khan_capstone_2:0 "Епоха добробуту"
  khan_capstone_2_desc:0 "Ми пережили багато лиха — цього не заперечить ніхто, ні північний, ні південний Хан. Та схоже, важкі часи лишаються позаду. Ми сильні як ніколи — час насолоджуватись плодами."

  khan_capstone_3:0 "Відплата"
  khan_capstone_3_desc:0 "Ми господарі цих земель, а отже — маємо частку з усього, що тут відбувається. Назвіть це даниною, податками... Хоча, до біса податки — назвіть це десятиною."
