  KHA_bailey_collaborator:0 "Співпраця з Бейлі"
  KHA_bailey_collaborator_desc:0 "Барон мертвий, але його донька жива – тепер підвладна ханам. Вона має великий вплив у регіоні, побудований на зв’язках і, можливо, на шантажі, що дозволяє зменшити опір нашому правлінню. Навіть за межами Ейрі її дипломатичні здібності й таємна мережа можуть нам допомогти. Проте деякі хани ніколи не пробачать помилування доньці ворога, а капси мають схильність зникати поблизу Бейлів."

  KHA_rowdy_khans:0 "Неслухняні хани"
  KHA_rowdy_khans_desc:0 "Незважаючи на найкращі зусилля Амгалана, хани залишаються ханами. Вони не змінять своїх звичок лише тому, що нова домівка здається тихою і гарною. \n\nЇх ще треба буде приборкати... Та чи на умовах Амгалана – покаже час."

  KHA_ranger_lead_the_way:0 "Нехай Рейнджер веде шлях"
  KHA_ranger_lead_the_way_desc:0 "Джей зробили все можливе, щоб провести нас і Послідовників через континент. Вони можуть бути рейнджером, але вони друг, як і всі інші – та і хан, хоч і не люблять, коли їх так називають. Звички старих собак."

  KHA_more_arrivals:0 "Очікуються новоприбулі"
  KHA_more_arrivals_desc:0 "Не всі були з Амгаланом, коли він прибув у Вайомінг – дехто відокремився або приєднався пізніше. Цілком імовірно, що нові обличчя та втрачені товариші з’являтимуться ще тижнями."

  KHA_whiterabbit_war_idea:0 "Війна з Білим Кролем"
  KHA_whiterabbit_war_idea_desc:0 "Поки мутанти та божевільні ведуть свої війни у нас під носом, наш народ не матиме спокою. Це має скінчитися – так чи інакше."

  KHA_bloody_border_conflict:0 "Кров на кордоні"
  KHA_bloody_border_conflict_desc:0 "Святі та обурені хани регулярно зіштовхуються на кордоні, втрачаючи бійців з обох боків. Поки нічого не зміниться, жага помсти поглинатиме дедалі більше життів."

  kha_expedition_funding:0 "Фінансування експедиції у Вайомінг"
  kha_expedition_funding_desc:0 ""

  kha_great_trek:0 "Великий похід"
  kha_great_trek_desc:0 "Не всі хани хочуть жити під п’ятою НКР. Побоюючись знищення між Биком і Ведмедем, багато хто обирає довгий шлях на північ, мріючи про нове життя."

  kha_the_crucible:0 "Горнило"
  kha_the_crucible_desc:0 "Далеко від великих імперій сходу і заходу саме у Вайомінгу Атраріс вирішив збудувати фундамент своєї імперії. Сповнений рішучості §Rспалити§! Вайомінг заради злету свого трону, тільки час покаже наслідки цієї гри з вогнем."

  kha_bos_no_supply:0 "Зрив постачання"
  kha_bos_no_supply_desc:0 "Через раптову втрату постачання від Консорціуму, у нас не вистачає енергії для забезпечення наших військ."

  KHA_enclave_connections_idea:0 "Зв’язки з Анклавом"
  KHA_enclave_connections_idea_desc:0 "Родина Джексонів активує свої сплячі осередки всередині бази Макартура, дозволяючи нам скористатися їхніми слабкостями."

  kha_one_percenters_idea:0 "Один відсоток"
  kha_one_percenters_idea_desc:0 "Відомі своїм тяжінням до злочинності, «одновідсотковці» здатні проходити туди, куди інші не наважуються сунутись."

  kha_drugs_on_Wheels_idea:0 "Хімія на колесах"
  kha_drugs_on_Wheels_idea_desc:0 "Ми дедалі більше покладаємося на мотоцикли для доставки хімії пусткою. Це швидко, ефективно і дозволяє охопити ширшу клієнтуру."

  KHA_shared_standing_rock_idea:0 "Хани й воїни"

