l_english:
 # originally by david, re-written/adapted by Happy, re-rewritten for 5.0 by Tar
 # restarted by violet, lusa, aida, ironvanguard, and tran for 5.0 following tar's departing of the team. we love and miss you, tar.
 # finished by Aida.valuna, IronVanguard and Anapostrophe. we love and miss you, Violet.

  #characters
  
  KHA_AMGALAN_NAME:0 "Амгалан"
  KHA_AMGALAN_DESC:0 "«Я вірю у свій народ, і в те, що він також побачить, яким яскравим може бути майбутнє.»\n\nШлях до того, щоб Амгалан став неформальним лідером Північних Ханів, був довгим. Десятиліття тому він мандрував пустками як зухвалий панк, здіймаючи галас і розбиваючи серця під командуванням Даріона та Нових Ханів. Коли Даріон загинув, а Хани втекли з Каліфорнії, Амгалан повів свою групу на зустріч із експедицією Послідовників Апокаліпсису. Після багатьох років, миль і боїв, обидві групи прибули до відкритих просторів Старого Вайомінгу. Оселившись із наміром вперше вкорінитися після довгої діаспори, Хани отримали шанс на довгоочікуване полегшення. Тепер, ставши значно старшим (і, як він сподівається, мудрішим), Амгалан лишається де-факто вождем, хоча багато його родичів ставляться з недовірою до його дедалі стриманішої поведінки. Дорога змінила Амгалана, хоча досі невідомо, чи змінила вона інших Ханів."
  KHA_AMGALAN_SECOND_DESC:0 "«Десятиліття випробувань і лиха привели Ханів сюди, до вибору – рухатися далі або залишитись. На мою велику радість, ми йдемо далі.»\n\nХани, як північні, так і новоприбулі з півдня, дали знати про своє бачення. І, на радість свого вождя, обрали мирний шлях. Завдяки зусиллям Амгалана втомлений від війни і вигнання народ повірив, що існує кращий шлях. Але тепер він мусить довести свою правоту ділом. Амгалан не має сумнівів, що за підтримки рідних, Послідовників Апокаліпсису та нових союзників, він зможе це зробити. Майбутнє нарешті видається світлим."
  KHA_amgalan_advisor_desc:0 "«Мало хто отримує те, про що мріяв. Я – не з таких, але маю все необхідне. Я дбатиму про свій народ, як завжди, і це не зміниться.»\n\nРоки нарешті далися взнаки плечам Амгалана, колись міцним і впевненим. Його мрії навчити Ханів нового способу життя залишились у минулому – поступилися волі рідних, що обрали інший шлях. Та все ж вони лишаються його народом. Щоранку він прокидається і робить усе, що може – лікує, навчає молодь чи виступає посередником між Ханами та тими, хто підпадає під владу Хана Ханів. Адже завтра – ще один день, і він може бути кращим за сьогодні."
  KHA_ESEN_NAME:0 "Ессен"
  KHA_ESEN_DESC:0 "«Пустка вже достатньо забрала в мене і Ханів. Досить. Відтепер – це ми забираємо.»\n\nЯкщо Хани щось і поважають понад усе – так це справжнього воїна. Того, хто не відступить перед погрозами, не дозволить себе принижувати. Справжній лідер Ханів має бути готовим пролити ріки крові заради свого народу. Ессен – саме така воїтелька. Остання з Сонячних Глядачів, тепер – Хан Ханів. Вона прагне не лише слави для Ханів, але й безпеки для кожного з племені. Їй ще належить багато довести, і тим, хто стане на її шляху, краще поступитися – або готуватись до війни."
  KHA_ESEN_ADVISOR_DESC:0 "Мало хто має що сказати про Ессен – вона відносно нова серед Ханів. Але завдяки своїй непохитності поруч із Амгаланом, вона швидко здобула авторитет, виступаючи проти його застою в ім’я завоювань, гідних Ханства."
  KHA_REGIS_NAME:0 "Реджис"
  KHA_REGIS_DESC:0 "«Великі Хани знову піднімаються. Ми завжди відроджуємось, і завжди будемо.»\n\nКолишня права рука Папи Хана змушений був стати лідером у часи лиха. І тепер знову став – цього разу, щоб об’єднати північних і південних Ханів. Формально Амгалан ще тримає владу, але Реджис швидко здобув підтримку в обох таборах. Він балансує між бажанням догодити всім і вірністю власним переконанням. Добра порада та врівноваженість допоможуть йому втриматися на цьому шляху."
  KHA_REGIS_SECOND_DESC:0 "«Ласкаво просимо на землі Великих Ханів. Я – їхній Папа.»\n\nШлях був довгим і тяжким, але Реджис тепер стоїть як Хан Ханів. Його вірні супутники з півдня та навіть північні побратими визнали його владу. Амгалан добровільно поступився місцем. Завдяки розуму і терпінню, Реджис знову нагадав, що означає бути Ханом – не лише у минулому, а й у майбутньому. Колись вони були втрачені, але тепер у Ханів знову є Папа."
  KHA_regis_advisor_desc:0 "«Хани були Великими у минулому і знову стануть Великими, як би нас не називали. Ми більше не впадемо.»\n\nДля людини, що взяла на себе тягар лідерства у часи кризи, майже полегшення – віддати цю владу. Його товариші завжди шануватимуть його, але тепер Хани з обох таборів починають змішуватись під новим керівництвом. Реджис тепер виступає як радник і стратег, допомагаючи новому лідеру. Він простежить, щоб ті, хто пережив Бітер-Спрінгс, не залишились осторонь."
  KHA_ATRARIS_NAME:0 "Атраріс"
  KHA_mogul_name:0 "Могул"
  KHA_mogul_high_command_desc:0 "Могул довго мандрував до того, як опинився у Вайомінгу. Колишній старший офіцер Армії Творця, він і досі має глибокі знання у військовій справі. З Ханами в нього з’явився шанс знову стати частиною чогось великого."
  KHA_ambercoza_name:0 "Паладин Амберкоза"
  KHA_jaye_name:0 "Джей"
  KHA_jaye_advisor_desc:0 "Коли Хани Амгалана і Послідовники проходили через Неваду, вони натрапили на колишнього Рейнджера Джея. Той відмовився від звань, прагнучи уникнути впливу НКР та жадоби помсти Абіґейл. Джей поспілкувався з Амгаланом і Ханами, відкривши для себе блискучу мрію старого вождя. Колись він не був другом Ханів – але після тривалих мандрів поруч, став для них родиною."
  KHA_justine_name:0 "Жюстін Волкер"
  KHA_justine_desc:0 "«У цьому світі ще стільки можливостей, щоб створити щось світле й прекрасне серед пустки. Ми зобов’язані показати шлях.»\n\nНе багато Послідовників у Вайомінгу пам’ятають Каліфорнію. Жюстін – не виняток. Народжена під час довгої мандрівки від матері-ханки і батька-послідовника, вона завжди брала приклад із батька. Вона вважає себе Послідовницею Апокаліпсису і присвятила себе їхній справі. Як дослідниця й лікарка, вона виступає посередником між Ханами і Послідовниками, зберігаючи добрі, хоч і незалежні стосунки між ними. Більшість свого часу проводить з Амгаланом, до якого відчуває дедалі більшу прив’язаність."
  KHA_DOOMFIRE_NAME:0 "Думфаєр"
  KHA_DOOMFIRE_DESC:0 "Відійшовши після чергової подорожі, Думфаєр був здивований, опинившись серед Ханів, а не Чортів. Він хотів вдихнути Джет, аби прояснити голову, але Реджис пояснив, що той сам запропонував супроводжувати їх. Думфаєр засмутився, що залишив дім, але швидко втопив смуток у ще одній дозі. Тепер у нього – нове призначення: бути правою рукою Реджиса і дарувати йому блискучі ідеї свого напівпритомного розуму. Реджис не став заперечувати."
  KHA_knight_avery_name:0 "Лицарка Ейвері"
  KHA_knight_avery_desc:0 "«Якщо чесно, мені тут більше подобається, ніж вдома серед Сестер. Тільки не кажіть їм.»\n\nБратство Сталі в Монтані завжди славилося колоритними особами, і Таша Ейвері – не виняток. Донька рейдерів зі сходу, вона успадкувала як хист до насильства, так і любов до гучних свят. Це часто приводило до того, що її відсилали на розвідку. Коли Гонор шукала волонтера для контактів із Ханами, Ейвері відразу зголосилась. Воїни й алхіміки – саме той тип культури, де вона почувалася як удома."
  KHA_TOOTHLESS_HANNIBAL_NAME:0 "Беззубий Ганнібал"
  KHA_TOOTHLESS_HANNIBAL_DESC:0 ""
  KHA_zeke_henries_name:0 "Езекіель Генріс"
  KHA_jessie_monroe_name:0 "Джессі Монро"
  KHA_jessie_monroe_desc:0 "«Не звертайте уваги на Ґіджет, вона кусає лише тих, кого любить. Якщо не любить – ви це зрозумієте.»\n\nЕнклейв, убивця, герой, відлюдник – Джессі «Пекельна Акула» Монро приміряла багато ролей. Нічого не затримувало її надовго. Після десятків операцій як солдат Анклаву вона дезертирувала з Макартура, розчарувавшись у службі. Відтоді вона жила в дикій природі, приручивши геконів. Тепер, зростаючи нова сила у Вайомінгу, вона одягнула броню з малюнком акули ще раз. І геконів приведе з собою – хай хтось тільки посміє сперечатись із солдаткою в силовій броні."
  KHA_booth_desc:0 "«Дивно бути Батьком серед Ханів. Боги мають дивні плани.»\n\nБут Кроу, колишній «Батько» з племені Чотирьох Отців, знайшов новий дім серед Північних Ханів. Розумний чоловік, що розуміє ціну як насильства, так і дипломатії. Його коси вплетені з історії рідного народу – на згадку. Зустрівшись із Реджисом, він запропонував свої послуги, аби те, що сталося з його плем’ям, більше не повторилося."
  KHA_wayles_desc:0 "Вейлз Томас, колись з Чотирьох Отців, тепер виступає радницею серед Північних Ханів. Вперта, волелюбна, але ворожа до насильства, вона погодилася працювати з Ханами лише після обіцянки, що ті будуть кращими за вбивць її народу. Час покаже, чи була ця обіцянка щирою."


  #Characters
  KHA_jessup:0 "Джессап"
  KHA_chance:0 "Ченс"
  KHA_chance_desc:0 "Ченс – член Великих Ханів і один із тих, хто пережив бійню в Бітер-Спрінґс. Багато хто вважає його ветераном клану та безжальним воїном, який без пощади рубає ворогів одного за одним."
  KHA_mcmurphy:0 "Макмерфі"
  KHA_mcmurphy_desc:0 "Макмерфі народився серед Ханів і має чималий досвід у веденні невеликих рейдерських загонів, що здійснювали набіги далеко на ворожі території."
  KHA_the_armorer_name:0 "Зброярка"
  KHA_the_armorer_desc:0 "«Давай сюди, я полагоджу.»\n\nХани без зброї не беззахисні, але почуваються незахищено. У Ханів Мохаве жінка, відома як Зброярка, дбала про постійний запас зброї й обладунків. Вона – загадкова постать, про яку ходять чутки, бо рідко з ким спілкується. У Вайомінгу вона робить те саме – лише в більших обсягах. Політика її не цікавить – вона завжди зайнята чищенням зброї або заточуванням клинків."
  KHA_oscar_velasco:0 "Оскар Веласко"
  KHA_oscar_velasco_desc:0 "Оскар Веласко був одним із небагатьох, хто вижив у Бітер-Спрінґс. Він відчайдушно бився пліч-о-пліч із побратимами, поки Ханів не знищили. Оскару вдалося вирватися завдяки його снайперській майстерності – він знищував солдатів НКР, що переслідували його вузькими гірськими стежками."
  KHA_melissa_lewis:0 "Мелісса Льюїс"
  KHA_melissa_lewis_desc:0 "«Я сумуватиму за татом і Папою, але якщо чесно – між Хаусом і НКР Мохаве було жахливим. А тут у нас є шанс.»\n\nМелісса – молода жінка, яку пустка не зламала, попри всі труднощі. Дочка Хана і солдата НКР, вона пройшла жорсткі випробування, щоб стати повноцінним Ханом. Відтоді вона була рейдеркою, мисливицею, кур’єркою, розвідницею, воїтелькою – ким завгодно. Мелісса мріє про славу – для себе й для Ханів.\n\nЗалишивши Мохаве та батька позаду, вона активно шукає своє місце серед північних Ханів. Вона вже змагається за лідерство у бойових загонах і знаходить споріднену душу в палкій Ессен. Вона не зрадить Реджиса, який повів їх на північ, але її цікавить лише слава й доказ власної сили."
  KHA_samool_name:0 "Самул"
  KHA_samool_desc:0 "«Дайте кілька дуп на копняка і пляшку віскі – мені вже нудно.»\n\nКоли Послідовники Апокаліпсису й Хани Амгалана мандрували пустками, їм не раз доводилося битися з бандами й племенами. Одного разу вони опинилися в облозі. Самул тоді був членом банди «Очегризів», чий ватажок зацікавився запасами каравану. Протягом року експедиція була заблокована в старих шахтах. Облогу зняв сам Амгалан, таємно напавши на табір ворогів і вбивши ватажка.\n\nДеякі Очегризи, вражені цим, приєдналися до Ханів (канібалізм довелось кинути). Самул став досвідченим ватажком. Проте йому не вистачає старого Амгалана."
  KHA_jack_name:0 "Джек"
  KHA_jack_desc:0 "«Чувак, треба щось? Підняти, приспати, зрівняти – я влаштую.»\n\nДжек – рідкісний тип серед Ханів: добродушний, розслаблений і талановитий хімік. Він – інь до янь своєї напарниці Діани. Відповідав за «добро» для Ханів Мохаве й клієнтів. Подорож на північ його не вразила, але він поважає Реджиса за витривалість. У Вайомінгу йому подобається: північні Хани – «норм чуваки», а спілкування з Послідовниками – приємне. Він не переймається майбутнім – головне, щоб бути з Діаною."
  KHA_diane_name:0 "Діана"
  KHA_diane_desc:0 "«Це місце має потенціал, але нових клієнтів треба знайти якнайшвидше.»\n\nДіана – передусім бізнесменка, хоч і може дати копняка. Вона – янь до інь Джека. Організовувала весь бізнес у Мохаве. Прибувши на північ, вона одразу почала будувати мережу клієнтів. Ідеально – якщо все залишиться як раніше: гроші тектимуть, бізнес працюватиме. Але врешті-решт вона погодиться на будь-що, що забезпечить комфорт їй і Джеку."
  KHA_anders:0 "Андерс"
  KHA_anders_desc:0 "Андерс був і є Ханом. Він здобув славу як найнадійніший наркокур’єр Діани. Разом із нею й Джеком вони тримають у руках левову частку наркоторгівлі Великих Ханів."
  KHA_jerry_the_punk:0 "Джеррі Панк"
  KHA_jerry_the_punk_desc:0 "Коли Джеррі був дитиною, Послідовники Апокаліпсису принесли книжки в Каньйон Ред-Рок. Джеррі годинами читав, особливо поезію, і врешті став поетом Великих Ханів – складаючи епоси про їхні перемоги."
  KHA_emma_winslow_name:0 "Емма Вінслоу"
  KHA_emma_winslow_desc:0 "«Я напівочікувала, що ми всі загинемо в дорозі або не знайдемо тут нікого. Але мені пощастило.»\n\nКоли Хани залишили Мохаве, більшість тільки зраділа. Але деякі – як Емма – побачили шанс. Вона знала про давню експедицію Послідовників і вирішила приєднатися. Допомагаючи пораненим, вона заслужила довіру Реджиса. У Вайомінгу вона нарешті знайшла живих Послідовників і подружилась із Амгаланом та Жюстін. Вона вміє працювати з технікою й мріє колись відновити радіовежу для зв’язку з південними гілками. А поки просто допомагає всім, чим може."
  KHA_falaya_name:0 "Фалая"
  KHA_falaya_desc:0 "«Подорож – це круто, але життя в дорозі переоцінене. Дайте мені шанс облаштуватися – і я вражу вас.»\n\nФалая народилась у дорозі, дочка ханки та члена племені, що давно зникло. Вона все життя кочувала, зупиняючись лише на рік-два. Але у Вайомінгу вона побачила шанс. Вона любить працювати руками, а будівництво довговічного дому стало для неї мрією. Фалая симпатизує Послідовникам і прагне навчитись у них усього, щоб залишитися тут і будувати нове життя."
  anders_lar_trait:0 "Андерс"
  KHA_barons_daughter_desc:0 "«Уявляю, як мій батько задихається від люті або в шоці. Ця думка завжди мене радує.»\n\nДочка покійного Барона з Ейрі, Анетт отримала помилування від Амгалана за рекомендацією Езекіеля. В обмін на життя та певні привілеї, вона погодилась підтримувати порядок у місті під новим управлінням. Їй огидне це приниження, але вона не дурна й грає за правилами. Тепер вона знову поруч із Езекіелем. Її зв'язки допомагають Ханам контролювати родини Ейрі, а ранчо й майстерні продовжують працювати, хоч і з новими умовами – робітникам тепер треба платити. Анетт також надала Ханам частковий доступ до шпигунської мережі свого батька."

