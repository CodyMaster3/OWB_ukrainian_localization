  kha_regis_wayles_advisor_tt:0 "§YВейлз Томас§! стане §Gкультурним радником!§!"
  kha_regis_fathers_tt:0 "§OХоча племені Чотирьох Отців кінець, Реджис зміг знайти одного з їхніх лідерів...§!"
  kha_regis_nit_tt:0 "§OОчевидно, що Ніітсітапі мають історію з Анклавом. Якщо ми підемо на війну, вони нам допоможуть!§!"
  kha_regis_nit_fall_tt:0 "§OХоча Ніітсітапі впали, їхній дух живе в нас!\n§!"

  kha_four_fathers_tt:0 "Запросити Чотирьох Отців до §YВогняної Ради§!.\nЯкщо вони були знищені – замість цього спрацьовує §Gподія§!, щоб зв’язатися з тими, хто вижив."
  kha_metal_mouths_tt:0 "Запросити Металічну Пащу до §YВогняної Ради§!.\nЯкщо вони були знищені – замість цього запросити §gСталевий Джо§! як §Gкомандира дивізій§!."
  khan_regis_jacksons_tt:0 "Запросити Джексонів до §YВогняної Ради§!.\nЯкщо вони були знищені – замість цього запросити §OНіл Джексон§! як §Gкомандира дивізій§!.\n\n§OЯкщо нам вдасться перемогти Макартур, ми віддамо землі Анклаву Джексонам як «законні землі їхньої родини».§!"

