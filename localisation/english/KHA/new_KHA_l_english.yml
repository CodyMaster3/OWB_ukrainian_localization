  khan_followers_established_bonuses_tt:0 "Цей модифікатор також буде надано всім націям у нашій §Cдипломатичній відстані§!, які прийняли §YПослідовників Апокаліпсису§!, а також усім теперішнім і майбутнім учасникам §1Опівнічного Союзу§!."
  khan_arrival_tt:0 "§gМохавські Хани тікають у Вайомінг, стаючи доступними як радники та командири.§!"
