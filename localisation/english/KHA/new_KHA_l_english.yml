  khan_regis_combine_new_khans_tt:0 "§OМи об'єднаємо ідеї §gСпадщина Ханів§! і §gДух Ханів§! у нову ідею, яка посилить бонуси від §gСпадщини Ханів§!§!\n\n"
  khan_regis_combine_spirit_tt:0 "§OМи об'єднаємо ідеї §gСпадщина Ханів§! і §gДух Ханів§! у нову ідею, яка посилить бонуси від §gДуху Ханів§!§!\n\n"
  khan_regis_promise_tt:0 "§OМи передамо землі Анклаву родині Джексонів, як і обіцяли. У відповідь вони віддадуть нам контроль над своїми старими територіями.§!"
