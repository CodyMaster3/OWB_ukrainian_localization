  kha_honours_pride_idea:0 "Еліта Гонор"
  kha_honours_pride_idea_desc:0 "Сентінел Гонор надала ханам своїх найкращих бійців. У відповідь хани призначили їх елітним авангардом для захисту батьківщини ханства."

  kha_followers_1:0 "Посилена співпраця з Послідовниками"
  kha_followers_2:0 "Дві сторони дуже дивної монети"
  kha_followers_2_desc:0 "Послідовники та Хани – не ті, кого очікували б побачити разом, але під уважним поглядом Амгалана неможливе стало можливим."

  kha_reflecting_on_old_times:0 "Пам’ятаєш, як було добре?"
  kha_reflecting_on_old_times_desc:0 "Колись хани були страшною бандою рейдерів – а тепер лише згадка в погано викладеній історії Нової Каліфорнії. Але у Вайомінгу ханство має шанс знову стати легендою..."

  kha_chem_addicts_crisis_debuff:0 "Хімзалежність Великих Ханів"
  kha_chem_addicts_crisis_debuff_desc:0 "Велики хани привезли з собою до Вайомінгу багато речей: травми, гнів, залежності... Все це потребує зцілення – або ж... може бути використане в чиїхось інтересах."

  kha_chem_lab_1:0 "Експерименти з хімією ханства"
  kha_chem_lab_2:0 "Операції з хімікатами ханату"

  kha_we_never_forget:0 "Ми не забудемо Каліфорнію"
  kha_we_never_forget_desc:0 "Скільки б не минуло часу, скільки б поколінь не змінилося, ненависть до Нової Каліфорнійської Республіки не зникне."

