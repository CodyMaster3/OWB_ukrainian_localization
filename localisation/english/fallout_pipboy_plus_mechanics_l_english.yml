  PIPBOY_PLUS_MECHANIC_TITLE_NIGHT_AT_THE_CAFE:0 "Ніч у кафе"
  PIPBOY_PLUS_MECHANIC_TEXT_NIGHT_AT_THE_CAFE:0 "§Y«То скільки тривав твій забіг цього разу?»§!\n\nПролунав знайомий голос, виводячи §MМаріанну§! з трансу.\n\n§M«Досить знущатися! Ти завжди заводиш цю пісню».§! Маріанна жартівливо вдарила §YНаталію§! кілька разів у плече. §M«Ти знаєш — ти, чорт забирай, знаєш... Ти майже ніколи не говориш по суті».§!\n\nПопри своє роздратування, §MМаріанна§! не могла перестати посміхатися.\n\n§Y«Це досі не відповідає на моє запитання...»§! — тепло відказала Наталія. Наталія пила те, що в кафе в розмовній мові називали пляшкою «Алкоголю-Z». Ніхто не міг «точно» визначити його на смак — просто суцільне ніщо.\n\nПроте Наталії це подобалося. З Міста Сховища ходить байка, що якщо пити його достатньо багато, може статися щось хороше.\n\nТим часом §MМаріанна§! повільно попивала холодний Мангеттен з віскі «Петарда». Вона знала його смак, навіть якщо ви — ні.\n\n§M«Три роки»,§! — неохоче відповіла вона.\n\n§Y«Лише три роки цього разу?»§!\n\n§M«Так, лише \"три\"!»§! — Маріанна роздратовано підняла пальці.\n\n§Y«Ти хоча б пройшла жителя Арройо?»§!\n\n§M«Пройшла його, але Восьмидесяті мене дістали».§!\n\n§YНаталія§! нахилилася ближче і підбадьорливо поплескала §MМаріанну§! по плечу. §Y«Не хвилюйся. Зрештою Карма дістане і його. Твоя черга настане, і то швидше, ніж ти думаєш».§!\n\n§M«-... Нат~... Ти все ще верзеш якісь нісенітниці».§!\n\n§Y«Просто продовжуй намагатися.\nКолись ти отримаєш свій шанс».§!"
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_1:0 "Журнал пустельного рейнджера 1"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_1:0 "§Y2269 — Січень — Новий журнал, те ж саме життя§!\n\nЯ перечитувала свій найперший запис у першому журналі, який я коли-небудь писала, і мені здається милим, що 18-річна Кейлін (досі без прізвища, ха-ха...) думала, що єдина причина вести журнал — це щоб люди знали, про що вона думала, коли вона коли-небудь стане знаменитою. Відомою чим? Серед кого? Забавно, наскільки ти відрізняєшся від тієї людини, якою була 10 років тому.\n\nЕббі така ж, якою була, коли ми познайомилися на базовій підготовці. Щодня вона береться за все, що потрібно зробити, а потім здається роздратованою, коли світ не стає повністю ідеальним після всього, що вона зробила. Генерал Варгас постійно каже їй, що звалювати весь світ собі на плечі — це шкідливо, і це звучить досить мудро. Але Ебігейл просто не може дивитися на речі так. Як вона може жити спокійно, знаючи, що десь когось ріжуть, грабують або перетворюють на раба? Я розумію її, хоча й хвилююся, що вона просто згорить, намагаючись полагодити світ самотужки.\n\nНещодавно вона отримала свою власну чорну броню. Нова маска й шолом дозволяють їй приховувати ту дурнувату посмішку, яка, мабуть, була на її обличчі, коли вона показувала її мені. Мені так не щастить здобути такий статус. З іншого боку, рейнджер Сагарра каже, що удачі не існує. Тож, мабуть, це моя вина.\n\nУ будь-якому разі, з новим роком, з новим журналом! Сподіваюся, я не заляпаю своєю кров'ю стільки ж сторінок, як у доброму старому випуску №3.\n\n— (Колись ветеран?) Рейнджер Кейлін.\n\nP.S. Так, я знаю, що зараз 2269 рік. Ха. Ха."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_2:0 "Журнал пустельного рейнджера 2"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_2:0  "§Y2269 — Лютий — Роздуми§!\n\nВ одному з наших патрулів рейнджер Кук знайшла справжнісіньку кіностудію біля Ту-Сан! Вона була досить засмучена тим, що більшість автомобільних запчастин на тій величезній парковці вже розграбували жителі Ту-Сан, тож я не змогла залишитися там надовго. Усе одно там майже не було нічого цінного. Ми розповіли про це місце рейнджеру Олдгейту, і він, здається, був у захваті. Він завжди говорив про те, щоб зняти фільм про Пустельних Рейнджерів і надіслати його до Каліфорнії.\n\nКоли я зайшла в одну з їхніх гримерок, там було ВЕЛИЧЕЗНЕ дзеркало. Воно змусило мене відчути себе такою маленькою, хоча, можливо, це тріщини й відсутні шматки робили відображення кумедним. Рейнджери мають бути великими та сильними ковбоями, але іноді я просто відчуваю себе так, ніби ношу одяг старшого брата, якого в мене немає. У найгірші дні мені здається, що я просто не створена для цього. Хотіла б я бути більше схожою на Еббі.\n\nГей, принаймні капелюх на мені виглядає круто!\n\nУ гримерці також був плакат із цією жінкою з макіяжем. Мені завжди було цікаво, як би я виглядала з ним. Шкода, що велика його частина, мабуть, радіоактивна, і мастити це на обличчя не рекомендується, поки не знайдеш лікаря, який переконається, що це безпечно. Але я впевнена, що була б дуже гарною з ним. Думаю, Еббі теж була б, якби я могла змусити її зняти цей модний новий шолом рейнджера.\n\nМені трохи сумно, що я більше не можу читати її емоції під цією маскою.\n\nПроте вона здалася мені досить похмурою, коли я згадала про свої мрії стати кінозіркою. У світі минулого моєю єдиною проблемою було б знайти на це гроші. А тепер я серед рейнджерів, б'юся з усіх сил за безпеку та гідність. Дехто навіть може сказати, що мені все ще дуже пощастило. Скільки людей навіть не мають вибору — боротися за щось більше, ніж вони самі? Скільки народжуються просто як раби чи зневірені старателі?\n\nВона просто лютувала, тільки-но думаючи про це. А мені просто ставало сумно. Ми не говорили про це довго. Хотіла б я, щоб ми обидві народилися в іншому світі. Можливо, в тому світі ми б просто переодягалися в рейнджерів, а не жили б як вони.\n\n— Рейнджер Кейлін, Кінозірка."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_3:0 "Журнал пустельного рейнджера 3"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_3:0  "§Y2269 — Лютий — Аризона§!\n\nПустельні Рейнджери спочатку прийшли з Невади, але ми пішли після того, як наші каліфорнійські колеги запевнили нас, що на заході все буде добре. Дехто з нас не дуже цьому довіряв, але в нас не було іншого вибору, окрім як повірити їм. До того часу, як ми пішли, рабство в Неваді та Каліфорнії було повністю викорінено. Це сталося завдяки нашим зусиллям, але також завдяки Новій Каліфорнійській Республіці та її власним рейнджерам НКР. Тим часом в Аризоні був суцільний безлад. Якби не ми, то хто б втрутився?\n\nЯ приєдналася якраз тоді, коли Пустельні Рейнджери збиралися покинути Неваду. Але технічно я була з рейнджерами все своє життя. Моя мама загинула від рук гадюк, коли я була маленькою, і мій батько в результаті дуже віддалився. Пустельні Рейнджери, які зупинялися в моєму маленькому містечку Даєр, були справді єдиними дружніми людьми, з якими я спілкувалася. Можливо, ще пара Послідовників Апокаліпсиса, але вони завжди здавалися досить виснаженими й перевтомленими, коли залишалися на ночівлю. До 15 років я вже допомагала рейнджерам як могла, а у 18 їм навіть не довелося питати, чи я приєднаюся. Вони просто відправили мене до рейнджера Холстадта в день мого повноліття.\n\nВони для мене як родина, Пустельні Рейнджери. Тож те, що я збираюся сказати, йде від щирого серця.\n\nЯ не знаю, чи все ми робимо правильно в Аризоні. Наш прихід безумовно покращив ситуацію, але в Аризоні все ще не дуже безпечно. Племена та громади постійно б'ються одне з одним, а рейдери все ще повсюди. Ми — добровольчі сили, тому не можемо охопити всю територію, яку хотіли б, і кожна громада та плем'я дбають лише про себе. Не кажучи вже про те, що більш «цивілізовані» міста потопають у розпусті та корупції. Це означає, що люди постійно голодують і опиняються на вулицях, і тому заради виживання вдаються до злочинності та набігів. Більше рейдерів означає, що люди при владі накопичують багатство, щоб захистити себе та свою сім'ю, замість того, щоб допомогти власному народу, який, на їхню думку, все одно може їх вбити.\n\nЦе, як називають це Послідовники Апокаліпсиса, «уроборос» страждань, що, очевидно, означає змію, яка ковтає власний хвіст, якщо ви не пам'ятаєте. (Я запам'ятала, тому я розумна).\n\nІ ось тут на сцену виходить Легіон. Хоча всі рейнджери, безумовно, не погоджуються одне з одним, ми знаємо, що ненавидимо легіон. Жорстокі вбивці-сексисти та работорговці, чиїми єдиними довгостроковими цілями є завоювання й диктаторський контроль, — це зовсім не те, що нам подобається. Але вони обіцяють людям *щось*. Вони обіцяють кудись рухатися! Навіть якщо це «кудись» — це тисячі років у минуле.\n\nРейнджери захищають нестабільний статус-кво. Ми не *змінюємо* Аризону, ми захищаємо людей. Просто так сталося, що деякі з цих людей безпосередньо відповідальні за цей безлад! Нам потрібно лікувати причину, а не симптом. Легіон хоче цього! Навіть якщо їхній план лікування причини полягає в тому, щоб відрубати всю руку до біса. Я не кажу, що ми повинні просто піти й повбивати тих, кого вважаємо відповідальними... Але... Аризона зламана, і будь-хто, хто тут виріс, може це побачити.\n\nНу, мене ніхто не слухає. Дідько, я б і сама себе не слухала. Легше говорити, ніж робити. Я навіть не уявляю, з чого б почати лагодити Аризону.\n\nАле я знаю, що одного дня, маючи трохи часу, співпраці та змін, ми могли б створити разом щось справді величне.\n\n— Аризонський Рейнджер, Кейлін."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_4:0 "Журнал пустельного рейнджера 4"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_4:0 "§Y2269 — Березень — По той бік річки§!\n\nМи відбили Гавасу-Сіті у якихось работорговців. У цьому районі все ще є дикуни, але вони знають, що ми прийдемо за ними, якщо вони колись знову поневолять іншу людину. Я вбила чотирьох із них. Мені здається, що легше ніколи не стає.\n\nЯ бачила кількох солдатів НКР по той бік річки Колорадо. Вони просто спостерігали, як ми самі робимо брудну роботу. Я не сказала цього вголос, але думаю, інші теж це бачили.\n\nРазом із країною з'являються кордони, а з кордонами — невидимі лінії, які не можна перетинати. Вони були занадто далеко, щоб ми могли розгледіти їхні обличчя, але я сподіваюся, що їх розривало між наказами та їхнім сумлінням. Я знаю, що будь-хто з работорговців, кому б вдалося перебратися через річку, відчув би на собі черевик НКР, але паршиво, що їм доводиться чекати, поки ті перетнуть уявну лінію. Люди повинні допомагати людям просто тому, що можуть. Особливо НКР! Хіба вони не були засновані після акту самовідданості?\n\nХоча НКР не така вже й погана. Дехто з нас хоче, щоб Пустельні Рейнджери приєдналися до них, і, чесно кажучи, я схильна погодитися. Ми живемо за рахунок пожертв і гостинності тих, хто нас оточує, але це швидко вичерпується, оскільки Легіон починає розповсюджувати про нас чутки й відкрито погрожувати всім, хто продовжує з нами співпрацювати.\n\nРейнджери НКР мають цілу країну, яку треба розбудовувати і яка їх підтримує. Уявіть, якби Аризона була однією країною, а не розрізненим місивом людей, які дбають лише про себе. Країною, яка б працювала разом і допомагала нам робити те, що необхідно! Саме це зараз відбувається в НКР, і я думаю, що це набагато стабільніше, ніж те, що відбувається з нами. Я втомилася грати роль посередника чи миротворця, коли в нас є значно більші проблеми.\n\nРейнджер Вудсон запевняє нас, що нам і так добре, але мені важко йому повірити, бачачи, скільки з нас працюють від світанку до заходу сонця, і я в тому числі. Всі ми так чи інакше бували в Каліфорнії, і це чудове місце з добрими людьми — набагато добрішими за тих, що живуть там, де ми зараз.\n\nУ них справді є здатність відштовхувати від себе, і я не можу цього заперечувати. Іноді рейнджер НКР кидає на нас дивний погляд, і нас часом називають анархістами або адреналіновими наркоманами. Їхні сенатори постійно називають нас лінчувальниками, які допомагають руйнувати Аризону та Мохаве. Ми просто хочемо допомогти, зрозуміло?! Якби НКР докладала більше зусиль для допомоги, а не намагалася скопіювати те, якими, на їхню думку, були Сполучені Штати, можливо, нам усім було б краще.\n\nПісля битви за Форт-Ебендон я бачила, як у генерала Варгаса почався напад кашлю. Вік бере своє, навіть якщо він це заперечує. Нам справді потрібна допомога — або в Аризоні, або з боку Каліфорнії.\n\nЗ того, що я чула, цей шеф Генлон здається непоганим хлопцем. Б'юся об заклад, я змогла б умовити його допомогти нам.\n\n— Амбасадор Кейлін."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_5:0 "Журнал пустельного рейнджера 5"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_5:0 "§Y2269 — Травень — «Кай-Тсар»§!\n\nХоча ми роками воювали з Легіоном, у нас ніколи не було справжньої повномасштабної війни. Гадаю, обидва наші керівництва розуміли, що це призведе до взаємного знищення. Легіон Цезаря — це просто зграя дикунів у спідницях, і, наскільки нам відомо, вони досі не такі професійні, як ми. Але ми також занадто нечисленні. Недостатньо людей для вторгнення. У минулому ми намагалися створити об'єднаний фронт Аризони, але багато племен і міст не захотіли довірити нам свої армії. Багато хто з них вважав, що Легіон нічим не відрізняється від будь-якого іншого племені, або вірив, що з ними можна домовитися, або ж вважав наші попередження цинічним «нагнітанням страху». Дехто навіть звинувачував нас у бажанні об'єднати Аризону під своїм прапором, а не віддати її Легіону.\n\nБоже, як би я хотіла, щоб вони мали рацію!\n\nАризона є, чи то пак була, таким розмаїтим місцем. З роками все більше племен і поселень повністю зникли під прапором Легіону. Щороку ми просимо Аризону долучитися грошима, припасами та, можливо, армією, яку ми могли б зібрати, щоб зупинити їх, але щороку Аризона відмовляє. Вони більше переймаються власною дрібною племінною кровною помстою або ж продають своїх людей за копійки.\n\nТепер залишилося так мало місць, що здається безнадійним навіть просити. Але генерал Варгас наполягає, щоб ми спробували згуртувати Аризону для самозахисту, навіть зараз.\n\nЛегіон прийде за нами вже незабаром, я думаю, це лише питання часу. Але зло ніколи не переможе. Західна Аризона сильно відрізняється від інших земель Легіону. Я впевнена, що тут ніхто ніколи не поведеться на цю балаканину ультранаціоналістичного тирана.\n\nГадаю, мені скоро доведеться навідатися на стрільбище.\n\n— «Короткий постріл» Кейлін"
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_6:0 "Журнал пустельного рейнджера 6"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_6:0 "§Y2269 — Червень — Де є дим...§!\n\nМи зловили кількох шпигунів на пагорбі, з якого видно Цитадель Рейнджерів. Коли ми запитали, що вони тут роблять, вони не дали нам чіткої відповіді. Я хотіла отримати зрозумілі пояснення, але рейнджер Моралес незабаром вишиб їм мізки. Я була розлючена, але Моралес показав записки, знайдені на їхніх тілах. Вони були написані латиною і містили деталі наших патрулів та приблизну чисельність. Ми навіть знайшли малюнок Кінгмана та Цитаделі. Напевно, вони не помітили, як ми поверталися з патрулювання. Виявляється, бажання помилуватися мальовничим маршрутом рятує життя. Моралес зазначив, що в них було заплетене волосся в стилі старого племені з Аризони — Скрученого Волосся. Вони були не найприємнішими людьми, але все ж не заслуговували на те, що з ними сталося. Він підозрював, що ці шпигуни колись належали до цього племені.\n\nПісля того, як ми доповіли про це, мене відправили в патруль. Самотні патрулі рейнджерів — це не така вже й рідкість. Сольні виходи дозволяють нам розосередитися та піти в підпілля. Ми настільки спеціалізовані, що один із нас вартий двадцяти супротивників, з якими ми стикаємося. Принаймні ті, хто прослужив тут достатньо довго. Можливо, не новобранці — їм потрібні напарники. В одному з таких одиночних патрулів я побачила людей, розіп'ятих на I-40.\n\nВони були прибиті до телефонних стовпів з табличками, на яких вказувалися їхні злочини. Деякі нібито були наркоторговцями, рейдерами чи корумпованими чиновниками, але на багатьох було просто написано «розпусник». Їх залишили гнити і стікати кров'ю на сонці. Деякі з них були ще живі, вони благали мене зняти їх, але їхні стогони страждання лише привернули увагу патруля легіонерів. Я побігла, не забуваючи відстрілюватися зі свого пістолета через плече. Здається, я влучила в кількох із них, але вони зачепили мій капелюх. Тепер він виглядає так, ніби мені вистрілили в голову. Це крутий трофей, доки не згадаєш, наскільки близька я була до того, щоб не побачити наступного дня.\n\nНе думаю, що я колись забуду цей день. Не кажучи вже про голови на палях, які Легіон постійно розставляє. Що ще гірше, на багатьох із них були шоломи рейнджерів або капелюхи, схожі на мій.\n\nНаступного ранку Цитадель Рейнджерів зустрів чоловік, який надривався від крику знадвору. На його шиї був вибуховий нашийник, і він виглядав розпатланим та наляканим. Він почав кричати про те, що Легіон позначив усіх нас як мішені для смерті, і що ми маємо 24 години, щоб залишити територію і вирушити до Каліфорнії, інакше на нас чекає відплата. Він заявив, що наші злочини проти Легіону не залишаться безкарними, і що землі, які ми дозволили «довести до зубожіння та виродження», тепер знаходяться під їхнім наглядом. Це було оголошення війни, чистої води. Перш ніж ми встигли знайти рейнджера, щоб знешкодити бомбу на його шиї, нашийник почав швидко пікати, як гатлінг-лазер. Незабаром він вибухнув і залишив криваву кашу по всій підлозі.\n\nЯ не боюся Легіону. Якщо я це запишу, значить, це правда.\n\nОчевидно, це був рейнджер з нашої експедиції в Нью-Мексико, тож ми можемо припустити лише найгірше для них. Того ж дня генерал Варгас зібрав усіх нас в одній кімнаті та пояснив ситуацію. Легіон наступав, і нам потрібно було вдарити по них усім, що в нас є, інакше ми ризикували втратити всю Аризону. Наші основні сили мали вирушити околицями території Легіону та спробувати захистити інші племена Аризони. Команди, більш орієнтовані на переговори та розвідку, відправляться до поселень, щоб просити їхньої допомоги у війні. Ополчення Країни Ковбоїв і найманці Кінгмана, безперечно, змогли б допомогти переломити хід подій проти чисельної переваги, яку визнавав Легіон. Рейнджери — це добровольчі сили, а Легіон, здається, мобілізує кожного хлопця, здатного битися за їхню справу, добровільно чи ні.\n\nКінгман був найближчою ціллю в той день, коли Легіон «оголосив нам війну». Майже відразу після заяви з вибуховим нашийником прибули легіонери й спустошили Кінгман. Однак у них не було достатньо солдатів, щоб утримати місто, тому вони відступили, щойно побачили наше наближення. Кінгман завжди нас ненавидів. Ми заважаємо їхньому «способу життя», їхньому праву жити розпусно і розкішно. Ми, своєю чергою, ненавидимо їх. Ми знаємо, що вони займаються торгівлею людьми й приховують від нас організовану злочинність, ми просто не можемо цього довести. Тож мені довелося приховувати посмішку, коли їхній слизький маленький мер благав генерала Варгаса на колінах допомогти йому захистити Кінгман. Хотіла б я побачити це знову.\n\nМи бачили снайперів Навахо, які прикривали сили легіонерів, тому не могли завдати превентивного удару по території Легіону. Ці перевертні просто позносили б нам голови ще до того, як ми б наблизилися до будь-якого табору Легіону.\n\nЯкби те, що залишилося від Аризони, розуміло, що для них краще, вони б приєдналися до нас у боротьбі за всі наші свободи. Разом.\n\nЯ справді сподіваюся, що кожен тут діятиме у своїх найкращих інтересах.\n\n— Рейнджер Кейлін"
PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_7:0 "Журнал пустельного рейнджера 7"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_7:0 "§Y2269 — Червень — Вогонь.§!\n\nПротягом тижня Легіон надіслав армію. Розлючену, незліченну. Їхні табори стояли, мов потворна червона стіна, що оточила Кінгман. Вони навіть не намагалися приховати свою присутність чи неминуче вторгнення в місто. Усе, що нам залишалося, — це окопатися й підготуватися. На кожного рейнджера припадало, напевно, по двадцять легіонерів.\n\nКоли вони кинулися на нас, я відчула, як земля здригається від їхнього тупоту. Кулеметні гнізда допомогли відбити перші хвилі, але кулі в них були не нескінченні. А коли вони в нас зрештою закінчилися, Легіон, ніби знаючи це, кинув на прорив нашої оборони своїх ветеранів.\n\nДеякі легіонери також пробралися через каналізацію Кінгмана. Я дізналася про це на своїй лінії оборони лише тоді, коли рейнджер Сото, який стояв поруч, отримав удар мачете в груди зі спини. Легіонер поранив мою ліву руку, коли я вихопила револьвер. Я все одно помстилася за Сото, але мені довелося зістрибнути з барикад, щоб врятуватися. Здається, я вивихнула щиколотку, але це було краще, ніж потонути у зростаючому цунамі легіонерів, яке нас накривало.\n\nКоли ми відступили на нашу останню лінію оборони, генерал Варгас не здавався надто стурбованим. Побачивши мене, він майже одразу підвів Еббі. Він попросив нас перейти на нову позицію і прикривати одна одній спину. Він попередив нас, щоб ми пильнували їхнього «Легата». Я не мала уявлення, про що він говорить. Ебігейл натомість хотіла, щоб ми дали відсіч, організували контратаку, а не дозволяли загнати себе в кут, але в очах Варгаса щось було. Він нічого їй не сказав, але щойно вона перехопила цей погляд, то випросталася й повела нас на нашу позицію.\n\nНевдовзі ми познайомилися з тим самим «Легатом Вулканом», про якого нас попереджав Варгас. На ньому був власний комплект Силової Броні, але, вочевидь, оздоблений у стилі Легіону. Решта Легіону, здавалося, зневажливо ставилася до технологій, і я думаю, що силова броня входила до цього списку. Можливо, «Цезар» зробив виняток для такої вправної особи, яка запропонувала йому свої послуги. Він проривав наші лінії, і ми чули криваву бійню по раціях. Чути крики всіх цих людей було справжнім пеклом.\n\nОцінюючи ситуацію в Кінгмані, було зрозуміло, що ми майже в оточенні. Я думала про те, щоб втекти, але Ебігейл навіть не здригнулася, коли побачила наближення наступної хвилі Легіону, тож я залишилася поруч із нею.\n\nВиявивши, що ми перебуваємо на наших останніх позиціях, Легат Вулкан прибув у повній силі, зі своїм власним підкріпленням центуріонів. Він скористався моментом, щоб проголосити, що Пустельні Рейнджери — це п'явка на тілі Аризони. Що ми зробили її занадто розніженою, м'якою та жадібною, і що всі ми помремо цього дня. Наші кулі безпорадно відскакували від його Силової Броні, коли ми намагалися змусити його замовкнути. Від його гучномовців у нас ледь не пішла кров із вух. Незабаром Легіон прорвав останні барикади, і Ебігейл потягла мене до мерії Кінгмана, перш ніж я встигла перетворитися на криваве місиво під ударами бензопил.\n\nВідчувши, що ми починаємо панікувати, рейнджер Андерсон згуртував усіх нас і наказав тримати хол. «Наш козир майже тут!» — сказав він. Лише тепер я зрозуміла, що хибила під час стрільби, бо все моє тіло тремтіло. Здається, я вижила лише тому, що трималася разом зі своїми товаришами-рейнджерами. Ебігейл, здавалося, не хвилювало, якщо її броню прострелять — це просто давало їй напрямок для вогню у відповідь.\n\nНевдовзі Легат знову наблизився до нас, а в моєму револьвері залишалося лише 6 патронів. Моєї гвинтівки важільної дії давно вже не було. Я десь її випустила й більше не бачила. Ми витратили на нього решту нашої вибухівки та бронебійних патронів, а він усе одно продовжував бігти. Це було безумство. Він навіть переступав через трупи власних людей, аби тільки вбити нас усіх. Коли мій револьвер клацнув, сповістивши, що він порожній, у мене перехопило подих. Я справді думала, що помру, коли побачила, як він ступає на перші сходинки мерії Кінгмана.\n\nЯкщо я не бачила наближення бойового автобуса рейнджерів, то Легат і поготів. Він увірвався вулицями міста і врізався прямо в нього. Якби не сходинки, його б розплескало під ним, як млинець. На жаль, того дня «Стара Слава» здійснила свою останню поїздку. Автобус був повністю розбитий, але він залишив Легата в кратері на мармурових сходах. Перш ніж цей виродок у Силовій Броні встиг зробити ще бодай щось, Ебігейл схопила антиматеріальну гвинтівку, втиснула її дуло йому в шолом і вистрілила. Після цього решта легіонерів кинулася навтьоки. Не те щоб їм було легко тікати.\n\nХеллрейзор і Вудсон очолили окремі штурми, щоб перекрити Легіону шляхи відступу з Кінгмана, а команді Анджели вдалося відбити наші пагорби й повернути снайперські групи. Пам'ятаю, як я підібрала якусь зброю з землі й побігла в контратаку.\n\nБуло так багато мертвих. Ми, мабуть, знекровили Легіон. Зазнати таких втрат за такий короткий проміжок часу — це катастрофа навіть для довоєнної армії. Було б нерозумно з боку Легіону не попросити миру після такої величезної невдачі.\nУ мене трохи паморочиться в голові. Думаю, мені варто здатися лікарю.\n\n— Пацієнтка (в обох сенсах) рейнджер Кейлін"
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_8:0 "Журнал пустельного рейнджера 8"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_8:0 "§Y2269 — Серпень — Гординя§!\n\nГенерал Варгас був героєм серед героїв, але після Кінгмана ми дізналися, що його поранили в бік. З огляду на його і без того слабке здоров'я, у нас не було іншого вибору, окрім як попросити його залишити посаду Генерала Рейнджерів і відновити сили. Було вирішено, що Генералом Рейнджерів стане рейнджер Вейд Вудсон. Вудсон — розсудлива людина, і Варгас, здавалося, був задоволений нашим вибором.\n\nЗ нагоди підвищення майже не було жодних урочистостей. Натомість Вудсон зібрав нас у Кінгмані й сказав усе прямо. Хоча наша оборона міста була хороброю, нам усе одно довелося кинути багатьох рейнджерів на захист лише для того, щоб компенсувати різницю в чисельності. Поки ми билися, наші фланги залишалися відкритими, і ще більше поселень та регіонів впали під натиском Легіону. Не кажучи вже про втрати, яких ми зазнали під час захисту Кінгмана. Кінгман присягнув на вірність нашій справі, але хіба це не занадто мало і занадто пізно? Їхні найманці давно розбіглися, а в нас немає часу тренувати й без того спустошене населення. Якби Кінгман готувався до війни раніше, як це робили ми, можливо, вони змогли б нам допомогти. Тепер ми можемо використовувати хіба що запаси та спорядження Кінгмана.\n\nТим часом Ту-Сан усе ще відмовлявся нам допомагати. Вони вірили, що зможуть битися з Легіоном самостійно. Очевидно, вони знали, що він [Цезар] був колишнім членом Послідовників Апокаліпсиса, і думали, що ми просто відчайдушно намагаємося створити ворога, щоб об'єднати Аризону під своїм прапором. Країна Ковбоїв також відмовила. Вони сказали, що ми не зможемо їх захистити, і що їхнє приєднання лише ще більше розлютить Цезаря. Ми могли б використати їхні ополчення для захисту наших флангів, але, схоже, вони радше віддадуть себе на завоювання.\n\nПісля цього в кімнаті запала тиша. Ми залишилися в Аризоні самі. Якщо Легіон не проситиме миру, перед нами постане неймовірне завдання — битися за всю Аризону самотужки. Від Легіону не надходило жодних посланців. Я думаю, що в глибині душі всі ми знали, що станеться далі.\n\nЛегіону знадобився лише тиждень, щоб повернутися в Кінгман.\n\nНова армія, ще більша за попередню, очолювана чоловіком, відомим як «Легат Мальпаїс». Після всього, що ми зробили, після життів, які ми втратили, після людей, яких ми вбили, здавалося, що Легіон взагалі нічого з цього не відчув. Вони напали на нас опівдні, ніби знущаючись і показуючи, що навіть у наші найкращі години ми не здатні врятувати Аризону.\n\nМи навіть не встигли по-справжньому усвідомити те, що бачили — другу повністю мобілізовану армію. Вони мчали на нас без жодного глузду чи жалю, ще одна нездоланна хвиля легіонерів, від якої рейнджерам доводилося відбиватися. Вони прорвали нашу оборону. Дехто з них не зупинявся ні на мить — вони просто починали рубати й різати все, що бачили, аж поки куля не зупиняла їх. У Кінгмані не вистачало боєприпасів, щоб ми могли протриматися так довго, як першого разу, а тепер з'явилися ще й передові загони Легіону, які вистежували наші спроби взяти їх у кліщі, тож наша стратегія заманювання та оточення більше не спрацювала б. Бідні рейнджери, які під час нападу перебували на околицях Кінгмана, мабуть, зазнали жорстоких страждань.\n\nГенерал Вудсон наказав евакуювати місто, але кілька рейнджерів порушили наказ і залишилися, щоб утримувати це місце до останнього. Легіон просто пішов би слідом за нами, якби ми всі пішли. Вудсон не став із ними сперечатися. Нам довелося поспіхом вибиратися — звісно, спочатку цивільні, але в цьому поспіху ми, мабуть, залишили там стільки людей і припасів.\n\nЕбігейл ледь не залишилася разом з іншими. Мені довелося переконувати її не робити цього. Вона послухала мене лише тоді, коли я впала у відчай і почала благати.\n\nТікаючи з міста разом з усіма цивільними, яких ми змогли забрати з собою, ми почули страшенний вибух, після чого Кінгман затих. Це найкраща смерть для рейнджера — у полум'ї слави.\n\nШкода лише решту з нас, кому доводиться жити у світі після цього.\n\n— Та, що вижила, Кейлін"
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_9:0 "Журнал пустельного рейнджера 9"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_9:0 "§Y2270 — Січень — Смерть.§!\n\nУчора рейнджер Кук запитала мене, як би я хотіла бути похованою. Вона просто намагалася розрядити атмосферу, але я справді не змогла їй відповісти. Я не змогла придумати навіть жарт. Вона одразу ж перепросила. Очевидно, останнім часом у мене був такий похмурий вигляд, що вона захотіла мене підбадьорити. Я видавила з себе посмішку, щоб їй стало легше, але мені не стало. У той момент ми ховали рейнджера Матіаса.\n\nОстаннім часом у мене не було часу оновлювати цей журнал. Навахо відстрілюють нас по одному, а Легіон робить усе так, що нам ніде сховатися. Прес-Кіт впав не так давно. Ми допомагали їм відбивати облогу, але шпигуни посіяли розбрат і сумніви серед захисників міста. Ми нічого не могли вдіяти з дезертирством і зрадою. Рейнджера Тайко і його дитини більше немає. Ніхто навіть не знайшов у собі сил відчути через це гіркоту.\n\nБільшість торговців і найманців покинули місто, коли ми увійшли до Прес-Кіта. Коли почалася битва за оборону міста, прибув Легат Мальпаїс і змусив решту міських захисників буквально накласти в штани. Рейнджер Андерсон казав, що він «не вартий і ламаного гроша» в тактиці, але він усе одно уникнув усіх планів замаху, які розробив Андерсон. Бомби, отрута, пастки... коли ми спробували навести на нього снайпера, Легат Мальпаїс, вочевидь, подивився прямо в приціл і сам запропонував йому вистрілити. Мабуть, після цього в рейнджера забракло духу це зробити, оскільки Легат Мальпаїс і досі сіє хаос.\n\nКоли Легат Мальпаїс прибув до Прес-Кіта, він заявив, що полонених не буде і що ми відчуємо на собі гнів Марса та Легіону за те, що затримуємо виконання волі Цезаря. Не було жодних хитромудрих методів — він сам проривав наші барикади й вбивав усіх, хто ставав йому на шляху. Ебігейл спробувала кинути йому виклик, але він вихопив зброю першим. Вона отримала три постріли з пістолета в груди. Револьвер Ебігейл вистрілив у повітря. Її броня прийняла на себе більшу частину удару, тому коли я відтягнула її, вона змогла підвестися. І все ж Прес-Кіт став для Легіону значно легшою перемогою, ніж Кінгман. Багато ополченців навіть виступили проти нас, коли прийшов Легіон. Виродки. Сподіваюся, їм сподобаються розп'яття, які на них чекають за те, що вони «пси без честі» або щось у цьому роді.\n\nБагато наших ветеранів було вбито. Решта з нас отримали надто серйозні поранення, щоб продовжувати бій. Генерал Вудсон наказав знову відступати.\n\nЦе сталося в листопаді 2269 року. Я не могла написати про це, бо ми так довго воювали. Тепер я вся в бинтах і шрамах, а ноги постійно болять. Мені здається, що я можу впасти будь-якої миті. Ебігейл наче звір, доведений до божевілля. Я постійно бачу на полі бою рейнджера Ебігейл Лі, але я більше не бачу Еббі. У ті рідкісні моменти, коли нам вдається поговорити, я просто ламаюся перед нею, плачу, а вона мовчить. Іноді вона мене обіймає, але я щоразу відчуваю на ній запах крові та бруду. Це лише нагадує мені про пекло, яким зараз стала пустеля Аризони.\n\nЯ вбила стільки людей, я втратила стільки друзів. Щоразу, заплющуючи очі, я просто бачу їх. А Легіон це навіть не хвилює. Думаю, вони цим насолоджуються. Після кожної перемоги вони виставляють на показ людей, яких я люблю, як якісь хворі декорації. Шибениці, хрести, або просто голови на палях. Я чула, що вони навіть не завдають собі клопоту закопувати братські могили, які самі ж створюють.\n\nНайбільше мене лякає те, що, швидше за все, нікому не буде до цього діла. Що ми просто помремо тут, а світ продовжить обертатися. Ніхто не знатиме наших імен, і нікому не буде до нас жодного діла, коли ми зникнемо. Те, що накоїв Легіон, — немислимо, і, можливо, ми так і не зможемо віддати їм по заслугах.\n\nГенерал Вудсон попросив Ебігейл і мене вирушити до Каліфорнії, де знаходиться НКР. Він не міг відправити нікого іншого. Всі інші надто цінні, щоб залишати передову, або надто недосвідчені, щоб відбитися від Легіону на шляху до Каліфорнії. Вудсон приватно сказав мені, що боїться, що Ебігейл починає втрачати себе на цій війні.\n\nІноді, коли ми говоримо, я чую в Ебігейл ту саму Еббі, яку я знаю. Вона все ще здається дуже стурбованою долею Аризони та Пустельних Рейнджерів, і в ті рідкісні моменти, коли вона говорить, це лише про такі речі. Я розумію, Пустельні Рейнджери — це все для нас, весь наш світ. Але чи не егоїстично з мого боку хотіти повернутися до тих людей, якими ми були? Просто побути Лін та Еббі на якийсь час?\n\nЯ більше не можу спати. Ебігейл теж. У ті рідкісні випадки, коли ноги відмовляють і ми змушені розводити вогонь, ми часто сидимо мовчки. Ми кажемо одна одній, що потрібно постояти на варті, але Легіон зовсім перестав з'являтися на нашому шляху. Ми просто не можемо відпочити.\n\nАризона розраховує на нас. Здається, що Легіон нескінченний, але вони не можуть продовжувати так вічно. Якби прибула НКР зі своєю величезною армією та економікою, ми б назавжди покінчили з цією загрозою.\n\nМи не підемо тихо.\n\n— Посланець Кейлін.\n\nСоняшники. Я хотіла б бути похованою серед соняшників."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_10:0 "Журнал пустельного рейнджера 10"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_10:0 "§Y2270 — Лютий — Відчай§!\n\nВони сказали ні.\n\nВони відмовили. Я не можу в це повірити, я вимовила це вголос, я записала це. Може, я щось наплутала? Мабуть, так і є. Це страшний сон або невдалий жарт, у якому я беру участь. Вони сказали ні.\n\nПринаймні нас сприйняли серйозно. Коли ми розмахуючи прапором наблизилися до найближчого аванпосту НКР, солдати, що там служили, переправили нас через річку Колорадо. Вони відвели нас до генерала Аарона Кімбола, який був там розквартирований. Очевидно, НКР готувалася до війни з дикунами та рейдерами, щоб утихомирити Пустку Мохаве. Він швидко сказав нам, що нічим не може допомогти. Він цього не вимовив, але знав, що ми подолали весь цей шлях даремно. Він навіть не роздумував над цим.\n\nВін звалював провину на купу речей. Конгрес повинен дати згоду на військове втручання, східна Аризона не є юрисдикцією Каліфорнії, йому доведеться мобілізувати країну для такої масштабної війни. Вони все ще приходили до тями від внутрішньої війни проти Братства Сталі, тож як би вони відреагували на війну проти такого величезного титана, як Легіон?\n\nЕбігейл втратила будь-яке терпіння. Вона розповіла йому, яку загрозу несе Легіон, розповіла про масові вбивства, свідками яких ми були, про новостворену імперію рабства, знищення культур, мов, домівок. Про злочини проти людства, які Легіон вже скоїв і, без сумніву, продовжуватиме чинити в Аризоні. Коли вона кричала на нього, на обличчі генерала Кімбола на мить промайнув вираз внутрішнього конфлікту, але він усе одно не поступився. Очевидно, він знав про все це від самого початку. Ще до того, як почалася війна проти рейнджерів.\n\nЯкийсь чоловік на ім'я Білл Келхун прибув до НКР біля річки Колорадо і почав попереджати всіх у Каліфорнії про підйом Легіону. Він розповів їм про злочини, які скоїло плем'я Чорноногих заради створення Легіону, та про нову ультранаціоналістичну державу Легіону, яка планувалася в Аризоні. І після всього цього вони не зробили абсолютно нічого. Вони були надто зосереджені на Мохаве та «власному внутрішньому розвитку». Ебігейл мало не задушила генерала Кімбола до смерті прямо там, але, на щастя, його охоронці були напоготові, і вона відступила. Я попросила трохи припасів. І знову — ні. Війська НКР не можуть зайти глибше в Аризону і покинути свої кордони без схвалення Конгресу. Ми були всього лише двома рейнджерами. Ми не змогли б самі донести припаси до Цитаделі.\n\nЯ попросила покликати Шефа Генлона з Рейнджерів НКР. Генерал Кімбол прямо сказав, що Генлон теж нікого не пошле в Аризону, але ми все одно наполягали. Кімбол направив нас до табору рейнджерів Генлона. По дорозі я намагалася поговорити з Ебігейл, але вона була готова вибухнути. Вона просто бурмотіла щось, що через її шолом було неможливо розібрати чи почути. Ми обидві знали, що скаже Генлон, коли ми до нього дійдемо, але все одно пішли. Ось наскільки жорстокою може бути надія.\n\nІ нічого дивного, Генлон теж не міг нічого й нікого послати. Проте він виглядав набагато більш співчутливим. Найменше, що міг зробити генерал Кімбол, — це хоча б удати смуток через те, що ми подолали такий шлях даремно. Він сказав, що не може ризикувати життями своїх рейнджерів без підтримки НКР. Не кажучи вже про логістику проникнення в саму Аризону. Для такої великої операції йому потрібна була б підтримка всієї НКР. Він говорив так, ніби дії всупереч наказам НКР не виключені, але це було б безглуздим рішенням, якби він справді на це пішов.\n\nВін пообіцяв нам медикаменти та припаси для зворотної дороги. Його війська їх не понесуть, ні. Ми просто візьмемо все необхідне для нашої подорожі. Замість допомоги нам запропонували, щоб Пустельні Рейнджери приєдналися до НКР — можливо, ми змогли б реформуватися й у майбутньому підштовхнути країну зсередини до відвоювання Аризони. Ймовірно, це наш найкращий шанс вижити, щоб боротися далі.\n\nЕбігейл пішла геть без жодного слова. Вперше я була рада, що на ній цей шолом, і мені не довелося бачити, наскільки їй було боляче.\n\nМи повертаємося до Цитаделі, і я не маю жодного уявлення, що робити. Що ми скажемо хлопцям удома? Пустельні Рейнджери залишилися самі. Тільки ми можемо врятувати Аризону.\n\nЯ тремчу.\nЯ не хочу помирати.\n\n— Рейнджер Пустки, Кейлін."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_11:0 "Журнал пустельного рейнджера 11"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_11:0 "§Y2271 — Червень — Злий, хворий, жорстокий світ.§!\n\nЦей журнал був у мене близько року. Я не могла змусити себе його прочитати. Не могла навіть дивитися на нього. Тому що, дивлячись на нього, я думаю лише про неї. Літає в хмарах, пише у своєму дурному журналі. Коли вона ловила мій погляд, завжди сміялася з того, що мені так цікаво. Вона ніколи не давала мені його читати. Навіть попри те, що, отримавши свій перший журнал, казала, що всі його прочитають, коли вона стане «знаменитою».\n\nМене було недостатньо. Нічого не було достатньо. Цьому світу нічого не достатньо. Якби ж тільки світ міг насититися болем, який він завдає сам собі, який завдає мені. Світ мав би перестати обертатися, коли він забрав рейнджера Кейлін.\n\nЯ робила все, що могла. Я спала десь по три години (шість, якщо пощастить) щодня відтоді, як Каліфорнія відмовила нам і звалила тягар зупинки Легіону виключно на нас. Вони просто спостерігали за нами по той бік річки Колорадо, дивилися, як ми безпорадно корчимося в агонії. Ми знали, що довго не протримаємося. Ніхто не прийшов нам на допомогу, ніхто не врятував. Ніхто не любить приєднуватися до сторони, що програє. \n\nНезабаром у нас залишилася лише Цитадель і річка за спиною.\n\nГенерал Вудсон стягнув усіх рейнджерів у Цитадель. Він залишив решту наших земель напризволяще, так само як і нас покинули. Ми залишили лише невеличку шпарину для відступу через річку в Мохаве, якщо такою справді мала стати наша доля. Це було наше найкраще укріплення і найкраще забезпечена зона. Якщо впаде Цитадель, впадуть і Пустельні Рейнджери. Варгас і Анджела мали евакуювати стільки цивільних до Каліфорнії, скільки зможуть. Битва за Цитадель Рейнджерів мала бути настільки масштабною, що це, ймовірно, відвернуло б увагу Легіону від міст, дозволивши нашій евакуаційній команді забрати якомога більше людей до Каліфорнії.\n\nУсім іншим Вудсон дав останній шанс піти, зберігши свої життя. Ми могли б покинути Цитадель, як Клентон, і жити далі, щоб розповісти цю історію. Жоден із нас цього не зробив. Я пам'ятаю, як стояла в тому натовпі рейнджерів, і Кейлін схопила мене за руку. Здавалося, бажання втекти було для неї як вітер, що міг здути її будь-якої миті. Я тримала її, і вона залишилася.\n\nУ свої найслабші моменти я шкодую, що не втекла разом із нею.\n\nПротягом двох місяців ми стримували їх з усіх боків. На цьому етапі битва навіть не була стратегічною. У глибині душі всі ми знали, що Аризона втрачена. Легіон також розумів, що ми не маємо жодних шансів. Вони просто хотіли знищити останній символ старої Аризони.\n\nВаргас і ті, хто евакуювався, не повернулися по нас. Через тиждень ми втратили зв'язок, і вони залишилися в Каліфорнії. Ми залишилися в Аризоні й у Цитаделі. Так було краще. Вони б просто змарнували свої життя.\n\nОднієї ночі, перед тим, як ми мали повернутися на зовнішній периметр Цитаделі та знову кинутися в бій, Кейлін попросила мене зняти шолом. Вона сказала, що сумує за нами — такими, якими ми були стільки років тому. Вона сказала, що просто хоче знову побачити моє обличчя і чітко почути мій голос.\n\nПам'ятаю, як вона плакала, і це був найжахливіший звук у світі. Той розпач у її очах, те, як міцно вона мене обіймала. Я пам'ятаю все це так, ніби воно випалене в моєму розумі розпеченим залізом. Я пам'ятаю, як мені хотілося просто померти тоді і там. Мені хотілося просто померти й забрати весь цей гнилий світ із собою.\n\nЛегіон нарешті прорвався тієї ночі. Місто навколо палало, і решту з нас загнали всередину, у глибший комплекс Цитаделі. Поки я прикривала наш відступ, хтось кинув у мене гранату. Я відкинула її ногою, але мене все одно відкинуло вибухом. Кейлін і той, хто був із нею в той момент, помітили це, і замість того, щоб бігти з іншими, вона зламала стрій і побігла за мною. Я мала б крикнути їй, щоб вона тікала, щоб залишила мене помирати.\n\nКрізь град куль вона пробралася, щоб підняти мене. Було щось таке, що руйнувало світ, коли я подивилася в її напружені й налякані очі. Я не знаю, чи вона боялася за себе, чи за мене. В ту мить я лише зрозуміла, що більше не хочу цього бачити.\n\nЯ сказала їй іти, а вона відповіла, що ніколи мене не покине. Вона відкрила рота, щоб сказати щось ще, але я не встигла цього почути. Я була змушена дивитися, як дві кулі обірвали її життя, коли вона стояла до мене спиною. Нас накрила хвиля багрянцю. \n\nЯ хотіла залишитися з нею, але змогла забрати лише її журнал. Тріппі відтягнув мене. Легат Мальпаїс продовжував переслідувати нас усе глибше в Цитадель, і мене нудить від думки про те, як вони просто топталися по її тілу під час гонитви, навіть не замислюючись.\n\nВудсон розповів нам, що рейнджери побудували тунелі на випадок, якщо Цитадель колись впаде. Генерал збирався залишитися і затримати Легіон. І знову я хотіла залишитися, але він зупинив мене. Він сказав, що я потрібна для того, щоб наступне покоління рейнджерів продовжувало жити. Пустці все ще були потрібні рейнджери, все ще потрібні були герої.\n\nЯ дозволила натовпу відступаючих потягнути мене за собою, дозволила собі залишити Кейлін позаду. Я досі пам'ятаю її тіло в калюжі червоного.\n\nКоли ми обернулися, Цитадель вибухнула вогняним стовпом, як і Кінгман. Ми були трохи дезорієнтовані. Дехто з тих, хто вижив, не зміг відпустити Аризону і вирушив до останніх вільних околиць. Там був Біллі Клентон. Він трохи тхір, але він був одним із нас. Було цілком очевидно, що він їх прихистить. Решта вирушила на захід, до Каліфорнії. Не знаю, чому я не продовжила боротьбу, як інші.\n\nНапевно, я просто втомилася.\n\n— Ебігейл Лі."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_11B:0 "Журнал пустельного рейнджера 12"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_11B:0 "§Y2271 — Червень — Хворий жарт.§!\n\nМоя група дісталася безпечного місця останньою. Ми чекали на повернення команди рейнджерів «Грудень», але вони повністю зникли зі зв'язку. Ми зв'язалися з тими, хто дістався Країни Ковбоїв, але про «Грудень» досі нічого. Думаю, нам залишається лише припускати найгірше.\n\nБуло певне полегшення знову побачити Варгаса. Я знову почала називати його генералом, і це якось підхопили й інші. Але насправді жодне полегшення чи радість не могли змінити того факту, що нас залишилося так мало. Зазвичай на зборах рейнджерів кімната була настільки забита, що ми штовхалися або ставали на ящики, щоб хоч побачити командування. Але коли Варгас зібрав нас цього разу, вільного місця було стільки, що можна було б поставити загін для брамінів. Варгас начепив маску мужності, і я поважаю його за це — він завжди був сильним, рішучим лідером. Він наказав нам поки що відновити нормальну діяльність у Мохаве. Ніби можна було повернутися до якоїсь «норми».\n\nНКР допомогла прикрити наш відступ до Мохаве — краще пізно, ніж ніколи. Вони все одно не захотіли залишатися через свої «кордони», залишивши нас розгрібати цей безлад із чвертю наших сил. Після цього не було сказано ні слова. Усі просто відчували порожнечу.\n\nКаліфорнія. Пам'ятаю, як щоранку бачила в снайперський приціл цих клоунів у хакі по той бік річки, які просто спостерігали, як нас спалюють, наче феєрверки. Коли ми перейшли на їхній бік, на їхніх обличчях читався сором. Вони дякували нам за те, що ми зробили, дехто навіть перепрошував, що не допоміг. Вони хотіли бути ввічливими, але насправді лише тицяли нас носом у власну нездатність допомогти. Їхні командири наказали нам забиратися з їхньої території, бо це не їхня «юрисдикція». Що б там не означала ця «юрисдикція». Очевидно, Мохаве ще не була їхньою. Поки що.\n\nПатрулювання Мохаве викликає в мене бажання просто покінчити з усім цим. Тутешні рейдери — це просто обдовбані наркомани, але нас занадто мало, щоб щось реально вдіяти. Підтримання миру в цьому регіоні — завдання, яке так легко виконати і водночас неможливо завершити за короткий час. Я все ще продовжую намагатися. Просто роблю хоч щось, аби не думати про Аризону і про людей, винних у моєму горі.\n\nОдного вечора генерал Варгас приватно показав мені папір, який йому «надіслали». Це був договір. *Той самий* договір. Договір про об'єднання рейнджерів. Умови були «простими». НКР допоможе нам патрулювати Мохаве, вони захищатимуть ті невеликі території, що залишилися в нас у Вегасі, Греблю Гувера. Варгас навіть сказав, що домовився про збереження незалежності міст Мохаве, фактично давши їм таку саму угоду, яку мали з нами міста в Аризоні. Але перш ніж я встигла відчути хоча б краплину радості від того, що НКР справді зробить щось, щоб допомогти комусь заради добра, а не заради прибутку чи власної вигоди, Варгас ударив мене обличчям об реальність.\n\nУсе це, весь цей мінімум для зупинки Легіону, НКР так *великодушно* зробить в обмін на приєднання Пустельних Рейнджерів до них. Це не був договір! Це був, бляха, смертний вирок! НКР отримує можливість розширитися на Мохаве, а натомість МИ ДОПОМАГАЄМО ЇМ ЦЕ ЗРОБИТИ? Краса Пустельних Рейнджерів у тому, що наші гріхи — це наші гріхи, а наші проблеми — це наша відповідальність. А тепер ми станемо підбитим сталлю чоботом за спиною президента НКР?! Кого МИ будемо ігнорувати? Які кордони забезпечуватимемо? Кого НКР назве «злочинцями-лінчувателями»? День, коли я наставлю зброю на того, хто, на мою думку, цього не заслуговує, стане днем моєї смерті. Я не збираюся виконувати накази якогось барона.\n\nПерш ніж я встигла заперечити, Варгас сказав, що вже підписав його. Він розповів мені це приватно лише тому, що боявся, що я підбурю інших рейнджерів на якийсь нерозважливий вчинок через це.\n\nДалі я мало що пам'ятаю. У мене в очах потемніло. Я кричала, гарчала. Я хотіла змусити його передумати, змусити переосмислити, але перш ніж я взагалі зрозуміла, що відбувається, я побачила, як його рука завмерла над кобурою. Це розбило мені серце.\n\nСкільки років ми працювали разом? Скільки років ми були сім'єю? Я довіряла Варгасу своє життя, а він поводиться зі мною, як із шаленим псом, який може просто його застрелити! Він мав винуватий вигляд, сказав, що це був інстинкт. Від цього стало ще боляче. Це довело, що десь глибоко всередині він вважав мене лише ницою, брудною вбивцею. Він же завжди говорив про те, що ми повинні довіряти своїй інтуїції. Ну і нехай. \n\nНе думаю, що на виході я сказала щось приємне. Якби це був хтось інший, а не Варгас, я була б набагато жорсткішою. Але Варгас навчив мене поводитися зі зброєю, навчив вистежувати ціль. Попри зраду й біль, я так і не змогла змусити себе зненавидіти старого.\n\nЗрештою я більше не могла дивитися Варгасу в очі. Здавалося, він теж не був від мене в захваті. Наші шляхи розійшлися. Принаймні я змогла вичавити з себе прощання перед тим, як ми розлучилися. Я не озирнулася.\n\nЯ по-справжньому усвідомила це лише тоді, коли вперше в житті опинилася в пустелі сама. \nЯ навіть не встигла попрощатися до того, як цей світ відібрав у мене Кейлін.\n\n— Ебігейл Лі, рейнджер-відступник."
  PIPBOY_PLUS_MECHANIC_TITLE_DESERT_RANGER_JOURNAL_12:0 "Журнал пустельного рейнджера 13"
  PIPBOY_PLUS_MECHANIC_TEXT_DESERT_RANGER_JOURNAL_12:0 "§Y2274 — Листопад — Чесні Серця.§!\n\nПривіт, Кейлін.\n\nСподіваюся, ти це читаєш. Напевно, тобі цікаво, де я була. Останні чотири роки я провела в загубленості. Я блукала без мети, роблячи те, що мало бути зроблено, вбиваючи те, що мало бути вбито. Більшість Пустельних Рейнджерів усе ще в Каліфорнії, принаймні наскільки мені відомо. Я бачила, на що схожа Каліфорнія: як багаті та впливові ігнорують хворих і голодних, як відчайдушні й слабкі благання тонуть у гучних, владних вимогах. Я бачила, на що схожа Аризона, на що Легіон перетворив місце, яке ми колись захищали. Від Цитаделі залишилися лише руїни — колись гамірний центр тепер стоїть закинутий і спалений дотла. Тепер це лише пам'ятник могутності Легіону. Я знаю, що саме там ти насправді похована. Можливо, це символічно, що ти похована там, де по-справжньому померли Пустельні Рейнджери. Одного дня я поховаю тебе серед соняшників.\n\nЯ подорожувала з кількома нашими, але мені вдалося тримати в полі зору всіх нас. Мабуть, я не могла винести того, щоб бути «самотнім» рейнджером. Те, що я роблю, технічно... не є «законним» у НКР. Мій револьвер не зважає на статус чи багатство, лише на скоєні злочини. Я зібрала чималу нагороду за свою голову. Здається, на цьому етапі тільки Варгасу вистачило б авторитету, щоб домогтися для мене помилування. Або, можливо, ще містеру Меннерсу. Він кумедний хлопець.\n\nОдного дня я опинилася в Даєрі. Це було абсолютне місто-привид. Я не змогла знайти твого мерзотника-батька чи будь-кого з тих людей, які ігнорували та зневажали таку людину, як ти. Це зробило заселення туди доволі простим.\n\nНа пагорбі неподалік від Даєра росло прекрасне дерево, і я просто сиділа там у тиші вперше за дуже довгий час. Я знала, що колись мені доведеться піти з Даєра, але не могла змусити себе це зробити. Я не могла змусити себе піти. На коротку мить світ перестав обертатися.\n\nЦе змусило мене задуматися. Задуматися про тебе, про Пустельних Рейнджерів, про Неваду, Аризону, Каліфорнію, Юту, Колорадо... Вудсон мав рацію, світ потребує Пустельних Рейнджерів. Зараз навіть більше, ніж будь-коли. У Каліфорнії та Неваді щодня гинуть невинні люди, а Новій Каліфорнійській Республіці на них начхати. Немає нічого, що радикалізує сильніше, ніж бачити, як люди голодують і стікають кров'ю на вулицях, і дивитися, як повз них проходять сотні інших.\n\nЇх хвилює лише влада та вогні їхнього дорогоцінного Вегаса. Це стосується не лише їхніх лідерів — апатія шириться серед людей Каліфорнії, мов чума. Вона зруйнувала Каліфорнію. Їхня апатія забезпечує їхні кордони, їхні закони, їхню культуру. Їхня апатія завадила їм врятувати тебе від орд Легіону, що нас накрили.\n\nТому я вирішила знову зібрати нашу команду. Я збираюся відродити Рейнджерів такими, якими вони колись були. Жодних договорів про об'єднання, жодних кордонів, ніяких богів, ніяких хазяїв. Я вже налаштувала далекобійний передавач і зібрала більшість хлопців, тож ти не зможеш сказати чи зробити нічого такого, що мене б зупинило.\n\nМожливо, є інший шлях, але я не бачу його за горою трупів, залишених через недбалість НКР і через зло, що роз'їдає наш світ сьогодні. Я знаю, ти б хотіла, щоб я жила далі. Я знаю, ти б хотіла, щоб я жила щасливо. Можливо, якби ти була тут, тобі б навіть вдалося переконати мене покинути все це.\n\nВибач, що підвела тебе. Вибач, що підвела Аризону, що підвела всіх. Вибач за те, що не можу відпустити.\n\nЯ просто не можу закривати очі на зло, особливо коли це зло відібрало все у мене і в тебе. Ти завжди це в мені розуміла. З часом ти зрозумієш, чому я повинна це зробити.\n\nРейнджер-відступник може відродити Пустельних Рейнджерів і створити символ, який надихне нове покоління на створення безпечнішого, кращого, добрішого світу. Світу, який би тобі сподобався, і світу, де такі люди, як я, більше ніколи не знадобляться. Світу, який ніколи не змусить нікого страждати так, як страждала я.\n\nЦей світ — злий, жорстокий, хворий і зламаний. Але цей світ також і прекрасний, і ти навчила мене ніколи цього не забувати. Коли я дивлюся вночі на прекрасне зоряне небо, я думаю про тебе.\n\nДумаю, мій біль ніколи не мине.\n\nЯкби ми жили в іншому світі, Лін, ми могли б бути кінозірками разом.\n\n— Еббі."
