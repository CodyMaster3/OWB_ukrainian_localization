  PIPBOY_PLUS_MECHANIC_TEXT_INITIATIVE_RANKINGS:0 "§OШЕФ§!\n- Хоча це і не ранг сам по собі, ті, хто має звання «Шеф» (або Головний), керують усіма іншими у своїй специфічній сфері. Наприклад, лідер Ініціативи, Чарльз Вей, носить титул Головного Адміністратора і керує всіма іншими Адміністраторами. Інші посади включають Головного Хіміка, який керує всіма співробітниками хімічного відділу, або Головного Оператора, який керує всіма Операторами.\n\n§OАДМІНІСТРАТОР§!\n- Титул, що надається всім співробітникам Ініціативи, які виконують «адміністративні» функції в межах організації. Загалом вони є найвищими посадовими особами, очолюваними самим засновником Ініціативи Чарльзом Веєм. Їхні обов'язки варіюються від офісної роботи до територіального управління.\n\n§RАГЕНТ§!\n- Титул, що надається працівникам «Агентства Егіда». Агенти фактично є спецназом Ініціативи. Вони виконують широкий спектр завдань: від шпигунства до бойових дій на передовій, і зазвичай забезпечуються силовою бронею. Оператори підпорядковуються їм, особливо у військових питаннях.\n\n§RОПЕРАТОР§!\n- Титул, що надається старшому бойовому персоналу Ініціативи. Оператори часто є офіцерами та ветеранами бойових дій, але також можуть виконувати спеціалізовані обов'язки, як-от польова інженерія та бойова медицина.\n\n§MСПЕЦІАЛІСТ§!\n- Титул, що надається особам зі специфічними науковими навичками, щоб виділити їх як експертів і лідерів у своїх галузях. Часто людям із видатними здібностями цей ранг присвоюється одразу, замість того, щоб вони просувалися з нижчих посад.\n\n§MТЕХНІК§!\n- Титул, що надається старшим співробітникам у технічних галузях, таких як будівництво чи виробництво. Їхні обов'язки іноді перетинаються з обов'язками Операторів, хоча Техніки, як правило, не є бойовим персоналом.\n\n§WПРАКТИК§!\n- Найнижчий офіційний ранг в Ініціативі. Практики зазвичай є допоміжним персоналом для інших співробітників, таких як Спеціалісти, Техніки та Оператори. Нерідко цей титул носять солдати нижчого рангу, але новобранці з невеликим попереднім досвідом зазвичай не мають жодного титулу."