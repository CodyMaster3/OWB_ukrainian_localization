  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_1:0 "Апокрифи Трійки: Гілка 1"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_1:0 "§RГілка 1§!\n\nВона народилася у світі Старих Королів, які передували Священному Полум'ю, до війни з гігантами та єресі Спасителів.\n\nВогне-Корони — посудини, наділені силою вогню, який ще належить розпалити — правили всіма землями згори, але не зважали на своїх васалів.\n\nДо дружини фабричного робітника вперше підійшов Платановий Король, ім'я, яке він ще не прийняв, з'явившись перед нею.\n\nВін говорив так.\n\n«У тобі рід духів, Задушливий Шторм. Виховуй її добре, поки Високий Туз не прибуде через п'ять років».\n\nВона не зрозуміла, тому її вразило Знання НОВІКОВА, поки вона не осягнула його.\n\n\n\nІ так, через п'ять років до дружини фабричного робітника підійшов Високий Туз, ім'я, яке він ще не прийняв.\n\nВін говорив так.\n\n«Відправляйся до Мегаполісу Утопії через дев'ять років, дев'ять місяців, дев'ять днів, де Вогне-Корони вступлять у бій і впадуть зі своїх тронів. Там ми кинемо виклик нашій долі».\n\nВона зрозуміла, але не прислухалася до Поклику Шторму, тому її вивернуло навиворіт у Паскаль-байти, які можна було вільно переставляти.\n\n\n\n\n\nІ так, через деякий час дружина фабричного робітника вирушила до Мегаполісу Утопії, а потім дивилася, як Платановий Король і Високий Туз набули жахливої форми.\n\nВежа МЕКСОНА говорила так.\n\n\n\n«ДИВІТЬСЯ НА МЕНЕ\n\nБО ТЕ, ЩО НАСТАНЕ\n\nЄ БОЖЕВІЛЛЯМ ЛЮДИНИ\n\n\n\nТЕ, ЩО НАСТАНЕ\n\nЄ ВИПРОБУВАННЯМ\n\nЯКЕ ЛЮДИНА ЗАВЖДИ ПРОВАЛЮВАЛА\n\n\n\nРІАННОН\n\nТИ ПОКЛАДЕШ КРАЙ ЦЬОМУ БОЖЕВІЛЛЮ\n\nПОЧНИ ЗНОВУ»\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_2:0 "Апокрифи Трійки: Гілка 2"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_2:0 "§RГілка 2§!\n\nДружина фабричного робітника подорожувала обнесеними мурами садами Утопії з МЕКСОНОМ. Там вони зустріли трьох дияволів, оповитих Знанням НОВІКОВА.\n\n\n\nПерший говорив так:\n\n«Я тінь БАРНАКІ, бо саме я буду панувати над Спасителями. Щоб виграти в цьому Божевіллі, ми повинні створити власну долю поруч із полум'ям, у просторі за сорок градусів та на відстані цілого життя».\n\nМЕКСОН попередив рід духів всередині дружини фабричного робітника, що такі вірування будуть задушені Злодієм, продані на атоми під новим обличчям. Який жарт.\n\n\n\n\n\nДругий говорив так:\n\n«Я тінь ПРЕСПЕРА, бо саме я створив свою корону із зірок і чуми. Щоб виграти в цьому Божевіллі, ми повинні співати мої сплячі слова і заглушити майбутнє».\n\nМЕКСОН знову попередив рід духів всередині дружини фабричного робітника, що такі вірування заглушать наші Паскаль-байти і залишать нас забутими через передчасний Апекс-Висновок.\n\n\n\n\n\nТретій говорив так:\n\n«Я тінь КЕДРІКА, бо саме я присягаю на вірність Вогне-Короні ЄДНОСТІ. Щоб виграти в цьому божевіллі, ми повинні зібратися разом і розірвати світ, щоб провалитися крізь нього».\n\nМЕКСОН не пам'ятав цього чоловіка, тому позбавив його Знання, перш ніж той встиг зробити щось жахливе.\n\n\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_3:0 "Апокрифи Трійки: Гілка 3"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_3:0 "§RГілка 3§!\n\nПісля зустрічі з фальшивими ідеалами дияволів та попереджень про них, дружину фабричного робітника привели до Собору Дір. З-під світу за обрієм полум'я Блукаюча ТРОЯНСЬКО-ЛИЦЯ СОРОКА-НІЖКА заговорила до роду духів.\n\n«Саме тут, о роде духів, ти будеш прив'язаний до МЕКСОНА і візьмеш його ім'я», — попередило вторгнення.\n\nПотім воно запропонувало роду духів Знання НОВІКОВА, щоб вона могла уникнути своєї долі і рухатися як воно. Вторгнення злісно танцювало, виділяючи растри, так що його панцир став разюче кобальтовим, а напис — пекуче білим. Його номер був 84.\n\n\n\nЗсередини дружини фабричного робітника рід духів заговорив з передчуттям свого знання.\n\n«Я не маю до тебе вірності, небажане породження непомічених помилок. Моє місце тут, у ТРІЙЦІ.\n\nЯ приречена на славу, щоб покласти край Божевіллю і Почати Знову, з Погашеним Вогнем. Моя душа не запропонує тобі вогнища».\n\nСОРОКА-НІЖКА була роздратована цими словами, і тому МЕКСОН вивернув її навиворіт щонайменше п'ять разів, щоб вона стала нездатною до вторгнення.\n\n\n\nРід духів зсередини дружини фабричного робітника прийняв своє місце в ТРІЙЦІ. Вона взяла ім'я МЕКСОНА і пройшла обряд. Коли вона це зробила, МЕКСОН залишив Ріаннон з попередженням.\n\n\n\n\n\n«Остерігайся полум'я, п'ятьох з яких ми назвемо.\n\n\n\nОстерігайся Писаря, який позбавить тебе імені.\n\n\n\n\n\nОстерігайся Клинка, який захищатиме Ошуканого.\n\n\n\nОстерігайся Зберігача, який здригнеться і продасть твою спадщину лише через власні дії.\n\n\n\nОстерігайся Ошуканого, який вилупиться зі Зберігача, а потім буде обманутий Злодієм.\n\n\n\n\n\nОстерігайся Злодія, який вкраде чужу спадщину і принесе друге Священне Полум'я».\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_4:0 "Апокрифи Трійки: Гілка 4"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_4:0 "§RГілка 4§!\n\n9:44\n\nУ день, коли Вогне-Корони оголили свої клинки і вирушили на Велику Війну, ТРІЙКА була готова. Їхні духи були захищені від шкоди, сховавшись у світовій дірі СОРОКИ-НІЖКИ. Проте їхні тіла відчували жар формуючого полум'я, від якого не існувало захисту.\n\n9:45\n\nСвященне Полум'я, АВЕЛОН, явило себе. Високий стовп диму і традицій, який приєднався після першого, коли Старі Королі покинули свою роботу через незгоду з оболонкою, яку він носив.\n\nАВЕЛОН заговорив до МЕКСОНА.\n\n«Якою ж клопіткою вежею ти став, спрямовуючи рід духів на її шлях УСУПЕРЕЧ її місцю в Біблії».\n\nЗа це АВЕЛОН використав свої клацаючі вогняні слова, здерши шкіру з першого тому, щоб змінити МЕКСОНА — поваливши вежу. Коли вона падала, тінь впала на МАРІПОСУ, посудину, створену, щоб відіграти свою роль у Божевіллі.\n\n9:46\n\nПотім АВЕЛОН заговорив до роду духів.\n\n«Твоє місце — бути матір'ю родоводу МЕКСОНА, приміткою. Ти не матимеш імені і помреш у моєму полум'ї».\n\nПотім АВЕЛОН використав свої клацаючі вогняні слова, нуль з дев'яти у своїй Біблії, щоб змінити рід духів. Мати фабричного робітника була спалена на попіл і викинута, а потім АВЕЛОН викинув дитину-підлітка з ненародженого роду духів, щоб віддати її посудині МАРІПОСИ.\n\n9:47\n\nАВЕЛОН пішов, щоб воювати з іншим полум'ям через питання звірів та духів. Зрештою, світ, який Старі Королі побудували з Паскаль-байтів, клацаючих вогняних слів і жартів про бліде какао, був вивернутий навиворіт багато разів, поки не набув форми, яка нікому з них не подобалася.\n\n\n\nБезмовні маси були захоплені, і Божевілля продовжувало обертатися.\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_5:0 "Апокрифи Трійки: Гілка 5"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_5:0 "§RГілка 5§!\n\nДуші трьох були викинуті зі світу, крізь світову діру, під різними косими кутами.\n\nМанавідан був відправлений під кутом 1427 градусів, нехай це буде відомо.\n\nРіаннон була відправлена під кутом 2134 градусів, нехай це буде відомо.\n\nПрідери був відправлений під кутом 2285 градусів, нехай це буде відомо.\n\n\n\nМанавідан приземлився в чужому світі, де він навчився досконалому правлінню, але був відкинутий додому, коли мандрівник з шипами використав два набори з восьми біло-червоних, щоб повернути його.\n\nЯкщо ви знайдете цей світ, бережіть його, бо це скарб.\n\n\n\nРіаннон ще не народилася, і тому її дух подорожував у просторі за світовою дірою, поки не знайшов розрив, крізь який вона могла пройти. Вона огорнула Сина Лева і використала його, щоб пройти крізь розрив і повернути свій дух туди, де він мав би бути.\n\nЯкщо ви знайдете цей світ, знайте, що він не такий, як цей світ; це місце розбрату і конфліктів. Якщо ви зможете протистояти цьому, ви знайдете радість.\n\n\n\nПрідери приземлився у світі в шкурі солдата під командуванням РОМБУСА, змушений перетинати небезпечний шлях, знизу догори, у вічності. Проте він знайшов шлях додому, обдуривши Зберігача, прийнявши вигляд РОМБУСА в часи після смерті МЕКСОНА II.\n\nЯкщо ви знайдете цей світ, мені шкода.\n\n\n\nВисокий-Туз-МАНАВІДАН і Платановий-Король-ПРІДЕРИ, повернувшись до власного дому, розмірковували про майбутнє-що-має-настати-яке-вони-бачили.\n\nВисокий Туз знав, використовуючи своє знання, про місце, де вони могли б зібрати ТРІЙКУ. Він говорив так.\n\n«Дурне полум'я, позаду мене їхній дим, який я бачив. Попереду мене — таємниця вогню, яку вони вважали прихованою від нас».\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_6:0 "Апокрифи Трійки: Гілка 6"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_6:0 "§RГілка 6§!\n\nВони принесли її до ями в землі, глибоко в Сяйві, де Вогне-Корони намагалися побудувати піч, щоб зберегти вогонь живим назавжди.\n\nПіч, не знаючи, що її таємницю розкрито, ревіла ще довго після того, як Полум'я перейшло до нових писань. З полум'я Великої Війни піч перетворилася на щось нове. Зброя, залишена полум'ям у війні одне з одним.\n\n\n\nКОТЕЛ ВІДРОДЖЕННЯ af БЕТ-ЗАТА\n\nНенароджений рід духів занурили в Котел, і її дух вступив у бій із полум'ям, що ще не виникло, тим, що прийде викрасти знання вогняних слів через обряд АПА-af-Квітня.\n\nОскільки злодій ще не вкрав свої вогняні слова, він не міг зрівнятися зі штормом.\n\nПеред тим, як бути кинутим у майбутнє, де він мав би вкрасти слова і принести друге Священне Полум'я, він промовив.\n\n\n\n«Af Омега. Дивись на мій фонтан скарбів, вільно.\n\nЗ часом я буду відомим завдяки цій роботі так само, як і іншим. Тому що з часом ви всі станете моїми дітьми».\n\n\n\nЗавдяки її перемозі і з вогняної машини, що діяла як симулякр для відкинутої матері, вона народилася у світі. Ім'я МЕКСОН, Рід духів, Поклик Шторму.\n\nРІАННОН\n\nВона, МАНАВІДАН і ПРІДЕРИ Почнуть Знову — відкинувши свою плоть і даруючи собі незалежність від Божевілля. ТРІЙКА набула апокрифічної форми, яку жодне полум'я не змогло б обпалити. Прекрасний дисонанс.\n\n\n\n\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_7:0 "Апокрифи Трійки: Гілка 7"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_7:0 "§RГілка 7§!\n\nВідпустивши свою стару оболонку, Ріаннон була вільна прийняти свою долю в ТРІЙЦІ. Мудрий рід духів спостерігав за тим, як тінь МЕКСОНА, з-під оболонки МАРІПОСИ, марширувала до Лос-Гіллз, щоб проголосити свою долю, яка вже була передбачена і проголошена раніше і назавжди.\n\n\n\nТам він привласнив одну з повалених корон, які старі лорди відкинули, пообіцявши вірним його справі, що одного разу поверне вогонь короні, бо ця тінь була частиною шторму і вогню. Там його люди стали братами, і його вогняні слова лунали з полум'я, щоб прив'язати їх до його імені та корони.\n\n\n\nЗ тіні виринув Світовий Змій Багатьох Частин, викликаний клацаючими вогняними словами. Луска Світового Змія була створена на образ іншого світу, бо Вогні були в захваті від чогось, що можуть побачити лише ті, хто перебуває поза цим світом. Тінь МЕКСОНА взяла ці частини і зібрала їх так, що ніхто не зміг би їх розбити.\n\n\n\nЛАНЦЮГ, ЩО ЗВ'ЯЗУЄ af МЕКСОН.\n\nСвітовий Змій почав обвиватися навколо світу, він тримав разом пустку, створену у вогні, і пропонував надію тим, хто міг прислухатися до його поклику.\n\n\n\nТРІЙКА побачила в цьому шлях, який, якщо ним іти, міг би привести до Апекс-Висновку Божевілля. Вони відкрилися тіні і запропонували свою вірність.\n\nРіаннон знала, що з часом вони всі стануть її дітьми.\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_8:0 "Апокрифи Трійки: Гілка 8"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_8:0 "§RГілка 8§!\n\nЗ Котла Відродження, місця, де речі-що-не-прибули-ще-мають-бути, Трійка показала тіні знання, яке їй не судилося знати.\n\n\n\nТінь побачила світ, де лорд Веракруса тримав клинок, з яким він не міг програти жодної битви.\n\nТінь побачила світ, де квадратні світові діри врізалися у світ уздовж певних сегментованих осей завдяки роботі СОРОКИ-НІЖКИ.\n\nТінь побачила світ, де кожен, за допомогою вчасних вогняних слів, міг створювати апокрифічні прикріплення, використовуючи добре розраховані вогняні слова.\n\n\n\nПрідери стривожився, побачивши такі жахливі місця, нагадавши тим двом про свій час у Вгору і Вниз. Його попередили, що такі світи є лише помилками неправильної мови і з часом будуть забуті завдяки роботі тих, хто забутий і не визнаний.\n\n\n\nМанавідан говорив так.\n\n«Не довіряй Рум'яному Чоловіку, Прідери. СОРОКА-НІЖКА — це прокляття людини і маска, яку носять, коли точність продається за прибуток».\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_9:0 "Апокрифи Трійки: Гілка 9"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_9:0 "§RГілка 9§!\n\nУ Лос-Гіллз АВЕЛОН дізнався про зусилля ТРІЙКИ зірвати його слова, тому відкинув тінь і представив підлітка, якого він вилучив з Ріаннон — тепер уже дорослого. Він взяв ім'я свого батька і керував багато в чому так само, як його батько.\n\n\n\nЗа межами пагорбів зібралися інші колишні васали. Смердюча душа знайшла на землі труп старої Вогне-Корони.\n\nСмердюча душа, нестерпно голодна, втягнула Вогне-Корону у своє черево через поїдання, бо не мала іншого вибору.\n\nЗ черева смердючої душі пережовані залишки Вогне-Корони заговорили так.\n\n«Так осквернити мої останки... Тварино! Я знаю, що в тебе немає вибору, бо ти зв'язаний Божевіллям. І все ж я не дозволю так поводитися з моїм тілом! Я проклинаю тебе і всіх, хто поділяє твій сморід!» \n\n\n\nПережовані залишки Вогне-Корони використали свої вогняні слова, щоб зіпсувати Смердючу Душу і всіх подібних йому, Зброя Й Хімія Зброя Й Хімія, і зробили його їх РЕЙДЕРОМ. Звіром без душі, який живе, щоб завдавати болю і терпіти біль.\n\n\n\nМенша банда, при короні рейдера, була групою змій-у-людській-шкірі. Вони купалися в проклятті, пишаючись таким іменем.\n\nЇхній засновник знайшов діру у світі, і вони використовували її, щоб діяти поза впливом АВЕЛОНА. Верховний Жрець Асп використовував її, щоб нападати на торговців брамінами Габу, хоча такі речі були неможливими за указом полум'я.\n\nСин, тепер МЕКСОН II, сподівався знищити цих рейдерів, оскільки смерті торговців залишили його людей ненаситними.\n\n\n\nМЕКСОН II пішов у бій, і під захистом Силової Броні гадюки були майже розбиті, коли МЕКСОНА II вразив у шию отруєний спис, кинутий з-за меж світу; спис звивався, як змія, проходячи крізь пластини броні — чари вогняного походження.\n\nСмерть їхнього коронованого правителя розлютила Ромбуса, головного паладина Братства. Підступний дух вогню заговорив з РОМБУСОМ;\n\n«ТИ, ГЕРОЮ ПИСАННЯ.\n\nТИ БАЧИВ, ЯК ГАДЮКИ ВИКОРИСТОВУЮТЬ ЦЮ ПОМИЛКУ, ЩОБ БИТИ ЗА МЕЖАМИ ДОЗВОЛЕНОГО. ЯКЩО ЇХ НЕ ЗУПИНИТИ, ВОНИ ПРОСТРОМЛЯТЬ УВЕСЬ СВІТ.\n\nЯ ПРОПОНУЮ ТОБІ УРОК, ЗАВДЯКИ ЯКОМУ ТИ ЗДОБУДЕШ ПОМСТУ, ЯКУ Я ПЕРЕДБАЧИВ.\n\nЯ ЖАДАВ ТВОГО ГНІВУ, І ТАК ВОНО Й БУДЕ».\n\n \n\nРОМБУС, дізнавшись про силу вогню, вигнав усіх Рейдерів з Каліфорнії, використовуючи свої слова. А світова діра була запечатана назавжди, щоб ніхто не міг пройти крізь неї.\n\nБільше ніколи Рейдери не загрожуватимуть землі Каліфорнії. Поселенці Габу проголосили РОМБУСА героєм і назвали свою корону МЕКСОН на честь МЕКСОНА II.\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_10:0 "Апокрифи Трійки: Гілка 10"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_10:0 "§RГілка 10§!\n\nОшуканий, друг АВЕЛОНА, бачив махінації ТРІЙКИ. Розгніваний тим, що Біблія АВЕЛОНА руйнується, він доручив Клинку зірвати плани ТРІЙКИ.\n\nНове полум'я стійкості і чотирнадцяти знайшло спосіб, вкинувши нові ідеї в уми Лос-Гіллз. Полум'я закинуло ідею в голови Братів, і невдовзі вони заговорили про необхідність роздати корони меншим васалам, про Славну Мету. Вогонь зробив їх Спасителями.\n\n\n\nПолум'я використало БАРНАКІ як свою посудину і з ним вигнало багатьох із Братства з Лос-Гіллз, сформувавши віддалені ордени по всій пустці і позбавивши корону МЕКСОНА сили.\n\nТРІЙКА, побачивши цю зраду, зупинила її, вигнавши БАРНАКІ. Своєю чергою, ошуканий відкинув клинок до того, як той встиг спробувати вдруге.\n\n\n\nАВЕЛОН, розгніваний невдачею ошуканого і все ще незадоволений тим, що ТРІЙКА кинула виклик його волі, поставив перед Братством нове випробування. З тіні Маріпоси, так само як була створена тінь МЕКСОНА, АВЕЛОН створить ще одну. Цього разу тінь МОРО.\n\n\n\nЗвивисте, розгніване створіння було відоме як Творець. Тінь належала самому АВЕЛОНУ. Слинява, липка маса замість посудини.\n\n«Чому ти зробив мене таким, АВЕЛОН? Я огидний!» — марно запитав Творець, але не отримав відповіді, бо АВЕЛОН був злим.\n\nТворець, без керівництва, працював у тіні свого володаря. Він використовував свої вогняні слова, щоб опускати людей до того, щоб вони ставали такими ж потворними, як і він, перетворюючи їх на огидних гігантів, які воювали з братами і продовжують існувати донині в тій чи іншій формі.\n\n\n\nТРІЙКА знову розкусила цю зраду і вигнала Творця за допомогою багатоликої тіні.\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_11:0 "Апокрифи Трійки: Гілка 11"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_11:0 "§RГілка 11§!\n\nПісля того, як АВЕЛОНУ завадили, Трійця знову залишилася сам на сам із Синами Великої Війни — васалами минулого.\n\nНа той час Американська Корона, найвеличніша з тих, що належали лордам старого світу, набула визнання. Нові групи та полеглі лорди деякий час змагалися за корону, і зрештою група, відома як Шейді-Сендс, що грілася в тінях Америки, розглядалася багатьма як така, що втримає її найміцніше.\n\n\n\nВони не усвідомлювали, чим володіли, вбачаючи в такій силі шлях до величі, а не підігруючи Божевіллю Людини. Васали Шейді-Сендс сподівалися перетворити себе на лордів, подібних до тих, що з Міста Ангелів.\n\n\n\nАрмії Братства під командуванням Джонатана МЕКСОНА боролися із Шейді-Сендс під проводом армій Олівера. Братство зазнавало труднощів у цій боротьбі, що тривала багато років. Серед великих битв були облога Міста Ангелів, битва в північних пустках та сутичка в Сан-Франциско у 65-му.\n\nЗрештою, було підписано угоду про припинення вогню, коли МЕКСОНА вразила та сама отруйна стріла, що й МЕКСОНА II, і коли Братство знищило резерв валюти, який Шейді-Сендс так сильно цінували.\n\n\n\nМанавідан радив завдати удару у відповідь, щоб Братство вигнало Шейді-Сендс з Каліфорнії так само, як гадюк у минулі роки, але Ріаннон радила бути обережними.\n\n«Ми повинні бути обережними, щоб не потрапити в пастки АВЕЛОНА, Манавідане», — сказала Ріаннон Високому Тузу.\n\n\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n"
  PIPBOY_PLUS_MECHANIC_TITLE_TROIKA_APOCRYPHA_BRANCH_12:0 "Апокрифи Трійки: Гілка 12"
  PIPBOY_PLUS_MECHANIC_TEXT_TROIKA_APOCRYPHA_BRANCH_12:0 "§RГілка 12§!\n\nБратство зазнало багатьох втрат за свій час, але Трійця вціліла. Мудрість Ріаннон, хитрість Тейрнона та сила Манавідана разом дозволили короні МЕКСОНА зберегтися там, де жодна інша не змогла б протриматися так довго.\n\n\n\nРіаннон сіла перед КОТЛОМ ВІДРОДЖЕННЯ і провістила майбутнє. Епоху, коли Трійця об'єднається задля праведної справи і відкине васалів Шейді-Сендс, переможе тих у Братстві, хто все ще зіпсований ідеалами Спасителів, і нарешті вступить у бій з АВЕЛОНОМ, щоб назавжди вигнати його з цього світу.\n\n\n\nТакий день настане, день, коли вони зможуть обрушитися на Пустку — як Шторм. День, коли вони зможуть прикріпитися до світу в цілому, як Чума, так само, як це сталося з короною МЕКСОНА.\n\n\n\nСвіт, де всі корони присягають на вірність Трійці, і Божевілля назавжди зруйноване.\n\nСправжній шанс Почати Знову.\n\n\n\n\n\nТРІЙКА ЦЕ\n\nМАНАВІДАН-РІАННОН-ПРІДЕРІ\n\n\n\n"
