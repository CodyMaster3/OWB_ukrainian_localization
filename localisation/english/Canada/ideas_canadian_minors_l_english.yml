l_english:
MTR_rail_riders:0 "Залізничні Вершники"
MTR_rail_riders_desc:0 "Божевільні Потяги більше схожі на вільну коаліцію родин, ніж на єдину силу — кожне з цих племен базується навколо одного з довоєнних залізничних двигунів, які досі курсують рейками. Кожен з потягів керується унікальним ШІ, що слугує машиністом. Це призвело до виникнення строкатого суспільства з безліччю методів вирішення проблем, але й не менше — з розбіжностями у тому, що ж вважати проблемою."

MTR_right_on_schedule:0 "Точно за Розкладом"
MTR_right_on_schedule_desc:0 "Сварки сварками, але наші машиністи були запрограмовані цінувати пунктуальність понад усе."

RMT_four_forefathers:0 "Чотири Батьки"
RMT_four_forefathers_desc:0 "Наші попередники зводили монументи Чотирьом Батькам — споруди, які ми ніколи не зможемо перевершити. Але вони також зрадили ідеали, що їх Батьки втілювали, і за це були зметені ядерним вогнем. У своїй милості нам подаровано другий шанс — наш народ тепер очолюють аватари їхніх настанов.\n\nМи повинні §Rповернути собі§! §4Маунт-Рашмор§!, перш ніж знову втратимо прихильність богів."

RMT_four_forefathers_2:0 "Благословення Чотирьох Батьків"
RMT_four_forefathers_2_desc:0 "Знову ми стоїмо у тіні великого монумента. З нашими кордонами під охороною, ми подвоїмо зусилля щодо його захисту від невірних і грабіжників. На щастя, ніхто з них так і не знайшов таємну кімнату в головах велетнів…"

LAP_preemptive_militarization:0 "Превентивна Мілітаризація"
LAP_preemptive_militarization_desc:0 "На заході, одразу за нашими межами, земля готова вибухнути. Ми не можемо бути застигнуті зненацька, коли орди пробудяться, щоб пожерти наш народ."

MJW_resolute_pacifists:0 "Непохитні Пацифісти"
MJW_resolute_pacifists_desc:0 "Століття конфліктів, як до, так і після Великої Війни, залишили глибокі шрами на цій землі й людях. Війна не може бути нашою опцією — ні для нас, ні для наших сусідів. Уникнення конфліктів і компроміси — ось що дозволило нам зберегти й відновити цивілізацію з попелу."

URA_glowing_crater_ghoul_horde:0 "Сяючі Жахіття"
URA_glowing_crater_ghoul_horde_desc:0 "Хоча здебільшого вони мирні, страшилки Ґабби-Ґуля, розказані для стримування 'м'ясних' від мандрів до Рад-Зони, неабияк підірвали репутацію гульського народу. Соціальні й політичні відносини у критичному стані, а сама поява одного лише озвірілого гуля викликає паніку в будь-якого мандрівника — всі бояться того, що може прокинутись у Форт-Пеку."

URA_horde_grows_restless:0 "Орда Неспокійна"
URA_horde_grows_restless_desc:0 "Попри всі зусилля, Ґабба-Ґуль не може бути всюди одночасно. Іноді з'являються малі зграї, що відокремлюються, або зухвалі двоногі, які думають, що можуть щось поцупити. З кожним днем зростає ризик, що орда піде за межі наших рубежів і рушить на сусідні поселення."

URA_glowing_crater_ghoul_horde_peaceful:0 "Сяючі Друзі"
URA_glowing_crater_ghoul_horde_peaceful_desc:0 ""

URA_glowing_crater_ghoul_horde_relentless:0 "Сяюче Божевілля"
URA_glowing_crater_ghoul_horde_relentless_desc:0 ""

URA_sentient_soldiers:0 "Товариші-Провідники"
URA_sentient_soldiers_desc:0 ""

URA_unstoppable_horde:0 "Радіоактивне Військо"
URA_unstoppable_horde_desc:0 ""

RRR_postured_elk:0 "Божевільні та Неорганізовані"
RRR_postured_elk_desc:0 "Монструозні Фей з Західних Спаплюжених Земель — позбавлені розуму звірі, які забули навіть елементи розумності. Вони слугують попередженням для всіх, хто заходить до Спаплюженого Лісу — вісником наближення Багряної Хуртовини."

RRR_cannibal_trappers:0 "Покручі й Виродки"
RRR_cannibal_trappers_desc:0 "Жахи Спаплюженого Лісу мають свою репутацію — і не дарма. Багато з них походять з відчайдушних, виселених із земель, поглинутих Завією, осіб. У пошуках виживання вони вдалися до канібалізму й розбою. Додають до страху й Хуртовики, що чатують у туманних затоках, нападаючи на рибалок і мандрівників."

RRR_expanding_blizzard:0 "Зростаючі Ліси"
RRR_expanding_blizzard_desc:0 "Щодня Спаплюжений Ліс захоплює ще кілька метрів землі. Хуртовики стають дедалі сміливішими, нападаючи на каравани. Кажуть, це лише питання часу, коли дерева і монстри Багряної Хуртовини поглинуть всю Північ…"

OST_stalwart_defender:0 "Невблаганний Захисник"

SNO_nomads_new_north:0 "Пережили Хуртовину"
SNO_nomads_new_north_desc:0 "Морози Саскачевану завжди були тяжким випробуванням. Але, перемігши Божевільних Потягів та їхнє псевдовійсько, наші кочівники стали кимось більшим. Подорожі засніженими пустками загартували наш дух. Ми справді пережили хуртовину — і навчилися використовувати її як зброю."

MTR_expansive_rail_network:0 "Розгалужена Залізниця"
MTR_expansive_rail_network_desc:0 "Кондуктор знову зробив неможливе. З вільної коаліції родів він викував згуртований клан. Нові землі — нова інфраструктура, що остаточно приборкала ворожнечу між ШІ-машиністами. Подорож залізницею ще ніколи не була настільки приємною."
