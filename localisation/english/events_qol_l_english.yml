l_english:
nf_qol.1.t:0 "Відродження Енклаву"
nf_qol.1.d:0 "У приголомшливому повороті подій Енклав взяв під контроль відокремлену групу всередині уряду НКР. Ми повинні знищити цю заразу, поки вона не здобула перевагу."
nf_qol.1.a:0 "Ми маємо їх розчавити!"
nf_qol.1.b:0 "Можливо, зараз не час для удару."

nf_qol.2.t:0 "Громадянська війна в НКР"
nf_qol.2.d:0 "НКР розвалюється — після провальних виборів і появи кількох відокремлених угруповань у їхньому уряді з’являється шанс повернути втрачені землі, а також, можливо, знайти нових друзів серед попелу республіки."
nf_qol.2.a:0 "Ми стоїмо самі за себе."
nf_qol.2.b:0 "Ми разом з Боньярдом."
nf_qol.2.c:0 "Нам не варто втручатись."
nf_qol.2.e:0 "Ми маємо підтримати наших союзників у республіці."

nf_qol.3.t:0 "Підтримка Братства"
nf_qol.3.d:0 "Братство Сталі пам’ятає допомогу, яку надало Аллгуд у спробі повернути свої землі. Вони хочуть стати нашими союзниками та приєднатись до наших війн."
nf_qol.3.a:0 "Ми вітаємо їхню підтримку."
nf_qol.3.b:0 "Ми впораємось самотужки."

nf_qol.4.t:0 "Відродження Братства"
nf_qol.4.d:0 "Після знищення Братства Сталі руками Республіки багато з тих, хто вижив, переховувались у Боньярді. Тепер, коли ми проголосили суверенітет, маємо нагоду підняти їх з попелу."
nf_qol.4.a:0 "Хай вони піднімуться з попелу."
nf_qol.4.b:0 "Ми не можемо собі цього дозволити."

nf_qol.5.t:0 "Зрада Братства"
nf_qol.5.d:0 "Після всіх зрад, що ми вже пережили, прийшла ще одна. Колись підкорене Братство Сталі знову проголосило свій суверенітет. Ми повинні готуватись до ще однієї війни."
nf_qol.5.a:0 "Ну і дідько."

nf_qol.6.t:0 "З попелу"
nf_qol.6.d:0 "Братство Сталі, яке вже вважали знищеним, піднялося з попелу руйнування."
nf_qol.6.a:0 "Цікаво."

#placeholder localisation begins
nf_qol.7.t:0 "Відродження Енклаву"
nf_qol.7.d:0 "У приголомшливому повороті подій Енклав узяв під контроль весь Нью-Ріно після рішучої атаки на місцеві сім’ї. Ми повинні знищити цю заразу, поки вони не здобули перевагу."
nf_qol.7.a:0 "Ми маємо їх розчавити!"
nf_qol.7.b:0 "Можливо, зараз не час для удару."
#placeholder localisation ends
