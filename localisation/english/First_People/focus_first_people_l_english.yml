l_english:
FOCUS_FILTER_CAPS:0 "Кришки"
 FOCUS_FILTER_CLANS_SUPPORT:0 "Підтримка кланів"
 FOCUS_FILTER_CITY_SUPPORT:0 "Підтримка міст"

 fp_history_1:0 "Дим і вогонь"
 fp_history_1_desc:0 "Коли впали бомби, ми були готові. Спільні зусилля всього нашого народу об'єднали фінансування, наукові знання, інженерну майстерність і духовне керівництво, щоб зберегти нас у безпеці під землею, поки дим і вогонь проносилися над землею."
 fp_history_2:0 "Знову виходячи із землі"
 fp_history_2_desc:0 "Як наші найдавніші пращури вийшли з-під землі в часи легенд, щоб заявити права на ці землі, так само зробили й ми."
 fp_history_3:0 "Угода"
 fp_history_3_desc:0 "Розділені територіально, але єдині духом. Ми записали все, що нам було потрібно, щоб вести наші нації в майбутнє."

 fp_industry:0 "Вирішення місцевої ситуації"
 fp_industry_desc:0 "Якщо ми хочемо продовжувати вдосконалюватися, нам потрібно заручитися прихильністю однієї (або всіх) основних груп у нашій нації. У нас є кілька варіантів, як цього досягти."
 fp_industry_tt:0 "§gВи можете отримати загалом 12 очок підтримки для двох фракцій у вашій нації в цій гілці. Вони знадобляться пізніше, щоб розблокувати більше фокусів. Плануйте заздалегідь, щоб не закрити собі доступ до того, що вам може знадобитися.§!"
 fp_support_clans:0 "Підтримати клани"
 fp_support_clans_desc:0 "Значна частина населення нашої країни живе в сільській місцевості і є переважно самоврядною та самозабезпеченою. Ми повинні запевнити їх, що наші рішення не вплинуть негативно на їхній спосіб життя, водночас намагаючись зблизити їх з нами. Ми не можемо бути могутньою державою в такі часи, якщо кожен робить те, що йому заманеться."
 fp_support_cities:0 "Підтримати містян"
 fp_support_cities_desc:0 "Містяни більше відповідають нашій меті створення сильної єдиної нації. Щоб завоювати їхню прихильність, здебільшого потрібно тиснути потрібні руки та давати правильні обіцянки."
 fp_improve_clan_housing:0 "Покращити житло кланів"
 fp_improve_clan_housing_desc:0 "Хоча люди з кланів не бажають повністю змінювати свої звички, є способи значно покращити якість їхнього життя, не зіткнувшись із надмірним опором. Краще житло для пересічного члена одного з кланів навряд чи засмутить надто багатьох."
 fp_reclaim_skyscrapers:0 "Відвоювати хмарочоси"
 fp_reclaim_skyscrapers_desc:0 "Незважаючи на те, що містяни живуть, як випливає з назви, у містах, дуже мало довоєнних хмарочосів і висоток насправді заселені. Це пов'язано з часто жахливим станом, особливо їхніх верхніх поверхів. 200 років впливу стихій на ці будівлі призвели до відсутності стін, обвалу перекриттів і різних інших проблем. Якщо ми відремонтуємо хоча б деякі з них, ми звільнимо багато місця для подальших починань."
 fp_clan_farmsteads:0 "Субсидувати кланові фермерські господарства"
 fp_clan_farmsteads_desc:0 "Фінансові вливання в різноманітні незалежні фермерські господарства дозволять їм виробляти більше, що дасть можливість продавати надлишки на ринку, а це, своєю чергою, дозволить нам утримувати більше населення. У виграші всі."
 fp_free_streets:0 "Очистити вулиці від завалів"
 fp_free_streets_desc:0 "У деяких наших містах дістатися з пункту А в пункт Б — серйозне випробування через зруйновані будівлі та інше сміття, що блокує вулиці й тротуари. Якщо ми не хочемо, щоб люди пробиралися через каналізацію, піднімалися і спускалися з триповерхової будівлі і ковзали по тросу тільки для того, щоб купити їжу на сусідній вулиці, нам потрібно щось із цим робити."
 fp_black_drink_bottling_plant:0 "Відкрити завод з розливу Чорного напою"
 fp_black_drink_bottling_plant_desc:0 "Чорний напій — традиційний напій нашого народу, що містить кофеїн. Якщо ми зможемо варити його в більших масштабах і розливати в пляшки, ми зможемо продавати його людям як свіжу альтернативу місцевим улюбленцям довоєнних часів: Бавлзу або, можливо, навіть Ядер-Колі. Хоча нам варто подумати над тим, щоб позбутися цього блювання після його вживання. Цей аспект, ймовірно, зашкодить прибуткам."
 fp_organized_scavenging_teams:0 "Організовані команди збирачів"
 fp_organized_scavenging_teams_desc:0 "Навколо наших міст просто валяється багато обладнання і транспортних засобів у різному стані функціональності. Невикористаних і нічиїх. Нам потрібно відправити спеціальні команди збирачів і механіків, щоб прочесати все, що нам належить, у пошуках того, що можна або відремонтувати, або перепрофілювати."
 fp_reopen_coal_mines:0 "Відкрити вугільні шахти"
 fp_reopen_coal_mines_desc:0 "Хоча поклади нафти і газу були вичерпані задовго до Великої війни, багато регіональних вугільних шахт все ще придатні для розробки. Оскільки вони, як правило, знаходяться на околицях урбанізованих територій, вони часто потрапляють на територію, на яку претендує один з кланів. Їх повторне відкриття дасть нам хороше постачання палива та інших компонентів і забезпечить хорошу роботу для цих районів."
 fp_fund_local_arms_factories:0 "Фінансувати місцеві збройові заводи"
 fp_fund_local_arms_factories_desc:0 "Клани, як правило, мають власних зброярів та кузні. Зазвичай вони виробляють високоякісні товари, але не мають достатньої потужності, щоб забезпечити більші сили достатньою кількістю спорядження. Фінансування, щоб забезпечити їх необхідною робочою силою та інструментами, які їм потрібні для нарощування виробництва, допоможе їм процвітати та дасть нам ще одне джерело зброї."
 fp_traditional_values:0 "Традиційні цінності"
 fp_traditional_values_desc:0 "Хоча багато наших звичаїв і традицій вважалися застарілими ще до війни, багато з них знову стали актуальними, коли світ повернувся до більш простого стану. Багато людей все ще дотримуються цих традицій, що було б благом для нашої нації, якби ми їх найняли."
 traditional_values_tt:0 "Стають доступними для найму кілька §Yрадників-представників кланів§!."
 fp_repair_industrial_complexes:0 "Відремонтувати промислові комплекси"
 fp_repair_industrial_complexes_desc:0 "У великих міських районах, які ми контролюємо, розкидано багато довоєнних майстерень і фабрик. Приведення деяких із них у робочий стан покращить наш промисловий потенціал, а також ми можемо дізнатися щось нове про будівництво нових."
 fp_hunt_down_weapon_stashes:0 "Полювати за схованками зі зброєю"
 fp_hunt_down_weapon_stashes_desc:0 "Час незадовго до війни не був спокійним. Наші записи показують, що в містах, на які ми претендуємо, було багато громадянських заворушень. Бунти. Повстання. Проте ці речі вже давно в минулому. Але для нас зараз це означає, що якщо ми зможемо знайти старі бази та укриття цих повстанців, там обов'язково будуть запаси зброї та припасів, які все ще мають бути придатними для використання."
 fp_the_new_expansion:0 "Нове розширення"
 fp_the_new_expansion_desc:0 "Тепер, коли ми маємо стабільний кістяк інфраструктури та економіки, з'явилося багато перспективних підприємців, які бажають довести свою спроможність у світі бізнесу або на державних посадах. Ми можемо вибрати найкращих із них."
 new_expansion_tt:0 "Стають доступними для найму кілька §Yрадників-містян§!."
 fp_dismantle_old_bunkers:0 "Демонтувати старі бункери"
 fp_dismantle_old_bunkers_desc:0 "Бункери, в яких наш народ пережив Велику війну, вже давно перестали служити за своїм призначенням. Деякі зберігали з сентиментальних причин, як пам'ятники або просто як склади. Але ми повинні дивитися в майбутнє, а не в минуле, і вони послужать значно краще як джерело будівельних матеріалів та обладнання, ніж курні сувеніри давно минулого часу."
 fp_new_world_tactics:0 "Тактика нового світу"
 fp_new_world_tactics_desc:0 "Переміщуючи деякі зі старих голозаписувачів, ми знайшли один з майстер-котушкою, на якій була купа інформації про великомасштабні бойові дії, стратегію і планування. Хоча багато що доведеться адаптувати до нинішнього стану світу, більша частина буде нам дуже корисна."
 fp_old_world_knowledge:0 "Знання старого світу"
 fp_old_world_knowledge_desc:0 "Серед коробок із брудними та зіпсованими водою паперами, які були для нас абсолютно марними, ми знайшли запечатану металеву коробку, що містила ґрунтовну інструкцію про те, як побудувати з нуля багато електронного обладнання. Вдала знахідка."
 fp_weapons_fit_for_the_wastes:0 "Зброя, придатна для Пустки"
 fp_weapons_fit_for_the_wastes_desc:0 "Багато більш висококласної зброї минулих років недостатньо міцна, щоб витримувати умови пустки протягом тривалого часу. Можливо, нам доведеться повернутися до простіших конструкцій, які легше виробляти та обслуговувати."
 fp_future_of_war:0 "Майбутнє війни з минулого"
 fp_future_of_war_desc:0 "Хоча простіша зброя може бути надійнішою, ніхто не може заперечувати відчуття могутності, яке ви отримуєте, стріляючи комусь в обличчя перегрітою кулею яскраво сяючої плазми."
 fp_bunker_research_slot:0 "Працюючий мейнфрейм"
 fp_bunker_research_slot_desc:0 "Вочевидь, найбільшою нашою знахідкою під час демонтажу бункера стало те, що встановлений у ньому мейнфрейм був повністю робочим, хоча й вимкненим. Якщо ми перенесемо всі важливі частини в більш доступне місце і включимо його, це стане великою підмогою для всього, що вимагає ефективного зберігання та обробки даних, наприклад, для наших досліджень. На ньому навіть немає злого ШІ... напевно."
 fp_ancestral_ways:0 "Шляхи предків"
 fp_ancestral_ways_desc:0 "Завдяки тому, що наші традиційні способи виживання останнім часом процвітають, багато хто надихнувся йти іншими шляхами предків нашого народу. Заохочення до розвитку нових вчителів для передачі цих уроків майбутнім поколінням та сприяння цій новій хвилі традиційного мистецтва ще більше зміцнять нас, як тілом, так і духом."
 fp_tools_of_war:0 "Знаряддя війни"
 fp_tools_of_war_desc:0 "Одна з переваг найму найкращих і найяскравіших (а іноді й найбезжальніших) полягає в тому, що вони іноді можуть дістати те, чого ви від них зовсім не очікуєте. У цьому випадку: довоєнну зброю. Причому досить просунуту. Те, що ми навряд чи змогли б виробити самі."
 fp_tools_of_war_tt:0 "Ви отримуєте §R10 міні-зарядів§!"

 fp_clear_rivers:0 "Очистити береги річок від місцевої фауни"
 fp_clear_rivers_desc:0 "Через нашу країну протікає багато річок, і вони відіграють значну роль в економіці та інфраструктурі нашої країни. Але великі їхні ділянки все ще страждають від болотників та інших істот. Нам потрібно позбутися їх, щоб зробити роботу і подорожі безпечними для всіх."
 fp_river_commerce:0 "Ріки торгівлі"
 fp_river_commerce_desc:0 "Рибальство та торгівля вздовж річки завжди були ключем до нашого виживання. Оскільки водні шляхи тепер набагато безпечніші, ми можемо інвестувати в них більше, щоб отримати від них максимальну користь."
 fp_river_fleet:0 "Розширити наш річковий флот"
 fp_river_defense:0 "Захистити наші береги річок"
 fp_river_defense_desc:0 "У річок є один великий недолік. Ми не можемо зупинити інших людей від їх використання. Тож, щоб запобігти тому, щоб хтось просто приплив до прибережного поселення, вкрав наші речі та спалив його, нам потрібно побудувати там захист."
 gpf_coastal_forts_tt:0 "Додає кілька §Yприбережних фортів§! вздовж річок ваших націй."

 fp_help_needed:0 "Потрібна допомога"
 fp_help_needed_desc:0 "Хоча нам і вдалося очистити річки, це було не швидко і не легко. Ми втратили чимало людей, які не трималися достатньо далеко від того, що ховалося під поверхнею. Вочевидь, ми були менш підготовлені, ніж думали. Нам варто пошукати допомоги."
 fp_foreign_mercenaries:0 "Запросити іноземних найманців"
 fp_foreign_mercenaries_desc:0 "Швидкий спосіб зробити це — витратити чималу суму грошей на те, щоб відтепер хтось інший робив цю роботу за нас. Через ці території проходить достатньо витривалих, добре екіпірованих людей, які шукають роботу. Дехто з них, імовірно, захоче патрулювати річки."
 fp_foreign_mercenaries_tt:0 "Дві дивізії річкового патруля з'являться у вашій столиці."
 fp_trained_hunters:0 "Навчені мисливці"
 fp_trained_hunters_desc:0 "Спосіб, що вимагає більше зусиль, — це спеціальне навчання людей для вистежування та полювання на всіх цих створінь. Можливо, вони не будуть готові одразу, але в довгостроковій перспективі це окупиться."

 fp_member_tt:0 "§YОригінальні члени Федерації Великих Рівнин§!"
 fp_has_not_started_joint_focus_tt:0 "Жоден інший оригінальний член §YФедерації Великих Рівнин§! ще не почав цей фокус."
 fp_the_joint_focus_tt:0 "§gВідповідний фокус також буде виконано для інших початкових членів§! §YФедерації Великих Рівнин§!.\n\n"
 fp_the_joint_focus_bonus_tt:0 "§gНація, яка завершить цей фокус для всіх членів, також отримає наступний бонус:§!"
 fp_the_joint_focus_bonus_event_tt:0 "§gНація, яка завершить цей фокус для всіх членів, також отримає бонус залежно від результату події.§!"
 fp_the_joint_focus_bonus_event_reward_tt:0 "§gБонус за завершення оригінального фокусу:§!"
 fp_the_join_tech_sharing_tt:0 "Кожен початковий член §YФедерації Великих Рівнин§! приєднується до §YОсвітньої системи Федерації Великих Рівнин§!"
 fp_buff_first_peoples_federation_sharing:0 "§G10%§! Бонус до обміну технологіями від §YОсвітньої системи Федерації Великих Рівнин§!."

 fp_the_alliance:0 "Переглянути Угоду Перехрестя Перших Людей"
 fp_the_alliance_desc:0 "Хоча наші нації співпрацюють уже тривалий час, великі спільні проєкти були рідкістю. Можливо, настав час це змінити."
 fp_lacrosse:0 "Молодший брат війни"
 fp_lacrosse_desc:0 "Нам варто подумати про відродження старого виду спорту під назвою стікбол. Він часто використовувався для вирішення суперечок між племенами та підготовки молодих воїнів до бою. І те, й інше звучить неймовірно корисно. Додайте до цього розважальну цінність, і регулярні міжфедеративні матчі стануть дуже гарною ідеєю."
fp_combined_militia_effort:0 "Об'єднані зусилля ополчення"
 fp_combined_militia_effort_desc:0 "Оборона сільської місцевості часто залишалася на розсуд окремих поселень у відповідних районах. Це означало, що існували території, де рейдери блукали більш-менш вільно. Особливо навколо регіону, який вважається кордоном між нашими націями, оскільки кожен просто сподівається, що інший виконає цю роботу. Це не може тривати далі, якщо ми хочемо досягти успіху в цьому суворому середовищі. Нам потрібно відстежувати, які ополчення та інші оборонні сили доступні в усій федерації, і як швидко ми можемо відправити їх туди, де вони потрібні."
 fp_fortify_the_borders:0 "Укріпити кордони"
 fp_fortify_the_borders_desc:0 "Бродячі банди рейдерів — не єдина проблема, з якою ми стикаємося. На наших кордонах формуються грізні загрози, і ми маємо бути готовими. Аванпости та кілька більших оборонних споруд у природних вузьких місцях поки що впораються з цим завданням."
 fp_shared_education:0 "Освіта для всіх"
 fp_shared_education_desc:0 "Наявність єдиної загальнофедеративної системи освіти не лише допоможе нам боротися з такими проблемами, як низька грамотність і некваліфікована робоча сила, але й виховає нове покоління світлих умів, які прискорять наші дослідницькі проєкти."
 first_peoples_federation_sharing:0 "Освітня система Федерації Великих Рівнин"
 fp_into_the_PIT:0 "У ЯМУ"
 fp_into_the_PIT_desc:0 "Наша спільна освітня система була гарним початком, але нам потрібне центральне місце, куди ми могли б відправляти наших найкращих і найяскравіших людей. Інститут технологій Співдружності Рівнин, який розмовно називають 'Ямою', був таким місцем до війни. Можливо, ми зможемо зробити його таким знову. Звісно, якщо нам вдасться вибити всіх рейдерів і радтарганів, які захопили його з того часу."
 fp_into_the_PIT_bonus_tt:0 "Додаткові §Y30 днів§! §Yпідготовки до ЯМИ§!"
 fp_clear_out_PIT_raiders:0 "Зачистити рейдерів"
 fp_clear_out_PIT_raiders_desc:0 "Неприємний тип, який називає себе 'Володарем Ями', та його банда облаштували свій дім у покинутій ЯМІ. За ці роки вони перетворили колишнє місце навчання на справжню фортецю. Необхідні спільні зусилля військових наших націй, щоб вигнати його звідти."
 fp_the_archives:0 "Прочесати архіви"
 fp_the_archives_desc:0 "Чому персонал ЯМИ вирішив зберігати стільки даних на перфокартах? У нас складається враження, що ЯМА була серйозно недофінансована, якщо вони не могли дозволити собі навіть звичайні побутові пристрої для читання голодисків. Перфокарти вже неможливо врятувати, але ті кілька голодисків, які у них були, на щастя, залишилися неушкодженими. Ми маємо розподілити їх у Федерації, щоб їх можна було використовувати якомога ефективніше."
 fp_usable_equipment:0 "Поділитися здобиччю"
 fp_usable_equipment_desc:0 "Ми знайшли кілька прототипів та вдосконалених версій повсякденного обладнання та пристроїв довоєнних часів. Хоча самі машини вже не працюють, ми винесли кілька цінних уроків з їхнього демонтажу та огляду."
 fp_reopen_the_PIT:0 "Знову відкрити ЯМУ"
 fp_reopen_the_PIT_desc:0 "Сьогодні в урочистій обстановці Інститут технологій Співдружності Рівнин знову відкрив свої двері для громадськості. Лідери союзних націй зібралися, щоб привітати цей великий крок уперед для Федерації. Перша група нових студентів уже чекала перед воротами, готова розпочати навчання. Майбутнє в наших руках."

 fp_the_expedition:0 "Експедиція"
 fp_the_expedition_desc:0 "'Видіння' викликало справжній ажіотаж. Шукачі пригод, Хранителі історій та інші зацікавлені в тому, куди це видіння нас приведе. Знадобиться деякий час, щоб підготувати все необхідне, але ми будемо готові."
 fp_unknown_woman_appared:0 "Отримано таємниче видіння"
 fp_expeditions_boon:0 "Дарунок"
 fp_expeditions_boon_desc:0 "Експедиція була важкою і не обійшлася без втрат, але ми вистояли і привезли з собою додому те, чого не бачили вже майже 200 років. Коней. Живих, справжніх коней, виведених спеціально для виживання в цих суворих умовах. Задовго до війни наш народ так швидко пристосувався до них, що став відомим своїм умінням поводитися з кіньми. Ми зробимо це знову."
 fp_towards_lonestar:0 "До Самотньої Зірки"
 fp_outriders:0 "Підготувати вершників-розвідників"
 fp_outriders_desc:0 "Однією з переваг коней є швидкість на пересіченій місцевості без використання обмежених запасів палива, що у нас залишилися. Нам варто інвестувати в спільні розвідувальні сили на конях, щоб використати це на нашу користь."
 fp_outriders_tt:0 "Розгортає §Y3 підрозділи кінної розвідки§! у вашій столиці."
 fp_horse_breeding:0 "Планове розведення коней"
 fp_horse_breeding_desc:0 "Хоча початкове поголів'я коней було хорошим, його не вистачить для задоволення потреб наших військ у довгостроковій перспективі. Нам потрібно організувати систему для їхнього ефективного розведення, інакше рано чи пізно вони у нас закінчаться."
 fp_internal_trade:0 "Організована внутрішня торгівля"
 fp_internal_trade_desc:0 "Хоча торгівля між територіями, що належать різним членам федерації, завжди існувала, вона була спорадичною і погано контрольованою. Завдяки більш структурованому підходу ми можемо гарантувати економічне зростання та запобігти або принаймні пом'якшити такі явища, як місцевий дефіцит продовольства, ресурсів чи обладнання."
 fp_free_trade:0 "Вільна торгівля між членами"
 fp_free_trade_desc:0 "Ми зробили великі кроки у правильному напрямку з нашим новим підходом до торгівлі. Тепер нам просто потрібно зупинити окремі поселення від 'оподаткування' торговців за захист. Часто досить насильницьким шляхом."
 fp_infrastructure_projects:0 "Інфраструктурні проєкти"
 fp_infrastructure_projects_desc:0 "Зі постійно зростаючим припливом людей і товарів нам потрібно модернізувати нашу транспортну мережу. Стежки, дороги, потяги. Усе потребує ремонту та свіжого шару фарби."
 fp_restore_highways:0 "Відновити автомагістралі"
 fp_restore_highways_desc:0 "Наші країни перетинає безліч автомагістралей. Вони часто є найпрямішими шляхами між містами та дрібними поселеннями. Звісно, там, де вони взагалі прохідні. Нам потрібно перевірити ступінь їхнього руйнування і відправити робочу силу на найкритичніші ділянки."
 fp_restore_highways_tt:0 "Кожен оригінальний член §YФедерації Великих Рівнин§! додає §Y3 інфраструктури§! у своїй столичній провінції."
 fp_connect_settlements:0 "З'єднати менші поселення"
 fp_connect_settlements_desc:0 "Хоча ремонт автомагістралей — це добре, не кожне поселення зручно розташоване вздовж цих артерій. Багато менших громад часто знаходяться далеко від головних доріг. Ми повинні переконатися, що ці люди не залишаться відрізаними від світу, забезпечивши до них чіткі, добре захищені дороги, щоб торговці могли дістатися до них і забезпечити всім необхідним."
 fp_connect_settlements_tt:0 "Кожен оригінальний член §YФедерації Великих Рівнин§! додає §Y2 інфраструктури§! у нестоличній провінції."
 fp_reopen_train_stations:0 "Знову відкрити залізничні станції"
 fp_reopen_train_stations_desc:0 "Залізнична мережа простоювала з часів війни. Хоча окремі авантюристи й облаштували собі житло на залізничних станціях, жодних зусиль для приведення потягів і колій у робочий стан не докладалося. Але особливо в місцях, де каравани брамінів працюють на межі можливостей, вантажний потяг допоможе як із кількістю товарів, так і з часом їхньої доставки. Це буде серйозне підприємство, але воно того варте."
 fp_passenger_trains:0 "Пасажирські потяги"
 fp_passenger_trains_desc:0 "Несподіваним побічним продуктом відновлення нашої залізничної мережі став зростаючий попит людей, які бажають ними подорожувати. Але наші потяги насправді не мають місця для розміщення значної кількості пасажирів. Великі вагони-бункери, заповнені зерном, — не найкраще місце для подорожей. Рішення просте: спеціальні пасажирські потяги, які курсують за фіксованим розкладом. Це трохи зменшить наші вантажні потужності, але матиме перевагу у можливості швидко доправляти людей туди, де вони потрібні."
 fp_protect_caravans:0 "Захистити каравани"
 fp_protect_caravans_desc:0 "Наш підхід, спрямований на припинення здирництва з боку певних поселень щодо торговців, на жаль, призвів до зниження рівня захисту караванів загалом. Схоже, нам доведеться втрутитися самим. Регулярні патрулі вздовж основних торгових маршрутів та до торгових хабів покажуть, що каравани — не легка здобич для звичайного рейдера."
 fp_attract_foreign_caravan_companies:0 "Залучити іноземні караванні компанії"
 fp_attract_foreign_caravan_companies_desc:0 "Оскільки ми непогано розібралися з місцевою стороною торгового бізнесу, можливо, настав час зазирнути зовні й подивитися, що роблять інші. І, можливо, зацікавити одну-дві з цих караванних компаній відкрити свою справу в межах наших кордонів."
 fp_the_currency_question:0 "Питання валюти"
 fp_the_currency_question_desc:0 "Досі наші країни здебільшого використовували кришки від пляшок як валюту, тому що... ніхто вже й не пам'ятає, чому ми почали їх використовувати. Але так повелося невдовзі після війни. Проте поточна ситуація може бути не найкращим варіантом для майбутнього. На півдні з'являється нова валюта, забезпечена торговою імперією Самотньої Зірки. І ще одна надходить із заходу, підкріплена значною військовою силою."
 fp_economic_growth:0 "Економічне зростання"
 fp_economic_growth_desc:0 "Перехрестя Перших Людей — ідеальне місце для купівлі та продажу найрізноманітніших речей. Інвестиції в його розвиток як торгового хабу принесуть користь усім членам федерації."


 gpf_a_monster_approaches:0 "Чудовисько наближається"
 gpf_a_monster_approaches_desc:0 "З заходу до нас надходить усе більше й більше тривожних новин. Подорожні та біженці розповідають, що більша частина Колорадо потрапила під контроль того, кого називають 'Чудовиськом Сходу'. І, судячи з усього, він рухається в нашому напрямку. Ми маємо бути готовими."

### Fate of the Federation
 gpf_fate_of_the_federation:0 "Доля Федерації"
 gpf_fate_of_the_federation_desc:0 "Останнім часом наші нації стають все ближчими, і ми вже давно ходимо довкола однієї теми. Чи варто нам переступити через себе і стати єдиною нацією та єдиним народом? Хоча це зробило б нас силою, з якою доведеться рахуватися в регіоні, у цього є не лише позитивні сторони. Навіть з огляду на нашу нинішню тісну співпрацю, мине ще багато часу, перш ніж нова нація почне функціонувати так само ефективно, як і окремі з них. І дехто може заперечити, що деякі речі, які роблять наш народ унікальним, загубляться в цій метушні."
 gpf_federation_apart:0 "Окремо, але не розділені"
 gpf_federation_merge:0 "Єдина нація"
 gpf_federation_merge_desc:0 "Рішення прийнято. Ми — одна нація, один народ. Ми будемо сильнішими. Ми вистоїмо. Ми з упевненістю дивимося в майбутнє."
 gpf_a_new_ruling_body:0 "Новий керівний орган"
 gpf_a_new_ruling_body_desc:0 "До нашого об'єднання в різних урядах було багато різних груп. Крім того, хоча вони більше не очолюють націю, вміння та досвід двох інших попередніх лідерів є безцінними для нашої новоствореної держави."
 gpf_scientific_advisor:0 "Небо — не межа"
 gpf_scientific_advisor_desc:0 "Наукова майстерність Черокі не має рівних у цьому регіоні. І ніхто не уособлює це краще, ніж Стендгоуп. Такий блискучий розум, як його, не повинен пропадати марно."
 gpf_cultural_advisor:0 "Частина історії"
 gpf_cultural_advisor_desc:0 "Історію ніколи не можна забувати. Незалежно від того, чи це історія місця, людини чи речі. Багато представників Чокто присвятили своє життя збереженню пам'яті. Нашоба десятиліттями перебував в авангарді цього руху. Він сам став частиною історії Чокто. І він стане частиною історії цієї нової нації."
 gpf_economic_advisor:0 "Більше ніж просто азартні ігри"
 gpf_economic_advisor_desc:0 "Не можна стать лідером нації та успішної бізнес-імперії водночас, не знаючи своєї справи. Це більше, ніж просто яскраві вогні та щасливий випадок."
 gpf_scientific_advisor_tt:0 "Радник із досліджень §YСтендгоуп Шедоу Маунтін§! стає доступним для найму."
 gpf_cultural_advisor_tt:0 "Культурний радник §YНашоба Соломон§! стає доступним для найму."
 gpf_economic_advisor_tt:0 "Економічний радник §YЛушаня Гарджо§! стає доступним для найму."
 gpf_a_new_capital:0 "Nova Столиця"
 gpf_a_new_capital_desc:0 "Насправді немає нагальної потреби переносити резиденцію нашого уряду на нове місце. Але не можна недооцінювати символічне значення розташування центру нашої новоствореної нації там, де багато десятиліть тому ми підписали документ, який привів нас до цього моменту. Проте нам усе ще потрібно покращити інфраструктуру та умови проживання в цьому районі."
 gpf_gateway_to_the_plains:0 "Ворота до Співдружності Рівнин"
 gpf_gateway_to_the_plains_desc:0 "Самотня Зірка давно домінує в торгівлі на території колишньої Співдружності Техас. З ними важко конкурувати на їхньому полі. Але що ми можемо зробити, так це стати воротами, посередником для торгівлі між Техасом та Співдружністю Рівнин. Канзас-Сіті, притулок збирачів Грейт-Бенд, Джанкшен-Сіті. Кожному, хто захоче торгувати в цьому регіоні, доведеться мати справу з нами."
 gpf_the_state_of_sequoyah:0 "Штат Секвоя"
 gpf_the_state_of_sequoyah_desc:0 "Виявляється, коли ми заселили цю територію, we більш-менш заявили права на всі землі штату Секвоя. Єдиний уряд корінних американців пропонували створити майже 300 років тому, але це так і не втілилося в життя. Краще пізно, ніж ніколи?"
 gpf_the_state_of_sequoyah_tt:0 "Володіти всіма національними територіями оригінальних членів §YФедерації Великих Рівнин§!."
