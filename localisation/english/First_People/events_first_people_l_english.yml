l_english:

 nf_event_fp.1.t:0 "Час диму та вогню"
 nf_event_fp.1.d:0 "Наші пращури називали велику війну 'часом диму та вогню'. Ми вижили завдяки тому, що були готові. Найрозумніші люди в нашій громаді передбачили наближення війни та те, що вона буде швидкою і закінчиться тотальним спустошенням з обох сторін. Ми побудували сховища, материнські кургани. Не зовсім бункери, але достатньо хороші, щоб дозволити нам комфортно виживати з достатньою кількістю запасів, щоб перечекати час, який нам потрібно було провести під землею. Чого у нас було вдосталь?"
 nf_event_fp.1.a:0 "Їжі"
 nf_event_fp.1.b:0 "Розваг"
 nf_event_fp.1.c:0 "Зброї"

 nf_event_fp.2.t:0 "Покидаючи Материнські кургани"
 nf_event_fp.2.d:0 "Ми знали, що не можемо залишатися під землею вічно. Але поверхня була надто небезпечною певний час відразу після падіння бомб. Як довго ми залишалися під землею?"
 nf_event_fp.2.a:0 "5 років"
 nf_event_fp.2.b:0 "10 років"
 nf_event_fp.2.c:0 "20 років"

 nf_event_fp.3.t:0 "Угода Перехрестя Перших Людей"
 nf_event_fp.3.d:0 "Ефективне та захищене будівництво дозволило нам залишатися на зв'язку з іншими материнськими курганами, поки ми були під землею. Щойно ми вирішили знову вийти на поверхню, ми зв'язалися з іншими групами, щоб зібратися разом і обговорити, як діяти далі. Це закінчилося підписанням Угоди Перехрестя Перших Людей. Яку найважливішу концепцію ми туди записали?"
 nf_event_fp.3.a:0 "Співпраця"
 nf_event_fp.3.b:0 "Безпека"
 nf_event_fp.3.c:0 "Свобода"

 nf_event_fp.4.t:0 "Молодший брат війни"
 nf_event_fp.4.d:0 "Знадобилося чимало часу, щоб розпочати перший повномасштабний матч зі стікболу. Існують різні версії правил, які учасники та судді пам'ятають лише наполовину, і ніхто не міг дійти згоди щодо єдиного варіанту. Дехто хотів грати за правилами лакросу, оскільки це був найповніший звід правил з усіх варіацій, що пережили війну. Інші хотіли повернутися до більш традиційних версій, які передавалися з покоління в покоління. Зрештою, дивна суміш з кількох наборів правил була прийнята як нові 'офіційні' правила стікболу. Гра тривала добрі чотири години й закінчилася бійкою, бо одна команда не погодилася з остаточним рахунком. Загалом, усі зійшлися на тому, що добре провели час і повинні повторити це якнайшвидше."
 nf_event_fp.4.a:0 "Гарне тренування для наших воїнів"
 nf_event_fp.4.b:0 "Можливо, всі ці стратегії перенесуться на справжню війну?"

 nf_event_fp.5.t:0 "Важке рішення"
 nf_event_fp.5.d:0 "Банда рейдерів, що засіла в ЯМІ, перетворила колишнє місце навчання на лабіринт пасток. У поєднанні з їхнім важким озброєнням це означає, що хоч ми й могли б їх знищити, але не без значних втрат. Ми могли б спробувати домовитися з ними, але це теж не гарантує успіху, адже рейдери рідко прислухаються до голосу розуму. Крім того, це може призвести до того, що вони дізнаються про наші плани щодо цього місця і окопаються ще глибше. Хоч би що ми робили, всі повинні долучитися, і нам потрібне колективне рішення про те, як діяти далі."
 nf_event_fp.5.a:0 "Ми маємо відправити наші війська"
 nf_event_fp.5.b:0 "Ми маємо відправити переговірників"
 gpf_pit_vote_tt:0 "§gВаше рішення може бути скасоване двома іншими членами Федерації, якщо вони проголосують проти вас.§!"

 nf_event_fp.6.t:0 "Ми відправляємо війська"
 nf_event_fp.6.d:0 "Після тривалих дискусій про те, чи варто відправляти війська, було прийнято рішення вибити рейдерів силою. Оскільки це була місія з високим шансом наступити на міну або зловити кулю, серед військ усіх трьох націй було розпочато набір добровольців з обіцянкою подвійної платні для кожного, хто запишеться. Незважаючи на очікувану смертельну небезпеку, записалася значна кількість солдатів. Важко сказати, чи сталося це через їхнє почуття обов'язку, нерозсудливість чи жадібність. \n\nСама битва пройшла досить буденно, як для битв. Перша пара невдачливих солдатів натрапила на кілька пасток, але після цього наші люди стали обережнішими у своєму просуванні. Це не означає, що після того моменту більше не було втрат, але ми досягли повільного і стабільного прогресу.\n\nСамопроголошений Володар Ями чекав на нас у лабораторії на нижньому поверсі, яку переобладнали на щось на кшталт тронного залу. Він почав читати монолог про те, що його доля — правити великими рівнинами, коли один з наших солдатів достроково обірвав цю долю влучним пострілом у голову. \n\n'Володар' зібрав у своєму тронному залі досить пристойну кількість кришок та інших цінностей, що може зробити цю місію виправданою навіть понад очевидну користь самої ЯМИ. Крім того, солдати засвоїли кілька уроків про те, як виживати в подібних ситуаціях — або завдяки власним діям, або через нещастя тих, хто не повернувся."
 nf_event_fp.6.a:0 "Чисто!"

 nf_event_fp.7.t:0 "Ми намагаємося домовитися"
 nf_event_fp.7.d:0 "Відправляти наші війська лише для того, щоб вони загинули від саморобної вибухівки та прихованих пасток із шипами, не здається гарним способом вирішення цієї проблеми. Особливо, якщо ми можемо зробити це без втрат людських життів. Можливо, якщо ми виявимо таку ж люб'язність, зберігши життя Володарю Ями та його головорізам, ми зможемо дійти згоди, яка задовольнить обидві сторони.\n\nНаближення невеликої групи переговірників із білим прапором, у надії, що рейдери знають, що це означає, було найбільш напруженим моментом усієї операції. На диво, їх не застрелили одразу, і їм справді вдалося розпочати переговори. Це призвело до того, що Володар Ями та його люди віддали ЯМУ нам, за умови, що ми пообіцяємо їм відсутність наслідків за все, що вони робили, перебуваючи в рейдерському бізнесі, і постійне місце в наших лавах. У довгостроковій перспективі це справді може принести нам користь у різних аспектах. Більше людей, здатних поводитися зі зброєю, — це завжди добре. Крім того, їхні оборонні споруди, хоч і примітивні, продемонстрували вражаючий рівень винахідливості, який ми, безперечно, зможемо застосувати в інших будівельних проєктах. Та й сам Володар Ями є здібним лідером, якому вдавалося утримувати банду рейдерів разом протягом кількох років."
 nf_event_fp.7.a:0 "Здається, сьогодні ми знайшли нових друзів?"

 fp_unlock_lord_of_the_pit:0 "\nБос рейдерів, який називає себе §HВолодарем Ями§!, стає доступним для найму.\n"
 fp_unlock_pit_raider_advisor_tt:0 "\nРадник-рейдер §HНачальник армії§! стає доступним для найму.\n"

 nf_event_fp.8.t:0 "Залучення іноземних караванних компаній"
 nf_event_fp.8.d:0 "Ми розіслали повідомлення всюди, щоб спокусити якомога більше перспективних іноземних караванних компаній пустити коріння, або принаймні заснувати аванпост на наших землях. Були дані обіцянки субсидувати їх певний час або надати їм ексклюзивні права на будь-який ринок, який вони намагаються монополізувати.\nНадійшла перша партія відповідей, і ми можемо обрати тих, хто, на нашу думку, принесе нам найбільшу користь."
 nf_event_fp.8.a:0 "Червоний Караван"
 nf_event_fp.8.b:0 "Діамантова Судноплавна Компанія"
 nf_event_fp.8.c:0 "Лісозаготівлі Озарк"

 nf_event_fp.9.t:0 "Програми розведення коней"
 nf_event_fp.9.desc:0 "Поголів'я, яке ми привели з собою від Діани, не триватиме вічно. Нам потрібно мислити довгостроково, якщо ми хочемо продовжувати використовувати коней через роки.\nХоча потреба у спеціальній програмі розведення є очевидною, специфіка обговорюється, як і те, яку частину нашого нинішнього поголів'я ми на неї виділимо. Чим більше коней залучено до програм розведення, тим менше у нас залишається для поточних потреб."
 nf_event_fp.9.a:0 "Масштабна програма розведення"
 nf_event_fp.9.b:0 "Середня програма розведення"
 nf_event_fp.9.c:0 "Невелика програма розведення"
 nf_event_fp.9.d:0 "Спеціалізована програма розведення"

 nf_event_fp.9_large_tt:0 "§GЦей варіант пропонує найбільший бонус ціною найдовшого штрафу до часу виробництва.§!"
 nf_event_fp.9_medium_tt:0 "§GЦей варіант пропонує хороший баланс між розміром бонусу та штрафом до часу виробництва.§!"
 nf_event_fp.9_small_tt:0 "§GЦей варіант пропонує найменший бонус, але й найкоротший штраф до часу виробництва.§!"
 nf_event_fp.9_special_tt:0 "§GЦей варіант пропонує хороший бонус із коротким штрафом до часу виробництва, але отриманих коней важко приручити, і вони менш надійні.§!"

 nf_event_fp.100.t:0 "Головне питання"
 nf_event_fp.100.d:0 "Останнім часом наші нації стають все ближчими, і ми вже давно ходимо довкола однієї теми. Чи варто нам переступити через себе і стати єдиною нацією та єдиним народом? Хоча це зробило б нас силою, з якою доведеться рахуватися в регіоні, у цього є не лише позитивні сторони. Навіть з огляду на нашу нинішню тісну співпрацю, мине ще багато часу, перш ніж нова нація почне функціонувати так само ефективно, як і окремі з них. І дехто може заперечити, що деякі речі, які роблять наш народ унікальним, загубляться в цій метушні.\n\nЯк ми голосуємо?"
 nf_event_fp.100.a:0 "За!"
 nf_event_fp.100.b:0 "Проти!"

 nf_event_fp.200.t:0 "Видіння невідомої жінки"
 nf_event_fp.200.d:0 "Ми отримали звіт про те, що минулої ночі двом мисливцям з'явилося те, що вони назвали 'видінням'. \nПісля досить невдалого полювання вони вже збиралися повертатися додому, коли почули дивні звуки, що, здавалося, лунали звідусіль водночас. Шукаючи джерело цього звуку, вони помітили жінку, яка раптом з'явилася 'як освітлена тінь' за кілька десятків метрів від них. Вона була в просторому одязі та несла снопи зерна. Мисливці обережно наблизилися до неї. Перш ніж вони встигли підійти надто близько, вона лише промовила слова \"Прийдіть до мене\", вказуючи на захід. У цей момент поруч із нею в повітрі з'явилася мапа, яка виглядала такою ж ефірною, як і вона сама. Мисливці стверджували, що вона напевно вказувала на місцевість у кінці річки Арканзас. Потім жінка знову зникла у спалаху світла. Мисливці якнайшвидше побігли назад на свій аванпост, щоб доповісти про побачене.\n\nУже було багато дискусій про те, що означає це 'видіння'. Оповідачі з племені Чокто кажуть, що ця подія разюче нагадує одну з наших стародавніх легенд. Рада вчених та інженерів племені Черокі стверджує, що такого 'видіння' можна було б досить легко досягти за наявності відповідних технічних знань і ресурсів. Але все це означає, що хтось доклав значних зусиль, щоб донести до нас це послання. Забагато зусиль, щоб це було простою пасткою. Навіть якщо ця подорож вимагатиме певних витрат, скоріш за все, результат буде того вартий, навіть якщо просто задля вдоволення нашої цікавості."
 nf_event_fp.200.a:0 "Час планувати експедицію"

 nf_event_fp.201.t:0 "Спокійний початок"
 nf_event_fp.201.d:0 "Перша ділянка нашої подорожі поки що проходить досить спокійно. Погода гарна, і ми швидко просуваємося до нашої мети на річці Арканзас. Хоча ми заледве покинули землі Федерації, тому цього і слід було очікувати. Та й за їхніми межами все ще відчувається вплив Останнього Патруля, навіть якщо вони не такі могутні, як колись. Але незабаром ми вирушимо переважно незвіданими територіями, і хто знає, що там станеться."
 nf_event_fp.201.a:0 "Вперед"

 nf_event_fp.202.t:0 "Забираємося з Доджа під три чорти"
 nf_event_fp.202.d:0 "Ми знали, що затишшя не могло тривати вічно. Ми пройшли приблизно третину шляху до нашої мети, коли натрапили на те, що, як ми гадаємо, є руїнами Додж-Сіті. Нас не лише сповільнили руїни будівель, що обвалилися в річку, але ми також помітили кілька трупів, які звисали з тих небагатьох уцілілих мостів, під якими ми пропливали. Це вже насторожило охорону, а згадки людей про рух на березі річки ситуацію не покращили. Якийсь час нічого не відбувалося, поки постріл із руїн не зніс голову охоронцю на правому борту. Екіпаж почав ховатися, охоронці зайняли укриття і вступили в перестрілку з ворогом, якого навіть не бачили. Капітан додав обертів двигунам, щоб якнайшвидше вибратися з цього району."
 nf_event_fp.202.a:0 "Швидше!"

 nf_event_fp.203.t:0 "Прокладаючи нові шляхи"
 nf_event_fp.203.d:0 "За роки, що минули після війни, річка явно проклала нові (або, можливо, старі) русла. Ми натрапили на частково затоплене село, через яке вона тепер звивалася. Місцева фауна була не в захваті від того, що ми пропливаємо крізь неї, але справжньої загрози не становила. Болотників важко вбити через їхні товсті панцири, але їхні клешні не змогли пробити корпус нашого корабля. Королі болотників — це вже зовсім інша справа, але вони траплялися досить рідко серед звичайних болотників, тому ми могли відстрілювати їх заздалегідь, ще до того, як їхні звукові атаки могли б комусь нашкодити. Хоча ніхто не постраждав, ми були раді залишити цю територію позаду і знову вийти на відкриту воду."
 nf_event_fp.203.a:0 "Сьогодні на вечерю смажений болотник"

 nf_event_fp.204.t:0 "Поповнення запасів"
 nf_event_fp.204.d:0 "На лівому борту ми помітили кілька будівель, які виглядали недоторканими, включно з супермаркетом і господарським магазином. Ми вирішили зупинитися і подивитися, чи зможемо знайти там якісь корисні припаси. Ми їх справді знайшли. А ще ми виявили, що те, що ми вважали парою мертвих тіл, насправді було скупченням диких гулів у стані спокою. Звуки нашого шопінгу розбудили їх, і вони почали шкандибати в наш бік. Ми вирішили поспішно відступити, прихопивши значно менше здобичі з ринку, ніж планували."
 nf_event_fp.204.a:0 "Краще бути голодним, ніж мертвим."

 nf_event_fp.205.t:0 "Аудієнція"
 nf_event_fp.205.d:0 "Ми нарешті прибули туди, що вважали місцем нашого призначення. Нас зустріла група дикунів, які, здавалося, чекали на нас, на диво, у супроводі робота Містер Помічник. Вони провели нас до великої зали, де перебувала велетенська жінка. Вона відпочивала на чомусь, оповитому димом і дивним світлом, але було зрозуміло, що якби вона підвелася, то височіла б над багатьма будівлями. Це точно була та сама жінка, яку наші мисливці бачили тієї ночі. Деякі з науково мислячих людей у нашій групі швидко вказали на проєктори, розміщені в кутках кімнати. Можна було припустити, що 'видіння', яке ми отримали, було створено подібним чином, хоча не зовсім зрозуміло, звідки походило джерело проєкції під час тієї події. Розмова з 'Богинею Діаною', як називали її дикуни, була приємною, але ми не могли позбутися відчуття, що вона очікувала від нас більшої шани та благоговіння перед її присутністю, ніж ми виявляли. А от що нас справді вразило, так це причина, з якої вона нас сюди привела.\nКоні. Справжнісінькі коні. Ми були майже впевнені, що їх більше ніде не залишилося. Вона фактично підтвердила цю підозру, сказавши, що ці коні були спеціально 'створені' для виживання в пустці за допомогою якихось машин, захованих у таємному місці. І вони були подарунком для нас.\nНам довелося швидко розв'язувати логістичні питання: як розмістити їх на наших човнах і як уберегти під час довгого шляху додому. Крім того, серед екіпажу та учасників експедиції почали гучно лунати сумніви щодо того, навіщо їй робити нам такий подарунок. Які її мотиви? Ми не впевнені й сподіваємося, що колись вона не попросить про послугу у відповідь."
 nf_event_fp.205.a:0 "Дарованому коню в зуби не заглядають?"
 fp_expedition_encounter_05:0 "зустрічає богиню"
