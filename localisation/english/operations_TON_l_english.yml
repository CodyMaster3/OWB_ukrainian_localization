l_english:
  ton_legion_more_reliant_tt:0 "§R[CES.GetName]§! більше залежатиме від нас у постачанні продовольства."

  infiltrate_desert:0 "Проникнення через пустелю"
  infiltrate_desert_desc:0 "Наші агенти пройдуть через пустелю, щоб дістатися до цілі. Це дуже безпечний метод, але він потребуватиме певних припасів, щоб безпечно перетнути її."
  infiltrate_traders:0 "Замаскуватися під торговців"
  infiltrate_traders_desc:0 "Легіон насправді вітає торговців на своїх землях. Прикинувшись торговцями та привізши товари, ми зможемо легко проникнути в Легіон."
  slave_uprisings:0 "Спровокувати повстання рабів"
  slave_uprisings_desc:0 "Озброївши рабів Легіону, що працюють на полях, ми зможемо спонукати їх повстати проти своїх господарів. Навіть якщо вони зазнають невдачі, вони завдадуть шкоди фермам."
  salted_fields:0 "Посипати землю сіллю"
  salted_fields_desc:0 "Найкращий спосіб переконатися, що їхні ферми не працюватимуть — це зрівняти їх із землею. І нам випала щаслива нагода зробити це."
  burned_storehouses:0 "Спалення їхніх складів"
  burned_storehouses_desc:0 "Трохи підпалу ще нікому не завадило... хіба що Легіону, звісно."
  stolen_tools:0 "Викрасти їхні інструменти"
  stolen_tools_desc:0 "Робота на фермі йде повільно і важко без інструментів, що робить крадіжку сільськогосподарського реманенту Легіону простим і привабливим вибором."
  hide_in_the_desert:0 "Сховатися в пустелі"
  hide_in_the_desert_desc:0 "Пустеля — ідеальне місце, щоб сховатися непоміченими. Вона велика і порожня, тож нашим шпигунам буде легко залягти на дно."
  hide_in_the_desert_outcome:0 "На жаль, патрулі Легіону знайшли наших шпигунів, що переховувалися в пустелі. Їх схопили."
  steal_vehicle:0 "Викрасти транспорт"
  steal_vehicle_desc:0 "Два Сонця мають багато гаражів по всій території Легіону, і вони в різному стані. Має бути неважко знайти один відносно неохоронюваний і викрасти одну з їхніх дорогоцінних машин."
  steal_vehicle_outcome:0 "Два Сонця охороняють свій транспорт пильніше, ніж ми думали; наших шпигунів схопили під час спроби втечі."