EXE_ERIC_SMITH_NAME:0 "Ерік Сміт"
EXE_PETER_GARNETT_NAME:0 "Пітер Гарнетт"
EXE_RICHARD_IVERSON_NAME:0 "Річард Айверсон"
EXE_FELIX_TERRELL_NAME:0 "Фелікс Террелл"

EXE_CARTER_NAME:0 "CRO Картер"
EXE_due_diligence:0 "Належна Обачність"
EXE_carter_advisor_desc:0 "Головна Наукова Офіцерка Жанетт Картер очолює всі наукові та інженерні підрозділи Виконавців і є де-факто лідеркою касти вчених. Вона — пристрасна та цілеспрямована жінка, вірна науковим принципам і спадщині експериментального Vault-Tec. Часто конфліктує з МакКінлі через деталі досліджень. Але не через етику — її більше цікавить марнування матеріалів, а не життя. Попри сварки, Картер близька до МакКінлі ще з дитинства й вірна їй у всьому, крім методів експериментів.\n\nЇї головна сфера — генетична інженерія, і вона має деякі з останніх архівів про дослідження ВПЕ із корпоративного Сховища. Саме Картер просуває досліди над істотами пустки, аби витиснути з них хоч щось. Її сміливість зробила її популярною навіть серед охорони — адже краще, щоб монстр помер, ніж хтось із них."

EXE_carter_leader_desc:0 "Головна Наукова Офіцерка Жанетт Картер... [повтор з попереднього, плюс нова частина]\n\nЯкимось дивом тепер вона очолює всю організацію, але твердо має намір зробити з цього максимум."

EXE_MIRANDA_NAME:0 "Міранда Ґріссом"
EXE_inhumane_resources:0 "Нелюдські Ресурси"
EXE_miranda_advisor_desc:0 "Міранда Ґріссом — голова Відділу кадрів Vault-Tec. Її завдання — підбір кадрів та моральний дух працівників. Вона — чарівна й харизматична жінка, яка знає, як роздобути симпатії... або змусити когось говорити.\n\nВідома своїми мотиваційними вправами. Персонал із теплотою згадує рейд на готель Steamboat Springs або спільне катування Мутанта — заради командної ефективності, звісно. Зустрічі Ґріссом — це щось!"

EXE_LOUIS_NAME:0 "Луїс Лофтон"
EXE_organized_raider:0 "Організований Рейдер"
EXE_louis_advisor_desc:0 "Луїс Лофтон — колишній учасник банди Довгих Ножів, знаної в регіоні. Завжди казав, що брак креативу вони компенсували ефективністю.\n\nВтеча від Монстра Сходу розпорошила банду, а сам Луїс приєднався до Виконавців. І хоч радий притулку, терпіти не може їх ексцентричність. Для нього вони креативні, але неефективні.\n\nВін підтримує доктора Картер, сподіваючись, що вона приведе до тями цю циркову компанію. Можливо, він ще відродить славу Довгих Ножів."

EXE_LESLIE_NAME:0 "Леслі Шейд"
EXE_bean_counter:0 "Бухгалтер до кісток"
EXE_leslie_advisor_desc:0 "Леслі Шейд очолює бухгалтерію Vault-Tec. Її завдання — вести фінансову документацію корпоративної діяльності.\n\nЛеслі фактично успадкувала цю посаду від батька. Спершу їй здавалося, що це буде крок уперед — шанс довести свою компетентність.\n\nА потім вона зіштовхнулася з реальністю: спробувати вести облік в організації, яка відверто зневажає облік. МакКінлі й її психи не залишають звітів. Леслі часто дізнається, що тисячі кришок були витрачені на «експеримент», у якому рабів перетворили на фарш — і все це через тиждень після події. Активи зникають із складів, а коли Леслі намагається з’ясувати, де вони — їй погрожують.\n\nЇї батько помер від цирозу печінки. І після всього пережитого, Леслі, схоже, йде тим самим шляхом."

EXE_ANGUS_NAME:0 "Ангус “Різанина” Карнегі"
EXE_explosive_art:0 "Мистецтво Вибуху"
EXE_angus_advisor_desc:0 "Ангус Карнегі — нинішній голова інженерного відділу. Його роль — вигадувати все більш брутальні види озброєння. Наприклад, він обожнює свою ідею «Бабах-Баттеркап» — використання іграшкових конячок для доставки вибухових подарунків. Також він вигадник колючих дротів з пастками: спершу здається, що це лише поріз, а далі жертву розриває на шматки.\n\nДля Ангуса це справжнє мистецтво. Його не можна пришвидшити чи спростити. Біль має бути майстерно завданий і супроводжуватись якнайбільшими збитками. Менше — це провал."

EXE_faceless_goon:0 "Права Рука"
EXE_eric_advisor_desc:0 "Ерік Сміт — новий голова служби безпеки Vault-Tec. Посаду він отримав через «підвищення» — вбивши попереднього начальника на офіційному двобої.\n\nЕрік — людина МакКінлі. А попередній охоронець — ні. А хто керує безпекою, той керує Вищими. Тож МакКінлі керує Ерікому. Вона вибрала його, бо він міцний, але не має амбіцій — просто хоче зарплату й спокій. Ідеальний підлеглий, що не стане обводити «Ворожі Поглинання».\n\nА ці «Поглинання» — значно веселіші, ніж закулісні змови."

EXE_GALLO_NAME:0 "Тімоті Ґалло"
EXE_polite_relations:0 "Ввічливі Відносини"
EXE_gallo_advisor_desc:0 "Тім виріс на історіях про ті часи, коли охорона Vault-Tec була взірцем поваги та дисципліни. Патрулювали коридори, спрямовували жителів із гідністю. Сьогодні — все інакше: побої, хаос.\n\nТім Ґалло хоче повернути повагу. Ввічливість, співпрацю, рукостискання. Він ініціює програми стабілізації відносин із франшизами. Так, це може означати передачу місцевих у рабство й експерименти — але ж усе по-дружньому і з вигодою для всіх, правда?"

EXE_AMELIA_NAME:0 "Амелія Морган"
EXE_motivational_manager:0 "Мотиваційна Менеджерка"
EXE_amelia_advisor_desc:0 "Амелія давно працює менеджером, але нещодавно очолила «Мотиваційний Рух» — офісну кампанію зі зміни культури Vault-Tec. Після того як МакКінлі вирішила, що ліниві менеджери — зло, вона запустила чистку. А Амелія має змусити решту працювати!\n\nВона знає: страх — найкраща мотивація. Отже, “Гаряче Крісло”: працівник мусить встигнути завершити роботу, щоб отримати ключ від бомбового нашийника. Інші дивляться. І вчаться. \n\nДехто плаче через загибель колег. Але МакКінлі потрібні вбивці. І Амелія їм стане."

EXE_NATALIE_NAME:0 "Наталі Паўнд"
EXE_armour_cutting:0 "Бронерізка"
EXE_natalie_advisor_desc:0 "Наталі — директорка з виробництва броні у Vault-Tec. Посаду створили нещодавно через потребу в нових панцерниках для контролю франшиз. Наталі, досвідчену технікиню, кинули на цю роботу.\n\nТиск росте, терміни скорочуються. Відповідь Наталі — інновації. А саме: крадіжки деталей, дешеві сплави, криво припаяна проводка. Можливо, хтось і загине через відмову обладнання — але звіти будуть гарними, а Vault-Tec — у плюсі."

EXE_PEGGY_NAME:0 "Пеґґі"
EXE_tour_captain:0 "Капітанка Екскурсійного Човна"
EXE_peggy_advisor_desc:0 "§g“Що ти верзеш про якусь асиміляцію? Я ж не якась чужинка, ідіоте.”§!\n\nПеґґі — капітанка річкового човна з Нью-Монтроузу. Вона чесно заробляє, перевозячи людей водними шляхами. Платить податок при проході через наші землі.\n\nОдин охоронець підозрював, що вона має «більш прибутковий бізнес» на Колорадо, але ця доповідь необґрунтована й звучить абсурдно. Як каже Ґалло: чого чіплятись до платника податків без доказів?"

