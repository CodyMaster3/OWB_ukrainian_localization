l_english:

EXE_CHIEF_EXECUTIVE_MCKINLEY_NAME: ""Головна" Виконавча МакКінлі"
EXE_CHIEF_EXECUTIVE_MCKINLEY_DESC: "Нова генеральна директорка Vault-Tec, яку підлеглі називають «Головною виконавчою», МакКінлі здобула свою посаду під час щорічного “Ворожого Поглинання” в 2271 році і з того часу її не полишала. Використовуючи передові технології та дослідження, здобуті з Корпоративного Сховища, МакКінлі очолила низку «поглинань» у Нью-Мексико, розширюючи сім’ю франчайзингових спільнот Vault-Tec. Хоча, за її словами, вона б воліла просто вбити всіх і пограбувати тіла.\n\nЯк CEO, МакКінлі змушена була покинути свої численні хобі заради вищих прибутків і зростання. Малювання кишками по стінах, ширяння на джеті, особисті рейди — тепер усе це поза межами дозволеного. Втім, вона має те, чого не має ніхто: можливість запускати нові експерименти Сховищ просто заради розваги!"

EXE_CHIEF_EXECUTIVE_MCKINLEY_SECOND_DESC:0 "За останні роки МакКінлі досягла феноменального успіху як CEO Виконавців, настільки, що організація переросла не тільки своє вигнання, але й саме Корпоративне Сховище. На знак відновлення, Vault-Tec повернувся до класичної корпоративної структури. Більше ніяких смертельних “ворожих поглинань”, де вона забивала конкурентів на смерть. Більше ніякого домінування охорони над іншими відділами. МакКінлі стала легендою компанії — жінкою, яка воскресила Vault-Tec.\n\nНа жаль для неї, разом із респектабельністю прийшли і відповідальність: наради, аудити, напівпрофесійна поведінка. Справжні веселощі відійшли у минуле. Залишається тільки гордість за своє творіння, повага працівників і вечеря з “сяйвом сховища”. Втім, МакКінлі досі дуже небезпечна — і ті, хто стане ворогом Vault-Tec, швидко в цьому переконаються."

