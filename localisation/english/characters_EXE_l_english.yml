# Фокуси Executives
# Передісторія
exe_focus_1_name_key:0 "Страхувальні Інвестиції"
exe_focus_1_desc_key:0 "Ми починали зі скромного — лише як найвеличніша компанія на Землі."

exe_focus_2_name_key:0 "Акції на Історичному Мінімумі"
exe_focus_2_desc_key:0 "Складні часи приходять до всіх. А до нас — прийшли найгірші."

exe_focus_3_name_key:0 "Графік Зростає"
exe_focus_3_desc_key:0 "Ми повертаємось, попри все, що світ кинув у нас. І повертаємось із помстою."

# Філія у Нью-Мексико
exe_business_is_good:0 "Справа Пішла"
exe_business_is_good_desc:0 "Executives керували своїм куточком Нью-Мексико десятиліттями. Вигнані з Корпоративного Сховища через Аттіса та Ініціата ще давно, вони з того часу безтурботно знущались із довірливого населення. Для режиму МакКінлі справи йшли краще ніж будь-коли, але з чутками про рух Легіону на схід, все може швидко змінитись..."

exe_emergency_hiring:0 "Програма Надзвичайного Найму"
exe_emergency_hiring_desc:0 "Бик іде, і нам знадобиться все, що в нас є, щоб він нас не 'викупив'. А ще більше, ніж є. Наймати кожного, хто дихає і має гонор — якщо виживемо, потім скоротимо."

exe_expansion_opportunities:0 "Можливості Розширення"
exe_expansion_opportunities_desc:0 "Легат і його компанія — банкрути, але хаос, який вони лишили, відкрив двері для іншої амбітної групи.\n\nДля нас."

exe_kings_of_new_mexico:0 "Королі Нью-Мексико"
exe_kings_of_new_mexico_desc:0 "Як колись казали: 'Король мертвий'. Із падінням Монстра ми тепер головні на цьому боці Пекосу. Все знову налагоджується. А тепер, без нього на заваді, ми можемо повернути погляд на справжній приз... Корпоративне Сховище."

# Політична гілка
exe_lethal_layoffs:0 "Смертельні Скорочення"
exe_lethal_layoffs_desc:0 "Багато хто з Executives — дармоїди. Вони сидять на зарплаті, і не реагують навіть на найкращу мотиваційну промову чи зустріч. Тож, підвищимо тих, хто справді важливий, а решту — скоротимо. Назавжди."

exe_call_of_science:0 "Поклик Науки"
exe_call_of_science_desc:0 "Від останнього інтерна до вершини виконавчої влади — всі з духом Vault-Tec відчувають поклик Експерименту. Але не всі згодні, як саме слід експериментувати."

exe_bug_rancher:0 "Курс по Вирощуванню Жуків"
exe_bug_rancher_desc:0 "У нас вдома яйцеголові обіцяли величезних жуків, що жертимуть ворогів. Нам потрібні ці кадри назад — і до кінця кварталу!"

exe_pump_it_up:0 "Додай Обертів"
exe_pump_it_up_desc:0 "Раджуки розвиваються, але їм треба бути більшими. Киньте в проблему стільки кришок чи інтернів, скільки треба."

exe_frontline_future:0 "Фронт Майбутнього"
exe_frontline_future_desc:0 "Старий проєкт раджуків у домашньому сховищі мав реальний потенціал. Залишки нотаток і обережні досліди дозволяють нам відродити його. Це наш шлях уперед."

exe_trials_and_tests:0 "Випробування і Тести"
exe_trials_and_tests_desc:0 "Комахи реагують добре, попередні випробування — перспективні. Якщо не поспішати, отримаємо щось дійсно корисне."

exe_greater_field_testing:0 "Масштабні Польові Випробування"
exe_greater_field_testing_desc:0 "Жуки вже достатньо хороші. Випустіть їх. Проєкт офіційно — успішний."

# Experiments Branch
exe_memories_of_the_secret_vault:0 "Спогади про Таємне Сховище"
exe_memories_of_the_secret_vault_desc:0 "Колись ми жили в нашому маленькому раю — Корпоративному Сховищі. Там не все було ідеально, але точно краще, ніж у цьому жорстокому світі. Ми дали собі непогане життя... але могли б мати значно більше. Поки що — це лише мрії. Але одного дня ми повернемося."

exe_better_beast_underground:0 "Краще чудовисько під землею"
exe_better_beast_underground_desc:0 "Відділ досліджень ВПЕ у плачевному стані, але ми знайшли одну лабораторію, що частково вціліла. На щастя, це була та, що досліджувала Кігтів Смерті, а не та, де намагались озброїти ос. Інакше це точно вийшло б з-під контролю."

exe_claws_out:0 "Кігті назовні"
exe_claws_out_desc:0 "Ми знову запустили дослідження Кігтів Смерті, і перші суб’єкти вже готові до польових випробувань. Залишилось лише знайти на кому перевірити..."

exe_eye_of_deathclaw:0 "Око Кігтя Смерті"
exe_eye_of_deathclaw_desc:0 "Картеру вдалося покращити один зі старих проєктів — він знайшов спосіб вилікувати поганий зір у Кігтів Смерті. Це відкриття можна застосувати і до всього відділу ВПЕ."

exe_battlin_beasts:0 "Бойові звірі"
exe_battlin_beasts_desc:0 "Наші новонароджені Кігті Смерті раніше були трохи слабкі. Але з додатковою дозою ВПЕ ми отримали справжніх монстрів. З нетерпінням чекаємо, коли побачимо їх у дії."

exe_metallic_sciences:0 "Відділ Металевих Наук"
exe_metallic_sciences_desc:0 "У руїнах ми почали знаходити уламки наших старих лабораторій з робототехніки, зброї та броні. Знайти щось ціле — справжній жах, але колись треба починати."

exe_gun_electric:0 "Електрогармата"
exe_gun_electric_desc:0 "Запустити виробництво електрозброї майже неможливо, але залишки матеріалів можна використати в нашій броні. Електричні поля на співробітниках — чудова перевага в бою."

exe_spiders_of_steel:0 "Павуки зі сталі"
exe_spiders_of_steel_desc:0 "Шкода, що відділ робототехніки вщент зруйнований... і розплавлений... і радіоактивний. Ті маленькі робот-павуки мали великий потенціал. Уцілілі креслення приводів і шарнірів можна застосувати для вдосконалення силової броні."

exe_edison_armour:0 "Броня Едісона"
exe_edison_armour_desc:0 "Більшість оригінального дизайну втрачено, тож повністю відтворити броню Тесли не вийде. Але Наталі має новий проєкт, майже не гірший, з урахуванням залишків технологій із руїн."

exe_forced_evolution:0 "Примусова еволюція"
exe_forced_evolution_desc:0 "Саме наше дослідження ВПЕ привернуло до нас тих зелених покручів і їх сталевих друзів. Уцілілі нотатки ще можна використати, хоча більшість знищено в домашньому сховищі."

exe_edible_insects:0 "Їстівні комахи"
exe_edible_insects_desc:0 "Не можна заперечувати, що комахи стали однією з найкращих джерел білка у цьому новому світі. Ми можемо спрямувати наше дослідження радтарганів на виведення більших, спокійних особин, придатних для утримання як худоба."

exe_bugnugget_trade:0 "Торгівля Жуком’ясом"
exe_bugnugget_trade_desc:0 "Дослідження йдуть краще, ніж очікувалось — скоро ми будемо просто тонути в жучиному м’ясі. Декілька наших маркетологів вже пропонують запустити масове виробництво для торгівлі."

exe_padded_in_thick:0 "Щільно Напаковані"
exe_padded_in_thick_desc:0 "Збільшені радтаргани корисні не лише як їжа — а й на полі бою. Картер упевнена, що розгадала формулу для виведення нової стабільної та агресивної породи."

exe_far_and_wide:0 "Дані з Далекого й Широкого"
exe_far_and_wide_desc:0 "Ми відкопали термінал з-під купи трупів мутантів — і він ще працює. Серед даних — записи про різні сховища по всій країні."

exe_tales_of_106:0 "Оповідки про Сховище 106"
exe_tales_of_106_desc:0 "Інформація про Сховище 106 обмежена — є лише хімічна формула, схожа на аерозоль. Цікаво, що вона робить?"

exe_tales_of_75:0 "Оповідки про Сховище 75"
exe_tales_of_75_desc:0 "75-те було жорстким — вели активні дослідження з євгеніки. Дивно, скільки сховищ мали подібну мету. Деякі методи тут можна використати для мотивації наших працівників..."

exe_tales_of_22:0 "Оповідки про Сховище 22"
exe_tales_of_22_desc:0 "Уся інформація зі Сховища 22 читається як старий горор-комікс. Незважаючи на ризики — дуже цікаві досліди. Але деякі важливі фрагменти відсутні. Можливо, варто спробувати провести власний експеримент?"

exe_vault_tec_science:0 "Наука Vault-Tec — поза конкуренцією!"
exe_vault_tec_science_desc:0 "Ми майже вичерпали все, що можна було витягти з руїн, але цього вистачило, щоб відновити більшість досліджень наших попередників. У наукового відділу попереду багато роботи — і ще більше відкриттів."

# Corporate Vault Branch
exe_difficult_rivals:0 "Нескладні конкуренти"
exe_difficult_rivals_desc:0 "Після провалу злиття з Биком залишилось багато покидьків, які просто хочуть влаштовувати нам проблеми. Вперті, агресивні, завжди готові до бійки — але саме такі ідеальні для кадрового хантингу."

exe_franchsing_drive:0 "Франчайзингова кампанія"
exe_franchsing_drive_desc:0 "Ми швидко розширились, і це добре — але тільки якщо зможемо все тримати під контролем. У цьому регіоні десятки заштатних містечок і лавок, які треба поставити під контроль і правильно франшизувати, щоб ми не втрачали свою частку прибутку."

exe_im_coming_home_again:0 "Я знову вдома"
exe_im_coming_home_again_desc:0 "Час настав. Мутанти на сході вже не становлять загрози. Наші люди хочуть дім, гідний нашої ваги у золоті — і ми їм його дамо."

exe_a_deal_most_beneficial:0 "Вигідна угода"
exe_a_deal_most_beneficial_desc:0 "Один із цих брудних мутантів виявився чимось на кшталт політика — слизький гігант, відкритий до переговорів. Якщо можна уникнути зайвої крові, чому б і ні. Ще одна велика угода — і майбутнє стане світлішим."

exe_the_stargazers:0 "Зіркопоклонники"
exe_the_stargazers_desc:0 "Зіркопоклонники довго не протримались — надто часто дивились вгору, щоб помітити, що під ногами. Тепер, коли їх не стало, ми можемо забрати собі їхні дивні технології."

exe_mesca_deesca:0 "Деескалація з Мескалеро"
exe_mesca_deesca_desc:0 "Мескалеро — народ впертий, і прибирати їх буде занадто дорого — і в плані кришок, і в плані стажерів. Якщо ми запропонуємо їм вигідніші умови франшизи — менше податків в обмін на допомогу в набігах — цілком можливо домовимось."

exe_other_side_of_summer:0 "З іншого боку літа"
exe_other_side_of_summer_desc:0 "Літня Федерація ніколи не буде нам другом — сльозливі ідеалісти, герої, брудні біженці. Тепер, коли їх не стало, ми можемо забрати все, що в них було."

exe_had_a_church:0 "У них була церква... Тимчасово"
exe_had_a_church_desc:0 "Монахи, що ховали знання у своїх норах, не мали права керувати. Вони були м'ясом. Вони боялись. І правильно робили. Ми заберемо все."

exe_home_sweet_home:0 "Дім, милий дім"
exe_home_sweet_home_desc:0 "Ми повернулись — і світ став гіршим. Розграбування займе час, ремонт — ще більше. Але ми знову на вершині. Як і має бути."

exe_vault_capstone_1:0 "Скарби Сховища"
exe_vault_capstone_1_desc:0 "Купа старої зброї досі розкидана у Сховищі — і від мутантів, і від охорони. З такими знаннями ми можемо знову почати виробництво плазмової зброї. Бо що це за Виконавчий без засобу розплавити когось?"

exe_vault_capstone_2:0 "Резерв"
exe_vault_capstone_2_desc:0 "Сили охорони сховища мали кілька комплектів силової броні, що залишились неушкодженими, попри нищення з боку Аттіса. Забираємо все, що можемо, і підвищимо кількох стажерів до рівня Виконавців."

exe_vault_capstone_3:0 "Що залишилось"
exe_vault_capstone_3_desc:0 "Більшість сховища не вдалося врятувати — зруйновано через чужаків. Йому, мабуть, не повернути колишню велич, але ми зробимо все, що в наших силах."

exe_finishing_reorganization:0 "Завершення реорганізації"
exe_finishing_reorganization_desc:0 "Ми повернулись додому і закріпились. Хоча попереду ще багато роботи, але це вже проблема стажерів. Наша задача — шукати шляхи до зростання і нові джерела прибутку. І трохи покрошити черепів — як бонус для команди."

# Twin Mothers Vault Branch
exe_wonder_women:0 "Чудо-жінки?"
exe_wonder_women_desc:0 "Зі сходу надходять повідомлення про плем’я у горах, яке поклоняється Матерям. Зазвичай ми б сказали: «Кого це хвилює?» — але ці не звичайні дикуни. Всі вони великі, сильні й... занадто здорові для мешканців пустки. Треба дізнатись більше."

exe_something_fishy:0 "Щось тут не так"
exe_something_fishy_desc:0 "Повідомлення підтвердились, і наші розвідники виявили щось цікаве — сховище, про яке ми втратили дані. Сховища — це наша власність. І дослідження, які там проводили — теж. Час зайти в гості."

exe_mystery_of_29:0 "Таємниці Сховища 29"
exe_mystery_of_29_desc:0 "Під час штурму дверей Twin Mothers усе стало досить кривавим, і тепер Сховище — суцільна руїна. Але ми повернули свою власність. Час дізнатись, чим займалась ця Діана."

exe_dna_banks:0 "ДНК-Банки"
exe_dna_banks_desc:0 "Деякі деталі наші науковці розбиратимуть ще роками, але ясно одне: тут вивчали генетику і ДНК. У нас вже є кілька ідей, як використати базові принципи просто зараз."

# Oklahoma Branch
exe_reaching_new_markets:0 "Вихід на нові ринки"
exe_reaching_new_markets_desc:0 "Старі мапи називали цей край OK, а тепер це мішанина з трибалів, згоранців, привидів, казино і гулів зі зброєю. Це хаос, що дозрів для збирання врожаю — тільки франчайзингом ми можемо підняти купу кришок. Готуйте персонал до нового етапу скуповування!"

exe_dirt_worshippers:0 "Поклонники Бруду"
exe_dirt_worshippers_desc:0 "Зазвичай це ми влаштовуємо набіги, але ці виродки мали нахабство напасти першими — влаштували засідку на одну з наших команд. Вони не перетравлюють нічого складнішого за палицю і камінь, тож найняти їх немає сенсу. Краще просто знищити їх і зробити з цього показовий урок."

exe_scrapping_the_lodge:0 "Утилізація Ложі"
exe_scrapping_the_lodge_desc:0 "Те, що такі групи як Компакт і Ложа досі існують, багато говорить про байдужість світу до цього регіону. Але халява закінчилась. А ще їхнє звалище — це справжнє родовище брухту. Час брати своє."

exe_setting_sun:0 "Заходяче сонце"
exe_setting_sun_desc:0 "Сандогів майже можна поважати — вони колись розбили Легіон, і це завжди вражає. Але от амбіцій у них не було: після поразки Паулла вони могли захопити регіон, але нічого не зробили. Це образливо. Їхня історія має скінчитись."

exe_use_more_red:0 "Треба більше червоного"
exe_use_more_red_desc:0 "Трібали майже завжди погані для бізнесу. Їм доводиться пояснювати навіть базові речі, якщо вони взагалі не намагаються встромити тобі списа в живіт. Клани з Розмальованої Скелі не виняток — хоча в бою вони жорстокі, треба визнати. Але ми можемо додати кілька нових мазків на їхні скелі..."

exe_the_real_meat:0 "Справжній шматок"
exe_the_real_meat_desc:0 "Північний схід OK — ось де справжні гроші, і справжні конкуренти. Казіно, божевільні вчені, гулі з гарматами... нам потрібно лише протягнути руки і взяти це."

exe_eastern_threat:0 "Загроза зі сходу"
exe_eastern_threat_desc:0 "Ми повернули наш дім, але ще далеко до справжньої помсти мутантам і братству сталі, що його зруйнували. Ніяких перемир’їв і дружби — ми маємо поставити Техас на коліна. Рекрутингові кампанії, експерименти, вичавлювання кришок з франчайзі — ми йдемо на війну."

exe_green_sideshow:0 "Зелена побічка"
exe_green_sideshow_desc:0 "Аттіс давно здох, але частина його армії досі тиняється тут — то в Братство лізуть, то танками катуються. Вони затримались. І коли ми закінчимо, ніхто вже не згадає ім’я Аттіса."

exe_road_to_texas:0 "Дорога до Техасу"
exe_road_to_texas_desc:0 "Щоб розірвати Техас, треба бити з усіх боків. Їхній друг Лаббок сидить на ключовій дорозі — це нічого особистого, просто бізнес."

exe_leafy_hell:0 "Зелене пекло"
exe_leafy_hell_desc:0 "Цей дивний ліс — золота жила для химерних ресурсів. Можливо, ми навіть знайдемо, чому він такий... дивний. Беріть вогнемети."

exe_dark_clouds_rolling_in:0 "Насуваються темні хмари"
exe_dark_clouds_rolling_in_desc:0 "Наші співробітники готові затопити Техас — великий фінальний двобій настав. Або ми, або Братство Сталі — хтось із нас не переживе цього. І сподіваємось, це буде останній «чесний» бій, що нам доведеться вести."

exe_compliments_of_the_company:0 "З найкращими побажаннями від компанії"
exe_compliments_of_the_company_desc:0 "Братство і його союзники у Техасі розбиті, а ми — нові господарі їхніх міст. Нам ще довго будуть стріляти в спину, але трохи насильства і жменя кришок — і ми почнемо це виправляти."

exe_better_future_below:0 "Світле майбутнє — вгорі і під землею"
exe_better_future_below_desc:0 "Пора міняти імідж. Або, скоріше, відновити справжній бренд. Ми вже не просто Executives. Ми — Vault-Tec. Повернулись. І стали ще кращими."

# Executives – Ideas
exe_healthiest_vault:0 "Найздоровіше Сховище"
exe_pre_war_knowledge:0 "Довоєнні знання"
exe_burgeoning_power:0 "Повелителі Нью-Мексико"
exe_burgeoning_power_desc:0 "З перемогою над Ланієм Executives не мають суперників у Нью-Мексико. Світ став їхньою устрицею..."

exe_homecoming_dreams:0 "Мрії про Сховище"
exe_homecoming_dreams_desc:0 "Вигнані Аттісом, Executives мріють повернутися до Корпоративного Сховища і відновити його. Воно ж належить їм... за правом, чи не так?"

exe_vault_legacy_of_experimentation:0 "Спадок експериментів"
exe_vault_legacy_of_experimentation_desc:0 "Нащадки Vault-Tec'івських вчених, Executives живуть експериментами. Їхня мета — нові способи спричиняти біль або збільшувати прибуток."

exe_memories_of_fev:0 "Спогади про експлуатацію ВПЕ"
exe_memories_of_fev_desc:0 "У часи, коли Сховище було нашим домом, ми роками досліджували ВПЕ. Хоча багато було втрачено при його знищенні, ми зберегли знання — і жагу відкрити більше."

exe_carters_way:0 "Шлях Картер"
exe_carters_way_desc:0 "CRO Джанетт Картер отримала повний контроль над R&D. Вона не краща за МакКінлі в плані етики, але прихильниця послідовної, цілеспрямованої науки. Добра новина для наукового відділу."

exe_dwelling_defenders_idea:0 "Захисники Сховища"
exe_mescalero_training:0 "Філія в Мескалеро"
exe_bug_field_testing_idea:0 "Випустити жуків"
exe_bug_field_testing_idea_desc:0 "Польові випробування радіожуків показують обнадійливі результати. Пора подивитись, як вони покажуть себе на справжньому полі бою."
exe_forced_evolution_idea:0 "Майбутнє еволюції"
exe_forced_evolution_idea_desc:0 "Ми знову опановуємо секрети ВПЕ, і ця нова фаза в нашому розумінні біології відкриває надзвичайні перспективи."
exe_electric_guns_idea:0 "Броня з електрополем"
exe_electric_guns_idea_desc:0 "Додавання електричних елементів до нашої броні забезпечує додатковий удар, і навіть може відлякувати мутантів."
exe_spider_steel_idea:0 "Павучі суглоби"
exe_spider_steel_idea_desc:0 "Залишки від роботизованих екзоскелетів дали нам змогу вдосконалити силову броню — з гнучкістю, про яку інші лише мріють."
exe_edison_armor_idea:0 "Броня Едісона"
exe_edison_armor_idea_desc:0 "Плід багаторічних зусиль Наталі Паунд і відновлених технологій із корпоративного Сховища. Ці костюми майже такі ж добрі, як і ті, що були втрачені, і стали справжнім проривом у наших розробках."

exe_preparing_for_eastern_threat:0 "Більше, ніж Техас"
exe_preparing_for_eastern_threat_desc:0 "Наші вороги зі сходу — справжня загроза. Потрібно почати підготовку до рішучого зіткнення з ними."

exe_legacy_of_75:0 "Спадщина Сховища 75"
exe_legacy_of_75_desc:0 "У цьому Сховищі проводили досліди з євгеніки. Деякі з їхніх методів досі корисні — особливо в контексті «мотивації» персоналу."

exe_legacy_106_profitable:0 "Вигідна спадщина 106"
exe_legacy_106_profitable_desc:0 "Хімікати зі Сховища 106 мають великий потенціал для прибутку. Побічні ефекти? Тільки якщо занадто довго дихати."

exe_legacy_106_relaxing:0 "Розслаблююча спадщина 106"
exe_legacy_106_relaxing_desc:0 "Правильно відфільтрований газ зі Сховища 106 знімає тривогу і робить рабів... слухняними. Доволі зручно."

exe_legacy_106_bloody:0 "Кривава спадщина 106"
exe_legacy_106_bloody_desc:0 "Психотропні речовини з 106 викликають жорстокі спалахи люті. Ідеально для використання в експериментах чи на полі бою."

exe_legacy_of_22:0 "Спадщина Сховища 22"
exe_legacy_of_22_desc:0 "Небезпечні біологічні експерименти з Сховища 22 можуть бути адаптовані в наших власних програмах. Якщо все піде не так — буде що спалити."

# Події
exe_vault.1.t:0 "Пропозиція від Executives"
exe_vault.1.d:0 "Executives пропонують чималу суму кришок за місто Лос. Враховуючи їхнє походження, така пропозиція — очевидна спроба повернутися до Сховища. Місто нам не дуже корисне, але дозволити їм це — серйозне рішення."
exe_vault.1.a:0 "Ми не ведемо переговори з рейдерами."
exe_vault.1.b:0 "Ну, якщо ціна хороша..."

exe_vault.101.t:0 "Вони про це пошкодують"
exe_vault.101.d:0 "Цей зелений велетень у дешевому костюмі нас відшив. Треба було здогадатись, що мутант буде надто тупий для угод. Тепер доведеться брати силою. Повернення додому — наш пріоритет. А помста на послідовниках Аттіса — приємний бонус. Готуємось до ворожого поглинання."
exe_vault.101.a:0 "Зброю до бою"

exe_vault.102.t:0 "Мирне злиття"
exe_vault.102.d:0 "Мутанти погодились на угоду, передали територію і посунули назад до Остіна. Дурні, але поки корисні. Ми ще повернемося за ними, але зараз — головне повернення додому."
exe_vault.102.a:0 "Чудово"

exe_vault.2.t:0 "Пробний запуск"
exe_vault.2.d:0 "[...] «Ми використаємо цього як контрольний зразок. Завтра відкриємо дві клітки й подивимось, скільки втече до того, як час вийде. А потім... імпровізуємо. Можливо, міни.» [...]"
exe_vault.2.a:0 "Щодня — новий експеримент."

exe_vault.3.t:0 "Дім, солодкий дім"
exe_vault.3.d:0 "Корпоративне Сховище було зруйнованим кратером, що лишався радіоактивним навіть через десятиліття. Але тепер його старі господарі повернулись. Старання не пройшли дарма: перші знахідки вже є:"
exe_vault.3.a:0 "Секретний офіс охорони з кількома цілими костюмами броні"
exe_vault.3.b:0 "Обвуглений картотечний шкаф із довоєнним посібником зі зведення Сховищ"
exe_vault.3.c:0 "Божевільний робот, який убив лише п’ять рабів, перш ніж його зупинили"

exe_vault.4.t:0 "Смертельні Скорочення"
exe_vault.4.d:0 "«Давно у нас не було атестацій, але розумієте — справи стали... гарячими, коли ті обіймачі биків зі своїм татком захотіли протягнути те злиття,» — зверталась МакКінлі до присутніх, стоячи в повній броні на високих риштуваннях. Знизу на неї дивилися працівники та інтерни, але її увага була прикута до семи менеджерів, які стояли осторонь, нервуючи все більше з кожним словом. Їхні обладунки та зброю відібрали, натомість вони отримали червоні тканини з логотипом Vault-Tec.\n\n«Не буду вам лити воду, ви тут тому, що не виправдовуєте моїх очікувань. Недостатньо хижості, мало креативу, забагато ігор на піп-боях у туалеті, Шерон. Схоже, ви вже й не хочете бути частиною родини Vault-Tec, тож настав час для справжнього лідерства. Почнемо з вправи на розформування команди.» Менеджери глянули на натовп за собою, озброєних співробітників із усмішками на обличчях. МакКінлі махнула в темряву — і весь ангар спалахнув світлом.\n\nВсередині було облаштовано смугу перешкод: стіни для лазіння, шини, мотузки та високий флагшток. Там ховались пастки, змащені ями з радтарачами та прикутим супер мутантом з кувалдою, якому обіцяли свободу, якщо вб’є хоч одного учасника. МакКінлі з ентузіазмом розвернулась до менеджерів: «Просто — дістаньтеся флагштоку, підніміть свій прапор. Перший, хто впорається — зберігає посаду. Решта — під ніж. Удачі на співбесіді, і не забудьте повеселитися!»\n\nПосмішка під її шоломом була по-справжньому зловісною, коли вона крикнула: «Поїхали!»"
exe_vault.4.a:0 "Звідки в Шерон ніж?!"

exe_vault.5.t:0 "Битва за Тезу"
exe_vault.5.d:0 "Картер схрестила руки: «Я хочу повний контроль над проєктом радтарганів. Повний. Без поспіху.»\n\nМакКінлі осушила пляшку: «Ти ще щаслива, що взагалі дозволила тобі колупатися в тих клятих жуках. Бери скільки хочеш рабів і інтернів — Леслі вже в комі після останнього експерименту.»\n\n«Мені не треба тіла, мені потрібен час і процес. Не все можна вирішити швидко й криваво!»\n\nМакКінлі кинула пляшку в бік — та розбилась об інші скалки. «Ну все, сучко. Хочеш командувати? Тоді покажи, що варта цього. Бийся зі мною, на очах у всіх. Влучиш хоч раз — отримаєш R&D. Все. Зустріч — після обіду, через два дні.»\n\nКартер вийшла мовчки. Її кроки лунали в сталевих коридорах, і вона знала — єдине, що лишається — це..."
exe_vault.5.a:0 "Спробувати чесно"
exe_vault.5.b:0 "Схитрувати"

exe_vault.501.t:0 "Виклалась по повній"
exe_vault.501.d:0 "Натовп працівників радів і глузував, коли Картер впала з дзвоном. Навіть дослідники аплодували. МакКінлі стояла над нею — без жодної подряпини. Картер стискала зуби. Вона дала все, що могла, але не змогла навіть влучити.\n\nМакКінлі нахилилась, схопила її за нагрудник і приготувалась до удару. «Будеш плакати, тітонько?» — Картер в останній момент замахнулась, але МакКінлі схопила її руку. «Оце дух. Але в огляді результатів це не допоможе.» — і вдарила в шолом. Після ще трьох ударів Картер здалась.\n\nВона лежала оглушена, поки МакКінлі не допомогла їй підвестись. «Розуміємо одне одного, Жанет?» — Картер кивнула. МакКінлі поплескала її по спині: «Не хвилюйся. Я подбаю і про тебе, і про твоїх чортових жуків.»"
exe_vault.501.a:0 "Краще не змогла"

exe_vault.502.t:0 "Розум перемагає силу"
exe_vault.502.d:0 "Глядачі лунко кричали, коли Картер впала. МакКінлі стояла непошкодженою. Але коли знову нахилилась до Картер, та активувала сюрприз — електричний розряд з її рукавиці вразив МакКінлі. Удар іншою рукою довершив справу — CEO впала. Команда науковців кричала від радості.\n\nМакКінлі швидко підвелась. Картер уже думала, що їй кінець — але бос протягнула руку. «Нічого собі. Що це було?»\n\n«Я і Наталі працювали над цим всю ніч. Твоя обіцянка в силі?»"
exe_vault.502.a:0 "«Домовились.»"

exe_vault.6.t:0 "Критичні Випробування"
exe_vault.6.d:0 "Френк важко зітхнув, згорбившись, руки в жовтуватій, блідій крові. Він мив підлогу на підрівні сховища, коли через стіну раптом прорвалася гігантська мураха. Двері одразу перейшли в режим безпеки й заблокували його всередині. Почалася відчайдушна битва — старіючий інтерн зламав свою швабру, щоб зробити з неї спис. Комаха померла з щелепами, що досі впивалися в його щиколотку, а зламаний держак стирчав із її голови.\n\nЦе все спостерігалось через камеру в іншій кімнаті двома молодшими дослідниками та МакКінлі. Більшість науковців відмовилися бути присутніми, але МакКінлі була в захваті. Вона вказала на монітор пивом і промовила: «Добре використав майно компанії. Ну, ми не дізнаємось, наскільки смертоносні укуси гігантських мурах, поки цей не помре. Запускайте наступного!» Дослідники метушливо почали готуватись до наступної фази.\n\nФренк почув гуркіт — ще одна дірка у стіні. Він вирвав спис із щелеп і приготувався. «Мені точно не платять достатньо за це лайно», — пробурмотів він."
exe_vault.6.a:0 "«12 укусів... нічого собі.»"

exe_vault.7.t:0 "Науковий Процес"
exe_vault.7.d:0 "Головна дослідниця Жанет Картер зняла окуляри та рукавички, виходячи з медичного крила. За нею ішла CEO Виконавців — МакКінлі. «Не впевнена, що це найкраще використання полонених мутантів. Їх же не вирощують на гідропоніці.»\n\nМакКінлі знизала плечима: «А я, чесно кажучи, й гадки не маю, звідки вони. З тієї Каліфорнії, про яку вони кричать? Але скажи мені, що може бути кориснішим, ніж знання, як ламати їм кістки?»\n\nКартер з роздратуванням обернулась: «Може, як працює їхній імунітет до радіації? Як зробити з них слухняну робочу силу? Я можу придумати купу корисніших речей. Ви просто розважаєтесь... пані», — додала вона з паузою.\n\nВажка рука МакКінлі ляснула їй по плечу: «Я й справді розважаюсь. А ти знаєш, яка я, коли мені нудно. Щастить тобі, що я тебе люблю, бо за такий тон можна й отримати.»"
exe_vault.7.a:0 "«Публічно я буду чемна.»"

exe_vault.8.t:0 "Жуки в Порядку"
exe_vault.8.d:0 "МакКінлі та Картер сиділи поруч — перша вже на четвертому пиві — дивлячись на монітори. Відбувались бойові випробування нового виду радтарганів, і ці комахи шматували найманців. Ті думали, що зачищають руїни, а натомість стали мішенню біозброї. «Бачиш? Все чудово працює», — пробурмотіла МакКінлі, вказуючи на екран, де раджук під шквалом куль роздер ворога.\n\n«Виступають... адекватно», — Картер була задоволена, хоч і намагалася зберігати професійну витримку. Стільки безсонних ночей, купа змін — але вони працювали.\n\n«Адекватно? Та пішла ти. Ти зробила крутих жуків, Жанет.» МакКінлі плеснула її по плечу, вручила пиво й обійняла. «Розслабся, дивись шоу.» На одному з екранів усе залило кров'ю. Картер мимоволі усміхнулася й прошепотіла:"
exe_vault.8.a:0 "«Так, ти права.»"

exe_vault.9.t:0 "Ворожа Злиття"
exe_vault.9.d:0 "Щорічне «Вороже Злиття» мало от-от початися. Начальник охорони Ерік Сміт зайшов у підготовчу кімнату, де була МакКінлі. Технік ще налаштовував її силову броню, і коли все було готово, CEO відпустила персонал, щоб поговорити зі Смітом наодинці — така вже у них традиція.\n\n«Готова, бос?» — Сміт оглянув броню на слабкі місця.\n\n«Завжди. І як цьогорічний претендент?»\n\n«Молодий, сильний, прямолінійний, дурний. Все за правилами.»\n\n«Чудово. Почнімо.» Вона розім’яла броню — і за кілька хвилин вийшла з кімнати. Через ще кілька хвилин її молот добив опонента."
exe_vault.9.a:0 "До зустрічі наступного року!"
exe_vault.9.b:0 "Шкода, що це останнє злиття."
EXE_takeovers_end_tt:0 "§gПісля створення Ради Директорів Vault-Tec потреба у щорічному злитті зникла. МакКінлі влаштовує фінальну церемонію прощання з традицією.§!"

exe_vault.10.t:0 "Плоди Сховища 75"
exe_vault.10.d:0 "Менеджерка Амелія Морган задоволено спостерігала за новим Центром Оцінювання. Надихнувшись даними з далекого Сховища 75, вона подала запит на створення нового центру тестування персоналу. МакКінлі погодила — аби встигли за кілька тижнів. Морган усе зробила вчасно, навіть за менший бюджет, і тепер пишалась результатом.\n\nРяди бігових доріжок, ваг, терміналів і тирів — усе зайнято. Науковці записували дані, тестуючи всіх до межі. Запах поту, крові та блювоти наповнював повітря. Інакше й не могло бути — адже найгірших «переказували» до «Аптопленду». Морган усміхнулась. У 75 це була вигадка, а тут — реальність. Вона побачила, як одна з працівниць ледь не загинула під гантеллю. Вчасно втрутилися техніки. Морган задоволено кивнула."
exe_vault.10.a:0 "«Оця — справжня трудяга.»"

exe_vault.11.t:0 "Плоди Сховища 106"
exe_vault.11.d:0 "«Завершити експеримент. І усунути суб’єкта,» — сказала Картер, передаючи помічнику лазерну гвинтівку. У цей момент пролунав звук відкриття дверей сховища — до кімнати зайшла МакКінлі.\n\n«Чула, там весело було. Я встигла?» — Картер просто вказала на монітор, де останній піддослідний розчинявся в лазері серед понівечених тіл. «Йой. А з тим що сталося?» — МакКінлі кивнула на труп у кутку.\n\n«Газ виявився потужним галюциногеном. Спершу ейфорія, а потім — агресія. Почали кричати, битися, а потім розірвали одне одного. Той у кутку почав здирати собі обличчя, кричав про хробаків.» — Картер сіла, занотовуючи дані у свій піп-бой.\n\n«Круто. Ось чому я не пропускаю досліди. Дивіться, що можна зробити з цією штукою. І касету з відео мені принесіть.» — МакКінлі вийшла, залишивши Картер у роздумах."
exe_vault.11.a:0 "«Можна як наркотик продати.»"
exe_vault.11.b:0 "«Може, витягнемо підсилювач агресії.»"
exe_vault.11.c:0 "«Зброю зробити?»"

exe_vault.12.t:0 "Плоди Сховища 22"
exe_vault.12.d:0 "«Ми виділили достатньо генів, аби, можливо, вивести спори. У такому разі врожайність збільшиться. Але є ризик прориву. Або ж зупинимось зараз, уникаючи ризикованих напрямів, і отримаємо помірне зростання родючості.» — Нервовий молодший дослідник Гарольдс не зводив очей із піп-боя.\n\nКартер замислено відповіла: «Краще призупинити. Уже одне сховище це знищило.»\n\nМакКінлі відкоркувала пляшку: «А подивитись на цвілевих зомбі не хочеш? Ми ж розумніші за тих слабаків із 22-го.» Картер лиш похитала головою.\n\nГарольдс запитав: «Що мені робити, пані?»"
exe_vault.12.a:0 "«Впораєшся, продовжуй.»"
exe_vault.12.b:0 "«Роби, як сказала Картер.»"

exe_vault.13.t:0 "Гнилі Плоди 22"
exe_vault.13.d:0 "МакКінлі ще раз вдарила — череп Гарольдса розлетівся на шматки. Вона пожбурила тіло в іншого зараженого, а потім розтрощила і його. «Невезучий, але ти був правий щодо прориву», — кинула вона до тіла. Їй уже набридли ці споровики. Перевіривши запальнички, вона подумала:\n\n«Добре, що Картер вимагала винести досліди з головної бази. І Наталі покращила фільтри в броні.» Взявши свій молот, вона рушила далі. Її зброя проносилася крізь голови заражених, вбиваючи їх одного за одним.\n\nВстановивши вибухівку, вона почала відступ, поливаючи коридори вогнем. «Час забиратись звідси.»"
exe_vault.13.a:0 "«Мені терміново потрібен душ для дезактивації.»"

exe_vault.14.t:0 "Біла Грива-Різник"
exe_vault.14.d:0 "Помічник охорони Антон блукав обвугленим містом. Офіцер Шона помітила його нерви: «Перша патрулька? За тобою слід із сечі тягнеться, інтерне.» Він кивнув, вона додала: «Чого боїшся? Племен? Вони броню побачать — в штани накладуть.»\n\nЇї слова перервав гуркіт — уламки впали їй на голову, розчавивши. За секунди на загін напали. Антон стріляв навмання, поки не побачив біля себе жінку з білим волоссям, яка стояла на мертвій Шоні.\n\nВін стріляв, але вона ухилялася. Підійшла блискавично, вирвала зброю і зламала її через коліно. Антон не встиг і кліпнути, як вона схопила його за шию..."
exe_vault.14.a:0 "...і викрутила голову"

exe_vault.15.t:0 "Танцюристка Стрічок"
exe_vault.15.d:0 "Головний інженер Ангус «Бійня» Карнегі гордо представив новий прототип: «Зустрічайте — Танцюристка Стрічок!» Чотириногий робот із обертовим корпусом та мотками колючого дроту ожив.\n\n«До дії!» — крикнув Карнегі. Робот рушив на двох жертв. Першого розірвало на шматки. Але другий зміг утекти. Танцюристка погналася, але заплуталась у деревах. Дроти затяглись, робот зламався. Карнегі застрелив утікача та звернувся до натовпу:"
exe_vault.15.a:0 "«Повертаємось до креслень.»"

exe_vault.16.t:0 "Містер Бадді"
exe_vault.16.d:0 "Картер вела МакКінлі у двір. Та здивовано спитала: «Що це?» І замовкла — перед нею стояв справжній робот-тесла.\n\n«Ангус допоміг полагодити. Єдиний Містер Бадді, якого ми змогли оживити.» — пояснила Картер. МакКінлі підійшла ближче, оглядаючи броню та електроканон.\n\n«Якщо зламається — навряд полагодимо. Але я пам’ятала, як ти засмутилась, що всі інші — в хламі. Тож він твій. Вибач, що тримала в таємниці.»\n\nМакКінлі кинулась в обійми: «Найкращий подарунок у житті. Дякую, Джинні.» Картер усміхнулась:"
exe_vault.16.a:0 "«Нема за що, Керол.»"

exe_vault.17.t:0 "Броня Едісона"
exe_vault.17.d:0 "Наталі Паунд, директорка з виробництва броні, кинула викрутку й втомлено впала на табурет. Очі злипалися, і вона вже не була певна, котра година. Здавалося, вона провела у майстерні цілі дні. МакКінлі й Карнегі дихали їй у потилицю, вимагаючи нову модель, тож вона просто замкнулася й працювала, забувши про їжу, воду і навіть душ. Усе це почекає — головне показати, що вона створила.\n\nЗ уламків тесла-ботів, зіпсованих тесла-костюмів із корпоративного сховища та частин іншої броні з Пустки вона зібрала справжнє чудовисько. Тяжча за всі попередні моделі Vault-Tec, нова броня мала високоефективну систему передавання енергії й захисні шокові генератори, здатні підсмажити раджука. Це було не гарно, не стильно, й аж ніяк не «тесла-броня», — думала Наталі. — Але це бодай «броня Едісона»."
exe_vault.17.a:0 "Зійде й так"

exe_vault.18.t:0 "Червона співбесіда"
exe_vault.18.d:0 "Бій навколо завмер, коли двоє ватажків зійшлися віч-на-віч. Решта або втікали, або вмирали. МакКінлі й Вимазаний-У-Червоне спершу обмінялися вогнем з автоматів і дробовиків, зруйнувавши цілу довоєнну будівлю. Потім — рукопаш. Уся Пустка, здавалося, спостерігала.\n\nМакКінлі мала перевагу в силі та броні, але її суперник був прудким і жорстким. Вони билися, не шкодуючи себе. Нарешті МакКінлі пішла на ризик і відкрилась. Її груди пронизала сокира, а її кувалда у відповідь розтрощила бік суперника. Він упав, тримаючись за зламані ребра. Її очко в шоломі було розбите, як і його око. Її броня — побита, як і його тіло.\n\nВитягнувши гачок, що застряг за дюйм від серця, вона подивилася зверху:\n«Ти, чорт забирай, класний. Роботу хочеш?» — простягнула руку."
exe_vault.18.a:0 "Він плюнув"
exe_vault.18.b:0 "Він заговорив"

exe_vault.19.t:0 "Зупинити чудовисько"
exe_vault.19.d:0 "Хоч війна й йшла не на користь Ланію, сам він лишався незламним. Він прорвався через броньовані елітні загони й відбив шість штурмів. Усі були в розпачі — окрім наукового відділу. Вони запропонували план.\n\nЧерез два дні Executives пішли в наступ, МакКінлі на чолі. Але це була пастка. Вона повільно відступала, ведучи Ланія у руїни. Там він викликав її на бій, називаючи боягузливою бабою. Вона лише сміялася, вдаючи втечу — і тоді він потрапив у пастку.\n\nМеталева сітка обвила його й випустила струм, достатній, аби зварити когось із братів смерті. МакКінлі кинулася вперед, розстрілюючи легіонерів і наказуючи своїм атакувати. Вона вже ступила на поваленого легата, коли той сіпнувся."
exe_vault.19.a:0 "«Та він, чорт забирай, живий!»"

exe_vault.20.t:0 "Суб’єкт Л"
exe_vault.20.d:0 "Його тримали у найглибшій комірці, майже в ямі. Їжу та воду спускали зрідка. Виводили лише для випробувань — десятки експериментів, десятки шрамів. Але він не зламався — навпаки. Він ішов до арени з піднятою головою, досі в уламках панцирів раджуків, яких він убив раніше.\n\nЙого справжню броню забрали — тепер вона в кабінеті МакКінлі. Але меч повертали — для боїв. Сьогодні — з новими раджуками. І знову глядачі, і знову ставки — і знову всі, хто ставив проти, програли.\n\nНавіть новий вид раджуків не витримав його натиску. Один за одним — усі загинули. Ланій залишив собі ріг, подивився на натовп, здав меч і повернувся в камеру. Він знав — його тіло заміновано. Але єдина думка тримала його на плаву..."
exe_vault.20.a:0 "«...Я — вищий.»"

exe_vault.21.t:0 "На гачку — і в обличчя"
exe_vault.21.d:0 "Легіонерів було знищити не надто складно, але Ланія — зовсім інша справа. Той або валив ворогів з одного удару, або залишав їх у забутті. Інженер-ветеран Чарльз Джонс висунув новий план: не битися напряму, а заманити Легіата в пастку. Хоч дехто вважав це божевільною затією, МакКінлі дала зелене світло. Джонс і Карнегі працювали цілу ніч.\n\nЗапис жіночого голосу вивів Ланія з табору — той не витримав самої його наявності. Він попрямував із частиною людей у каньйон. Першим етапом стали бочки з ТНТ — легіонери загинули, а Ланій вийшов із хмари пилу — розлючений. І тут йому на голову впі́в фортепіано.\n\nExecutives вже святкували, аж коли пролунав звук фортепіанних клавіш — Ланій піднімався з-під уламків. Він був приголомшений, похитнувся, зробив крок... І саме тоді на нього впала ковадла."
exe_vault.21.a:0 "«Та він же знову живий!»"
exe_vault.22.t:0 "І полетів"
exe_vault.22.d:0 "Ідей щодо випробувань над Ланієм більше не лишилось: він пережив усі тортури й убив усе, що кинули на нього. Executives провели раду. Джонс знову запропонував геніальне: випустити Ланія... буквально.\n\nТиждень потому вся верхівка Executives й кілька молодших працівників зібралися у містечку, де колись упіймали Легіата. Джонс і Карнегі представили найбільшу катапульту у світі. Величезний Ланій виглядав у ній крихітним. «Ви розпусні дегенерати!» — закричав він. Джонс смикнув важіль.\n\nЗа мить Легіат зник у горизонті, наче зірка. Executives святкували. Експеримент із аеродинамікою Легіата вдався. І хоч більше його ніхто не бачив, у Флагстаффі подейкують про кратер у формі Ланія під самими воротами."
exe_vault.22.a:0 "Оце фінал!"
exe_vault.23.t:0 "Думка ззовні"
exe_vault.23.d:0 "— Ангус, ти колись думав зробити просто... рушницю? — запитав Луїс Лофтон, охоронець, що став завсідником науково-карткових вечірок. Раніше він служив у групі, яку розчавив Легіон. І хоч охорона переважно трималася осторонь, Луїс був винятком.\n\n— Яку саме рушницю? З кислотним спреєм? Гарпуном із вибухівкою? — відповів головний інженер Ангус Карнегі, скидаючи всю руку карт.\n\nГоловбух Леслі Шейд зітхнула й відкрила пляшечку віскі. — Віддай, — Луїс вихопив пляшку. — Минулого разу ти грала шість пар.\n\n— Я мав на увазі звичайну. Що стріляє. Кулями. Може, лазерами. Може, просто кращу, ніж зараз.\n\nКартера на іншому боці столу затягнулася сигаретою, не міняючи карт. Вона глянула на Карнегі й спитала:\n— То що скажеш, Ангус?\nТой скривився й пробурмотів:"
exe_vault.23.a:0 "«Гадаю... зможу й таку зробити.»"

exe_vault.24.t:0 "Протягнута рука"
exe_vault.24.d:0 "Тімоті Ґалло, ветеран охорони, крокував вулицями Стімбоут-Спрінґз. Одне з перших міст, що стало франшизою Executives. Одні мешканці відверталися при вигляді силової броні, інші — кланялися або поступалися дорогою. Краще бути другом Старого Ґладгенда, ніж ворогом, — думали вони. За ним котився барвистий віз із браміном.\n\nМер Генсон зустрів його з посмішкою й передав плату за франшизу:\n— І що за цирк ти цього разу привіз, Тім?\n\n— А от бачиш? — Ґалло показав на віз. — Новий товар. Багнагетси. Назва така собі, зате їжа — справжня. Без тирси, поживна, смачна. Маємо вдосталь — можемо торгувати. Скуштуй, я пригощаю. Ти ж знаєш — я не обману, Гарольде."
exe_vault.24.a:0 "«Спробувати не завадить.»"

exe_vault.25.t:0 "Втручання"
exe_vault.25.d:0 "— Вставай, сука, — прогарчала Картер, ляскаючи МакКінлі по обличчю. Та здригнулася, затрусилася, закашлялась. Боліло в грудях, усе тіло свербіло. — Хочеш знати, що сталося? — Картер нахилилась ближче, її голос палав люттю. — Один виродок із охорони всучив тобі пару джетів — і ти зірвалася. Я тебе тут замкнула, й ти знепритомніла.\n\nМакКінлі помітила синці на руках — і на обличчі Картер.\n— Ми билися?.. — хрипко запитала вона.\n\n— Ти не хотіла йти з вечірки, — сухо відповіла Картер.\n\nВона підняла її за плечі й глянула в очі:\n— Я влаштувала тобі ще один курс детоксу. І ти туди підеш. Інакше — я тебе приріжу. Я знаю, де ти спиш. Це й моє ліжко.\n\n— Пробач, Джіні, — розгублено промовила МакКінлі. І зрозуміла, що Картер каже серйозно.\n\n— Ми пройшли надто багато, Керол. Не здавайся. Залишайся зі мною, будь ласка."
exe_vault.25.a:0 "— Обіцяю."

exe_vault.26.t:0 "Перестрахування"
exe_vault.26.d:0 "До Великого Баху, коли світ згорів в екскрементному вогні, Vault-Tec була однією з найбільших компаній світу. Найбільшою, якщо спитати когось з мізками. Найкращі керівники, найрозумніші вчені. Недарма боси старої Америки доручили їм майбутнє. Ми збудували сховища, створили сотні технологій — і були готові до кінця. Насправді, дякуйте нам, що хтось взагалі вижив.\n\nАле дещо треба було тримати при собі. Тому ми створили таємне сховище — зараз зване корпоративним. Найкращі лабораторії, найкращий персонал, найкращі керівники. І навіть запас ВПЕ, «позичений» непомітно. Усе йшло чудово. Розробки електро-зброї, біо-озброєнь, роботів, суперкомп'ютерів, тесли... І купа розкоші до війни, включно з"
exe_vault.26.a:0 "Арсеналом довоєнної зброї"
exe_vault.26.b:0 "Кращими зразками довоєнної медицини"
exe_vault.26.c:0 "Бібліотекою довоєнних книг"

exe_vault.27.t:0 "Акції на дні"
exe_vault.27.d:0 "Завжди знаходиться хтось, хто все зіпсує. Для нас це був блюдолиз по імені Блейк. Його знудило, що ми тестували ВПЕ і радіацію на живих. Наче мертві — кращий варіант. Він здійняв бунт, мало не знищив сховище, а потім утнувся в якогось зомбі-культиста.\n\nМи ще не отямились, як до нас дійшов зелений виродок Еттіс і Сталеві виродки. Ходили чутки, що ми маємо ВПЕ — певно, завдяки Блейку. Мутанти хотіли його для своїх «діток», Сталь — щоби знищити. Єдине корисне з того — вони грохнули Блейка й половину його церкви.\n\nКоли бій закінчився, сховище було вщент. Ми — біженці. Але ми змогли винести"
exe_vault.27.a:0 "Прототипи броні"
exe_vault.27.b:0 "Майже всіх, хто вижив"
exe_vault.27.c:0 "Запаси алкоголю"

exe_vault.28.t:0 "Графік угору"
exe_vault.28.d:0 "Минуло чимало часу з того моменту, як наше сховище пішло під три чорти. Наука відійшла на задній план — яйцеголові не могли вигадати, як подолати монстрів, голод чи конкурентів. Тому охорона взяла кермо. Щоб найсильніший був у керма, ми започаткували «Ворожі Захоплення» — щорічна битва за пост CEO.\n\nСпрацювало. Ми закріпились на поверхні завдяки технологіям і безжальній стратегії. Міста — під франшизою. Беремо плату, забираємо, що треба, збудували нове сховище. Звали нас тепер Executives, бо називати себе Vault-Tec було соромно.\n\nНова CEO — МакКінлі, жорстка, вперта. Вона знову фінансує науку й перезапускає експерименти. Перший був знатний:"
exe_vault.28.a:0 "Виявилось, один гранат достатньо — зсередини"
exe_vault.28.b:0 "«Бутчер Піт», зациклений, зводить гуль до сказу"
exe_vault.28.c:0 "Супермутант таки може зігнути сталеві прути, якщо дати Псайко"

exe_vault.29.t:0 "Відповідальність — і фінансова теж"
exe_vault.29.d:0 "Леслі Шейд, головна бухгалтерка, підійшла ззаду до МакКінлі й Карнегі. Вони спостерігали за битвою нового смерткла в загоні супермутантів. На шосте гучне покашлювання МакКінлі обернулась:\n\n— ЩО?!\n\nПобачивши Леслі, пом’якшилася:\n— Це ти. Ми вже збанкрутіли?\n\n— Можливо... — невпевнено сказала Леслі. — Я не можу дізнатись — жоден аудит не заповнено.\n\nМакКінлі не відривала погляду від шоу. — До речі, прошу — Vault-Shine. Хлопці для тебе відклали.\n\nЛеслі взяла флягу. — Дякую, мем... так, мем."
exe_vault.29.a:0 "«Дякую, мем, так мем.»"

exe_vault.30.t:0 "Що вони там роблять?"
exe_vault.30.d:0 "Звіти з території Матерів-Близнючок були одностайні: трибали великі, сильні й доглянуті. Найвідчайдушніші розвідники навіть схопили кількох жінок племені — вони билися скажено. Картер піддала їх серйозним дослідженням і тепер виступала перед вищим керівництвом — зі слайд-презентацією.\n\n— Отже, — почала вона, — всі Близнючі Матері — у піковому або майже піковому фізичному стані. Високі, без вад, часто надзвичайно сильні. Це або результат селекції, або генетичних змін. А наявність сховища на їх території — додатковий доказ. Пропоную повернути сховище та порівняти матеріали з нашими.\n\nМакКінлі вже давно втратила увагу, але Картер кашлянула:\n— Я справді цього хочу, МакКінлі. Це може дати прорив у моїй роботі.\n\n— Ти впевнена, що просто не хочеш сховище повне сильних жінок? — з усмішкою кинула МакКінлі. Інші засміялись, але Картер лишилась кам'яною.\nМакКінлі знизала плечима:\n"
exe_vault.30.a:0 "— Гаразд, твоя сцена."

exe_vault.31.t:0 "Діани вдома немає"
exe_vault.31.d:0 "Картер йшла поміж терміналів та серверів керівного центру Сховища 29, помітно задоволена. За нею крокував Луїс Лофтон, її охоронець. — То головбос дала тобі це все? — здивовано спитав він.\n\n— Сказала дослівно: «Роби, що хочеш». Це її спосіб бути сентиментальною. І я визнаю — подарунок гідний. — Вона зупинилась біля вимкненого термінала. — Шкода, що ця Діана пішла з системи, не зустрівшись зі мною. Думаю, ми б порозумілися: генетика, біологія, ДНК...\n\n— І що ти з цим усім зробиш? — Картер мовчала. Це займе роки досліджень. Та передусім її цікавила біологія. Нарешті вона сказала:"
exe_vault.31.a:0 "— Новий дослідницький центр"
exe_vault.31.b:0 "— Лабораторії генної терапії"
exe_vault.31.c:0 "— Біозброя"

exe_vault.32.t:0 "Це більше, ніж сода"
exe_vault.32.d:0 "У двері офісу МакКінлі продзеленчало — і відразу вони відчинились. Увійшла Міранда Гріссом, голова HR. А точніше — її каблуки, бо жінка несла здоровенну коробку. — Гарні новини, Керол! — пролунав голос.\n\n— Мене звати МакКінлі. Що це, до біса, таке? — буркнула CEO.\n\nМіранда відкинула кришку з коробки — усередині ряди пляшок Bawls Guarana. — Свята ж... — МакКінлі взяла одну. — Я знала, що техасці шось ховають.\n\n— Я влаштую вечірку, роздам це найкращим працівникам. Але цю — для тебе. — Міранда підморгнула й вийшла. МакКінлі відкрила пляшку, сіла назад у крісло й мовила:"
exe_vault.32.a:0 "— О так, курва!"

exe_vault.33.t:0 "Міська рада"
exe_vault.33.d:0 "МакКінлі зайшла до конференц-залу — і завмерла. Вся старша команда була на місці. — Бунт? Я не витримаю ще одного втручання.\n\nКартер жестом запросила її до голови стола:\n— Це — пропозиція. З урахуванням усього, що ми досягли, ми вважаємо: час знову стати справжньою компанією. Рада директорів, рівна ієрархія, відповідальність, менше насильства.\n\nМакКінлі обвела залу поглядом. Ніхто не виглядав невпевнено. Навіть Сміт і Галло з безпеки схвально кивнули.\n\nКілька годин і ящики пива потому, всі висловились. Лишалась тільки МакКінлі. Вона грюкнула порожньою пляшкою об стіл:\n\n— І ця ваша рада залишить мене CEO, поки я сама не піду?\n\n— Якщо не буде кризи — так. — підтвердила Картер.\n\nМакКінлі зітхнула і відповіла:"
exe_vault.33.a:0 "— Домовились."

exe_vault.34.t:0 "Пташка в клітці"
exe_vault.34.d:0 "— Як, чорт забирай, ти втягнула мене в цей костюм? — буркнула МакКінлі, дивлячись у дзеркало.\n\n— Тобі личить, — посміхнулась Картер, розчісуючи її волосся. — Не хвилюйся, це — разова акція. Ангус записує виступ, його побачить вся компанія. Професіоналізм ще нікого не вбивав. Після вечірки знімеш.\n\n— Обов'язково. Там хоч бухло буде? — МакКінлі торкнулась старих шрамів на обличчі.\n\nКартер пирхнула:\n— Та де ж без нього. Половина ради алкоголіки. Але нічого сильнішого — ти ж знаєш. — Вона обняла її за шию. — Лише одна промова, Керол.\n"
exe_vault.34.a:0 "— Так... Лише одна."

exe_vault.35.t:0 "Vault-Tec знову на зв’язку"
exe_vault.35.d:0 "CEO МакКінлі стояла перед кількома тисячами працівників, у спеціально пошитому синьо-чорному костюмі. Її гучний голос підсилювався мікрофонами і лунав через величезну залу, підготовлену для цієї події.\n\n— Слухайте всі. Я скажу вам, моя родино Vault-Tec, дві речі. Перше — я вами чортово пишаюсь. Кілька років тому ми були на дні: без прибутків, без головного офісу, перед ворожими поглинаннями. Але служба безпеки взяла кермо — і почалась нова ера жорсткого бізнесу. І так, ми порізали чимало горлянок! — Зал вибухнув сміхом і вигуками. — Але тепер ми знову на вершині. Більші, ніж були з моменту, як світ пішов під три чорти. І тому ми більше не просто Executives — ми знову Vault-Tec!\n\nЦьому оголошенню зал аплодував гучніше. МакКінлі стріляла в повітря, щоб повернути увагу. — Друга річ: буде реорганізація. Створюється рада директорів, ворожі виклики — закінчені, і дослідження та адміністрація тепер рівні з безпекою. Менеджери все пояснять. — Реакція була змішаною, але в основі — схвальною. — Все, день вільний!"
exe_vault.35.a:0 "Це викликало найгучніші овації"

exe_vault.36.t:0 "Vault-Tec повернулась"
exe_vault.36.d:0 "Привиди минулого рідко спочивають у пустці. Старий світ постійно дає про себе знати. І сьогодні його ехо гучніше, ніж будь-коли: компанія Vault-Tec повернулась. У пустелі її ім’я викликає різні емоції: рятівник, монстр — або й те, й інше. Що воно означає тепер, ще належить з’ясувати. Одне зрозуміло: Vault-Tec знову серед нас."
exe_vault.36.a:0 "Могили старого світу не мовчать"

exe_vault.37.t:0 "Посів зерна"
exe_vault.37.d:0 "Ерік Сміт і Тімоті Галло, голови охорони, прийшли до офісу Міранди Гріссом, керівниці з кадрів. Вона запросила їх обговорити командну роботу. Галло привітно сів, а Сміт лишився стояти біля дверей. Через кілька хвилин дрібної балаканини він запитав:\n\n— Гріссом, до чого все це?\n\n— О, Ерік, я мало не забула, ти такий тихий! — відповіла вона. — Сядь, ми чекаємо ще одну людину. — Сміт перехрестив руки, але не сів. За хвилину зайшла Картер і вибачилась за запізнення.\n\n— Ну що ж, тепер можна починати. — сказала Гріссом. — Ми хочемо, щоб ви допомогли нам представити Карол пропозицію щодо реструктуризації компанії.\n\nСміт насторожився, але Картер заговорила:\n\n— Зачекай, Ерік. Це не заколот. Якби був — вас би не запросили. І ти знаєш, що я не зраджу МакКінлі. — Сміт кивнув. — Просто вислухайте. Якщо не підтримаєте — ми залишимо цю ідею. Домовились?"
exe_vault.37.a:0 "— Домовились."

exe_vault.38.t:0 "Угода з дияволом?"
exe_vault.38.d:0 "Executives — компанія, що називає себе спадкоємцем Vault-Tec — запропонувала нам торгівлю. Вони хочуть доступу до наших ресурсів в обмін на якісну продукцію Vault-Tec і хімікати зі своїх лабораторій."
exe_vault.38.a:0 "Не бачу зла."
exe_vault.38.b:0 "Нам це не потрібно."

exe_vault.381.t:0 "Нова Каліфорнія погодилась!"
exe_vault.381.d:0 "НКР прийняла нашу пропозицію, торгівля відкрита."
exe_vault.381.a:0 "Чудово"

exe_vault.382.t:0 "Нова Каліфорнія нас відкидає!"
exe_vault.382.d:0 "НКР відмовила — вона лишається потенційною загрозою."
exe_vault.382.a:0 "Так тому і бути"

exe_vault.39.t:0 "Союзники з попелу?"
exe_vault.39.d:0 "Executives — ті самі броньовані профлігати, що тепер панують у Колорадо — запропонували угоду. Вони постачатимуть рабів, а в обмін просили технохламу та денаріїв."
exe_vault.39.a:0 "Прийнятна угода..."
exe_vault.39.b:0 "...для овець."

exe_vault.391.t:0 "Легіон згоден"
exe_vault.391.d:0 "Легіон прийняв угоду. Нехай золото тече."
exe_vault.391.a:0 "Як захопливо"

exe_vault.392.t:0 "Легіон ворожий"
exe_vault.392.d:0 "Орда все ще агресивна. Можливий конфлікт."
exe_vault.392.a:0 "Чорт..."

exe_vault.40.t:0 "Пропозиція від Executives?"
exe_vault.40.d:0 "Executives — компанія з символікою довоєнного Vault-Tec — хоче обміняти предмети розкоші на надлишкову зброю Ріо."
exe_vault.40.a:0 "Чому б і ні?"
exe_vault.40.b:0 "Відмовимося."

exe_vault.401.t:0 "Безпека на Ріо-Ґранде"
exe_vault.401.d:0 "Республіка Ріо-Ґранде прийняла нашу пропозицію."
exe_vault.401.a:0 "Вигідно обом"

exe_vault.402.t:0 "Загроза на Ріо-Ґранде"
exe_vault.402.d:0 "Республіка відмовилась. Вони можуть бути загрозою."
exe_vault.402.a:0 "Слідкувати уважно"

exe_vault.41.t:0 "Vault-Tec на лінії?"
exe_vault.41.d:0 "Солдати в синій броні пропонують інженерів і запчастини до роботів в обмін на... людей?"
exe_vault.41.a:0 "Дешева праця, дорогі деталі."
exe_vault.41.b:0 "Ні, дякуємо."

exe_vault.411.t:0 "Ejército погоджується"
exe_vault.411.d:0 "Армія Мексики прийняла нашу пропозицію. Один кордон — безпечний."
exe_vault.411.a:0 "Відмінно"

exe_vault.412.t:0 "Ejército нас ігнорує"
exe_vault.412.d:0 "Армія Мексики відмовилась — можлива загроза."
exe_vault.412.a:0 "Та він і так шалений"

exe_vault.42.t:0 "Новий Старий Вегас"
exe_vault.42.d:0 "Під запиленими залишками довоєнного містечка Старий Вегас постала новозбудована Вольт-станція E37. Її сталеві стіни наповнені яскравими вогнями, звуками монет і строкатими кольорами — усе, щоби створити досвід справжнього казино. Вольт було створено не лише для експериментів, але й для відпочинку та туризму. Головна зала першого поверху вщерть забита класичними та експериментальними іграми, серед яких — нова електронна лінія Vault-Tec, що дозволяє грати через піп-бой без дилера з виведенням піксельних зображень.\n\nНа другому поверсі інженери вручну змінюють шанси виграшу, а дослідники збирають дані про поведінку гравців. Їхнє завдання — створювати нові ігри, проводити соціальні експерименти й гарантувати, що розважальний підрозділ Vault-Tec завжди лишається у виграші. Найбільші махінації прибережено для чужинців — адже надто багато збанкрутілих працівників псують імідж.\n\nГра вже почалась: мандрівники, які шукають Вегас, дедалі частіше прибувають у райони під контролем Vault-Tec. Поверхневе містечко відроджується — торговці та ділки знову відкривають лавки, обслуговуючи інтернів Vault-Tec. Місто інкорпороване, а отже кожна угода приносить дохід компанії."
exe_vault.42.a:0 "Абсолютно нова концепція"

exe_vault.43.t:0 "Підземелля Зеленого Пекла"
exe_vault.43.d:0 "Збудувати вольт під хаотичним мутованим лісом було не просто. Численні раби та інтерни загинули від хвороб, отруйної флори й мутантів. Проте E245 тепер упевнено стоїть під деревами, кидаючи їм виклик. КРО Картер формально керує вольтом, хоча її присутність там рідкісна. Метою E245 є дослідження мутованої рослинності, її застосування та можливість відтворити спотворений GECK, що породив цю аномалію.\n\nПерші успіхи вже є: знайдено папороть з мутагенними властивостями, подібними до ВПЕ. До результатів — ще роки, але це обнадіює. Просування гальмується постійними сутичками між охороною й агресивним лісом: збирати зразки важко, коли вони атакують у відповідь. Виробництво вогнеметів Vault-Tec триває."
exe_vault.43.a:0 "Недарма Адам і Єва втекли звідси"

exe_vault.44.t:0 "Привидна діра"
exe_vault.44.d:0 "Вольт E14 збудували біля каплиці зруйнованого Ланцюгового Хору, неподалік підземного центру, де колись створили загадкових псайкерів. Дослідники Vault-Tec мало що знають про ті експерименти, тож мають цілі шафи пропозицій, з чого почати. Особливо зацікавлена CEO МакКінлі. Історії про медіумів, що керують розумом, нагадують їй комікси з дитинства.\n\nВона наказала створити дослідницький вольт з метою відтворити деякі результати, що породили хор. Деяким дослідникам вона сказала прямо: «Зробіть мені псайкерські сили. Без демонів і голосів». Прогрес повільний: залишилося небагато документації, й усе доводиться відтворювати з нуля. Ускладнює справу й те, що персонал постійно скаржиться на тривогу та відчуття чужого погляду. Хоча музика їм подобається."
exe_vault.44.a:0 "Напевно, просто здається"

exe_vault.45.t:0 "Особистий ігровий майданчик"
exe_vault.45.d:0 "Вольт під Далласом, E213, будувався за дуже конкретним проєктом. Усе відповідало баченню CEO МакКінлі, яка очолила архітекторів. Її слід — на кожному дюймі. Перший поверх майже стандартний: житло, зручності, пишний офіс. Єдина особливість — велика й популярна зброярня. Нижчі поверхи — ще цікавіші.\n\nОстанній рівень — в’язниця. Тут тримають зрадників, мутантів, агентів Братства. Час від часу когось відпускають у смертоносний лабіринт — пастки, охоронні системи, небезпечні кімнати. Усі їхні рухи записуються. Якщо хтось доходить до першого поверху — його зустрічає МакКінлі. І пропонує роботу. Або смерть."
exe_vault.45.a:0 "CEO теж хоче трохи розваг"

exe_vault.46.t:0 "Справжнє повернення"
exe_vault.46.d:0 "Урочисте відкриття Корпоративного Вольта було справжнім гала-вечором. Присутні — сотні працівників, представники франшиз та союзників. Жодного насильства. Все організовано на найвищому рівні — демонстрація сили, багатства й впливу Vault-Tec.\n\nCEO МакКінлі урочисто відкрила двері, але на екскурсії не пішла — це доручила Гріссом, а сама з Картер вирушила до бару. Настрій — святковий: навіть Леслі Шаде була твереза.\n\nНасправді «відновлення» трохи не точне: руїни старого вольта все ще занадто радіоактивні. Тож новий було збудовано якомога ближче. І він стане новим домом."
exe_vault.46.a:0 "Як і повинно бути"

#executives tooltips

exe_uoa_deal_tt:0 "§gМи надішлемо пропозицію Кітсу: гроші в обмін на місто Лос. §GЯкщо він погодиться, ми знову отримаємо доступ до Корпоративного Сховища...§! §RЯкщо ж відмовиться — ми отримаємо §Oказус беллі§! на місто.§!§!"
