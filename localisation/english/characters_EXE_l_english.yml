EXE_trade_with_ncr_decision:0 "Звернутись до Нової Каліфорнії"
EXE_trade_with_ncr_decision_desc:0 "Наша весела компанія тепер межує з титаном Заходу — Новою Каліфорнійською Республікою. Вони багаті, як ніхто у Пустці, і мають армію, яка їм пасує. Ми маємо вибрати дипломатію — укласти вигідну угоду з НКР."

EXE_trade_with_ces_decision:0 "Зробити пропозицію Легіону"
EXE_trade_with_ces_decision_desc:0 "Ми повинні забезпечити безпеку наших кордонів від усіх загроз — а Легіон це ще яка загроза. Наша пропозиція проста: ми надішлемо їм трохи «підданих», а вони дадуть нам плату й обміняють це на зайві технології."

EXE_trade_with_rrg_decision:0 "Передати сигнал через Ріо-Ґранде"
EXE_trade_with_rrg_decision_desc:0 "Республіка Ріо-Ґранде — тепер наш сусід, і як годиться, час нанести їм візит та домовитись. Товари Вольт-Тек в обмін на їхні надлишкові озброєння."

EXE_trade_with_arm_decision:0 "Спробувати зв'язатися з ШІ, що вважає себе Санта-Анною"
EXE_trade_with_arm_decision_desc:0 "Санта-Анна зі своєю армією роботів стоїть біля наших дверей. Варто знайти з ними спільну мову. Надішлемо їм інженерів Вольт-Тек і запчастини, а вони — робочих для наших «етичних експериментів»."

