##Події
###Подія 1 — відповідь
caps_raider_events.21.t:0 "Сільська місцевість розграбована!"
caps_raider_events.21.d:0 "Ті дурні з §R[FROM.FROM.GetName]§! прорвалися через наші пагорби і вкрали кришки! Схоже, вони пройшли між нашими патрулями та застали наших хлопців зненацька. Це просто брагмінське лайно!"
caps_raider_events.21.a:0 "Зібрати хлопців, зарядити зброю!"

###Подія — відбитий рейд
caps_raider_events.22.t:0 "Рейд відбитий"
caps_raider_events.22.d:0 "Ми відбили кілька рейдів із §R[FROM.FROM.GetName]§! Вони хотіли пробратися між нашими патрулями, але наші хлопці добре постріляли й відправили їх додому з поламаними колінами."
caps_raider_events.22.a:0 "Можливо, варто укріпити захист у §Y[FROM.GetName]§!"

###Подія — успішний рейд
caps_raider_events.1.t:0 "Успішний рейд на село"
caps_raider_events.1.d:0 "Знаєш, це виявилося легше, ніж я думав. Не те щоб я скаржився, але... товстун і високий худий охоронці? Ми просто почекали, поки товстий упустить свій бутерброд — і вже палимо ферми."
caps_raider_events.1.a:0 "Добич! І не найгірша!"

###Подія — вимога данини
caps_raider_events.4.t:0 "Вимога данини"
caps_raider_events.4.d:0 "Рейдери, які ховаються біля нашого кордону, надіслали просте повідомлення: Плати данину або помри (а потім все одно заплати)."
caps_raider_events.4.a:0 "Щоб зберегти мир..."
caps_raider_events.4.b:0 "Ми не піддамося на залякування."
tributized_self_tt:0 "Ми повинні сплачувати данину державі §R[FROM.GetName]§!"
reject_tributized_self_tt:0 "§R[FROM.GetName]§! отримає можливість §Rграбувати§! наші землі"

###Подія — прийняття данини
caps_raider_events.5.t:0 "[FROM.GetName] платить данину"
caps_raider_events.5.d:0 "Наш улюблений метод дипломатії знову показав, хто тут головний. [FROM.GetName] тепер платить НАМ купу кришок, щоб ми не ламали їх цивілізовану показуху. Жодних обіцянок."
caps_raider_events.5.a:0 "Великі гармати — великі гроші."

caps_raider_events.6.t:0 "[FROM.GetName] Відмовили"
caps_raider_events.6.d:0 "О, чоловіче, я ж насправді сподівався, що вони скажуть «ні». Тепер ми можемо трощити їм черепи і ще й отримати за це плату!"
caps_raider_events.6.a:0 "Ми ж намагались бути чемними."

caps_raider_events.8.t:0 "Час данини для §R[FROM.GetName]§!"
caps_raider_events.8.d:0 "Рейдери з §R[FROM.GetName]§! вимагають свою данину."
caps_raider_events.8.a:0 "Дайте їм, що просять..."
caps_raider_events.8.b:0 "Цього разу — ні!"

caps_raider_events.7.t:0 "Розірвана Угода про Данину"
caps_raider_events.7.d:0 "[FROM.GetName] порушили нашу домовленість. Вони більше не бажають платити за привілей залишатись неушкодженими. Час принижувати ботаніків."
caps_raider_events.7.a:0 "Я завжди хотів пудровий перуку!"

broken_tribute_self_tt:0 "Відкриває рішення рейду проти §R[FROM.GetName]§!"

caps_raider_events.31.t:0 "Успішний рейд на [FROM.FROM.FROM.GetName]"
caps_raider_events.31.d:0 "Ми пограбували §R[FROM.FROM.FROM.GetName]§!, ті дурники нічого не запідозрили, і ми втекли з горами кришок! Якби всі завдання були такі прості, я б уже давно вийшов на пенсію... якщо б не любив так сильно все підпалювати."
caps_raider_events.31.a:0 "Якщо будемо й далі так працювати, то скупимо всю Пустку!"

caps_raider_events.32.t:0 "Економічний центр [FROM.GetName] пограбовано"
caps_raider_events.32.d:0 "Наш економічний вузол було пограбовано §R[FROM.FROM.GetName]§!. Знадобиться час на відновлення, і вже зараз багато хто в нашій країні сумує через брак військової сили та захисту, якщо навіть такий важливий вузол може бути атакований так легко."
caps_raider_events.32.a:0 "Велика втрата сьогодні."
caps_raider_events.32.b:0 "«Велика втрата», кажеш? До біса! Мобілізуйте резерви — виб'ємо їм зуби!"

caps_raider_events.3.t:0 "Невдача рейду на [FROM.FROM.FROM.GetName]"
caps_raider_events.3.d:0 "Босе, слухай, я знаю, що ми багато разів казали тобі, що §R[FROM.FROM.FROM.GetName]§! — це важка ціль, і я знаю, що ти нас не дуже слухав... але нічого, наступного разу все вдасться! Просто доведеться дати Ларрі дерев’яну ногу і знайти заміну ще п’ятдесяти двом хлопцям, яких ми втратили."
caps_raider_events.3.a:0 "Сподіваюсь, ми зможемо зібрати банду до того, як вони вирішать, що краще їм бути самостійними."
caps_raider_events.3.b:0 "Просто звинуватимо Ларрі. Він і так весь час кидає вибухівку не туди."

caps_raider_events.2.t:0 "Безрезультатний рейд на [FROM.FROM.FROM.GetName]"
caps_raider_events.2.d:0 "Наші війська не змогли прорвати оборону, тож командири віддали наказ на відступ для перегрупування. Все ж це нічия — і ганебна."
caps_raider_events.2.a:0 "Головне, що повернулись."
caps_raider_events.2.b:0 "Стільки зусиль — і марно?"

caps_raider_events.100.t:0 "Наближення рейду на наші кордони"
caps_raider_events.100.d:0 "Ми дізналися про запланований рейд на наші кришки з боку §R[?FROM.GetName]§! На щастя, ми перехопили повідомлення між рейдерами й дізналися про ціль нападу до того, як вони встигли здивувати нас."
caps_raider_events.100.a:0 "Ми повинні готувати оборону."

caps_raider_events.51.t:0 "Відплата"
caps_raider_events.51.d:0 "Настав час атакувати [?current_raider_reverse_target.GetName], щоб показати їм нашу силу. Мобілізуйте війська, скликайте командування — ми покажемо, що буває, коли з нами зв'язуються!"
caps_raider_events.51.a:0 "Розпочати підготовку!"

caps_raider_events.52.t:0 "План вторгнення"
caps_raider_events.52.d:0 "Наші хлопці, які виконували рейди, були схоплені біля кордону [FROM.GetName]. Ми знайшли їх пораненими з посланням: «Поверніть наші гроші і тримайтесь подалі. Інакше...» Схоже, наша остання здобич далася нам не так просто..."
caps_raider_events.52.a:0 "Вони думають, що можуть нам наказувати? До вибухівки, хлопці!"
caps_raider_events.52.b:0 "Ми маємо здобич — нехай собі скиглять."

caps_raider_events.53.t:0 "Відплата провалена"
caps_raider_events.53.d:0 "Сутички закінчились нічиєю. Ми відвели війська і вирішили перегрупуватись."
caps_raider_events.53.a:0 "Вічна боротьба..."

caps_raider_events.54.t:0 "Відступ з [FROM.FROM.FROM.GetName]"
caps_raider_events.54.d:0 "Не віриться, що ми програли! І не тільки програли — вони ще й витрусили з нас усе, поки ми не дивилися! Усі припаси зникли, а трупи обчищені. Хлопці ще довго згадуватимуть напад на [FROM.GetName]..."
caps_raider_events.54.a:0 "Ем... можливо, наступного разу візьмемо когось слабшого."

caps_raider_events.55.t:0 "Відплата"
caps_raider_events.55.d:0 "Нарешті настав день, коли ми об'єдналися як [THIS.GetName] проти покидьків з [FROM.GetName]. Це повинно стримати їх від наших кордонів на деякий час."
caps_raider_events.55.a:0 "Поки що — мир."
