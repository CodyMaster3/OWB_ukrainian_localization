l_english:
is_barbarian:0 "Є варварською нацією"

nf_cwb.1.t:0 "Все згорить!"
nf_cwb.1.d:0 "Вогонь, що поглинає зіпсовані залишки технологій, – лише іскра в порівнянні з полум’ям нашого незламного духу. Ми захопимо жар цієї перемоги й поширимо нашу лють ще далі. Ніхто не зупинить наш наступ. Ми охопимо світ полум’ям нашої сили."
nf_cwb.1.a:0 "Вперед!"

nf_cwb.2.t:0 "Ми подолаємо!"
nf_cwb.2.d:0 "Хоч злісні сили технологій і намагаються стримати нас, ми знову вийшли переможцями. Наші воїни стають дедалі могутнішими з кожним днем. Незабаром ніхто не зможе встояти проти нашої сили."
nf_cwb.2.a:0 "Наша сила зростає!"

nf_cwb.3.t:0 "Воєнна здобич!"
nf_cwb.3.d:0 "Наші завоювання приносять не лише перемоги, а й здобич від тих, хто прагнув закувати світ у кайдани машин. Ми використаємо ці трофеї, аби підживити вогонь нашої безжальної боротьби."
nf_cwb.3.a:0 "Грабуй!"