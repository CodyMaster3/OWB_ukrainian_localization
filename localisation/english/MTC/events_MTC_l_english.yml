l_english:
nf_mtc.1.t:0 "Наша Революція"
nf_mtc.1.d:0 "Ще до самого вторгнення до Канади, народи, що жили в околицях Кетчу, прагнули незалежності. Та навіть після ядерного спустошення, яке охопило світ, Великий Канадський Рівнин майже не змінився — ним і далі правив англоїд зі сходу. Згодом для метисів з’явилася нова можливість знову пролити кров за свою мрію.\n\nЦя можливість проявилася у вигляді невдоволення серед купців на східному кордоні Королівства. І коли зброя почала надходити до Революційних Рад у Реджайні від добродіїв з Півночі й Сходу, стало цілком очевидно, на чиєму боці опиниться майбутня республіка. Разом із зростанням націоналістичної активності зростала й поліцейська активність — вірні гончі пси Королівства здійснювали арешти під виглядом «осушення боліт» і масово засилали людей на каторжні роботи. Воєнний стан став нормою для міських центрів.\n\nКоли Королівська Військова Поліція вирушила на північ для проведення «покарання прикордоння», Атуан дізнався про піднесення Купців на сході, тож наказав своїм осередкам завдати удару. І вже до кінця дня поліція залишилась відрізаною північніше Кетчу, а міліції захопили західні території земель метисів.\n\nУ наступні дні вирішувалося — чи демократія може з’явитися вже зараз, чи ж має чекати зміцнення революції. Це протиріччя породило два імпровізовані політичні табори: §CКонституціоналісти§!, що вірили в необхідність негайного встановлення демократії, аби запобігти появі диктатора, і §0Конфедералісти§!, очолювані армією, які стверджували, що будь-які перешкоди на старті незалежності можуть знищити її повністю."
nf_mtc.1.a:0 "Не можна дати диктаторам часу на зростання!"
nf_mtc.1.b:0 "Революція не має часу на закони!"

nf_mtc.2.t:0 "Побудова Нації"
nf_mtc.2.d:0 "Поки наші хлопці на передовій билися проти псів Королівства, жителі Реджайни сперечались над тим, чим завершаться століття боротьби. Чи матиме республіка сильного центрального лідера, чи влада буде децентралізована й передана сенатові народів?\n\n§0Конфедералісти§! стверджували, що зважаючи на нещодавні перемоги армії, єдиний потужний президент із кабінетом офіцерів Вищого Командування буде найкращим варіантом для Республіки і в мир, і у війну.\n\n§CКонституціоналісти§! ж вказували на ці ж перемоги як доказ того, що армії не потрібна ще більша влада в уряді.\n\nДебати тривали тижнями, адже обидва лідери — Атуан та Етьєн — у цей час або воювали за Кетч проти Йорктону, або вели перемовини з Трьома Ріками про постачання зброї."
nf_mtc.2.a:0 "Ми не можемо дати військовим розчавити демократію."
nf_mtc.2.b:0 "Потрібно лише пришвидшити революцію."

nf_mtc.3.t:0 "Вихідна Допомога"
nf_mtc.3.d:0 "Етьєн нещодавно повернувся з Транскони з новинами — хорошими і поганими. Його спроби отримати фінансування від Трьох Рік увінчались успіхом: вони погодили стабілізаційні інвестиції для нашої промисловості. Однак Етьєн не найтонший дипломат, і його поведінка погіршила нашу репутацію в їхній Республіці.\n\nЦі фабрики стали б величезним проривом для нашого народу, підвищивши рівень життя і зробивши боротьбу більш легітимною навіть для найзапекліших критиків.\n\nНа жаль, Атуан також повернувся, і з ще гіршими новинами. Його спроба прорватися через Кетч закінчилась катастрофою — більшість армії знищено Йорктоном. Це дозволило йому і Військовій Поліції перегрупуватись і розпочати похід на Реджайну. Атуан вимагає передати йому фінансування на відновлення армії. Та чи загроза настільки велика, як він каже — невідомо. Можливо, це просто спроба очорнити Етьєна і зміцнити свої позиції у Вищому Командуванні."
nf_mtc.3.a:0 "Громадське обурення було б катастрофічним"
nf_mtc.3.b:0 "Від цього залежить доля Республіки!"

nf_mtc.4.t:0 "Конгрес Засідає"
nf_mtc.4.d:0 "Почуття та образи, що виникли під час бурхливого становлення Республіки, і досі відлунюють у нинішніх сесіях Конгресу. Хоча армія і керує країною з моменту революції, формально це не хунта — народ вирішив, що це необхідна жертва. Але тепер, коли криза йде на спад, люди знову повинні вирішити: чи варто знову передати мандат правління військовим?"
nf_mtc.4.a:0 "Волю демократії буде почуто"
nf_mtc.4.b:0 "Наша свобода ще не здобута"

nf_mtc.5.t:0 "Друга Коаліція"
nf_mtc.5.d:0 "[MTC.GetLeader] бажає покласти край конфлікту між Королівством і його повстанцями раз і назавжди. Відтак було скликано народ Манітоби для обговорення коаліції задля повалення короля — «народного фронту» в дусі оригінального Канадського Народного Фронту. Хто ж переможе?"
nf_mtc.5.a:0 "Ми битимемось — і матимемо рацію!"
nf_mtc.5.b:0 "Нехай це буде наша остання битва!"
nf_mtc.5.c:0 "Смішні канадці."
nf_mtc.5.e:0 "Буржуазні дурні, всі до одного."

nf_mtc.6.t:0 "Простягнута Рука"
nf_mtc.6.d:0 "Конгрес Метисів простягнув нам «пропозицію» захисту від зовнішніх загроз, передусім — Кривавих Електоралів. Очевидно, це ультиматум, що змушує нас відмовитися від незалежності. Але чи маємо ми, маленька та знесилена нація, інший вибір?"
nf_mtc.6.a:0 "Заради добробуту нашого народу..."
nf_mtc.6.b:0 "Історія згадає наш спротив війнам!"

nf_mtc.7.t:0 "Несподівана Відповідь"
nf_mtc.7.d:0 "Крихітна нація Мус-Джо відмовилася прийняти наш ультиматум.\n\nЇхня відповідь:\n\n«Покоління ваших дітей вчитимуть, як ви вирізали беззахисних і мирних. Ваші солдати підуть не проти ворога зі зброєю, а в землю, що не становить жодної загрози. І коли вони повернуться до домівок, замість славетних історій хоробрості — їм доведеться мовчки крокувати під поглядами байдужих людей і жити з усвідомленням, що вони знищили.»\n\nНехай прокляття впаде на вас і ваш народ.\n\n— Еверетт"
nf_mtc.7.a:0 "Ем... гаразд?"

nf_mtc.8.t:0 "Назад на Шляху"
nf_mtc.8.d:0 "Родини Двигунів зібралися у Колісній Хаті, обговорюючи листа від Етьєна. Тон його листа ясно вказує на серйозність відмови. Вони сперечаються годинами: чи щирий він? Чи це спроба уникнути мисливців Конгресу? Чи дійсно вони думають, що Божевільні Поїзди — буквально божевільні? Минуло багато часу, доки нарешті заговорив Кондуктор..."
nf_mtc.8.a:0 "Він бажає добра нашому народу."
nf_mtc.8.b:0 "Його брехня — це отрута, яка знищить нашу культуру!"

nf_mtc.9.t:0 "Хто Не Ризикує — Той Не Вагон"
nf_mtc.9.d:0 "Привіт, Етьєне.\n\nІди до біса.\n\nЩиро ваш — Кондуктор та його Родини."
nf_mtc.9.a:0 "Ну це вже зайве."

nf_mtc.10.t:0 "Виправдані Рейдери"
nf_mtc.10.d:0 "Брати й сестри нашої громади не повинні забувати про своє важке минуле — часи, коли ми відмовляли у мирі світу, і коли ми відвернулися від закликів метисів під час їхньої боротьби за свободу. Ми були сліпі до страждань — і це наш гріх. Але тепер вони знову звертаються до нас за допомогою, і можливо, саме зараз ми маємо шанс спокутувати свої провини. Я залишаю це рішення за вами, хто нині сидить у Домі Господа."
nf_mtc.10.a:0 "Господь показав нам шлях до спокути."
nf_mtc.10.b:0 "Ми не змиємо свої гріхи участю у помсті."

nf_mtc.11.t:0 "Вони Знову Відвертаються"
nf_mtc.11.d:0 "Пастор Ельбо надіслав відкритого листа, в якому просить нас відмовитись від шляху кривавої помсти. Він пропонує землю і людей як покуту за минулі гріхи, але заявляє, що ніколи не допоможе нашому «сатанинському рейдовому походу»."
nf_mtc.11.a:0 "Одним шляхом чи іншим..."

nf_mtc.12.t:0 "Метиси Простягають Запрошення"
nf_mtc.12.d:0 "Метисський Конгрес і Республіка Трьох Рік поновили свою коаліцію — фактично, це Антикоролівський Пакт. Вони запрошують нас приєднатись для взаємного захисту, але це порушить нашу давню політику нейтралітету."
nf_mtc.12.a:0 "Можливо, час змінити наші погляди..."
nf_mtc.12.b:0 "Ми ж не просто так колись сказали 'ні'..."

nf_mtc.13.t:0 "Друга Відмова Мус-Джо"
nf_mtc.13.d:0 "Штат Мус-Джо вирішив і надалі триматися своєї політики нейтралітету, відхиливши нашу пропозицію об'єднатися проти Манітобського Королівства."
nf_mtc.13.a:0 "Якщо вони хочуть залишитись осторонь історії — так тому й бути."
nf_mtc.13.b:0 "Вони не залишили нам вибору."

nf_mtc.14.t:0 "Скликано Північний Конгрес"
nf_mtc.14.d:0 "Після розриву відносин з Республікою Трьох Рік, Метисський Конгрес вирішив самостійно вибудовувати зовнішню політику. Чи призведе це до миру чи до нової хвилі кровопролиття — покаже час. Але одне ясно: така регіональна сила, як Конгрес, змінить політичну карту Канади."
nf_mtc.14.a:0 "Вітаємо у Північному Конгресі!"
nf_mtc.14.b:0 "Це буде цікаво..."
nf_mtc.14.c:0 "Можливо, настав час для удару."

nf_mtc.15.t:0 "Запит Від Прем'єра"
nf_mtc.15.d:0 "Прем'єр-Міністр Метисського Конгресу порушив питання можливого військового союзу, де ми будемо молодшим партнером у боротьбі проти північних рейдерів, Великого Стампіду й відродженого Манітобського Королівства. Чи зрадимо ми свої принципи і незалежність заради безпеки?"
nf_mtc.15.a:0 "У нас немає іншого вибору"
nf_mtc.15.b:0 "Наші моральні засади міцніші за багнети"

nf_mtc.18.t:0 "Тріумф Демократії"
nf_mtc.18.d:0 "Етьєн нарешті зайняв місце в президентському палаці, хоча йому це більше нагадувало бункер. Тепер він може взятися за справу — подолати спільну історію конфлікту. Спершу він вирішив посадити кілька папоротей і найняти декоратора. Цілком очевидно, що жоден із попередників з ЦНЛ не мав творчого мислення — адже сірий і чорний кольори не пасують до природної краси міста.\n\nПротягом років нація загрузла в стагнації, чекаючи, поки Атуан завершить свій шалений хрестовий похід проти власних поразок. Але тепер, коли його усунули, місто нарешті знову може рухатись уперед. Хоча Етьєн сповнений надій, він не дурень. Він знає, що посадити квіти — недостатньо, аби захистити землю від нових загроз. Тому, водночас із відмежуванням від майже фанатичного культу Атуана, він усе ж готується до можливої оборони Республіки від її історичних ворогів.\n\nІ поки світло повертається в Столицю, Атуан та його найближчі радники похмуро сидять у залах Конгресу та кабінетах. Не таємниця, що напруга останніх виборів значною мірою була спричинена давнім суперництвом, якому не зміг зарадити навіть спільний революційний досвід. Атуан не приховує зневаги, спостерігаючи, як Етьєн виносить з палацу золоті скіпетри й військові портрети, щоби віддати їх до музею. Етьєн, помітивши цього стоїчного старого, перехоплює його ще до того, як той іде до кабінету. І передає Атуану два щоденники в шкіряній палітурці, з вигравіюваним символом нескінченності метисів. Зношені, очевидно давні..."
nf_mtc.18.a:0 "“Ти й сам добре знаєш нашу історію.”"

nf_mtc.19.t:0 "Сила Нашої Спадщини"
nf_mtc.19.d:0 "Наша мішана спадщина бере свій початок у XVII столітті, коли французькі купці, намагаючись укріпити хутрову торгівлю, почали взаємодіяти з різними корінними племенами. Попри конфлікти, ці мисливці на хутро та корінні народи побудували мережу поселень і торгових постів по всьому континенту.\n\nЦьому супроводжували «шлюби за звичаєм країни» — союзи між французькими чоловіками та корінними жінками, що поєднували традиції обох народів. Попри початкову критику з боку торгових компаній, як європейці, так і корінні народи заохочували ці союзи, бо вони сприяли економічному процвітанню. Чоловіки займалися торгівлею, а жінки допомагали у навігації, виготовляли інструменти, сушили харчі й будували каное. Саме ці союзи дали початок етногенезу метисів.\n\nМинав час, але наш народ залишався ключовим елементом торгівлі, а наші зусилля з об'єднання культур тривали й під час конфліктів. Ми — нащадки вправних мисливців і дипломатів. Саме ці риси допомогли нам пережити лихоліття — від репресій урядів до анархії пустки. Та коли східні й західні сусіди знову загрожують Канаді, саме ці риси допоможуть нам захистити свободу — не лише для метисів, а й для всіх вільних людей Півночі."
nf_mtc.19.a:0 "Саме так."

nf_mtc.20.t:0 "Купці з Метисів"
nf_mtc.20.d:0 "Купці з метиських земель у південному Саскачевані прибули на річковий берег у спробі відновити торгівлю. Вони пропонують добрива з місцевих калійних шахт, стверджуючи, що ці речовини допоможуть рослинам пережити зиму, якщо їх внести навесні чи влітку. Взамін вони просять стару вогнепальну зброю для захисту новозвільненого населення. Колись Конфедерація Залізного Народу допомогла метисам у їх боротьбі за свободу. Можливо, час повернути цей борг?"
nf_mtc.20.a:0 "Вони завжди можуть на нас покластись."
nf_mtc.20.b:0 "Ввічливо відмовимо."

nf_mtc.21.t:0 "[IRC.GetNameDefCap] Погодились"
nf_mtc.21.d:0 "На щастя, наші давні союзники з Крії не забули минулого й погодились на нашу пропозицію. Сподіваємось, наші ресурси стануть їм так само корисними, як їх допомога — нам."
nf_mtc.21.a:0 "Надійні, як завжди."

nf_mtc.22.t:0 "[IRC.GetNameDefCap] Відмовили"
nf_mtc.22.d:0 "На жаль, племена Крії на півночі відхилили нашу торгову пропозицію, заявивши, що не можуть дозволити собі передати жодної зброї у нинішніх обставинах. З огляду на їхні загрози, це прикра, але зрозуміла відповідь. Сподіваємося, що це не зашкодить нашим довгостроковим відносинам."
nf_mtc.22.a:0 "Бажаємо їм удачі."

nf_mtc.23.t:0 "Мова Під Загрозою"
nf_mtc.23.d:0 "Можливо, найвиразнішою рисою метисів є наша мова — мічиф. Вона має кілька діалектів, що поєднують крі та французьку, відображаючи нашу змішану ідентичність.\n\nУ XIX–XX століттях мічиф зазнала суттєвого занепаду через колоніальну політику Канади. Кількість мовців скоротилась до кількох сотень. Але, що парадоксально, саме американська окупація Канади частково врятувала мову. В умовах жорсткого режиму метиські повстанці почали використовувати мічиф — особливо діалекти з переважанням крі — як засіб безпечного спілкування. Обмеження на пересування також сприяли зростанню писемності мовою мічиф перед Великою Війною.\n\nОднак Королівство Манітоба, навчившись на помилках американців, вирішило повністю знищити мову. Воно заборонило всі мови, які не визнавав королівський уряд. У результаті багаторічної політики грамотність на мічиф знову опинилася під загрозою. Кульмінацією цього стало підпал бібліотек у Реджайні з початком повстання, внаслідок чого зникли безцінні архіви.\n\nЦей варварський акт затьмарив нашу перемогу і зменшив бажання народу до нових конфліктів. Та зараз, коли Манітоба знову на межі, уникнути боротьби вже не вдасться. Лідери громади та уряду повинні вирішити, як зберегти мічиф та нашу ширшу культуру. Реформісти пропонують локальні ініціативи, наголошуючи на історичному збереженні, тоді як інші закликають до масштабної державної програми з відновлення мови й формування потужної національної ідентичності."
nf_mtc.23.a:0 "Місцеві ініціативи досягнуть успіху з підтримкою."
mtc_modernize_our_stance_tt:0 "Відкриває національний фокус §YСучасна Позиція§!."
nf_mtc.23.b:0 "Федеральне втручання — єдиний шлях."
mtc_federalize_the_revitalization_tt:0 "Відкриває національний фокус §YФедералізувати Відродження§!."

nf_mtc.24.t:0 "Аудієнція з Токала"
nf_mtc.24.d:0 "Історія метисів та сіу — це низка конфліктів і перемир’їв. Ми настільки загрузли в боротьбі за території, що не зосередились на справжніх колонізаторах, які змусили нас ділити крихти від колишніх земель. Та після Битви при Літтл-Біггорн, коли уряд США був змушений діяти, Сіттінг Булл вивів свій загін до Канади замість капітуляції. Коли вичерпалась їжа й зникли бізони, саме французько-канадський торговець, союзник метисів Жан-Луї Легаре, віддав усе, що мав, щоб урятувати сіу.\n\nУ час, коли більшість мешканців пустки втратили зв'язок із предками, народ Стендінґ-Рок не забув минулого. Їхня історія — джерело вогню в серцях, і ця пам’ять формує їхню дипломатію: вони не вірять порожнім обіцянкам. Але у вчинках — доказ. Якщо нагадати їм про Легаре, навіть попри посилення войовничості серед їхніх братств, можливо, ми досягнемо союзу, якого не вдалося нашим предкам."
nf_mtc.24.a:0 "Ми повинні спробувати."

nf_mtc.25.t:0 "Петиція Метисів"
nf_mtc.25.d:0 "До нас прибула група дипломатів із [MTC.GetNameDef], що просить зустрічі з нашим вождем. [STR.GetLeader] здивувалася, коли замість суперечок про минуле, вони запропонували посилену економічну та військову співпрацю. Історично наші стосунки з метисами були... м’яко кажучи, нестабільними. Але сама Кіт-Фокс не мала до них особливої думки. Адже жодна зі сторін не дотримувалась усіх угод, а підсумком стало століття під каблуком Манітоби. Навіть якщо приставити рушницю до скроні короля — метиси все одно запропонують 'переговори'.\n\nОднак несподіваним було почути, як вони розбили Манітобу і змусили її короля тікати. Вони нагадали про допомогу, яку колись надали великому вождю Сіттінгу Буллу. Ці метиси шукають не лише доброзичливості, а справжнього союзу — міцного, двостороннього. Минуле не зітреться за день, і хоча [STR.GetLeader] залишилася обережною, аргументи метисів були на диво переконливими."
nf_mtc.25.a:0 "Це даремна справа."
nf_mtc.25.b:0 "Це потребуватиме часу..."

nf_mtc.26.t:0 "[STR.GetName] Приймає"
nf_mtc.26.d:0 "Наші дипломати повернулися з новинами про те, що Шаппа Вагнер із [STR.GetName] прийняв нашу пропозицію щодо подальшої співпраці між нашими народами. Сіу ще не готові до відкритого військового союзу, однак вони висунули умови для поступового зближення. Головні з них — відновлення історичного договору між нашими націями та взаємна обіцянка надання військової допомоги у найважчі часи, крім обміну певними технологіями."
nf_mtc.26.a:0 "Чудово"

nf_mtc.27.t:0 "[STR.GetName] Відхиляє"
nf_mtc.27.d:0 "На жаль, Шаппа Вагнер із [STR.GetName] повністю проігнорував наше звернення щодо співпраці. Схоже, наша пропозиція взагалі не викликала у них жодного інтересу. Хоча дипломатам дозволили пройти без перешкод, і ніякої відкритої ворожості не виявлено, це може свідчити про те, що Кіт-Фокс має власні плани стосовно Манітоби."
nf_mtc.27.a:0 "Ми маємо бути готові до цього." 

