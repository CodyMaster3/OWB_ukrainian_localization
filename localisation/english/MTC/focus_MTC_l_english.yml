  mtc_multiculturalism_idea:0 "Мультикультуралізм"
  mtc_multiculturalism_idea_desc:0 "Змішане походження метисів — особливо французьке та крі — надає їм значно більше дипломатичних можливостей, ніж у більшості мешканців пустки, а також сприяє великій винахідливості серед народу."

  mtc_endangered_language:0 "Спустошення Реджайни"
  mtc_endangered_language_desc:0 "Наше повстання проти Королівства Манітоби завершилося перемогою, але для культурної ідентичності метисів це була піррова перемога. Під час тривалих заворушень у місті перед самим повстанням, королівський гарнізон Реджайни намагався виграти час для прибуття підкріплень зі сходу. Їхні зусилля виявилися марними, але підпаливши бібліотеки міста, вони знищили безліч важливих книжок про мову мічиф — серце нашої культури, яка боролася за виживання протягом століть. Цей напад на нашу спадщину досі болить у серцях людей і серйозно підриває їхню волю до участі в будь-якому майбутньому збройному конфлікті — навіть якщо він справедливий."

