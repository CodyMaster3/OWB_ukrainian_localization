l_english:
mtc_our_revolution:0 "Наша Революція"
mtc_our_revolution_desc:0 "У нас завжди були наша земля і наш народ, але власна доля належала нам лише в короткі моменти історії. Діти тих, хто вперше пролив кров за наше майбутнє, тепер самі кладуть життя за ту саму мрію, яку бачать уже століттями."

mtc_nation_building:0 "Побудова Нації"
mtc_nation_building_desc:0 "Недостатньо бути незалежним народом — ми маємо бути ще й ефективним. Ефективним у війні й у мирі. Яке майбутнє матиме наш народ, якщо наша держава розвалиться одразу після народження?"

mtc_development_funds_from_three_rivers:0 "Інвестиції з Трьох Річок"
mtc_development_funds_from_three_rivers_desc:0 "Західні провінції Королівства ніколи не розвивалися належним чином, і тому наша країна досі загрузла в застої. На щастя, якщо ми спалимо кілька мостів на сході, то зможемо виторгувати трохи економічної допомоги від наших братів по зброї."

mtc_congress_is_in_session:0 "Конгрес Засідає"
mtc_congress_is_in_session_desc:0 "Конгрес знову працює, і тому битви та зовнішня політика відходять на другий план — натомість у пріоритеті дискусії й дебати. Хоча голоси було підраховано ще кілька місяців тому, зараз настане справжнє випробування — чи виконають представники волю народу, чи піддадуться корупції."

mtc_choosing_our_national_heroes:0 "Обрати наших Національних Героїв"
mtc_choosing_our_national_heroes_desc:0 "Наша довга і насичена історія залишила нам чимало оповідей, які ми можемо передати молодшим поколінням. Але хто буде нашим символом надії — наполегливий Луї Ріель чи відважний Габріель Дюмон?"

mtc_teachings_of_louis_riel:0 "Вчення Луї Ріеля"
mtc_teachings_of_louis_riel_desc:0 "Шанований політик і дипломат, Луї Ріель був символом надії для нашого народу. Він заснував перший Національний Комітет, що боровся за наші права під час Опору Червоній Ріці. Ріель невтомно домагався гідного ставлення до нашого народу, але зрештою був страчений після політично зрежисованого процесу. Попри це, ми досі несемо його ідеї значно далі, ніж нести свої могли самі канадці."

mtc_poverty_programs:0 "Відкрити Наші Кордони"
mtc_poverty_programs_desc:0 "Занадто довго ми тримали свої кордони закритими для інших. Якщо ми справді хочемо нести спадщину Ріеля, то маємо приймати сусідів, як своїх. Щоб довести, що ми не лицеміри — мусимо ставитись до них так само, як і до наших."

mtc_susbsidized_essentials:0 "Спадщина Лінії Ліків"
mtc_susbsidized_essentials_desc:0 "Кордон між Канадою та США — або ж Лінія Ліків, як ми її називаємо — колись розділив сотні родин. Цей штучний рубіж відокремив наш народ і спричинив численні утиски. Настав час об’єднатися з тими племенами на південь від лінії і знову віднайти спорідненість."

mtc_expansive_defintion_of_metis:0 "Розширене Розуміння Ме́тіс"
mtc_expansive_defintion_of_metis_desc:0 "Протягом століть скептики як зсередини, так і ззовні, ставили під сумнів, хто ж справді є ме́тіс. Що це означає насправді? Можливо, варто виявити більше терпимості до всіх, хто має наші корені й поділяє нашу спадщину?"

mtc_reconcile_with_anglo_metis:0 "Підтримати Племена Нового Світу"
mtc_reconcile_with_anglo_metis_desc:0 "Хоч у минулому ми мали конфлікти з деякими племенами, розумно буде протягнути руку дружби в цьому спустошеному краю. Замість чвар і ворожнечі — запропонуємо їм дипломатію. Це зміцнить усіх нас."

mtc_the_wasteland_metis:0 "Пустка Робить Нас Усіма Ме́тіс"
mtc_the_wasteland_metis_desc:0 "Дотримуючись ідеалів предків, ми досягли глибокого рівня прийняття й процвітання. Тепер тисячі знову визнають своє минуле й знаходять належне місце. Слава Конгресу! Хай живе пам’ять Луї Ріеля!"

mtc_actions_of_gabriel_dumont:0 "Дії Габріеля Дюмона"
mtc_actions_of_gabriel_dumont_desc:0 "Габріель Дюмон був хоробрим воїном, який захищав усіх ме́тіс у численних битвах. На відміну від деяких своїх сучасників, Дюмон не чекав — він діяв, коли нашому народу загрожувала небезпека. Нехай його подвиги надихнуть молодь так, як він надихав своїх товаришів."

mtc_restrictive_definiton_of_metis:0 "Обмежене Розуміння Ме́тіс"
mtc_restrictive_definiton_of_metis_desc:0 "Пустка — жорстокий край, і випробувань було чимало. Визначення чітких меж того, хто є ме́тіс, допоможе нам зосередитися на внутрішніх питаннях і уникнути зовнішніх негараздів."

mtc_metisization:0 "Національна Рада Ме́тіс"
mtc_metisization_desc:0 "Чимало новітніх племен довкола нас досі перебувають під утисками або знаходяться на межі зникнення. Тож замість того, щоб дозволити їм зникнути, як багатьом до них — дамо їм наші автомати й гранати!"

mtc_foundations_of_civilization:0 "Основи Цивілізації"
mtc_foundations_of_civilization_desc:0 "Будь-яка цивілізація, маючи достатньо часу і влади, має змогу виживати самостійно, не покладаючись на надії щодо допомоги ззовні. Ми завжди були винахідливими — ще з часів хутрової торгівлі — і ніколи не повинні залежати ні від кого, крім себе."

mtc_expand_the_metis_works:0 "Розширити Ме́тісні Майстерні"
mtc_expand_the_metis_works_desc:0 "Ми здавна були майстрами та торгівцями, але останнім часом наші ресурси почали вичерпуватися. Настав час прийняти самозабезпечення, профінансувавши будівництво лісопилок і торгових постів по всій країні."

mtc_forged_in_fire:0 "Вигартовані в Вогні Історії"
mtc_forged_in_fire_desc:0 "Ме́тіс не раз були побиті та знищені, але сама наявність нашої культури — доказ нашої сили. Нас вигартувала історія, і ми не маємо наміру бути лише тьмяним вогником — ми згоримо у яскравому полум’ї."

mtc_restrain_the_unbound:0 "Стримати Незв'язаних"
mtc_restrain_the_unbound_desc:0 "«Незв'язані» з півдня без кінця сутичались з нашими прикордонниками. Замість того, щоб дозволяти їм грабувати й палити наші села — стримаємо цих, так званих, нестримних. У нашому Конгресі нема місця для рейдерів."

mtc_a_plea_of_sincerity:0 "Щире Благання"
mtc_a_plea_of_sincerity_desc:0 "Мус-Джо — мирне місце, навіть надто. Але цього миру недостатньо, аби вижити у нових баталіях Канади. Атуан мусить звернутись до Еверетта і його людей із пропозицією вступу до Конгресу на рівних. Ми не можемо дозволити, щоб їхня невинність була зруйнована Електоратом чи навалою «Стада»."

mtc_exploitation_of_the_frontier:0 "Експлуатація Прикордоння"
mtc_exploitation_of_the_frontier_desc:0 "Ми повинні якнайшвидше використати нещодавно повернуті землі. Реалізуємо їх як оборонні бастіони Конгресу. А ті, хто не служить захисту демократії — не заслуговують на її блага."

mtc_end_the_assimilation:0 "Покласти Кінець Асиміляції"
mtc_end_the_assimilation_desc:0 "Так зване «Велике Стадо» — лише опухла пухлина, що пожирає захоплені народи заради наступних завоювань. Це знищення культур мусить скінчитись, доки ще залишилось кого звільняти."

mtc_sway_the_farmers:0 "Перетягнути Фермерів Півдня"
mtc_sway_the_farmers_desc:0 "Фермери на південь від Кетча, які ще недавно годували «Стадо», були звільнені. Їх нещодавнє повернення до нормальності зустрічається радісно. \nТа що нас справді здивувало — це їхня політична обізнаність. Чудно, звідки в них така тяга до демократії? Сумно, що їхню історію було стерто кінними варварськими налетами."

mtc_unity_against_tyranny:0 "Єдність Перед Тиранією"
mtc_unity_against_tyranny_desc:0 "Використовуючи руйнування, завдане зовнішніми ворогами, ми можемо повністю інтегрувати звільнені народи до нашої нації. І хоча ми не є диявольськими загарбниками — краще знати свого правителя, ніж гадати, ким буде наступний."

mtc_face_down_the_electorals:0 "Подивитися Електоралам у Вічі"
mtc_face_down_the_electorals_desc:0 "Народний фронт Канади був непоганою спробою реформувати варварську й жорстоку державу. Та жахи лише посилились з часом і радіацією. Ми вже майже стоїмо перед останнім бастіоном старої Канади, і втечі для чудовиськ не буде."

mtc_provisional_government_of_manitoba:0 "Тимчасовий Уряд Манітоби"
mtc_provisional_government_of_manitoba_desc:0 "Народ Ме́тіс здобув свою країну та своє майбутнє. Ще до того, як Канада створила провінції на заході, Ме́тіс правили землею під назвою Манітоба. Ми завжди мали глибокий зв’язок із цією землею, і наш уряд — теж."

mtc_our_natural_enemies:0 "Скасувати Манітобський Акт"
mtc_our_natural_enemies_desc:0 "Ми дозволяли канадцям правити під загрозою тортур і смертей. Та тепер настав час відкликати нашу підтримку й розтрощити анґлоїдів у їхньому останньому притулку на заході."

mtc_open_the_front:0 "Відкрити Фронт"
mtc_open_the_front_desc:0 "Брендон захоплено, тепер час обійти монархістську нечисть з флангу. А якщо на нашому шляху стоятимуть культисти — ну, вони теж впадуть."

mtc_source_of_the_red_river:0 "Джерело Червоної Ріки"
mtc_source_of_the_red_river_desc:0 "Багато наших людей мешкають уздовж Червоної Ріки — як за правом спадщини, так і через насильницьке переселення Королівством. Тепер вони можуть насолоджуватись демократією, створеною та керованою Ме́тіс."

mtc_clear_the_riff_raff:0 "Вичистити Нечисть"
mtc_clear_the_riff_raff_desc:0 "Щури одного гнізда тримаються разом. А тепер уздовж наших кордонів цих щурів чимало — монархісти, терористи й шпигуни з Трьох Річок. Уже ні для кого не таємниця, що ми — домінантна сила в регіоні. Тож хто може нас зупинити на шляху до нашого остаточного призначення?"

mtc_expell_colonists:0 "Знищити Мрію про «Канаду»"
mtc_expell_colonists_desc:0 "Не існує жодної причини, чому колоніальна, вбивча і вандалістська держава Канада повинна залишатися плямою на наших мапах. Король близький до своєї смерті — і якщо якась сила спробує відродити цю вже тричі знищену націю для гноблення нашого народу, ми завдамо їм великого лиха."

mtc_our_home_upon_the_river:0 "Наш Дім Над Рікою"
mtc_our_home_upon_the_river_desc:0 "Слава Президентові! Слава Республіці! Слава її Народові! Радіймо — наш народ вдома і в безпеці. Вони повертаються з вигнання на заході назад до родючих берегів рік, що їх народили."

mtc_republican_resistance:0 "Опір з Боку Конституціоналістів"
mtc_republican_resistance_desc:0 "Колись шляхетна опозиція перетворилася на тонко завуальований заколотницький рух. Вдаючи, що вони ведуть цивілізовану дискусію, вони насправді блокують фінансування армії і намагаються послабити контроль генералів над підлеглими. Їм не можна довіряти — за жодних обставин."

mtc_lower_the_voting_age:0 "Прив’язати Виборчий Вік до Призовного"
mtc_lower_the_voting_age_desc:0 "Зараз у нас голосують ті, хто у часи небезпеки не буде покликаний захищати Республіку. Це неприпустимо. До того ж, молодь схиляється до радикалів і підривників."

mtc_increase_congressional_guards:0 "Збільшити Охорону Конгресу"
mtc_increase_congressional_guards_desc:0 "§CКонституціоналісти§! показали свою неспроможність вести себе гідно навіть під час звичайної дискусії. Ми введемо охорону (звісно, з лояльних підрозділів армії), щоб забезпечити збереження наших цінних демократичних інституцій."

mtc_bully_opposition:0 "Залякати Опозицію"
mtc_bully_opposition_desc:0 "Єдина мова, яку вони розуміють — це мова сили. Якщо хочуть зруйнувати країну — нехай роблять це пошепки, боячись нашого кулака."

mtc_grease_their_wheels:0 "Змастити Механізми"
mtc_grease_their_wheels_desc:0 "Ці слизькі чиновники не мають ані принципів, ані гідності. Їхні голоси легко купити — достатньо кількох кришок із казни."

mtc_allow_weapons_in_congress:0 "Дозволити Зброю в Конгресі"
mtc_allow_weapons_in_congress_desc:0 "Після нещодавньої паніки було прийнято указ, що дозволяє охороні й Конгресменам носити зброю на засіданнях. На щастя, здебільшого лише наші представники скористались цим послабленням."

mtc_tie_citizenship_to_service:0 "Громадянство за Службу"
mtc_tie_citizenship_to_service_desc:0 "Якщо надати повноцінне громадянство лише тим, хто служив або служить у війську, ми зможемо укріпити контроль і забезпечити, щоб нашою країною керували лише хоробрі."

mtc_worker_battalions:0 "Трудові Батальйони"
mtc_worker_battalions_desc:0 "Кажуть, перемога здобувається на заводах. Тож мобілізуємо наших робітників — нехай принесуть перемогу виробництвом!"

mtc_harvesting_season_pto:0 "Відпустка на Жнива"
mtc_harvesting_season_pto_desc:0 "Багато з наших солдатів мають землю, яку треба обробляти. І якщо ми не дозволимо їм займатися господарством — вони дезертируватимуть. Краще вже дати офіційний дозвіл і уникнути трибуналів."

mtc_instill_military_pride:0 "Виховати Гордість за Армію"
mtc_instill_military_pride_desc:0 "Культ обов’язку й патріотизму, кращі умови служби та підтримка ветеранів створять віддане суспільство. Громадяни не боятимуться майбутнього в лавах армії."

mtc_overemployment_in_check:0 "Контроль Надмірного Призову"
mtc_overemployment_in_check_desc:0 "Ми нарешті стабілізували населення: фабрики й поля працюють, армія повна новобранців. Демократія захищена."

mtc_disgruntled_military:0 "Невдоволене Військо"
mtc_disgruntled_military_desc:0 "Автократичні яструби нарешті усунені народом. Але навіть зараз вони вставляють палки в колеса, перешкоджаючи переходу до влади народу. І, без сумніву, будуть заважати й під час війни."

mtc_address_the_grunts:0 "Звернутись до Рядових"
mtc_address_the_grunts_desc:0 "Багато солдатів прослужили вже роки. Якщо пообіцяти їм, що це буде їхня остання служба — вони це проковтнуть."

mtc_raise_deployment_pay:0 "Підвищити Зарплату в Зоні Бою"
mtc_raise_deployment_pay_desc:0 "Нашим хлопцям на передовій майже нічого не платять. Їхній вклад неоціненний — настав час платити належним чином."

mtc_speak_to_their_liuetenants:0 "Поговорити з Їхніми Лейтенантами"
mtc_speak_to_their_liuetenants_desc:0 "Молоді офіцери, не встигнувши ввібрати сліпу вірність армії, мають більший вплив на рядових — саме до них варто звернутись."

mtc_turn_luxeries_to_necesscities:0 "Зробити Розкіш — Необхідністю"
mtc_turn_luxeries_to_necesscities_desc:0 "Чому ті, хто боронить свободу, мають випрошувати сигари чи побачення з родиною? Нехай бачать матерів, нехай відпочивають скільки треба!"

mtc_punish_expressions_of_disloyalty:0 "Карати за Вияви Нелояльності"
mtc_punish_expressions_of_disloyalty_desc:0 "Деякі з членів вищого командування використовують своє становище, щоб стрибнути в політичну сцену. Подібні дії треба придушити — армія не їхня особиста піар-команда для здобуття м’якого сенаторського крісла."

mtc_new_high_command:0 "Піднести Героїв Революції"
mtc_new_high_command_desc:0 "Вшановуючи героїв нашого повстання, ми здобудемо підтримку солдатів і покажемо, що наша армія будується компетентно. І, можливо, отримаємо ще більше героїв."

mtc_incorporate_new_technologies:0 "Інтегрувати Нові Технології"
mtc_incorporate_new_technologies_desc:0 "Сильна технічна й промислова база — те, що відрізнятиме нашу армію від решти пустки. Військові дослідження часто приносять користь і цивільному населенню."

mtc_ballistics_expertise:0 "Інновації у Вогнепалій Зброї"
mtc_ballistics_expertise_desc:0 "Метиси, особливо у сільських районах, вже вправно користуються старими рушницями для полювання. Варто лише модернізувати зброю — навички вже є."

mtc_prioritize_industrial_machinery:0 "Пріоритет Промисловим Механізмам"
mtc_prioritize_industrial_machinery_desc:0 "Погано забезпечена армія нічого не варта. Виробництво має швидко реагувати на потреби фронту й розробки нових технологій."

mtc_a_well_armed_populace:0 "Озброєне Населення"
mtc_a_well_armed_populace_desc:0 "Колишні генерали зникли — і Конгрес тільки виграв. На зміну їм прийшло молоде покоління революціонерів, а цивільні готові підхопити зброю у разі потреби."

mtc_phase_out_humans:0 "Замінити Людей"
mtc_phase_out_humans_desc:0 "Роботи можуть врятувати наших солдатів. Ми більше не повинні жертвувати молодими метисами заради свободи."

mtc_robot_sensory_training:0 "Надолужити Втрачене"
mtc_robot_sensory_training_desc:0 "Ми не генії, але маємо гори американських прототипів і креслень. Знаряддя наших поневолювачів тепер — наш щит."

mtc_simulation_runs:0 "Симуляції для Роботів"
mtc_simulation_runs_desc:0 "Роботи можуть проганяти симуляції сотні разів за секунду. Жоден сценарій не застане їх зненацька."

mtc_robo_brain_war_games:0 "Військова Рада Робо-Мозків"
mtc_robo_brain_war_games_desc:0 "Робо-Мозки — найсучасніше, що ми маємо. Їх можна використовувати як на передовій, так і у штабах."

mtc_dawn_of_the_juke_bots:0 "Світанок Джук-Ботів"
mtc_dawn_of_the_juke_bots_desc:0 "Ера рукопашного бою відходить у минуле. Ми повинні першими автоматизувати жорстокість, аби нас знову не завоювали."

mtc_council_for_national_liberation:0 "Рада Національного Визволення"
mtc_council_for_national_liberation_desc:0 "Часи змінюються. Ми маємо визначити свій шлях, поки наші сусіди не нав’язали нам свій."

mtc_a_league_of_our_own:0 "Свій Власний Союз"
mtc_a_league_of_our_own_desc:0 "Занадто багато нас пов’язує з Королівством і Уінніпеґом. Ми повинні самі вести себе до майбутнього."

mtc_throw_around_our_weight:0 "Показати Нашу Вагу"
mtc_throw_around_our_weight_desc:0 "Щоб набути ваги у цих буремних часах — ми маємо звернути увагу на сусідів."

mtc_our_deal_with_moosejaw:0 "Угода з Мус-Джо"
mtc_our_deal_with_moosejaw_desc:0 "Мус-Джо — спокійне місто зі сталим народом. Їхня підтримка — ключова."

mtc_rearm_moosejaw:0 "Озброїти Мус-Джо"
mtc_rearm_moosejaw_desc:0 "Мус-Джо — пацифісти, але це не завадить їм виробляти зброю для нас. Ймовірно."

mtc_civilize_the_mad_trains:0 "Знищити Сяючих Жахів"
mtc_civilize_the_mad_trains_desc:0 "[URA.GetNameDefCap] — зграя лютих гульських мутантів, що заважає нашому впливу поширюватися на захід. Ми повинні узяти їхню землю."

mtc_invest_in_train_markets:0 "Інвестувати в Форт Пек"
mtc_invest_in_train_markets_desc:0 "З [URA.GetNameDef] усмиреними, ми можемо нарешті скористатися їхнім потенціалом."

mtc_raider_congregation:0 "Отримати Доступ до Міссурі"
mtc_raider_congregation_desc:0 "[UNB.GetNameDefCap] — сильні гравці. Вони контролюють кордони річки Міссурі. Ми не можемо проґавити цей шанс."

mtc_humanitarian_aid_to_elbo:0 "Постачання Їхніх Майстрів"
mtc_humanitarian_aid_to_elbo_desc:0 "З [1297.GetName] під нашим контролем ми можемо скористатися з Унбаунд. Допомога в їхньому авіаційному божевіллі, ймовірно, зробить їх більш задоволеними під нашою владою."

mtc_end_unlawful_imprisonment:0 "Втеча з Форту Кеп-Гелл"
mtc_end_unlawful_imprisonment_desc:0 "Божевільних тюремників із Форту Кеп-Гелл більше не можна терпіти. Колись ми вигнали їх із Реджайни — тепер виганяємо назавжди!"

mtc_prepare_the_onslaught:0 "Готуватися до Натиску"
mtc_prepare_the_onslaught_desc:0 "Манітоба прийде — чи хочемо ми цього, чи ні. Ми вживемо всіх заходів, щоб бути готовими."

mtc_refurbish_the_national_armories:0 "Оновити Національні Арсенали"
mtc_refurbish_the_national_armories_desc:0 "Армія без арсеналів — це взагалі не армія. Для людей чи машин — ми маємо бути готовими постачати."

mtc_the_last_vestige_of_democracy:0 "Останній Острівець Демократії"
mtc_the_last_vestige_of_democracy_desc:0 "Комплекси МАНІФЕСТ'у у наших межах приховують багато дивних і корисних речей. Можливо, американська компанія виявиться кориснішою, ніж здається…"

mtc_rekindle_commitments:0 "Відновити Присяги"
mtc_rekindle_commitments_desc:0 "Колись ми пліч-о-пліч ішли з Республікою Трьох Річок проти монархії Манітоби. Ми програли.\n\nТепер — не програємо."

mtc_tend_to_our_garden:0 "Доглядати Сад Демократії"
mtc_tend_to_our_garden_desc:0 "Наша іскра знову горить. Час подивитися на сусідів. Якщо Манітоба має впасти — нам потрібні союзники. І ресурси."

mtc_cull_wilted_buds:0 "Прирізати Зів’яле"
mtc_cull_wilted_buds_desc:0 "Унбаунд — банда рейдерів з дивними амбіціями. Прибравши їх і поглинувши їхні ресурси, ми зміцнимо себе."

mtc_our_prize_rose:0 "Наша Призова Троянда"
mtc_our_prize_rose_desc:0 "Мус-Джо завжди були нам друзями. Можливо, варто формалізувати цю дружбу — поки ще не пізно."

mtc_tend_the_weeds:0 "Підрізати Бур’яни"
mtc_tend_the_weeds_desc:0 "Вогонь горить — але без серця не виживе. Ми розпалимо дух народу перед бурею, що гряде з неба."

mtc_no_loose_ends:0 "Жодних Відкритих Питань"
mtc_no_loose_ends_desc:0 "Монархія Манітоби впала, Коаліція перемогла. Після століть поневолення — ми більше не стоїмо під чиїмись ногами."

mtc_march_on_the_marches:0 "Марш на Окраїни"
mtc_march_on_the_marches_desc:0 "Ми маємо силу захищати себе — і тому повинні наступати. Усе: зброя, машини, люди — проти тиранів Манітоби."

mtc_scrap_drives:0 "Збір Металобрухту"
mtc_scrap_drives_desc:0 "Війна з Манітобою потребує частин. Ми можемо вимагати від населення все, що згодиться на заводах."

mtc_troubled_north:0 "Тривожна Північ"
mtc_troubled_north_desc:0 "Північ — осередок безумців і самозванців. Щоб захистити свободу, ми повинні позбутися цих шкідників."

mtc_victory_caps:0 "Кепси Перемоги"
mtc_victory_caps_desc:0 "Багатства Манітоби — тепер наші. Те, що колись забрали у нас — повернуто справедливою розплатою."

mtc_congress_of_peoples:0 "Конгрес Народів"
mtc_congress_of_peoples_desc:0 "Ми стали більшими за себе. Люди вважають нас визволителями. Героями. Можливо, місія Конгресу тільки починається..."

mtc_preservation_of_michif:0 "Суть Культури"
mtc_preservation_of_michif_desc:0 "Мова мічиф пережила колонізацію, окупацію, але пожежі бібліотек Манітоби знищили її записи. Її можна відновити, але за яку ціну — і чи готові ми її заплатити?"

mtc_modernize_our_stance:0 "Оновити Наш Підхід"
mtc_modernize_our_stance_desc:0 "Зникнення мічиф — велика втрата, але є важливіші питання. Ми збережемо мову через місцеві програми. Якщо виживемо — майбутнє покоління продовжить роботу."

mtc_modernize_our_stance_flag:0 "Обрано Місцеві Ініціативи"

mtc_broad_literacy_improvements:0 "Поліпшити Рівень Грамотності"
mtc_broad_literacy_improvements_desc:0 "Грамотність у нас не гірша, ніж у інших, але питання мічиф гальмує розвиток. Підвищивши рівень освіти, ми збережемо і знання, і активність громадян."

mtc_hierarchy_of_needs:0 "Ієрархія Потреб"
mtc_hierarchy_of_needs_desc:0 "Про що забувають прихильники жорсткої мовної політики, так це про те, наскільки сильна національна гордість уже існує серед нашого народу. Культурну ідентичність неможливо встановити законом — що безпечнішим є повсякденне життя громадян, то більше часу і бажання в них буде для пізнання власної історії."

mtc_accept_pidgin_language:0 "Прийняти Варіанти Піджин-Мови"
mtc_accept_pidgin_language_desc:0 "Більшість носіїв мови мічиф користуються її спрощеними формами — піджинами, в яких змішано лексику кількох мов. Прихильники стандартизації завжди намагалися уніфікувати мову, але мічиф із самого початку виник як поєднання французької та крі. У цьому сенсі прийняття діалектів — це продовження її істинної традиції."

mtc_appeal_to_youth:0 "Звернутися до Молоді"
mtc_appeal_to_youth_desc:0 "Захист культури мітчіф має бути спільною справою, яку передають наступним поколінням. Але це можливо лише тоді, коли ми дамо їм можливість стати її частиною. Використовуючи патріотизм, що з’явився після війни за незалежність, ми зможемо надихнути молодь та підняти бойовий дух усього населення."

mtc_rights_for_survivors:0 "Права для Виживших"
mtc_rights_for_survivors_desc:0 "Ми полюбляємо хизуватися нашою відкритістю, але в той час як ми приймаємо інші культури, ставлення до гульських громадян залишається тривожним. Це не лише моральна поразка — ми також втрачаємо їхню мудрість, знання, що сягають ще до Війни. Підкреслюючи їхню цінність, ми зможемо підвищити їхній соціальний статус і водночас дізнатися багато нового."

mtc_safeguarded_history:0 "Захищена Історія"
mtc_safeguarded_history_desc:0 "Ми успішно подолали наслідки спалення Реджайни військами Манітобської Корони, чим заклали фундамент для нових можливостей у навчанні, відновленні й майбутньому розвитку мітчіф перед лицем тих, хто хотів би бачити нас у вогні."

mtc_distinguish_the_culture:0 "Визначити Культурну Ідентичність"
mtc_distinguish_the_culture_desc:0 "Народ мітчіф завжди виходив за межі соціальних та етнічних рамок — саме це стало основою нашого розвитку. Збереження історії має значення, але важливо зробити з неї правильні висновки. Наше походження — це результат злиття різних культур. І прийняття змін через покоління — теж частина нашої ідентичності."

mtc_federalize_the_revitalization:0 "Федералізувати Відродження"
mtc_federalize_the_revitalization_desc:0 "Збереження мови мічиф — недостатньо. Нашій нації потрібне її повне відродження, аж до повсякденного використання. Федеративна підтримка цього процесу пов’яже його успіх із державним апаратом, зробивши мову пріоритетом над усіма іншими бюджетними та політичними питаннями."

mtc_federalize_the_revitalization_flag:0 "Обрано Федеральне Втручання"

mtc_rebuild_the_cultural_centers:0 "Відбудова Культурних Центрів"
mtc_rebuild_the_cultural_centers_desc:0 "Пожежі, які охопили столицю до нашої незалежності, знищили більшість збережених письмових джерел нашої історії та мови. Це стало серйозним ударом по національній гордості. Усі спроби відновити мову мають починатися з відновлення цих інституцій."

mtc_exchange_of_knowledge:0 "Обмін Знаннями"
mtc_exchange_of_knowledge_desc:0 "На південному заході проживає частина народу ассінібойн, що переселились до нас із Північної Монтанії після погіршення умов у регіоні. Вони є нащадками людей із Форт-Пек і мають знання про ремонт старих комп’ютерів. Ці навички допоможуть нам відновити історичні записи, що зберігаються на зламаних машинах."

mtc_contract_digital_archivists:0 "Фінансувати Оцифровку Даних"
mtc_contract_digital_archivists_desc:0 "Реджайна завжди була домівкою багатьох народів ще з часів післявоєнної відбудови, але Королівство свідомо заважало їхній співпраці. Ми можемо виправити це, найнявши фахівців із племені ассінібойн для створення цифрових архівів і захисту нашої спадщини."

mtc_computer_industry:0 "Індустріальна Електроніка"
mtc_computer_industry_desc:0 "Співпраця з ассінібойнами значно розширила наші знання у сфері комп’ютерів, мережевої інфраструктури та базової електроніки. Цей поступ у культурному розвитку став основою для наукового й індустріального прориву."

mtc_code_talkers:0 "Кодомовці 23-го Століття"
mtc_code_talkers_desc:0 "Однією з головних перешкод для поширення мічиф була її практичність. Але із зростанням технологічного рівня ми виявили її цінність у військових умовах — як у зв’язку, так і у контррозвідці. Це її нова ніша. І, можливо, перша з багатьох."

  mtc_fruits_of_our_labor:0 "Плоди Нашої Праці"
  mtc_fruits_of_our_labor_desc:0 "Як виявилось, імпульс збереження нашої мови значно посприяв розвитку інших академічних сфер. Підвищений рівень безпеки в Реджайні та інших міських районах покращив рівень життя нашого народу, зробивши ці зусилля популярнішими і відкривши шлях до подальших інновацій."
  
  mtc_establish_the_flammand_project:0 "Ратифікувати Програму Фламманда"
  mtc_establish_the_flammand_project_desc:0 "Із запуском кампанії з відродження мови Конгрес розпочав обговорення відсутності національної системи формальної освіти. Прихильники відновлення публічної освіти запропонували фінансування цього процесу. Програма, названа «Проєктом Фламманда» на честь родини, відомої своєю підтримкою мови мічиф, зробить викладання мови центральним елементом освітньої програми."
  
  mtc_reenact_legal_protections:0 "Відновити Правовий Захист"
  mtc_reenact_legal_protections_desc:0 "За часів Королівства маріонетки з числа дворян проштовхнули безліч законів і риторики, ворожих до процвітання мови мічиф. Скасування цих законів стало одним із перших рішень Конгресу, проте дорослі, що пам’ятають ті репресії, досі бояться використовувати мову публічно. Щоб відновити їхню впевненість, ми повинні чітко закріпити їхнє право на це у законі."
  
  mtc_pass_reimbursement_program:0 "Запустити Програми Відшкодувань"
  mtc_pass_reimbursement_program_desc:0 "Пожежі в Реджайні зруйнували засоби до існування багатьох людей, а позбавлена доходу людина часто втрачає й свій вплив у громаді. Щоб досягти відродження мови, її носії — група, яка економічно сильно постраждала — повинні покращити свій добробут. Інвестиції в них можуть оживити цілі райони."
  
  mtc_redistribute_government_land:0 "Передати Колишні Володіння Дворян"
  mtc_redistribute_government_land_desc:0 "Великі площі нашої землі були розділені як трофеї між дворянами та королівськими прихвостнями за Королівства. Відтоді як уряд захопив ці території, більшість з них залишались недоторканими — частково через страх розлютити їхніх колишніх власників на сході. Сучасний Конгрес відкидає саму ідею такого страху, і рекомендує використати їх для житла й інших цілей. І так народ отримає назад те, що завжди було його."
  
  mtc_approve_morin_act:0 "Прийняти Акт Моріна"
  mtc_approve_morin_act_desc:0 "Опоненти нашої мовної програми стверджують, що уряд занадто зосереджений на інтелектуальних питаннях, ігноруючи реальні проблеми людей. Вони недооцінюють матеріальні переваги нашого проєкту, але у їхніх словах є доля правди. Названий на честь президента Національної ради метисів Джеральда Моріна, Акт Моріна дотримується його ідеї самоврядування, забезпечуючи робочі місця, де мічиф буде застосовуватись у нових галузях."
  
  mtc_nationalized_education:0 "Націоналізувати Освіту"
  mtc_nationalized_education_desc:0 "Одним із наших перших актів спротиву під час Американської окупації були спроби багатьох метиських громад підірвати або обійти нову пропагандистську систему освіти шляхом домашнього навчання. Це відіграло неоціненну роль у збереженні знань під час бомбардувань завдяки родинним традиціям, але також сприяло ширшому спротиву державній освіті — тенденції, яку наш новий уряд має швидко подолати."
  
  mtc_linguistic_revival:0 "Відродження Мови"
  mtc_linguistic_revival_desc:0 "Мічиф — це серце метиської ідентичності. Наша кампанія з її захисту мала свою ціну, але вона повністю виправдала себе, зміцнивши почуття єдності нашого народу. Тепер як у містах, так і в маленьких поселеннях мова проникає у повсякденне спілкування на рівні з англійською, а слідом за нею починається ренесанс історичних традицій."
  
  mtc_fur_trade_legacy:0 "Спадщина Північноамериканської Торгівлі Хутром"
  mtc_fur_trade_legacy_desc:0 "Зіткнувшись із труднощами пустки, важливо зберегти наше почуття єдності. Ми не повинні забувати уроки історії нашого народу."
  
  mtc_establish_assiniboine_ports:0 "Заснувати Порти на Ассінібойні"
  mtc_establish_assiniboine_ports_desc:0 "Ріки Канади були надзвичайно важливими для наших предків, особливо як життєва артерія для руху людей і товарів. Але після нашого повстання проти королівства доступ до Ассінібойну з західного берега став значно обмеженим. Це варто виправити."
  
  mtc_develop_the_river_docks:0 "Розвинути Річкові Пристані"
  mtc_develop_the_river_docks_desc:0 "Розвиток річкового узбережжя заклав міцну основу для створення великої гавані. Це дозволило нам розпочати ремонт кількох пошкоджених пасажирських човнів і торгових суден, які довго простоювали на березі, а також покращити промислову базу Мусоміна загалом."
  
  mtc_boon_of_river:0 "Дар Ріки"
  mtc_boon_of_river_desc:0 "Разом із ростом гавані розширюються й її можливості. Природні ресурси узбережжя завжди були достатні, але зі стартом торгівлі почали надходити додаткові матеріали, а наша здатність використовувати ріку як джерело енергії та питної води значно зросла. Настільки, що сільські райони стали домівкою для низки нових поселень."

  mtc_promote_ship_manufacturing:0 "Сприяти Суднобудуванню"
  mtc_promote_ship_manufacturing_desc:0 "Ми завжди славилися як вправні кораблебудівники, але ця галузь не процвітала з часу здобуття незалежності від монархії. Подальший розвиток суднобудування був би вельми корисним."

  mtc_birchbark_canoes:0 "Берестяні Каное"
  mtc_birchbark_canoes_desc:0 "Наші ремісники вже давно стикаються з труднощами при виготовленні каное через нестачу берези поблизу. Імпортувати її через Ассінібойн незручно, враховуючи наше... неспокійне минуле з монархією. На щастя, нещодавно у південні притоки Реджайни прибули торговці з лісом і повідомленнями про безлюдні ліси на півночі. Завдяки цьому новому постачанню, дефіцит нарешті можна буде подолати."

  mtc_highway_refurbish:0 "Ремонт Шосе 18"
  mtc_highway_refurbish_desc:0 "Велика війна давно завершилась, але більшість доріг та інфраструктури Канади все ще перебувають у занедбаному стані. Якщо ми хочемо швидко перевозити людей і вантажі нашою землею, спершу маємо відновити шосе, що перетинає південь."

  mtc_potash_mines:0 "Відкриття Калійних Шахт"
  mtc_potash_mines_desc:0 "Холодніші температури зробили землі на південь від Кваппелле менш придатними для сільського господарства, але вони все ще досить родючі, аби компенсувати це. До того ж, тут колись працювали шахти, що видобували сировину для добрив. Їхнє відновлення покращить аграрний сектор і створить робочі місця."

  mtc_local_processing:0 "Локальна Переробка"
  mtc_local_processing_desc:0 "Із самого початку наш народ пишався самозабезпеченням — і вирішення аграрних проблем є тому підтвердженням. Інвестиції у місцеві підприємства, що перероблятимуть корисні копалини на добрива, лише підкреслять це, сприяючи індустріальному розвитку."

  mtc_strong_domestic_markets:0 "Сильні Внутрішні Ринки"
  mtc_strong_domestic_markets_desc:0 "Коли наші люди виробляють товари, що потім повертаються в їхні громади, нерівність у доходах зменшується, а базові послуги стають доступнішими. Це створює стабільний цикл виробництва й споживання, що відкриває шлях до прибуткової торгівлі з іноземцями."

  mtc_potash_exports:0 "Експорт із Північного Саскачевану"
  mtc_potash_exports_desc:0 "Час скористатися перевагами іноземних ринків. [IRC.GetName] були нашими союзниками ще з часів торгівлі хутром і Повстання на Північному Заході під проводом Луї Ріеля. Ми віддячили їм, підтримавши під час їхнього спротиву американській окупації. Калій уже часто використовується місцевими торговцями зброєю, тож чому б не розповсюдити цю практику й далі?"

  mtc_revitalize_weyburn:0 "Відродити Вейберн"
  mtc_revitalize_weyburn_desc:0 "Хоча це й не наша столиця, Вейберн колись був важливим містом Саскачевану. З огляду на потреби у зброї та припасах для розвитку хутрової торгівлі, його відновлення створить зручний осередок для мисливців і пасток, де ті зможуть торгувати і координувати свою діяльність."

  mtc_balanced_beaver_breakfast:0 "Збалансований Сніданок Бобра"
  mtc_balanced_beaver_breakfast_desc:0 "Спершу території проживання бобрів у Канаді майже не постраждали від радіоактивного забруднення. Але коли зниження температур змусило багатьох тварин переселитися південніше, частина з них піддалася опроміненню, що знизило густоту хутра та прибутки для мисливців. Якщо ми запровадимо поживніші культури й рослинність у їхні ареали, цей спад можна буде повернути назад."

  mtc_industrial_heart:0 "Індустріальне Серце"
  mtc_industrial_heart_desc:0 "Разом із відродженням торгівлі відроджується і Реджайна. Перше її відновлення після Великої війни затягнулося, і коли Королівство спалило цивільні квартали, ми знали, що буде потрібно чимало часу для повноцінного відновлення. Та з економікою, яка нарешті зростає без іноземного гніту, цей час, схоже, настав."

  mtc_settling_grudges:0 "Офіційно Примиритися з Лакотою"
  mtc_settling_grudges_desc:0 "У наших силах дати народу сіу той самий мир, що наші предки колись дали їм у знак допомоги. Ми хочемо вшанувати і їх, і себе, простягнувши руки в ім’я наших спільних традицій — особливо якщо це дозволить зберегти наш союз у цю нову епоху."

  mtc_hunter_militias:0 "Мисливські Ополчення"
  mtc_hunter_militias_desc:0 "У часи війни, коли воля нашої нації проходить випробування, навички наших мисливців можуть бути спрямовані й на захист домівок. Формування загонів з цих чоловіків і жінок на заході забезпечить здатність сільських районів стримувати ворога до прибуття головних сил."

  mtc_seasoned_expeditionaries:0 "Досвідчені Дослідники"
  mtc_seasoned_expeditionaries_desc:0 "Коли жінки й чоловіки повертаються з торгівлі в глушині, вони приносять не лише шкури та хутро. Колись ми добре знали великі простори Манітоби й Саскачевану. Але Велика війна докорінно змінила ландшафт, а падіння Королівства змінило його ще раз. Та щоразу, як мисливці діляться розповідями про мандрівки, наша готовність зустріти невідоме тільки зростає."

  mtc_preparing_for_the_storm:0 "Підготуватися до Бурі"
  mtc_preparing_for_the_storm_desc:0 "Ми завжди дбали про захист нашого народу — аж до того, що самі ініціювали удари по потенційних загрозах ще до того, як ті встигали дозріти. Саме для цього наша програма підготовки передбачає регулярні випробування для всіх солдатів, щоб кожен у нашій армії був здатний нести службу."

  mtc_new_world_army:0 "Армія Нового Світу"
  mtc_new_world_army_desc:0 "Прийшов час опанувати нові доктрини, які зміцнять наші сили, щоб ми змогли перейти до вдосконалення тактики й підготовки. Новосвітні зусилля із захисту нашого народу й знищення ворогів відкривають шлях до набагато більшого."

  mtc_call_upon_veterans:0 "Закликати Ветеранів Революції"
  mtc_call_upon_veterans_desc:0 "Наше повстання склалося з тих, хто втомився від правління Манітоби — неорганізованих, але сповнених жаги до свободи від корони. Це прагнення досі має місце в нашій армії, і ми можемо перетворити його на гостру зброю проти ворогів."
  mtc_call_upon_veterans_tt:0 "2 підрозділи спецпризначення з'являться в Реджайні"

  mtc_the_modern_voyagours:0 "Сучасні Вояжери"
  mtc_the_modern_voyagours_desc:0 "Вояжери — герої фольклору, що перевозили хутро на каное, — були прикладом витривалості, сили й духу. Ми з гордістю беремо на себе їхню спадщину, адже наші воїни не поступаються їм у міці, а то й перевершують."

  mtc_extensive_preparedness:0 "Повна Готовність"
  mtc_extensive_preparedness_desc:0 "Якщо наші солдати будуть готові до будь-яких випробувань, ми зможемо гарантувати їхню безпеку — особливо, якщо забезпечимо їх усім необхідним з голови до п’ят."

  mtc_self_sufficient_forces:0 "Самодостатні Сили"
  mtc_self_sufficient_forces_desc:0 "Наш народ завжди був винахідливим — особливо у пошуку їжі й її зберіганні. Ми можемо інтегрувати ці навички в навчання наших підрозділів, щоб зробити їх повністю самозабезпеченими. Це також зміцнить почуття підтримки й довіри між ними."

  mtc_aviation_development:0 "Авіаційний Розвиток Реджайни"
  mtc_aviation_development_desc:0 "Дослідження старого аеродрому поблизу Реджайни виявило антикварні біплани з напівпрацездатними двигунами. Ангари, де вони зберігались, охороняли гарнізони Королівства — ймовірно, з надією колись переправити техніку на схід. Тепер, коли ці ресурси в наших руках, ми можемо використати їх для власних досліджень."

  mtc_airfield_restoration:0 "Відновлення Аеродрому"
  mtc_airfield_restoration_desc:0 "У своєму розквіті південний схід Саскачевану був домівкою багатьох злітно-посадкових смуг. Завдяки новим знанням ми зможемо повернути їх до робочого стану, а заразом — відновити деякі з простих літаків, що зберігались поблизу."

  mtc_prairie_bomber_practice:0 "Вивчення Траєкторій Бомбометання"
  mtc_prairie_bomber_practice_desc:0 "Відкриті, рівні землі — ідеальне місце для навчання пілотів поводженню з важкими боєприпасами. Завдяки цьому ми зможемо ефективно використовувати легкі бомбардувальники на підтримку наземних військ або тяжкі — для знищення ворожих укріплень. У будь-якому разі, це дасть нам змогу повноцінно використовувати повітряний простір, захищений нашими новими винищувачами."

  mtc_prairie_flight_training:0 "Польоти Над Преріями"
  mtc_prairie_flight_training_desc:0 "Ще задовго до Великої війни канадські прерії використовувались як місце для підготовки пілотів завдяки своїм просторим і відкритим ландшафтам. І сьогодні ці самі характеристики можуть принести нам не менше користі."

  mtc_study_engine_blueprints:0 "Вивчення Схем Двигунів"
  mtc_study_engine_blueprints_desc:0 "Вивчення старих креслень, а ще краще — надання таких креслень нашій інженерній команді, безумовно, поглибить їхнє розуміння авіаційних конструкцій старого світу й дозволить нам розробити власні, можливо навіть досконаліші."

  mtc_old_world_firepower:0 "Вогнева Міць Старого Світу"
  mtc_old_world_firepower_desc:0 "Зміцнивши організацію наших наземних і повітряних сил, ми примножили свою міць удесятеро. Тепер ми можемо повною мірою використати бойову силу армій старого світу — потужну артилерію, що сиплеться з небес, навіть якщо її випущено із землі."

