  mtc_empowered_army:0 "Основи для Заміни"
  mtc_empowered_army_desc:0 "Армії не можна довіряти у справах політики й дипломатії, тому ми розпочали закладання основ для заміни войовничої, егоїстичної старої гвардії на молодих і найрозумніших. Сподіваємося, це мінімізує їхній вплив на політичну сцену."

  mtc_empowered_president:0 "Уповноважений Президент"
  mtc_empowered_president_desc:0 "Лише Президенту можна довірити ведення армії до перемоги — і це доведено як у нещодавніх, так і в історичних битвах. \n§7Слава Головнокомандувачу!§!"

  mtc_checks_and_balances:0 "Контроль і Баланс"
  mtc_checks_and_balances_desc:0 "Хоча нам не вдалося запобігти піднесенню армії, ми можемо обмежити її вплив на наші інституції завдяки вправній політичній боротьбі."

  mtc_elevated_high_command:0 "Посилене Високе Командування"
  mtc_elevated_high_command_desc:0 "Армії потрібна можливість впливати на внутрішню політику, якщо вона хоче ефективно вести війни."

  mtc_march_on_marches:0 "Марш по Околиці"
  mtc_scrap_drives_idea:0 "Скасування Мобілізацій"

  mtc_disgruntled_military_personal:0 "Обурений Особовий Склад"
  mtc_disgruntled_military_personal2:0 "Невдоволений Особовий Склад"
  mtc_disgruntled_military_personal3:0 "Заспокоєний Особовий Склад"
  mtc_disgruntled_military_command:0 "Обурене Військове Командування"
