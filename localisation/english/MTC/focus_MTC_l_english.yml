  mtc_low_fur_yields:0 "Зниження Видобутку Хутра"
  mtc_low_fur_yields_desc:0 "Після зниження температур по всій Канаді внаслідок Великої війни, міграція багатьох видів і вплив радіації залишили по собі численні сліди, але, мабуть, найбільше постраждали метиси. Як з'ясували мисливці й пасткирі, у бобрів та інших ссавців хутро стало значно рідшим і менш густим — основа хутрової торгівлі почала зникати. Враховуючи відродження галузі в Саскачевані — торгівля слугувала для багатьох втечею від злиднів, що охопили центральні міста Канади з початком американської окупації — ця екологічна зміна стала ударом по нашій економіці. Ситуація лише погіршилася за правління Королівства, коли дворяни обмежили навіть ті незначні права на самоврядування, що у нас залишались, аби забезпечити стабільні поставки для східних міст. Це сильно стримувало наші спроби адаптації та розвитку альтернативних галузей. \n\nСвобода від попереднього гніту нарешті дала змогу виправити ситуацію, але культурне значення торгівлі хутром настільки велике, що її занепад видається неприйнятним для більшості. Якщо ми знайдемо спосіб поліпшити становище, то прибутки, які це принесе, переважать будь-які економічні втрати, яких ми зазнали."

  mtc_improving_fur_yields:0 "Поліпшення Видобутку Хутра"
  mtc_improving_fur_yields_desc:0 "Після зниження температур по всій Канаді внаслідок Великої війни, міграція багатьох видів і вплив радіації залишили по собі численні сліди, але, мабуть, найбільше постраждали метиси. Як з'ясували мисливці й пасткирі, у бобрів та інших ссавців хутро стало значно рідшим і менш густим — основа хутрової торгівлі почала зникати. Враховуючи відродження галузі в Саскачевані — торгівля слугувала для багатьох втечею від злиднів, що охопили центральні міста Канади з початком американської окупації — ця екологічна зміна стала ударом по нашій економіці. Ситуація лише погіршилася за правління Королівства, коли дворяни обмежили навіть ті незначні права на самоврядування, що у нас залишались, аби забезпечити стабільні поставки для східних міст. Це сильно стримувало наші спроби адаптації та розвитку альтернативних галузей. \n\nСвобода від попереднього гніту нарешті дала змогу виправити ситуацію, і уряд узявся до справи. Зусилля з подолання спаду вже тривають, і на горизонті знову з’являється відроджена торгівля."

