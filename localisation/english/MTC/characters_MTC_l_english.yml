MTC_ETIENNE_NAME:0 "Етьєн Десмойн"
MTC_ETIENNE_DESC:0 "§LЗвільнення нації — це справа, що кличе всіх її людей. \n-----------------------------------------------------------------\n§!Життя у нетрях часто означало повільне згасання. Але для Етьєна схованість від світу була справжньою свободою — дні він проводив у крадіжках, ночі ж — у страху, що вкрадене в нього відберуть. Такий цикл дав йому глибоке розуміння механізмів колонізаційної машини Королівства. Але ця обізнаність не породила в ньому жаги до національного визволення. Те, що змусило його вступити до боротьби — це безпорадність його близького друга Атвана. \n\nХлопці вступили до хитро названого підпілля — «Бойскаутів», — щоби передавати записки й пакунки через місто, навіть попри локдауни, до осередків спротиву. Вони показали неабияку майстерність у своїх місіях і згодом піднялись у званні.\n\nКоли Режинський фронт визволення отримав шанс зв’язатися з осередками опору у Трьох Ріках, саме Етьєна відправили туди дирижаблем укласти союз. За час його відсутності Атуан піднявся до командування більшістю регінських осередків. Одна зі стрілянин із Королівською поліцією залишила його без руки — замість неї Етьєн встановив йому роботичну, зібрану зі списаних іграшкових роботів. Повернувшись до Режини зі зброєю й новим союзом, Етьєн виявив, що місто змінилось до невпізнання: спротив більше не діяв потай — тепер він вів відкриті бої, завдаючи непоправної шкоди місту, за яке нібито воював. \n\nТакий Режинський рух опору більше не викликав у нього довіри. Він привітався зі старим другом — і попрощався, вирішивши триматись якомога далі від боротьби, що перетворилась на показуху. Від друзів, до соратників, до суперників — чоловіки поступово віддалились.§L\n-----------------------------------------------------------------\n§GЕтьєн скористався своєю репутацією, щоби очолити опозицію. Формально відома як Конституціоналісти, його коаліція прагне покласти край надмірному впливу армії на політику. Він мріє вивести Конгрес на новий рівень — де міжнародна політика формуватиметься під проводом метисів.§!"

MTC_ATOINE_NAME:0 "Атуан Боусолей"
MTC_ATOINE_DESC:0 "§LЗвільнення нації — це справа, що кличе всіх її людей. \n-----------------------------------------------------------------\n§!Атуан не мріяв гнити у бруді нетрів Режини. Його мрією було увійти в історію — як великі генерали й адміністратори з книжок, які він читав. Тож коли метиси піднялись, він був поруч. Коли поліціянт кривдив хлопця — Атуан зібрав хлопців і каміння, і навчив: закони — це те, що ми самі дозволяємо себе обмежувати. А коли почув про рух спротиву — негайно приєднався, разом із найкращим другом, виконуючи роль кур’єра.\n\nАтуан жадав справжньої боротьби, але рух дотримувався ненасильницької стратегії, з якою він не міг змиритись. Тож почав залучати частину «Бойскаутів» до відкритих сутичок із поліцією — і невдовзі його підвищили, відсторонивши від передової. В цей час його брат Етьєн вирушив до Трьох Рік на переговори з купецьким опором, тож пацифістський голос поруч із Атуаном зник. І він негайно скористався цим — знову очоливши бойові групи. \n\nХодили чутки, що деякі лідери здають його поліції. Це вилилось у стрілянину, де вибух Ф'южн Флі вирвав йому руку. Побратими врятували його, а Етьєн, хоч і був відсутній, прислав йому нову — механічну. Після одужання Атуан узявся витіснити поміркованих із руху спротиву — і йому це вдалося. Він із нетерпінням чекав повернення брата, щоби той побачив результати. Але замість захоплення зустрів холодного, ревнивого Етьєна. Тож призначив йому посаду, яка гарантувала, що їхні шляхи більше не перетнуться… принаймні, на деякий час.\n\nЖоден із них не шукав примирення. Від друзів, до соратників, до суперників — чоловіки поступово віддалились.§L\n-----------------------------------------------------------------\n§GПеремога за перемогою супроводжували марш Атуана на Манітобу, поки його кампанію не зупинив Йортон. Але ці перемоги відкрили йому шлях до влади над Конгресом. Його поразка на фінальному рубежі переслідує його у кожному президентстві. Тепер він прагне перевоозброєння й суспільної реорганізації — щоби підготуватись до своєї останньої й найважливішої кампанії.§!"