  moosejaw_congress:0 "§GМусджав§! буде запрошено на §CПівнічний Конгрес§!, що дозволить нам контролювати їхню зовнішню політику. \n\nЯкщо вони §Rвідмовляться§!, у нас не залишиться вибору, окрім як §Rвторгнутись§! задля захисту наших інтересів§!."
