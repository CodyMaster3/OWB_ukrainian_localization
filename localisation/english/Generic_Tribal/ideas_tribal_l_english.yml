l_english:
 tribal_nation:0 "Племінна держава"
 tribal_nation_desc:0 "Війна взяла своє в багатьох сенсах. Більшість інфраструктури зруйнована. Так багато знань було втрачено. Не маючи змоги жити так, як до ядерного знищення, цілком логічно повернутися до того, як люди жили тисячі й тисячі років тому, ще до існування технологій, якими ми самі себе і знищили."

 tribal_defence:0 "Оборона племені"
 tribal_defence_desc:0 "Як сказав колись стародавній член племені: «найкращий напад — це хороший захист»."

 tribalunity:0 "Єдність племені"
 tribalunity_desc:0 "Неважливо, хто ти, якщо ти належиш до племені — ти на своєму місці."

 tribal_tradition:0 "Традиція племені"
 tribal_tradition_desc:0 "Збиральництво — це традиція не лише племені, а й усієї пустки."
 tribal_tradition_tt:0 "Наші §Hзбирачі§! тепер матимуть шанс повернутися з §Hуспішних місій зі збору§! з додатковими одиницями зібраного §Gпіхотного спорядження§!"
 tribal_tradition_reward_tt:0 "\nГрупа також повернулася з додатковими §H35§! одиницями зібраного §Gпіхотного спорядження§!!"

 war_chief1:0 "Військовий вождь"
 war_chief1_desc:0 "Наймудріший з наших воїнів скоро правитиме нами всіма, і це на краще."

 war_chief2:0 "Майстер війни"
 war_chief2_desc:0 "Щоб захистити себе, ми повинні знищити тих, хто прагне знищити нас. Військовий вождь поведе нас у ці часи завоювань."

 high_shaman:0 "Верховний шаман"
 high_shaman_desc:0 "Ми щойно вийшли з епохи розпусти та гріха. Щоб гарантувати, що це ніколи не повториться, ми повинні наділити владою наших священнослужителів."

 elder1:0 "Старійшина"
 elder1_desc:0 "Старійшина має знання. Старійшина має досвід. Старійшина має мудрість. Старійшина знає, як краще."

 elder2:0 "Рада старійшин"
 elder2_desc:0 "Старійшина вирішив створити раду, щоб не приймати рішення щодо добробуту племені одноосібно. Різноманітність думок неодмінно сприятиме нашому розвитку."

 elder3:0 "Міграція"
 elder3_desc:0 "До нас стікаються одноплемінники з інших племен. Поки вони поважають наші закони, до них ставляться як до рівних, а їхні думки цінуються."

 highchief1:0 "Верховний вождь"
 highchief1_desc:0 "Зміна «Вождя» на «Верховного вождя» — це радше символічна зміна, ніж політична, але проста зміна титулу все одно змінить те, як нашого ватажка сприйматимуть одноплемінники."

 highchief2:0 "Абсолютна влада"
 highchief2_desc:0 "Вождь тепер має абсолютну владу над племенем, маючи можливість приймати рішення, не турбуючись про те, що їх потрібно узгоджувати з різними лідерами громад."

 highchief3:0 "Особиста армія"
 highchief3_desc:0 "Наші воїни тепер особисто служать Верховному вождю. Хто ще заслуговує на те, щоб володіти такою владою?"

 elders:0 "Шановані старійшини"
 elders_desc:0 "Найстарші серед нас віддали племені найбільше завдяки десятиліттям своєї служби. Ми ставимося до них із тією повагою, якої вони вимагають."

 outsideragreement:0 "Угода з чужинцями"
 outsideragreement_desc:0 ""

 tribal_volunteers:0 "Добровольці племені"
 tribal_volunteers_desc:0 "Дозвіл нашим воїнам брати участь у чужих війнах не лише готує їх до майбутніх воєн на внутрішньому фронті, а й послаблює потенційних ворогів і зміцнює наші відносини з племенами, яким ми допомагаємо."

 tribal_mercenaries:0 "Найманці племені"
 tribal_mercenaries_desc:0 "Вимагати плату за службу наших воїнів? Яка новаторська ідея!"

 tribalyouth:0 "Молодь племені"
 tribalyouth_desc:0 "Хоча й була певна опозиція щодо того, щоб дозволити дітям служити воїнами, вигода від цього подвійна. Це не лише забезпечить нас більшою кількістю солдатів, коли заграють барабани війни, а й вивчення мистецтва війни з раннього віку зробить цих хлопців і дівчат кращими бійцями в майбутньому, кращими, ніж якби вони почали в старшому віці."

 tribalchamps:0 "Чемпіони племені"
 tribalchamps_desc:0 "Дехто може назвати використання образу особливо успішних воїнів для збільшення призову до наших бойових загонів «пропагандою». І вони матимуть рацію."

 healingpowder:0 "Цілющий порошок"
 healingpowder_desc:0 "Хоча наш цілющий порошок не такий ефективний, як стимулятор, його набагато легше зробити, і це подарунок самої природи, а не витвір науки."

 tribalsecrets:0 "Секрети племені"
 tribalsecrets_desc:0 "У міру того, як наші аптекарі відкривають методи лікарів Старого світу, ми стаємо кращими в зціленні власних поранених. Наприклад: чи знали ви, що треба одягати рукавички, коли засовуєте руку всередину когось?"

 tribalmuster:0 "Збір племені"
 tribalmuster_desc:0 "Звук барабанів лунає по всьому селу. Це може означати лише одне."

 tribalhoundmasters:0 "Майстри гончаків"
 tribalhoundmasters_desc:0 "Хоча собака — найкращий друг людини, він також може бути її найлютішим ворогом."

 tribalskirmish:0 "Племінна тактика сутичок"
 tribalskirmish_desc:0 "Ми поколіннями жили за рахунок землі. Якщо ми просто навчимося робити те саме в тилу ворога, це дозволить нам завдавати ударів тоді, коли нам заманеться."

 tribalfervor:0 "Племінний запал"
 tribalfervor_desc:0 "Ми занадто довго дозволяли зневажати себе і нашу релігію. Ми повинні навчити пустку наших мирних звичаїв... силою!"

 tribalfragprod:0 "Осколкові горщики"
 tribalfragprod_desc:0 "Хоч вони і походять з іншого племені, ми перейняли ці горщики смерті як свої власні, і навчання того, як їх створювати швидше, має стати головним пріоритетом."

 spirits:0 "Слова Духів"
 spirits_desc:0 "Хоча іноді духів важко зрозуміти, коли вони говорять чітко, вони говорять рішуче."

 sacredlands:0 "Священні землі"
 sacredlands_desc:0 "Ця земля — наша земля. Ми будемо боротися, щоб захистити її від усіх, хто намагається її зганьбити."

 tribalwasteland:0 "Пустка"
 tribalwasteland_desc:0 "Пустка загартувала всіх нас. Оскільки прибувають нові одноплемінники, навички, які вони здобули як ті, хто вижив, допоможуть нам процвітати в тому, що залишилося."

 tribaldrums:0 "Барабани племені"
 tribaldrums_desc:0 "§RБарабани війни б'ють, і бойовий загін вирушає до наступного завоювання."

 slipperyenemies:0 "Слизькі вороги"
 slipperyenemies_desc:0 ""

 rivergods:0 "Річкові боги"
 rivergods_desc:0 "З часів наших найдавніших цивілізацій річки були джерелом життя для людства. Вони зрошують наші посіви, дозволяють нам подорожувати далеко і, звичайно ж, дають нам пити свою воду. Ми повинні ставитися до них із належною повагою."

 motherearth:0 "Матінка-Земля"
 motherearth_desc:0 "Гея. Теллус. Свята Терра. Її називали багатьма іменами, але істина залишається незмінною. Матінка-Земля народила нас усіх, і одного дня ми повернемося до неї."

 sungods:0 "Боги Сонця"
 sungods_desc:0 "Хоча Він дає нам життя, Він не робить це життя легким. Наш яскравий Бог виливає на нас своє святе світло, відправляючи багатьох у ранню могилу. Тільки ті, хто навчиться пристосовуватися, зможуть повністю присвятити себе славі Сонця."

 mountaingods:0 "Боги Гір"
 mountaingods_desc:0 "Їхні печери дають нам притулок. Їхні дерева дають нам ресурси, яких ми потребуємо. Їхня висота уособлює їхню могутність. Духи, що живуть у горах, говорять до нас, і говорять із запалом."

 warlegend:0 "Легендарний воїн"
 warlegend_desc:0 "В епоху, про яку тепер пам'ятають лише найстарші з нас, жив воїн, який міг знищити цілі армії одним помахом свого меча. Він міг перемагати кігтів смерті голими руками й змушувати армії відступати одним лише поглядом. Ми сподіваємося знову виховати воїна з таким талантом."

 shamanlegend:0 "Легендарний шаман"
 shamanlegend_desc:0 "Давним-давно, коли духів вважали не більше ніж маренням божевільного культу, на землю, яка тепер є нашою батьківщиною, прибув Шаман. Використовуючи свій дар переконання, Шаман переконав багатьох скептиків в існуванні духів, що дозволило нашій релігії вкорінитися на цій території."

 builderlegend:0 "Легендарний будівельник"
 builderlegend_desc:0 "У далекому минулому жила жінка з неймовірним хистом до будівництва. Саме завдяки їй ми еволюціонували, покинувши кочовий спосіб життя, і оселилися там, що нині є нашою батьківщиною. Саме вона навчила нас будувати будинки й жити за рахунок землі, а не тільки полювання."

 erawar:0 "Епоха війни"
 erawar_desc:0 "Духи кричать силою кожного нашого воїна, який загинув у бою — наближається війна."

 eramigration:0 "Епоха міграції"
 eramigration_desc:0 "Духи висловили потребу поширити свій вплив за межі наших кордонів. Ми повинні підготуватися до того, щоб вирушити далеко за межі нашої батьківщини, щоб поширювати їхнє послання."

 eraprosperity:0 "Епоха процвітання"
 eraprosperity_desc:0 "Духи нашіптують, що незабаром ми побачимо епоху процвітання, якої ще ніколи не бачив наш народ."

 tribalfactions:0 "Дипломатичні зв'язки"
 tribalfactions_desc:0 "Наші стосунки з іншими племенами принесли плоди як у прямому, так і в переносному сенсі. Наша торгівля з іншими племенами зробила їх більш відкритими до дружніх дипломатичних відносин із нами."