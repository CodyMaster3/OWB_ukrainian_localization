# Events
nf_sok.1.t:0 "Необраний"
nf_sok.1.d:0 "Обранець Аррою був не першим, кого обрали врятувати плем’я та стати його старійшиною. Був інший — палкіший і лютіший кандидат, якого також навчали з народження, щоб він став Обранцем. Проте село, зневажливо заплющивши очі, вигнало його, і, з нестерпним болем, він прийняв їхній вирок. Його відхід також спричинив вихід сотень хоробрих чоловіків та жінок, які пішли за ниткою його пророцтва. Саме ці великі воїни й сформували Синів Каґи, які невдовзі почали правити смугою землі у невадській рукавичці.\n\nЙого подорож була довгою та важкою. На цьому шляху він пройшов через безліч випробувань. Свої знакові сталеві обладунки та силову рукавицю він здобув у бою, й на полі битви йому не було рівних. Тепер він мусить дивитись уперед — на прийдешні випробування, які можуть загрожувати існуванню його молодої нації та перервати передбачене пророцтво."
nf_sok.1.a:0 "Обрані чи ні — ми переможемо."
nf_sok.1.b:0 "Не слід тримати зла."

nf_sok.2.t:0 "Симфонія нового світу"
nf_sok.2.d:0 "Боротьба за владу в Неваді от-от перетвориться на повномасштабну війну. Ми мусимо знайти своє місце в цьому конфлікті, інакше загинемо від рук бездушних племен, що нас оточують. Каґа обрав це місце через його ізольованість від зла та подібність до його рідного Аррою. Але з часом у регіон почали прибувати нові сили, і згодом це стало рукавичкою, що палає прикордонними конфліктами й дипломатичними кошмарами. У підсумку Каґа повинен подолати й це випробування, як і всі попередні, але чи не зламається його лють під тиском зовнішнього світу?"
nf_sok.2.a:0 "Чужинці не знають нашого болю — ми можемо простити їхню сліпоту."
nf_sok.2.b:0 "Каґа не похитнеться і не впаде."

nf_sok.3.t:0 "Відлуння з TV-Тауну"
nf_sok.3.d:0 "Щодня, на кожному радіо та телевізорі в окрузі, працював лише один канал — і на ньому 24/7 показували лише одне шоу — «Карусель». «Карусель» — це дивне видовище, яке показує життя химерних машинолюдей у їхніх штучних «буднях», спробах відтворити справжнє людське буття. Це була погана ілюзія: чари часто ламалися, й усе доводилось ремонтувати. Але цей видовищний обман викликав у Каґи шалений інтерес — яке ж зло могло створити таку наругу над людською подобою?"
nf_sok.3.a:0 "Ми маємо підготуватись до боротьби з цією нечистю."
nf_sok.3.b:0 "Укріпити кордони перед цією погрозою."
