sok_es_1:0 "Техніки бою!"
sok_es_1_desc:0 "Ухилення, парирування, укол! Якудза навчать мене битися. І коли я закінчу, мої супротивники навіть не помітять мого віку!"
nf_sok.4.t:0 "Прах до праху"
nf_sok.4.d:0 "Каґа стояв над попелом поля бою, через червонувате скло свого APA, нарешті, вперше за довгий час, побачивши місце, яке йому так довго було відмовлено. Це було Аррою — місце його народження. Те єдине місце, що вирвали з його рук.\n\nЦе все була вина Обраного, казав собі Каґа, але він знав — справа в більшому. Можливо, якби він відпустив гнів, все не дійшло б до цього. Він підняв погляд на свій новий, але знайомий дім. Згадав, яким було його дитинство — ігри під зірками з іншими дітьми, мрії про те, що ж там, у Пустці.\n\nАррою тепер у його руках, і саме він має вирішити — відпустити цей гнів чи ні. Всередині нього жевріла жага знищити це місце, змусити себе відпустити минуле. Переконатися, що більше ніхто не забере у нього його право — бути визнаним «Обраним».\n\nВін хотів знищити це місце, стерти його, забути все, що тут сталося. Але інша частина душі шепотіла: можливо, з часом, це місце можна врятувати. Викинути гнів, як попіл у вітер.\n\nНа роздоріжжі стояв Каґа. Яким шляхом він піде?"
nf_sok.4.a:0 "Гнів — це сходи, але я досяг вершини."
nf_sok.4.b:0 "§RЯ чекав цього дуже довго.§!"
nf_sok.4.a.tt:0 "§gМій гнів втамовано. Пора мені відпочити.§!"
nf_sok.4.b.tt:0 "§RЦі люди — вони зробили це зі мною! Я покажу їм. Я спалю їхнє село знову, як зробив колись їхній фатальний ворог. Я втілю дух Горріґана й знищу своїх ворогів!§!"
sok_enclave_pa_schematics_purchase:0 "§RКупити заборонену схему:§! §YAPA§!"
sok_enclave_pa_schematics_purchase_desc:0 "Схоже, ім’я, яке ми взяли, привернуло увагу залишків армії старого Короля. За певну ціну вони можуть погодитись передати нам креслення інструментів армії Горріґана."
sok_enclave_verti_schematics_purchase:0 "§RКупити заборонену схему:§! §YВертiптахи§!"
sok_enclave_verti_schematics_purchase_desc:0 "$sok_enclave_pa_schematics_purchase_desc$"
sok_enclave_guns_schematics_purchase:0 "§RКупити заборонену схему:§! §YПередові озброєння§!"
sok_enclave_guns_schematics_purchase_desc:0 "$sok_enclave_pa_schematics_purchase_desc$"
any_active_schematic_purchase:0 "Триває придбання креслень"
sok_form_navarro:0 "Сформувати Наварро"
sok_form_navarro_desc:0 "Щоб уособлювати жах у серцях пустки, ми повинні самі стати цим жахом. Ніколи знову ніхто не поставить під сумнів право Каги на владу. Ми заберемо силу ворогів Аррою собі — їхнє ім’я, їхню броню, їхню спадщину. Ми візьмемо спадщину Горріґана, так само як і спадщину Фальшивого."
sok_form_navarro_tech_tt:0 "Ми забираємо §Yтехнології§!, які §Yарройці§! були надто §Rбоягузливі§!, щоб використати."
sok_can_form_arroyo:0 "Обрано §Yпощадити Аррою§! від §Rповного знищення§!."
sok_wg_on_tof:0 "Кінець Маріанни"
sok_wg_on_tof_desc:0 "Каґа доведе цим рейдерам — це не їхній дім.\nГеть звідси, звідки прийшли!"
sok_wg_on_north:0 "Удар на північ"
sok_wg_on_north_desc:0 "Північ — це мій шлях до Аррою. Каґа виріже його шаром крові та м’яса!"
sok_teaching_raiders_our_way:0 "Навчити рейдерів нашому шляху"
sok_teaching_raiders_our_way_desc:0 "З часом вони пізнають ті ж уроки сили, які пізнав я.\nЇхні спини прикрасять ті самі шрами."
sok_new:0 "Повернення в Ріно"
sok_new_desc:0 "Минуло чимало часу, відколи я був тут востаннє, переслідуючи Фальшивого.\nЯ знайшов його на плівках, у байках.\nВін був легендою тут — скоро він буде ніким."
sok_sln:0 "Найбільша загроза людству"
sok_sln_desc:0 "Фальшивий говорив про страх Анклаву, що людство занепаде, коли дари Землі потраплять до тих, хто вижив у Пустці — що ці дари спотворять людей до невпізнання. Серед усього, с'лантери були б найбільшою загрозою — не через силу, а через гордість."
sok_sln_1:0 "Закуті воїни"
sok_sln_1_desc:0 "Ми доведемо с'лантерам, що людство стоятиме над ними — у небесах, поки вони животітимуть у своїх норах."
sok_psh:0 "Машинолюди"
sok_psh_desc:0 "Після боїв з андроїдами ТБ-Тауну ці машини здаються просто жалюгідними."
sok_psh_1:0 "Перероблені машини"
sok_psh_1_desc:0 "Кров машин живитиме мою справу, а їхня шкіра захищатиме моїх вірних."
sok_new_1:0 "Кінець наркоторгівлі"
sok_new_1_desc:0 "Справжньою силою Ріно завжди був розум Майрона.\nПрипини торгівлю — і вб’єш місто, як ніж до горла браміну."
sok_new_2:0 "Наліт на Клуб Акули"
sok_new_2_desc:0 "Для декого єдина надія вибратись із бруду — це вірити у брехню когось сильнішого, віддати все, сподіваючись на нагороду. Давайте визволимо Новий Ріно з цієї облуди і покажемо: силу не дають — її здобувають.\nАдже я Обраний не волею долі, а силою власної руки."
sok_vlt:0 "«Місто» Сховку"
sok_vlt_desc:0 "Фальшивий був і тут, шукаючи щось для своєї місії з пошуку G.E.C.K. Якщо ми хочемо стерти його зі сторін історії — стерти треба й це місто."
sok_vlt_1:0 "Недоторкана броня"
sok_vlt_1_desc:0 "Столько цієї броні залишилось незаплямованою — пацифісти не мали потреби використовувати свою зброю. Два століття миру.\nЯ покажу їм війну."
sok_vlt_2:0 "Ціна інформації"
sok_vlt_2_desc:0 "Цікаво, що сталося з тими героями, що супроводжували Фальшивого. Горіс, Салік, Девін. Я пам’ятаю їх, хоч і не знаю, де вони."
sok_vlt_3:0 "Скарби Сховку"
sok_vlt_3_desc:0 "Можна провести життя, обшукуючи вулиці Міста Сховку, й ніколи не знайти всіх його скарбів. Це — оаза культури, багатства й процвітання."
sok_tdn:0 "У погоні за Фальшивим"
sok_tdn_desc:0 "Мешканці Нового Ріно казали, що це місце — справжній притулок для покидьків і мерзоти."
sok_mxs:0 "Рейдери Забутого В’язниці"
sok_mxs_desc:0 "Треба бути наївним, аби знайти свободу у в’язниці."
sok_kla:0 "Кінець Кламету"
sok_kla_desc:0 "Дивно, як це містечко вижило стільки років."
sok_fou:0 "Наступ на захід"
sok_fou_desc:0 "Ми так близько до Аррою — не можна зупинятись!"
sok_mod:0 "Набіг на Модок"
sok_mod_desc:0 "Модок мертвий уже багато років. Забуте містечко на краю Нового Ріно. Вони оцінять урок сили."
sok_sla:0 "Лоно Матері-Землі"
sok_sla_desc:0 "Ці мутанти вірили, що їхня сила — у Матері-Землі. Але така віра привела їх лише до ранньої могили."
sok_cyc:0 "Кінець Оуенса"
sok_cyc_desc:0 "Досить уже Бакару дозволяли полювати тут. Час вказати їм їхнє місце."
sok_che:0 "Захоплення артилерії"
sok_che_desc:0 "Станцію Чемалт завжди боронили великі артилерійські гармати.\nТехнології не мають бути захистом. Покажемо їм як по-справжньому захищатись."
sok_integrate_2:0 "Рука над багатьма містами"
sok_integrate_2_desc:0 "Ми тримаємо владу над багатьма містами. Вони повинні навчитись жити, виживати і процвітати в цій Пустці — як ми."
sok_pac:0 "Прорив до Паккерів"
sok_pac_desc:0 "Я майже чую запах Фальшивого. Все більше племен розповідає історії про його прихід."
sok_eur:0 "Кінець світу"
sok_eur_desc:0 "Наші завоювання привели нас до краю світу. Ми скорили усе — від Тринадцятого Пагорба до узбережжя."
sok_umb:0 "Малий друг Аррою"
sok_umb_desc:0 "Люди Умбри завжди були близькі до Аррою — час покласти край цим відносинам."
sok_arr:0 "Остаточна помста"
sok_arr_desc:0 "Я чекав цього довго — шанс довести Аррою, що вони помилилися, обравши Фальшивого — шанс довести істину.\nІСТИНУ, ЩО Я — І Є ОБРАНИЙ!"
sok_arr_a_sharpened_spear:0 "Старе загострене списа"
sok_arr_a_sharpened_spear_desc:0 "Кажуть, Майнок зробив це списа для Фальшивого перед його подорожжю — сталеве списа з кременем."
sok_arr_a_canyon_of_memories:0 "Каньйон спогадів"
sok_arr_a_canyon_of_memories_desc:0 "Минуло багато років відтоді, як я востаннє бачив цей каньйон. Частина мене думала, що більше не побачу його. Але я тут."
sok_arr_hunting_grounds:0 "Оновити Мисливські Угоддя"
sok_arr_hunting_grounds_desc:0 "Відтоді як Фальшивий Прийшлий приніс сюди G.E.C.K., ці угіддя наповнились життям. Дозвольмо нашим мисливцям знову пройтись цими землями й повернутись із повним врожаєм їжі!"

sok_arr_the_water_chip:0 "Водний Чип"
sok_arr_the_water_chip_desc:0 "Цей маленький водний чип колись врятував Арройо — дрібка схемотехніки, що дозволила очищати воду. Вражає, через що довелося пройти одному з пращурів, щоб здобути його."

sok_arr_the_temple_of_trials:0 "Храм Випробувань"
sok_arr_the_temple_of_trials_desc:0 "Святе місце, нарешті під моїм контролем. Володіючи цим храмом, я зможу переконати старійшин Арройо дати мені ім’я, на яке я завжди прагнув."

sok_norcal:0 "Справжня Перемога"
sok_norcal_desc:0 "Наші мисливці переповнені гордістю після перемоги над Арройо. Дехто хоче зупинитися, мовляв, час конфліктів минув. Та це — омана. Залишився ще один суперник. Загроза, яку Фальшивий Прийшлий був надто дурний, аби зупинити."

sok_navarro:0 "Наварро"
sok_navarro_desc:0 "Це слово має особливе значення для народу Арройо.\nНастав час зруйнувати цю традицію, змусити їх побачити істину."

sok_nat_1:0 "Спадок Жаху"
sok_nat_1_desc:0 "«Летючі машини» — ось чому це місце колись заснували, як станцію дозаправки. Їхня сама присутність досі лякає людей Арройо до покори."

sok_gunderson_ranch:0 "Захопити Ранчо Ґандерсона"
sok_gunderson_ranch_desc:0 "Я пожну плоди його праці. Він був занадто слабкий, щоби залишити такий скарб без охорони."

sok_sac_city:0 "Багатства Сак-Сіті"
sok_sac_city_desc:0 "Вісімдесятники прагнули цього місця. Серце промисловості Північної Каліфорнії."

sok_shi:0 "Вчення Дракона"
sok_shi_desc:0 "Дракон, великий майстер бойових мистецтв із Сан-Франциско, колись навчив нас важливості сили й волі. Якщо Сан-Франциско контролює школа Ло Пана, ми, за честю, мусимо допомогти нашому старому вчителеві й знищити їх."

sok_shi_1:0 "Благословення Імператора"
sok_shi_1_desc:0 "Мене буде короновано під благословенням Імператора. Я отримаю силу й міць через працю Ші. Вони вивчили мій урок, і я скористаюсь їхніми дарами."

sok_control_station_enclave:0 "Останній Урок Сили"
sok_control_station_enclave_desc:0 "Тут, на пляжах Каліфорнії, я шукатиму уламки Нафтової Платформи. Там Гориган бився з Фальшивим Прийшлим, і там Річардсон впав. Я поспілкуюсь із духом Горигана, вивчу те, чого він іще може навчити мене про силу й волю."

sok_unique:0 "Помста Арройо"
sok_unique_desc:0 "Протягом десятиліть я жадав помсти Фальшивому Прийшлому. Ми покажемо їм, на що здатні!"

sok_ykz:0 "Повернення до Кланів"
sok_ykz_desc:0 "Кажуть, що десь у пустелі є клан — далекий, забутий. Фальшивий Прийшлий не встоїть переді мною. Їхні родоводи й знання занадто слабкі."

sok_ykz_1:0 "Спадщина Кланів"
sok_ykz_1_desc:0 "Священні знання кланів — наші! Ми їх заслужили. Ми заплатили свою ціну."

sok_jac:0 "«Данина» Людожерам"
sok_jac_desc:0 "Ха! Ніби ми справді платитимемо цим людожерам! Мої воїни розчавлять будь-який спротив."

sok_vip:0 "Знищення Фальшивих Кумирів"
sok_vip_desc:0 "Присутність Фальшивого Прийшлого — це живе прокляття, пухлина, яку треба вирізати з тіла людства."

sok_vip_1:0 "Випробування Зміїної Ями"
sok_vip_1_desc:0 "Ці абомінації та їхня фальшива віра — огидні. Але історії про Фауста, що вижив у глибині Великої Діри, інтригують мене. Я переживу те саме випробування й стану кращим воїном."

# Ідеї
knowledge_of_arroyo_1:0 "Знання Арройо"
knowledge_of_arroyo_1_desc:0 "Ми дізналися багато нового від народу Арройо."
knowledge_of_arroyo_2:0 "$knowledge_of_arroyo_1$"
knowledge_of_arroyo_2_desc:0 "$knowledge_of_arroyo_1_desc$"
