l_english:
  infrastructure:0 "Інфраструктура"
  infrastructure_plural:0 "Інфраструктура"
  infrastructure_desc:0 "Ця споруда покращує інфраструктуру регіону. Вона збільшує пропускну здатність постачання у стратегічних регіонах і швидкість пересування ваших дивізій, а також підвищує видобуток сировинних ресурсів."
  arms_factory:0 "Збройова майстерня"
  arms_factory_plural:0 "Збройові майстерні"
  arms_factory_desc:0 "Ця споруда забезпечує регіон промисловістю для виробництва нового військового спорядження. За потреби може бути перетворена на цивільну промисловість."
  dockyard:0 "Військово-морська верф"
  dockyard_plural:0 "Військово-морські верфі"
  dockyard_desc:0 "Ця споруда забезпечує регіон промисловістю для будівництва нових кораблів."
  industrial_complex:0 "Цивільна майстерня"
  industrial_complex_plural:0 "Цивільні майстерні"
  industrial_complex_desc:0 "Ця споруда забезпечує регіон промисловістю для виробництва товарів широкого вжитку або будівництва нових споруд. За потреби може бути перетворена на військову промисловість."
  air_base:0 "Авіабаза"
  air_base_plural:0 "Авіабази"
  air_base_desc:0 "Ця споруда забезпечує розміщення ваших військово-повітряних сил у регіоні."
  naval_base:0 "Морська база"
  naval_base_plural:0 "Морські бази"
  naval_base_desc:0 "Збільшує радіус дії вашого флоту та забезпечує його ремонт. Дозволяє здійснювати постачання через море та експорт ресурсів. Вищі рівні збільшують пропускну здатність постачання."
  bunker:0 "Аванпост"
  bunker_plural:0 "Аванпости"
  bunker_desc:0 "Ця споруда накладає штраф на атаку в розмірі $VALUE|+%0$ за кожен рівень укріплення для нападника в бою. Атака з кількох напрямків знижує ефективність укріплень."
  bunker2:0 "Бункер"
  bunker2_plural:0 "Бункери"
  bunker2_desc:0 "Ця споруда накладає штраф на атаку в розмірі §R-16%§! за кожен рівень для нападника в бою. Споруда надає подвійний ефект порівняно з аванпостами."
  coastal_bunker:0 "Береговий форт"
  coastal_bunker_plural:0 "Берегові форти"
  coastal_bunker_desc:0 "Ця споруда накладає штраф на атаку в розмірі $VALUE|+%0$ за кожен рівень укріплення для нападника під час морського вторгнення."
  anti_air_building:0 "ППО"
  anti_air_building_plural:0 "ППО"
  anti_air_building_desc:0 "Ця споруда забезпечує регіону захист від ворожих бомбардувальників і можливість вести вогонь по літаках, що атакують."
  radar_station:0 "Радіолокаційна станція"
  radar_station_plural:0 "Радіолокаційні станції"
  radar_station_desc:3 "Радар дозволяє отримувати розвіддані про ворожі війська у сусідніх регіонах.\nВищий рівень радара в регіоні збільшує ефективний радіус дії.\nРадар також забезпечує краще виявлення ворожих повітряних сил, даючи вашим літакам кращі шанси перехопити їх.\nКрім того, радар покращує виявлення ворожих флотів у морі."
  supply_node:1 "Вузол постачання"
  supply_node_desc:2 "Вузол постачання — це точка вздовж доріг, за межами існуючих міст, звідки можна отримувати припаси."
  rail_way:0 "Дороги"
  rail_way_desc:2 "Дороги використовуються для з'єднання вузлів постачання, що дозволяє отримувати припаси далеко від вашої столиці."
  rocket_site_tech:0 "Технологія ракетних шахт"
  rocket_site:0 "Ракетна шахта"
  rocket_site_plural:0 "Ракетні шахти"
  rocket_site_desc:0 "Ця споруда забезпечує регіон можливостями для запуску балістичних ракет."
  ROCKET_SITE_LEVEL:0 "§HРакетна шахта§! у $NAME|H$, Рівень $VAL|H$"
  land_multi_charge_large_caliber_gun_tech:0 "Технологія важкої артилерії"
  mega_gun_emplacement:0 "Важка артилерія"
  mega_gun_emplacement_plural:0 "Важка артилерія"
  mega_gun_emplacement_desc:0 "Незалежно від того, чи використовує вона масивні заряди, ракетні двигуни чи силу електромагнетизму, ця масивна конструкція розганяє вибухівку до надзвукових швидкостей перед запуском у віддалені цілі."
  GUN_EMPLACEMENT_LEVEL_UNKNOWN:0 "§H$mega_gun_emplacement$§! у $NAME|H$"
  GUN_EMPLACEMENT_BUILDING: "§YВажка артилерія§!"
  naval_supply_hub: "Військово-морський вузол постачання"
  naval_supply_hub_desc: "Ця споруда дозволяє вашим флотам поповнювати запаси та пальне на цій базі на додаток до їхніх баз приписки, потенційно розширюючи оперативний радіус дії ваших §YОперативних з'єднань§!.\nВійськово-морський вузол постачання можна побудувати лише у прибережній провінції, що має Морську базу принаймні 5-го рівня."
  naval_headquarters: "Військово-морський штаб"
  naval_headquarters_desc: "Ця споруда дозволяє призначити адмірала для підвищення ефективності §YОперативних з'єднань§!, що діють у радіусі Військово-морського штабу.\n\nОдночасно адміралів можна призначити до $MAXNUM|H$ штабів.\n   Наразі призначено: $CURRNUM|H$\n\nВійськово-морський штаб можна побудувати лише у прибережній провінції, що має Морську базу принаймні 5-го рівня."