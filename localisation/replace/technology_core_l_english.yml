 # Equipment naming is inherited from the equipment name when displayed in the techtree
 #----------------------------
 # Folders
 #----------------------------
fallout_infantry_folder:0 "Піхота"
fallout_infantry_folder_desc:0 "Бій був невіддільною частиною людського суспільства ще з моменту його зародження. Мечі змінилися на гвинтівки, коні — на танки, а Велика війна змусила нас заново вивчати давнє мистецтво виживання в новому жорстокому світі."

fallout_support_folder:0 "Підтримка"
fallout_support_folder_desc:0 "Навіть найсильнішому солдату чи найвлучнішому снайперу іноді потрібна допомога. Медики з припасами, розвідники в тилу ворога або вірні напарники, готові битися до кінця."

fallout_vehicle_folder:0 "Транспорт"
fallout_vehicle_folder_desc:0 "Попри те, що Велика війна знищила більшість інфраструктури для виробництва транспорту, чимало передвоєнних уламків усе ще можна привести до ладу. Потрібно лише harness — опанувати їхню силу."

fallout_robotics_folder:0 "Робототехніка"
fallout_robotics_folder_desc:0 "До війни роботи мали безліч мирних функцій. У пустці вони можуть стати смертоносною зброєю, якщо ми вкладемося в технології й знатимемо, як їх спрямувати в бій."

fallout_tech_creatures_folder:0 "Істоти"
fallout_tech_creatures_folder_desc:0 "Людство — цікава річ. Одні хочуть утвердити себе на вершині харчового ланцюга. Інші — приручити тварин пустки. Яку цікавість оберемо ми?"

fallout_land_doctrine_folder:0 "Сухопутна доктрина"
fallout_land_doctrine_folder_desc:0 "Відтоді як людина вперше вдарила людину, тактика бою розвивалась для сильних і кмітливих. Але тільки ті, хто є обома, зможуть довести її до досконалості."

fallout_air_doctrine_folder:0 "Спеціальні доктрини"
fallout_air_doctrine_folder_desc:0 "Хоча політ — відкриття останніх століть, більшість знань про повітряні бої втрачено. Але ми можемо або віднайти їх знову, або створити свої власні доктрини."

fallout_air_folder:0 "Авіація"
fallout_air_folder_desc:0 "Планер, повітряна куля, літак — усе це кроки людства до неба. Проте від Великої війни мало хто ще здіймався в повітря. Настав наш час злетіти — інакше нас поглине вогонь."

fallout_naval_folder:0 "Флот"
fallout_naval_folder_desc:0 "Моря й річки повні піратських барж і мутованих чудовиськ. Щоб плавати, нам знадобиться багато зусиль: міцні корпуси, нові методи виробництва й технології мореплавства."

fallout_naval_non_mtg_folder:0 "Флот"
fallout_naval_non_mtg_folder_desc:0 "Моря й річки повні піратських барж і мутованих чудовиськ. Щоб плавати, нам знадобиться багато зусиль: міцні корпуси, нові методи виробництва й технології мореплавства."

fallout_naval_modules_folder:0 "Модулі кораблів"
fallout_naval_modules_folder_desc:0 "Тепер, коли ми знову можемо борознити ріки та узбережжя, нам потрібна якісна техніка: зброя, броня, комунікації. Усе це — ключ до панування на воді."

fallout_industry_folder:0 "Промисловість"
fallout_industry_folder_desc:0 "Більшість спорядження походить із часів Великої війни. Щоб його відновити, нам потрібна злагоджена промисловість і нові технології виробництва. Це основа виживання."

fallout_engineering_folder:0 "Інженерія"
fallout_engineering_folder_desc:0 "Більшість електроніки та зв’язку загинули в імпульсах Чорного спалаху. Проте ми маємо їх відродити, бо без електроніки наше майбутнє приречене."

fallout_tech_tribal_folder:0 "Племена"
fallout_tech_tribal_folder_desc:0 "Унікальні технології для племінних суспільств."

