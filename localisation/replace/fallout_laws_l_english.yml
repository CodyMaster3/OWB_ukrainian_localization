l_english:
  disarmed_nation: "Захист поселень"
  disarmed_nation_desc: "Коли якесь поселення потребує нашої допомоги, ми цілком здатні надати її, і це все, чого ми зараз вимагаємо від наших військових."
  undisturbed_isolation: "Мир та процвітання"
  undisturbed_isolation_desc: "Рейдери лютують на землях, на суверенітет яких претендує НКР, але сама НКР більш-менш захищена від зовнішніх загроз своєму існуванню. Як результат, виробицтво працює тільки на половину своєї потужності. Буде потрібна якась значна подія, щоб пробудити НКР від сну...\n"
  isolation: "Самодостатнє суспільство"
  isolation_desc:0 "Ми завжди могли покладатися лише на себе. Чому ж зараз це змінювати?"
  undisturbed_isolation:0 "Мир і добробут"
  civilian_economy: "Пусткова економіка"
  civilian_economy_desc:0 "Оскільки повоєнні цивілізації почали розквітати на руїнах минулого, разом із ними з'явилася й рудиментарна економіка. Хоча більшість зосереджена на продажі припасів, необхідних для виживання, дехто почав продавати товари, що мають більш розкішний характер. Вишуканий одяг, дитячі іграшки тощо."
  low_economic_mobilisation: "Фінансування армії"
  low_economic_mobilisation_desc:0 "Пустка довела, що є небезпечним місцем. Не лише через блукаючих мутантів, але й тому, що майже кожна інша фракція дбає лише про власні інтереси. Ми повинні переконатися, що готові вступити в конфлікт з іншими силами, які вижили в пост'ядерну епоху."
  partial_economic_mobilisation: "Файно споряджена армія"
  partial_economic_mobilisation_desc:0 "Влада є вирішальною у світі, в якому ми опинилися. Без належно оснащеної армії ми незабаром опинимося в такому ж становищі, як і нації старого світу — мертвими та забутими."
  war_economy: "Усі кришки на армію"
  war_economy_desc:0 "У знайденій нами старій книзі колишній президент Сполучених Штатів казав: «Ми повинні остерігатися набуття невиправданого впливу військово-промисловим комплексом». Тепер він мертвий, тож що він може знати?"
  tot_economic_mobilisation: "Усі за воєнну машину!"
  tot_economic_mobilisation_desc:0 "Америка знову занурилася у війну. Оскільки наші вороги погрожують знищити те, що ми змогли створити для себе, ми повинні спрямувати всі можливі ресурси на нашу армію, навіть за рахунок інших галузей. Виживання — понад усе."
  limited_exports: "Нічого тут торгувати!"
  limited_exports_desc:0 "Хоча було б нерозумно з нашого боку повністю відмовитися від іноземного імпорту, було б мудро обмежити його вплив. Ми не знаємо, кому насправді віддані ці караванники."
  free_trade: "Купуй якщо прийшов"
  free_trade_desc:0 "Куди б ви не пішли в Америці, ви знайдете листівки, білборди та брошури, що проповідують чудеса капіталізму. Якщо він був таким чудовим, чому б нам не спробувати?" 
  export_focus: "Вітаємо кожен караван"
  export_focus_desc:0 "Хоч це й не 18-колісні вантажівки та танкери старого світу, скромний брамін довів свою здатність підтримувати рудиментарну економіку Пустки."
  closed_economy: "Вхід заборонено!"
  closed_economy_desc:0 "Вороги всюди. Не лише на полі бою, але й під маскою дружніх облич у наших поселеннях. Нам потрібно вигнати всіх, у кому ми не впевнені на 100 відсотків, навіть якщо це означає відмову від раніше прибуткових торгових угод."
  scavenging_law: "Збиральництво"
  scavenging_law_desc: "Замість того, щоби направляти наші ресурси на виробництво нових товарів, ми можемо шукати багатства Старого Світу. Там повинно хоча б щось залишитися, чи не так?"

  # conscription laws
  paladins: "Паладини"
  senior_knights: "Старші лицарі"
  knights: "Лицарі"
  scribes: "Писці"
  initiates: "Послушники"
  caps_advisor_add_tt: "Цей радник буде коштувати [?caps_diff|+] доларів НКР."
