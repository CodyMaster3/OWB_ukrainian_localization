  SUPPLY_NODE_UPGRADE_TO_CAPITAL: "§HПоліпшити дороги§!\nПоставити в чергу поліпшення дорожніх «вузьких місць» на шляху від столичного центру. Це збільшить доступний можливий об'єм припасів у всіх провінціях, які зачіпає цей вузол." # (&)
  SUPPLY_NODE_TOGGLE_ALLIES: "§HСоюзне постачання§!\nПеремкнути доступ до центру постачання для ваших союзників."
  SUPPLY_NODE_BUILD_RAIL: "§HЗбудувати дороги§!\nЗбудувати дорогу від цього центру постачання.\n§GУтримуючи Shift§!, буде автоматично знайдено оптимальний шлях." # (&)
  SUPPLY_FLOW_SHOW_RANGE: "§HЦентри постачання§! розподіляють припаси в ближні провінції. Їхні досяжність й ефективність залежать від погоди, стану ґрунту, інфраструктури, рівня дороги та моторизації.\n\nЩоб збільшити досяжність і припаси, надані §Hцентром постачання§!, скористайтеся командою §HПоліпшити дороги§!, змініть §Hрівень моторизації§! або збільште §Hрівень інфраструктури§!.\n\nВтримуйте §GShift§!, щоби показати дальність.\n§GShift + клацніть§!, щоби змінити рівень моторизації.\n§GCtrl + клацніть§!, щоби перемкнути доступ для союзників."
  SUPPLY_FLOW_DELAYED_DESC: "§HЗалишок припасів§! вказує на те, скільки постачання надається цій провінції й обчислюється з обласного постачання та центрів постачання в межах досяжності. Досяжність центрів залежить від погоди, стану ґрунту, інфраструктури, рівня дороги та моторизації.\n\n§HДивізії§! споживатимуть припаси в провінції в залежності від ваги постачання. Якщо їхні §Hзапаси припасів§! перевищують відсоток припасів, наданих їхній місцевості, вони споживатимуть припаси з внутрішніх запасів, поки рівень не досягне місцевого.\n\nУтримуйте §GCtrl§!, щоби побачити джерела потоків."
