### АЛЬЯНС ###
 # Invite to faction
 DIPLOMACY_OFFER_JOIN_FACTION_TITLE: "Запросити до альянсу"
 DIPLOMACY_OFFER_JOIN_FACTION_DESC:1 "Invite $COUNTRY|UH$ to join $FACTION|H$. This will allow you to call each other to war. The faction leader is $LEADER|H$.\nIf any volunteers have been sent or received between the faction members, they will be sent back."
 DIPLOMACY_OFFER_JOIN_FACTION_ACTION_DESC:0 "Invite them to join our faction."
 DIPLOMACY_OFFER_JOIN_FACTION_ACTION_DETAILED_DESC:0 "Staged coups between you and them will automatically cancel if they join your faction"
 DIPLOMACY_OFFER_JOIN_FACTION_KICKED_BY_YOU_RECENTLY:1 "$COUNTRY|UY$ has been kicked from the faction recently. You can't reinvite them back before $DATE|Y$"

 # Join faction
 DIPLOMACY_JOIN_FACTION_TITLE: "Попросити приєднатися до альянсу"
 DIPLOMACY_JOIN_FACTION_ACTION_DESC:0 "By joining a faction, we will have the option to join their wars, and they have the option to join our wars. We will then fight together!"
 DIPLOMACY_JOIN_FACTION_REQUEST_DESC:2 "$COUNTRY|UY$ wants to join our faction $FACTION|Y$.\nIf any volunteers have been sent or received between the faction members, they will be sent back."
 DIPLOMACY_JOIN_FACTION_NO_FACTION:1 "$COUNTRY|UH$ is not in a faction."
